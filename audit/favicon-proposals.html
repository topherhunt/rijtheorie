<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Favicon proposals</title>
<style>
  body { font: 15px/1.5 system-ui, sans-serif; margin: 0; padding: 24px 16px; background: #f8fafc; color: #0f172a; }
  h1 { margin: 0 0 4px; font-size: 22px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; margin-top: 20px; }
  .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 16px; }
  .card h2 { margin: 0 0 4px; font-size: 16px; }
  .card p { margin: 0 0 12px; color: #475569; font-size: 13px; }
  .row { display: flex; gap: 0; border-radius: 8px; overflow: hidden; }
  .bg { flex: 1; display: flex; align-items: center; justify-content: space-around; padding: 12px 8px; }
  .light { background: #fff; border: 1px solid #e2e8f0; }
  .dark { background: #202124; }
  .tab { display: inline-flex; align-items: center; gap: 6px; margin-top: 10px; padding: 6px 10px; border-radius: 8px 8px 0 0; background: #dee1e6; font-size: 12px; }
  .tab.d { background: #35363a; color: #e8eaed; }
  svg { display: block; }
</style>
</head>
<body>
<h1>Favicon proposals</h1>
<p>Each one is shown at 16, 32 and 64 px, on a light and a dark browser tab bar. Pick a letter (or mix: "C, but in blue"). Built from Bootstrap Icons (MIT) plus simple shapes.</p>
<div class="grid" id="grid"></div>

<script>
  const options = [
    ['A', 'Car on Dutch orange', 'Bootstrap car-front on the site brand orange. Matches the header; reads clearly at 16 px.'],
    ['B', 'Car on road-sign blue', 'Same car on the blue of Dutch information signs. Calmer; less "branded".'],
    ['C', 'Speech bubble + car', 'Orange chat bubble with a car: "driving, in your language". The car gets small at 16 px.'],
    ['D', 'Yield triangle (B6)', 'The haaientanden / B6 shape: instantly "Dutch traffic". Very plain; no brand color.'],
    ['E', 'Priority road (B1)', 'The yellow diamond. Iconic in NL; thin white edge vanishes at 16 px.'],
    ['F', 'Yield triangle on orange', 'D inside the brand square: traffic sign meaning plus site color.'],
  ];
  const grid = document.getElementById('grid');
  for (const [id, name, note] of options) {
    const svg = document.getElementById(id).innerHTML;
    const sized = (n) => svg.replace('<svg ', `<svg width="${n}" height="${n}" `);
    const sizes = [16, 32, 64].map(sized).join('');
    grid.insertAdjacentHTML('beforeend', `<div class="card"><h2>${id}. ${name}</h2><p>${note}</p>
      <div class="row"><div class="bg light">${sizes}</div><div class="bg dark">${sizes}</div></div>
      <div class="tab">${sized(16)} Rijtheorie en español</div> <div class="tab d">${sized(16)} Rijtheorie en español</div></div>`);
  }
</script>
</body>
</html>
