questions:
  - id: detencion-suma
    type: mc
    prompt: "¿Cómo se compone la distancia de detención (stopafstand)?"
    options: [Distancia de reacción más distancia de frenado, Solo la distancia de frenado, Solo la distancia de reacción, Distancia de seguimiento más distancia de frenado]
    answer: 0
    explain: "La stopafstand es la reactieafstand más la remweg."
    cites: ["cbr-examenplan"]
    exam: false

  - id: detencion-reaccion
    type: mc
    prompt: "¿Qué es la distancia de reacción?"
    options: [Lo que recorres desde que ves el peligro hasta que empiezas a frenar, Lo que recorres frenando, El espacio con el auto de delante, La distancia hasta el semáforo]
    answer: 0
    explain: "Durante el tiempo de reacción el auto sigue a la misma velocidad."
    cites: ["cbr-examenplan"]
    exam: false

  - id: detencion-doble-reaccion
    type: mc
    prompt: "Si duplicas tu velocidad, ¿qué pasa con la distancia de reacción?"
    options: [Se duplica, Se cuadruplica, Se mantiene, Se reduce a la mitad]
    answer: 0
    explain: "La distancia de reacción es proporcional a la velocidad (el tiempo de reacción es el mismo)."
    cites: ["cbr-examenplan"]
    exam: false

  - id: detencion-doble-frenado
    type: mc
    prompt: "Si duplicas tu velocidad, ¿cuánto crece aproximadamente la distancia de frenado?"
    options: [Unas 4 veces, 2 veces, 8 veces, No cambia]
    answer: 0
    explain: "Crece aproximadamente con el cuadrado de la velocidad: 2 al cuadrado son 4."
    cites: ["cbr-examenplan"]
    exam: false

  - id: detencion-conversion
    type: mc
    prompt: "¿Cómo conviertes km/h a metros por segundo?"
    options: ['Dividiendo por 3,6', 'Multiplicando por 3,6', Dividiendo por 10, Multiplicando por 2]
    answer: 0
    explain: "1 km/h = 1000 m / 3600 s, o sea 1/3,6 m/s."
    cites: ["cbr-examenplan"]
    exam: false

  - id: detencion-mojado
    type: yesno
    prompt: "Una calzada mojada, ¿alarga la distancia de frenado?"
    answer: true
    explain: "Con menos adherencia el auto necesita más distancia para detenerse."
    cites: ["cbr-examenplan"]
    exam: false

  - id: detencion-triple
    type: mc
    prompt: "Si triplicas tu velocidad, ¿cuánto crece aproximadamente la distancia de reacción?"
    options: [3 veces, 9 veces, 6 veces, No cambia]
    answer: 0
    explain: "La distancia de reacción es proporcional a la velocidad: 3 veces la velocidad, 3 veces la distancia."
    cites: ["cbr-examenplan"]
    exam: false

  - id: detencion-cansancio
    type: yesno
    prompt: "El cansancio o una distracción, ¿alargan la distancia de reacción?"
    answer: true
    explain: "Aumentan el tiempo de reacción, y en ese tiempo el auto sigue avanzando a la misma velocidad."
    cites: ["cbr-examenplan"]
    exam: false

  - id: detencion-frenado-reaccion
    type: mc
    prompt: "Al subir la velocidad, ¿qué parte de la distancia de detención crece más rápido?"
    options: [La distancia de frenado, La distancia de reacción, Las dos igual, Ninguna]
    answer: 0
    explain: "La distancia de frenado crece con el cuadrado de la velocidad; la de reacción, de forma proporcional."
    cites: ["cbr-examenplan"]
    exam: false
