questions:
  - id: detencion-reaccion-calculo
    type: mc
    prompt: "Vas a 72 km/h y tu tiempo de reacción es de 1 segundo. ¿Cuántos metros recorres antes de empezar a frenar?"
    options: [10 m, 20 m, 40 m, 72 m]
    answer: 1
    explain: "72 km/h dividido por 3,6 son 20 m/s; en 1 s recorres 20 m. Los 72 m serían confundir km/h con metros."
    cites: ["general"]
    exam: false

  - id: detencion-reaccion-108
    type: mc
    prompt: "En una autosnelweg vas a 108 km/h y el auto de delante frena de golpe. Tu tiempo de reacción es de 1 segundo. ¿Cuántos metros recorres hasta que empiezas a frenar?"
    options: [30 m, 54 m, 108 m, 15 m]
    answer: 0
    explain: "108 / 3,6 = 30 m/s, así que en 1 s recorres 30 m."
    cites: ["general"]
    exam: false

  - id: detencion-reaccion-distraido
    type: mc
    prompt: "Vas a 72 km/h. Normalmente reaccionas en 1 segundo, pero hoy miras el celular y reaccionas en 2. ¿Cuántos metros más recorres antes de empezar a frenar?"
    options: [10 m, 20 m, 40 m, 4 veces más]
    answer: 1
    explain: "A 72 km/h vas a 20 m/s. Un segundo más de reacción son 20 m más. La distancia de reacción es proporcional al tiempo; no se cuadruplica."
    cites: ["general"]
    exam: false

  - id: detencion-frenado-escala
    type: mc
    prompt: "Supón que a 40 km/h tu distancia de frenado es de unos 10 m. Aproximadamente, ¿cuánta necesitas a 80 km/h?"
    options: [20 m, 30 m, 40 m, 80 m]
    answer: 2
    explain: "La distancia de frenado crece con el cuadrado de la velocidad: al doble de velocidad, unas 4 veces (10 x 4 = 40 m). 20 m sería el error de suponer que crece de forma proporcional."
    cites: ["general"]
    exam: false

  - id: detencion-total-72
    type: mc
    prompt: "A 36 km/h, con 1 segundo de reacción, recorres 10 m antes de frenar y frenas en unos 8 m (18 m en total). Con el mismo tiempo de reacción, ¿cuál es aproximadamente la distancia de detención a 72 km/h?"
    options: [36 m, 44 m, 52 m, 72 m]
    answer: 2
    explain: "A 72 km/h la reacción se duplica (20 m) y el frenado se multiplica por unos 4 (32 m): 20 + 32 = 52 m. Duplicar el total (36 m) ignora que el frenado crece más rápido."
    cites: ["general"]
    exam: false

  - id: detencion-frenado-vista-libre
    type: mc
    prompt: "A 40 km/h tu distancia de frenado es de unos 10 m. Ves la vía libre solo en los próximos 25 m (curva sin visibilidad) y quieres pasar a 80 km/h. ¿Qué conclusión sacas, contando solo el frenado?"
    options: ["A 80 necesito unos 40 m, más de los 25 que veo: no puedo ir a 80", "A 80 necesito unos 20 m, menos de 25: puedo ir a 80", "A 80 necesito unos 25 m, justo lo que veo: puedo ir a 80", "La distancia de frenado no depende de lo que veo libre"]
    answer: 0
    explain: "Al doble de velocidad el frenado es unas 4 veces mayor: 10 x 4 = 40 m. Con solo 25 m libres no te detienes a tiempo (art. 19), y eso sin contar la reacción. Calcular 20 m sería suponer que crece de forma proporcional."
    cites: ["rvv:19", "general"]
    exam: false

  - id: detencion-por-que-distancia-seguimiento
    type: mc
    prompt: "Vas a 90 km/h (25 m/s) y dejas solo 10 m al auto de delante. Si frena de golpe, ¿qué es lo primero que te falta?"
    options: ["Metros para cubrir tu reacción y el frenado", "Peso sobre el eje delantero", "Tiempo para encender los intermitentes", "Nada: 10 m son suficientes con buenos frenos"]
    answer: 0
    explain: "Tu distancia de detención es reacción más frenado. Con 1 s de reacción ya recorres 25 m antes de frenar, más que los 10 m que dejas; buenos frenos no recuperan lo que se pierde reaccionando."
    cites: ["rvv:19", "general"]
    exam: false

  - id: detencion-lluvia-reaccion-rapida
    type: mc
    prompt: "Un amigo dice: \"Con lluvia no necesito más distancia, porque reacciono rápido\". Vas por una autosnelweg con calzada mojada. ¿Por qué se equivoca?"
    options: ["Reaccionar rápido acorta la distancia de reacción, pero la calzada mojada alarga el frenado", "La lluvia alarga la distancia de reacción, aunque reacciones rápido", "Con lluvia el auto frena igual; el problema es la visibilidad", "Reaccionar rápido no cambia ninguna de las dos distancias"]
    answer: 0
    explain: "La distancia de reacción depende de tu tiempo de reacción y de la velocidad; el frenado depende de la adherencia, y mojado se alarga. Tu rapidez de reacción no arregla eso. La lluvia no alarga la reacción: la visibilidad es otro tema."
    cites: ["general"]
    exam: false
