questions:
  - id: detencion-suma
    type: mc
    prompt: "¿Cómo se compone la distancia de detención (stopafstand)?"
    options: [Distancia de reacción más distancia de frenado, Solo la distancia de frenado, Solo la distancia de reacción, Distancia de seguimiento más distancia de frenado]
    answer: 0
    explain: "La stopafstand es la reactieafstand más la remweg."
    cites: ["cbr-examenplan"]
    exam: false

  - id: detencion-reaccion
    type: mc
    prompt: "¿Qué es la distancia de reacción?"
    options: [Lo que recorres desde que ves el peligro hasta que empiezas a frenar, Lo que recorres frenando, El espacio con el auto de delante, La distancia hasta el semáforo]
    answer: 0
    explain: "Durante el tiempo de reacción el auto sigue a la misma velocidad."
    cites: ["cbr-examenplan"]
    exam: false

  - id: detencion-reaccion-calculo
    type: mc
    prompt: "Vas a 72 km/h y tu tiempo de reacción es de 1 segundo. ¿Cuántos metros recorres antes de empezar a frenar?"
    options: [10 m, 20 m, 40 m, 72 m]
    answer: 1
    explain: "72 km/h dividido por 3,6 son 20 m/s; en 1 s recorres 20 m. Los 72 m serían confundir km/h con metros."
    cites: ["cbr-examenplan"]
    exam: false

  - id: detencion-reaccion-108
    type: mc
    prompt: "Vas a 108 km/h con un tiempo de reacción de 1 segundo. ¿Cuántos metros recorres hasta que empiezas a frenar?"
    options: [30 m, 54 m, 108 m, 15 m]
    answer: 0
    explain: "108 / 3,6 = 30 m/s, así que en 1 s recorres 30 m."
    cites: ["cbr-examenplan"]
    exam: false

  - id: detencion-reaccion-distraido
    type: mc
    prompt: "Vas a 72 km/h. Normalmente reaccionas en 1 segundo, pero hoy miras el celular y reaccionas en 2. ¿Cuántos metros más recorres antes de empezar a frenar?"
    options: [10 m, 20 m, 40 m, 4 veces más]
    answer: 1
    explain: "A 72 km/h vas a 20 m/s. Un segundo más de reacción son 20 m más. La distancia de reacción es proporcional al tiempo; no se cuadruplica."
    cites: ["cbr-examenplan"]
    exam: false

  - id: detencion-frenado-escala
    type: mc
    prompt: "Supón que a 40 km/h tu distancia de frenado es de unos 10 m. Aproximadamente, ¿cuánta necesitas a 80 km/h?"
    options: [20 m, 30 m, 40 m, 80 m]
    answer: 2
    explain: "La distancia de frenado crece con el cuadrado de la velocidad: al doble de velocidad, unas 4 veces (10 x 4 = 40 m). 20 m sería el error de suponer que crece de forma proporcional."
    cites: ["cbr-examenplan"]
    exam: false

  - id: detencion-frenado-triple
    type: mc
    prompt: "Supón que a 30 km/h tu distancia de frenado es de unos 5 m. Aproximadamente, ¿cuánta necesitas a 90 km/h, el triple de velocidad?"
    options: [15 m, 30 m, 45 m, 90 m]
    answer: 2
    explain: "Al triple de velocidad, la distancia de frenado es unas 3 x 3 = 9 veces mayor: 5 x 9 = 45 m. 15 m sería el error de multiplicar solo por 3."
    cites: ["cbr-examenplan"]
    exam: false

  - id: detencion-total-72
    type: mc
    prompt: "A 36 km/h, con 1 segundo de reacción, recorres 10 m antes de frenar y frenas en unos 8 m (18 m en total). Con el mismo tiempo de reacción, ¿cuál es aproximadamente la distancia de detención a 72 km/h?"
    options: [36 m, 44 m, 52 m, 72 m]
    answer: 2
    explain: "A 72 km/h la reacción se duplica (20 m) y el frenado se multiplica por unos 4 (32 m): 20 + 32 = 52 m. Duplicar el total (36 m) ignora que el frenado crece más rápido."
    cites: ["cbr-examenplan"]
    exam: false

  - id: detencion-causa-parte
    type: mc
    prompt: "Vas cansado y distraído, y además la calzada está mojada. ¿Qué parte de la distancia de detención alarga el cansancio y cuál la calzada mojada?"
    options:
      - "El cansancio alarga la de reacción; la calzada mojada, la de frenado"
      - "El cansancio alarga la de frenado; la calzada mojada, la de reacción"
      - "Ambos alargan solo la de reacción"
      - "Ambos alargan solo la de frenado"
    answer: 0
    explain: "El cansancio aumenta el tiempo de reacción (el auto sigue a la misma velocidad). La calzada mojada reduce la adherencia y alarga el frenado."
    cites: ["cbr-examenplan"]
    exam: false
