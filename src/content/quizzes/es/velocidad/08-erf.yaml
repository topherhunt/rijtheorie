questions:
  - id: erf-velocidad
    type: number
    prompt: "Vienes por una calle de la zona urbana (máximo general 50) y giras hacia una calle que empieza con la señal G5. ¿Cuál es tu máximo desde la G5?"
    sign: G5
    answer: 15
    unit: km/h
    explain: "Dentro de un erf los conductores no pueden ir a más de 15 km/h (art. 45), aunque fuera de él rijan 50. El erf baja el límite que traías."
    cites: ["rvv:45"]

  - id: erf-vacio-mas-rapido
    type: yesno
    prompt: "Dentro de un erf no ves a nadie en la calle. ¿Puedes ir a 25 km/h?"
    answer: false
    explain: "El máximo es 15 km/h siempre que estés dentro del erf (art. 45), haya gente o no."
    cites: ["rvv:45"]

  - id: erf-peaton-en-el-centro
    type: mc
    prompt: "Dentro de un erf un peatón camina por el medio de la calzada delante de ti. ¿Qué es correcto?"
    options:
      - "Tiene derecho a usar todo el ancho; yo adapto mi velocidad y sigo con cuidado"
      - "Debe apartarse a un lado porque yo soy el vehículo"
      - "Le toco el claxon hasta que se aparte y sigo a mi velocidad"
      - "Puedo pasar a 30 km/h si lo esquivo"
    answer: 0
    explain: "Los peatones pueden usar las vías de un erf en todo su ancho (art. 44) y el máximo para conductores es 15 km/h (art. 45). El procedimiento CBR pide conducir a la defensiva y mostrar que cuentas con ellos."
    cites: ["rvv:44", "rvv:45", "cbr-rijprocedure:3.6"]

  - id: erf-estacionar-fuera-de-plaza
    type: yesno
    prompt: "Entras en un erf (G5) y ves un hueco ancho junto a una casa, sin plaza marcada. ¿Puedes dejar allí tu auto estacionado?"
    answer: false
    explain: "Dentro de un erf los vehículos de motor solo pueden estacionar en plazas señaladas como tales (art. 46)."
    cites: ["rvv:46"]

  - id: erf-g6-salida
    type: mc
    prompt: "Sales de un erf por la señal G6 hacia una calle de la zona urbana sin ninguna señal de velocidad. ¿Qué máximo rige para tu auto desde la G6?"
    options: [15 km/h, 50 km/h, 30 km/h, 80 km/h]
    answer: 1
    explain: "Los 15 km/h valen dentro del erf (art. 45). Al pasar la G6 termina el erf y, en una calle de la zona urbana sin señales, vuelve el máximo general de 50 km/h (art. 20). No sigues limitado a 15, pero tampoco rigen los 80 de fuera de la zona urbana."
    cites: ["rvv:bijlage1.G6", "rvv:45", "rvv:20"]
    sign: G6

  - id: erf-por-que-15
    type: mc
    prompt: "Un vecino te dice que en su erf nadie va a 15 km/h, que a 30 se ve igual. Según el procedimiento del CBR, ¿por qué el máximo es 15?"
    options: ["A esa velocidad tú puedes reaccionar bien y los peatones tienen tiempo de reaccionar al auto", "Para que los autos no hagan ruido a los vecinos", "Porque los peatones tienen preferencia sobre cualquier vehículo", "Porque las calles de un erf siempre tienen baches"]
    answer: 0
    explain: "El CBR explica que a 15 km/h el conductor reacciona bien a lo que encuentre y los peatones tienen tiempo de reaccionar al auto. No es una regla de ruido ni de preferencia: en el erf todos tienen igual derecho de uso."
    cites: ["cbr-rijprocedure:3.6", "rvv:45"]

  - id: erf-g5-tres-cambios
    type: multi
    prompt: "Conduces un auto y pasas una señal G5. ¿Qué es cierto desde ese momento?"
    sign: G5
    options: ["Mi máximo es 15 km/h", "Los peatones pueden usar la vía en todo su ancho", "Solo puedo estacionar en plazas señaladas como tales", "El máximo de 15 km/h vale solo si hay peatones a la vista", "Tengo preferencia sobre los peatones porque soy el vehículo"]
    answer: [0, 1, 2]
    explain: "Dentro del erf rigen 15 km/h siempre (art. 45), los peatones pueden usar todo el ancho (art. 44) y solo puedes estacionar en plazas señaladas (art. 46). El 15 no depende de que haya gente a la vista, y el procedimiento CBR dice que todos tienen igual derecho de uso."
    cites: ["rvv:bijlage1.G5", "rvv:44", "rvv:45", "rvv:46", "cbr-rijprocedure:3.6"]

  - id: erf-pelota
    type: mc
    prompt: "Circulas a 15 km/h por un erf y una pelota rueda a la calle desde entre dos casas. ¿Qué haces?"
    options:
      - "Reduzco y me preparo para parar, porque puede salir un niño detrás"
      - "Sigo a 15 km/h, porque es el máximo permitido"
      - "Toco el claxon y acelero para pasar antes"
      - "Miro solo la pelota y sigo igual"
    answer: 0
    explain: "En un erf cuentas con niños en cualquier punto y debes frenar y parar a tiempo si hace falta. Ir a 15 km/h no te dispensa de reaccionar."
    cites: ["cbr-rijprocedure:3.6", "rvv:44"]
    exam: false

  - id: erf-esquina-sin-vista
    type: mc
    prompt: "Dentro de un erf te acercas a una esquina donde un seto tapa la calle lateral. Vas a 15 km/h. ¿Qué es correcto?"
    options:
      - "Reduzco más y estoy listo para detenerme dentro de lo que veo libre"
      - "Mantengo 15 km/h, porque es lo que permite la ley"
      - "Acelero para cruzar la esquina rápido"
      - "Paso por el lado izquierdo para ver mejor"
    answer: 0
    explain: "El art. 19 exige poder detenerte dentro de la distancia que ves libre, y el máximo de 15 km/h no sustituye esa regla. El procedimiento CBR pide además un campo de visión amplio y atención constante."
    cites: ["rvv:19", "rvv:45", "cbr-rijprocedure:3.6"]
    exam: false

  - id: erf-derecha-vacio
    type: mc
    prompt: "Circulas por una calle ancha de un erf, sin nadie a la vista. ¿Dónde circulas según el procedimiento CBR?"
    options:
      - "Lo más a la derecha posible, según la forma del erf"
      - "Por el centro, porque no hay nadie"
      - "Por la izquierda, para ver mejor"
      - "Donde haya más espacio, sin importar el lado"
    answer: 0
    explain: "El procedimiento pide circular lo más a la derecha posible, según la forma del erf."
    cites: ["cbr-rijprocedure:3.6"]
    exam: false
