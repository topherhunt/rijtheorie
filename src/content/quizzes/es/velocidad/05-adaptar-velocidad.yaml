questions:
  - id: adaptar-curva-ciega
    type: yesno
    prompt: "En una curva sin visibilidad, la vía está dentro del límite de velocidad. ¿Basta con respetar el máximo?"
    answer: false
    explain: "Además debes poder detenerte en la distancia que ves libre; el máximo no sustituye esta regla."
    cites: ["rvv:19"]

  - id: adaptar-lento
    type: yesno
    prompt: "Sin necesidad, ¿conviene circular excepcionalmente despacio respecto al resto del tráfico?"
    answer: false
    explain: "Causa estorbo innecesario y puede ser peligroso."
    cites: ["cbr-rijprocedure:3.2", "wvw:5"]

  - id: adaptar-curva
    type: mc
    prompt: "Te acercas a una curva. ¿Cuándo regulas la velocidad?"
    options: [Antes de entrar en la curva, En medio de la curva, Al salir de la curva, No hace falta]
    answer: 0
    explain: "Se adapta antes de entrar, para recorrerla de forma segura y responsable."
    cites: ["cbr-rijprocedure:3.2"]

  - id: adaptar-salida-curva
    type: mc
    prompt: "Sales de una curva con visibilidad. ¿Qué haces con la velocidad?"
    options: [La vuelvo a subir hasta el máximo vigente, Me quedo lento, Freno, La subo por encima del máximo]
    answer: 0
    explain: "Al salir se sube la velocidad conforme al máximo vigente."
    cites: ["cbr-rijprocedure:3.2"]

  - id: adaptar-curva-ciega-subir
    type: mc
    prompt: "En una curva sin visibilidad, ¿cuándo subes la velocidad?"
    options: [Cuando ves toda la curva, Al entrar, Nunca, Cuando aparece otro auto]
    answer: 0
    explain: "En curvas sin visibilidad se sube la velocidad solo cuando la curva se ve completa."
    cites: ["cbr-rijprocedure:3.2"]

  - id: adaptar-no-aumentar
    type: yesno
    prompt: "Alguien te está adelantando. ¿Debes aumentar tu velocidad?"
    answer: false
    explain: "Al ser adelantado no se aumenta la velocidad."
    cites: ["cbr-rijprocedure:3.2"]

  - id: adaptar-niebla-bajo-maximo
    type: mc
    prompt: "Hay niebla densa y ves la vía libre solo hasta 40 m. A tu velocidad actual (80 km/h) necesitarías unos 60 m para detenerte. El máximo es 100 km/h. ¿Qué exige el art. 19?"
    options:
      - "Nada: voy por debajo del máximo"
      - "Reducir la velocidad hasta poder detenerme dentro de lo que veo libre"
      - "Mantener 80 y encender las luces"
      - "Seguir al auto de delante"
    answer: 1
    explain: "El art. 19 obliga a poder detenerse dentro de la distancia que ves libre. Estar bajo el máximo no basta."
    cites: ["rvv:19"]

  - id: adaptar-mojado-art19
    type: mc
    prompt: "Ves 100 m de vía libre y, con calzada seca, te detienes en 90 m a tu velocidad. Empieza a llover y la calzada se moja. ¿Qué haces para seguir cumpliendo el art. 19?"
    options: [Mantengo la velocidad, "Reduzco la velocidad, porque la calzada mojada alarga la distancia de frenado", Aumento la velocidad para salir antes de la lluvia, Solo enciendo los limpiaparabrisas]
    answer: 1
    explain: "La calzada mojada alarga la distancia de frenado; para poder parar dentro de lo que ves libre hay que ir más despacio."
    cites: ["rvv:19", "cbr-examenplan"]

  - id: adaptar-estrecho
    type: mc
    prompt: "Entras en un tramo estrecho de una vía donde el máximo es 80 km/h y ves venir otro auto de frente. ¿Qué haces con la velocidad?"
    options: ["Voy más despacio, tanto más cuanto más estrecha es la calzada", "Mantengo 80, porque es el máximo permitido", "Acelero para cruzarme antes en la parte ancha", "Freno hasta parar siempre"]
    answer: 0
    explain: "En un tramo estrecho se circula más despacio, y cuánto depende sobre todo del ancho; al cruzarte con otro vehículo adaptas la velocidad. El máximo es un tope, no una meta, y detenerse siempre no es lo que pide el procedimiento."
    cites: ["cbr-rijprocedure:3.2"]
    exam: false
