questions:
  - id: limites-urbana
    type: number
    prompt: "¿Cuál es la velocidad máxima de un auto dentro de la zona urbana (bebouwde kom) si no hay otra señal?"
    answer: 50
    unit: km/h
    explain: "El art. 20 fija 50 km/h para vehículos de motor dentro de la zona urbana."
    cites: ["rvv:20"]

  - id: limites-autosnelweg
    type: number
    prompt: "¿Cuál es la velocidad máxima general de un auto en una autosnelweg según el RVV, sin otras señales?"
    answer: 130
    unit: km/h
    explain: "El art. 21 fija 130 km/h para vehículos de motor en autosnelwegen."
    cites: ["rvv:21"]

  - id: limites-autoweg
    type: number
    prompt: "¿Cuál es la velocidad máxima de un auto en una autoweg fuera de la zona urbana?"
    answer: 100
    unit: km/h
    explain: "Autowegen: 100 km/h según el art. 21."
    cites: ["rvv:21"]

  - id: limites-otras
    type: number
    prompt: "¿Cuál es la velocidad máxima de un auto en una vía que no es autosnelweg ni autoweg, fuera de la zona urbana?"
    answer: 80
    unit: km/h
    explain: "En las demás vías fuera de la zona urbana el máximo es 80 km/h."
    cites: ["rvv:21"]

  - id: limites-bromfiets
    type: number
    prompt: "¿Cuál es la velocidad máxima de un ciclomotor (bromfiets) en la calzada, dentro y fuera de la zona urbana?"
    answer: 45
    unit: km/h
    explain: "En la calzada, 45 km/h tanto dentro como fuera de la zona urbana."
    cites: ["rvv:20", "rvv:21"]

  - id: limites-bromfiets-fietspad
    type: mc
    prompt: "Un bromfiets circula por un fiets/bromfietspad fuera de la zona urbana. ¿Cuál es su máximo?"
    options: [30 km/h, 40 km/h, 45 km/h, 50 km/h]
    answer: 1
    explain: "En el fiets/bromfietspad: 30 km/h dentro de la zona urbana y 40 km/h fuera."
    cites: ["rvv:21"]

  - id: limites-senal-prevalece
    type: yesno
    prompt: "Una señal de velocidad máxima de 70 km/h está puesta en una vía donde el máximo general es 80. ¿Debes obedecer los 70?"
    answer: true
    explain: "Las señales de prohibición y mandato se obedecen y prevalecen sobre las reglas generales."
    cites: ["rvv:62", "rvv:63"]

  - id: limites-exceso-grave
    type: yesno
    prompt: "¿Aparece el exceso de la velocidad máxima entre las conductas graves de la Wegenverkeerswet (art. 5a)?"
    answer: true
    explain: "Sí: art. 5a lid 1 onderdeel g."
    cites: ["wvw:5a"]

  - id: limites-bromfiets-autoweg
    type: yesno
    prompt: "Un amigo conduce una bromfiets (máximo 45 km/h) y quiere tomar una autoweg (señal G3). ¿Puede usarla?"
    sign: G3
    answer: false
    explain: "El art. 42 permite usar la autoweg solo a conductores de un motorvoertuig, y una bromfiets no es motorvoertuig según el art. 1. Tampoco alcanza el mínimo de 50 km/h."
    cites: ["rvv:42.2", "rvv:1"]

  - id: limites-h2-otra-via
    type: mc
    prompt: "Sales de un pueblo por una carretera normal (ni autoweg ni autosnelweg, sin señales de velocidad) y pasas la señal H2. ¿Qué máximo rige para tu auto desde ahora?"
    options: [50 km/h, 80 km/h, 100 km/h, 130 km/h]
    answer: 1
    explain: "H2 es el fin de la zona urbana. Fuera de ella, en las demás vías, el máximo del art. 21 es 80 km/h."
    cites: ["rvv:21", "rvv:bijlage1.H2"]
    sign: H2

  - id: limites-minimo-aplicado
    type: yesno
    prompt: "Tu vehículo de motor, por su construcción, no puede superar los 40 km/h. ¿Puedes entrar en una autoweg?"
    answer: false
    explain: "La autoweg solo la puede usar un vehículo de motor con el que se puede y se permite ir a 50 km/h o más (art. 42 lid 2)."
    cites: ["rvv:42.2"]
