questions:
  - id: limites-urbana
    type: number
    prompt: "Entras con tu auto en un pueblo, pasas la señal H1 y no ves ninguna señal de velocidad. ¿Cuál es tu máximo?"
    sign: H1
    answer: 50
    unit: km/h
    explain: "El art. 20 fija 50 km/h para vehículos de motor dentro de la zona urbana."
    cites: ["rvv:20"]

  - id: limites-autosnelweg
    type: number
    prompt: "Circulas con tu auto por una autosnelweg (G1) sin ninguna señal de velocidad ni remolque. ¿Cuál es tu máximo?"
    sign: G1
    answer: 130
    unit: km/h
    explain: "El art. 21 fija 130 km/h para vehículos de motor en autosnelwegen."
    cites: ["rvv:21"]

  - id: limites-autoweg
    type: number
    prompt: "Circulas con tu auto por una vía con la señal G3 (autoweg), fuera de la zona urbana y sin otras señales de velocidad. ¿Cuál es tu máximo?"
    sign: G3
    answer: 100
    unit: km/h
    explain: "Autoweg: 100 km/h (art. 21). No son los 130 de la autosnelweg ni los 80 de las otras vías: lo decide el tipo de vía."
    cites: ["rvv:21"]

  - id: limites-bromfiets
    type: number
    prompt: "Un bromfiets circula por la calzada de una carretera normal fuera de la zona urbana, sin señales de velocidad. ¿Cuál es su máximo?"
    answer: 45
    unit: km/h
    explain: "En la calzada, la bromfiets va a un máximo de 45 km/h, dentro y fuera de la zona urbana. No le valen los 80 de las demás vías, que son para otros vehículos de motor."
    cites: ["rvv:20", "rvv:21"]

  - id: limites-bromfiets-calzada-vs-pad
    type: mc
    prompt: "Un bromfiets entra en una zona urbana. Por la calzada va a su máximo y después se pasa a un fiets/bromfietspad. ¿Cómo cambia su máximo?"
    options: ["De 45 a 30 km/h", "De 45 a 40 km/h", "De 50 a 30 km/h", "Sigue igual: 45 km/h"]
    answer: 0
    explain: "Dentro de la zona urbana el bromfiets va a 45 km/h en la calzada y a 30 km/h en el fiets/bromfietspad (fuera serían 45 y 40). No existe un 50 para la bromfiets, y el camino aparte no le da más velocidad sino menos."
    cites: ["rvv:20", "rvv:21"]

  - id: limites-senal-prevalece
    type: yesno
    prompt: "Vas por una carretera normal fuera de la zona urbana, donde el máximo general es 80, y ves una señal de 70 km/h. No hay obras ni nadie delante. ¿Debes bajar a 70?"
    answer: true
    explain: "Sí. La señal de prohibición se obedece y prevalece sobre la regla general; que la vía esté libre no cambia nada. Los 80 son un tope general, no un derecho a ir a 80 con una señal que dice menos."
    cites: ["rvv:62", "rvv:63"]

  - id: limites-exceso-grave
    type: yesno
    prompt: "Decides ir a propósito a 140 km/h en un tramo de 100 con tráfico, y tu forma de conducir pone a otro en peligro de lesión grave. ¿Puede contar como una de las conductas graves de la Wegenverkeerswet (art. 5a)?"
    answer: true
    explain: "Sí. Exceder el máximo a propósito, de forma que pone a otro en peligro de muerte o lesión grave, es una de las conductas del art. 5a. No es una simple infracción menor solo porque el límite sea 'general'."
    cites: ["wvw:5a"]

  - id: limites-bromfiets-autoweg
    type: yesno
    prompt: "Un amigo conduce una bromfiets (máximo 45 km/h) y quiere tomar una autoweg (señal G3). ¿Puede usarla?"
    sign: G3
    answer: false
    explain: "El art. 42 permite usar la autoweg solo a conductores de un motorvoertuig, y una bromfiets no es motorvoertuig según el art. 1. Tampoco alcanza el mínimo de 50 km/h."
    cites: ["rvv:42.2", "rvv:1"]

  - id: limites-h2-otra-via
    type: mc
    prompt: "Sales de un pueblo por una carretera normal (ni autoweg ni autosnelweg, sin señales de velocidad) y pasas la señal H2. ¿Qué máximo rige para tu auto desde ahora?"
    options: [50 km/h, 80 km/h, 100 km/h, 130 km/h]
    answer: 1
    explain: "H2 es el fin de la zona urbana. Fuera de ella, en las demás vías, el máximo del art. 21 es 80 km/h."
    cites: ["rvv:21", "rvv:bijlage1.H2"]
    sign: H2
