questions:
  - id: senal-recomendada-obligatoria
    type: mc
    prompt: "Vas por una carretera normal fuera de la zona urbana, de día y con la calzada seca. Ves una señal A4 de 60 km/h antes de una curva abierta que ves entera, y tú vas a 80. ¿Qué es correcto?"
    options: ["La A4 recomienda 60, no obliga; sigo a 80 si veo que puedo detenerme", "Debo bajar a 60 porque toda señal de velocidad es un máximo", "Debo bajar a 60 porque la curva lo exige por ley", "Puedo acelerar a 100 porque la A4 anula el máximo de 80"]
    answer: 0
    explain: "La A4 es una adviessnelheid: no manda ni prohíbe, así que no es un máximo como la A1. Aun así sigues obligado a poder detenerte dentro de lo que ves libre (art. 19); si en esa curva no lo consigues a 80, vas demasiado rápido. Y no anula el máximo de la vía."
    cites: ["rvv:bijlage1.A4", "rvv:62", "rvv:19"]
    sign: A4

  - id: senal-a2-general
    type: mc
    prompt: "Conduces un auto por una carretera normal fuera de la zona urbana (ni autoweg ni autosnelweg). Pasas una señal A2, el final de una velocidad máxima de 60 km/h. ¿Qué máximo rige para ti desde ahora?"
    options: [60 km/h, 80 km/h, 100 km/h, 130 km/h]
    answer: 1
    explain: "A2 termina el máximo de la señal y vuelve el máximo general de la vía: en las demás vías fuera de la zona urbana, 80 km/h. No sigue valiendo el 60, y 100 o 130 son para autowegen y autosnelwegen."
    cites: ["rvv:bijlage1.A2", "rvv:21"]
    sign: A2

  - id: senal-a4-curva
    type: mc
    prompt: "Antes de una curva cerrada y sin visibilidad ves una señal A4 de 40 km/h. El máximo legal de la vía es 80 y tú vas a 70. ¿Qué es correcto?"
    options: ["Voy bien: 70 está bajo el máximo y la A4 solo recomienda", "Debo poder detenerme dentro de lo que veo libre; si a 70 no puedo, voy demasiado rápido", "Debo ir exactamente a 40 porque toda señal de velocidad es obligatoria", "La A4 solo cuenta si llueve, así que sigo a 70"]
    answer: 1
    explain: "La A4 (adviessnelheid) no obliga, pero el art. 19 sí: debes poder detenerte dentro de la distancia que ves libre. En una curva sin visibilidad esa distancia es corta, y estar bajo el máximo legal no sustituye esa regla. Ir a 40 exactos tampoco es la regla: lo que cuenta es poder parar."
    cites: ["rvv:bijlage1.A4", "rvv:62", "rvv:19"]
    sign: A4

  - id: senal-a5-fin
    type: mc
    prompt: "Pasas una señal A5 justo después de una curva donde había una A4 de 40 km/h. ¿Qué cambia para ti?"
    options:
      - "Termina solo la recomendación; el máximo legal y la obligación de poder detenerme siguen"
      - "Termina también el máximo legal y puedo ir a la velocidad que quiera"
      - "Debo acelerar hasta el máximo legal"
      - "Debo seguir a 40 km/h hasta el próximo cruce"
    answer: 0
    explain: "A5 es el final de la adviessnelheid. No termina ningún máximo ni la regla del art. 19, y tampoco te obliga a acelerar."
    cites: ["rvv:bijlage1.A5", "rvv:19"]
    sign: A5

  - id: senal-zona-calles
    type: yesno
    prompt: "Pasas una señal A1 de 30 km/h con la palabra «zone» encima y sin indicación del área. Giras por dos calles del barrio y todavía no has visto ninguna señal de fin de zona. ¿Sigue valiendo el máximo de 30?"
    answer: true
    explain: "Sin indicación del área, la señal vale en el área limitada por ella y por las señales de fin de zona colocadas con ella. Mientras no llegues a ese final, sigues dentro."
    cites: ["rvv:66.2"]
    sign: A1

  - id: senal-zona-fin
    type: mc
    prompt: "Circulas por un barrio dentro de la zona urbana con una A1 de 30 km/h con la palabra «zone». Pasas la señal que marca el fin de la zona y no ves ninguna otra señal de velocidad. ¿Qué máximo rige ahora para tu auto?"
    options: [30 km/h, 50 km/h, 80 km/h, 15 km/h]
    answer: 1
    explain: "Al pasar el fin de la zona, la A1 de 30 deja de valer. Sigues dentro de la zona urbana, así que rige el máximo general de ahí: 50 km/h (art. 20). No son los 80 de fuera de la zona urbana, y seguir a 30 no es obligatorio."
    cites: ["rvv:66.2", "babw:9", "rvv:20"]
    sign: A1

  - id: senal-onderbord
    type: mc
    prompt: "Conduces un auto. Una señal tiene debajo un onderbord con la palabra uitgezonderd y el símbolo de bicicleta. ¿Qué significa para ti?"
    options: [La señal no vale para los ciclistas pero sí para ti, La señal vale solo para ciclistas, La señal no vale para nadie, La señal no vale para ti por ser un vehículo de motor]
    answer: 0
    explain: "Uitgezonderd con símbolos: la señal vale para todos menos para los usuarios indicados. Los excluidos son los ciclistas; un auto sigue sujeto a la señal."
    cites: ["rvv:67.1"]

  - id: senal-onderbord-solo-simbolo
    type: mc
    prompt: "Conduces un auto fuera de la zona urbana, por una vía normal. Ves una señal A1 de 50 km/h y debajo un onderbord que solo muestra el símbolo de un camión. ¿Qué máximo rige para ti?"
    options: [50 km/h, 80 km/h, 30 km/h, 100 km/h]
    answer: 1
    explain: "Un onderbord con solo símbolos limita la señal a los usuarios indicados (art. 67 lid 1 b). La A1 vale para los camiones, no para ti, así que rige el máximo general de 80 km/h fuera de la zona urbana."
    cites: ["rvv:67.1", "rvv:21"]
    sign: A1

  - id: senal-onderbord-uitgezonderd-auto
    type: yesno
    prompt: "Una señal A1 de 60 km/h tiene debajo un onderbord con la palabra «uitgezonderd» y el símbolo de una bicicleta. Conduces un auto. ¿Debes respetar los 60?"
    answer: true
    explain: "«Uitgezonderd» con símbolos significa que la señal no vale para los usuarios indicados (art. 67 lid 1 c). La excepción es para las bicicletas; tú sigues sujeto a la señal."
    cites: ["rvv:67.1"]
    sign: A1

  - id: senal-a3-panel-80
    type: mc
    prompt: "En una autosnelweg con poco tráfico, el panel sobre tu carril muestra un 80 en un círculo rojo y tú ibas a 120. ¿Qué haces?"
    options: ["Bajo a 80 como máximo y sigo por mi carril", "Cambio al carril de al lado porque el 80 es solo para este", "Sigo a 120 porque el máximo general es 130", "Salgo del carril porque está cerrado"]
    answer: 0
    explain: "El A3 en un panel es una velocidad máxima y significa que el carril puede usarse, con esa velocidad como máximo. Prevalece sobre los 130 generales. Un carril cerrado se muestra con una cruz roja, no con un número."
    cites: ["rvv:bijlage1.A3", "rvv:73", "rvv:62"]
    sign: A3

  - id: senal-a3-cruz-roja
    type: yesno
    prompt: "En una autosnelweg, el panel sobre tu carril muestra una cruz roja y el del carril de al lado un 100. ¿Puedes seguir por tu carril?"
    answer: false
    explain: "Una cruz roja significa que el carril no puede usarse (art. 73 b). El 100 del carril vecino es la velocidad máxima de ese carril, que sí puede usarse."
    cites: ["rvv:73"]
