questions:
  - id: seguimiento-regla
    type: mc
    prompt: "¿Qué dice la regla de los dos segundos?"
    options: [Dejar la distancia que recorres en dos segundos, Dejar siempre dos metros, Dejar dos autos de distancia, Frenar durante dos segundos]
    answer: 0
    explain: "La volgafstand equivale a la distancia que recorres en dos segundos a tu velocidad."
    cites: ["cbr-rijprocedure:3.2"]

  - id: seguimiento-calculo
    type: number
    prompt: "Vas a 90 km/h. Con la regla de la mitad, ¿cuántos metros de distancia de seguimiento aproximados dejas?"
    answer: 45
    unit: metros
    explain: "La distancia en metros es aproximadamente la mitad de la velocidad en km/h: 90 / 2 = 45."
    cites: ["cbr-rijprocedure:3.2"]

  - id: seguimiento-mas
    type: multi
    prompt: "¿En cuáles de estas situaciones hace falta más distancia?"
    options: [Detrás de un vehículo opaco, Con tiempo mojado, Cuando te siguen muy de cerca, Con la calzada seca y buena visibilidad]
    answer: [0, 1, 2]
    explain: "La Rijprocedure B lo pide detrás de un vehículo opaco, con tiempo mojado y cuando otro te sigue muy de cerca."
    cites: ["cbr-rijprocedure:3.2"]

  - id: seguimiento-lluvia
    type: yesno
    prompt: "Llueve. ¿Mantienes la misma distancia que con calzada seca?"
    answer: false
    explain: "Con tiempo mojado hace falta una distancia mayor."
    cites: ["cbr-rijprocedure:3.2"]

  - id: seguimiento-opaco
    type: yesno
    prompt: "Vas detrás de una furgoneta que no te deja ver lo de delante. ¿Dejas más distancia?"
    answer: true
    explain: "Detrás de un vehículo opaco hace falta más distancia."
    cites: ["cbr-rijprocedure:3.2"]

  - id: seguimiento-fila
    type: mc
    prompt: "Estás en una fila de tráfico lento. ¿Qué distancia con el auto de delante recomienda la Rijprocedure B?"
    options: [Lo más constante posible, Lo más corta posible, Cada vez menos, Ninguna]
    answer: 0
    explain: "En fila se mantiene la distancia lo más constante posible."
    cites: ["cbr-rijprocedure:3.2"]

  - id: seguimiento-grave
    type: yesno
    prompt: "¿Aparece en el art. 5a WVW el ir muy cerca detrás de otro vehículo entre las conductas graves?"
    answer: true
    explain: "Sí: onderdeel h, zeer dicht achter een ander voertuig rijden."
    cites: ["wvw:5a"]

  - id: seguimiento-siguen
    type: yesno
    prompt: "Un auto te sigue demasiado pegado. ¿Conviene dejar tú algo más de distancia delante?"
    answer: true
    explain: "Con un vehículo muy pegado detrás hace falta más distancia, y esa situación debe evitarse en lo posible."
    cites: ["cbr-rijprocedure:3.2"]

  - id: seguimiento-punto-fijo
    type: mc
    prompt: "En una autosnelweg el auto de delante pasa un poste y tú lo pasas 1 segundo después. ¿Qué pasa con tu volgafstand?"
    options: [Es suficiente, "Es demasiado corta: debería ser de al menos 2 segundos", Es demasiado larga, Depende solo del color del auto]
    answer: 1
    explain: "La regla de los dos segundos pide una distancia que se recorre en 2 segundos. Con 1 segundo dejas la mitad."
    cites: ["cbr-rijprocedure:3.2"]

  - id: seguimiento-120
    type: yesno
    prompt: "Vas a 120 km/h detrás de otro auto y dejas unos 40 m. ¿Cumples el punto de partida de la regla de los dos segundos?"
    answer: false
    explain: "A 120 km/h el punto de partida son unos 60 m (la mitad de la velocidad en km/h); 40 m son menos de 2 segundos."
    cites: ["cbr-rijprocedure:3.2"]

  - id: seguimiento-lluvia-opaco
    type: mc
    prompt: "Vas a 90 km/h, llueve y vas detrás de un camión que te tapa la vista. La regla básica da unos 45 m. ¿Qué haces?"
    options: [Dejo 45 m justos, Dejo más de 45 m, Dejo menos de 45 m para ver mejor, Dejo 45 m solo si el camión frena]
    answer: 1
    explain: "Con tiempo mojado y detrás de un vehículo opaco hace falta una distancia mayor que el punto de partida."
    cites: ["cbr-rijprocedure:3.2"]
