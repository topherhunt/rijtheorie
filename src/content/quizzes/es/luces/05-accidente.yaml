questions:
  - id: accidente-irse-herido
    type: yesno
    prompt: Estás implicado en un accidente y hay un herido que no puede valerse por sí mismo. ¿Puedes irte después de dejar tus datos?
    answer: false
    explain: "Dar tu identidad no cubre el caso c) del artículo 7 lid 1: dejar a un herido en estado de desamparo sigue prohibido."
    cites: ["wvw:7.1", "wvw:7.2"]

  - id: accidente-danos
    type: mc
    prompt: Rozaste un auto estacionado y causaste daños, sin heridos. ¿Qué debes hacer para no cometer una infracción al irte?
    options: ["Irte, porque nadie resultó herido", "Dar en el lugar la oportunidad de establecer tu identidad y la del vehículo", "Irte y llamar a tu aseguradora esa tarde", "Irte si no hay ningún testigo"]
    answer: 1
    explain: Si das en el lugar la oportunidad de establecer tu identidad (y la del vehículo), la prohibición de abandonar el lugar por daños no se aplica. Que no haya heridos o testigos, o avisar luego a la aseguradora, no sustituye eso.
    cites: ["wvw:7.2"]

  - id: accidente-golpe-no-vi
    type: yesno
    prompt: Al dar marcha atrás sientes un golpe y por el espejo ves que el auto de atrás quedó con la defensa abollada. Piensas "no era mi culpa" y te vas sin dejar tus datos. ¿Cometes una infracción?
    answer: true
    explain: El artículo 7 prohíbe irse cuando sabes o debes suponer razonablemente que hubo daños a otro. Con el golpe y la abolladura a la vista lo sabes, y la excepción solo vale si das la oportunidad de identificarte.
    cites: ["wvw:7.1", "wvw:7.2"]

  - id: accidente-bici-identidad
    type: yesno
    prompt: Con tu bicicleta rozas un auto estacionado y le rayas la puerta. Antes de irte, ¿la ley te exige también dar la oportunidad de identificar tu vehículo (la bicicleta)?
    answer: false
    explain: Debes dar la oportunidad de establecer tu identidad. La identidad del vehículo solo se exige a quien conducía un motorrijtuig, y una bicicleta no lo es.
    cites: ["wvw:7.2"]

  - id: accidente-curiosear
    type: yesno
    prompt: Pasas junto a un accidente en el otro sentido y frenas casi hasta parar, en pleno carril, para mirar. Nadie choca contigo. ¿Has infringido el artículo 5 de la WVW?
    answer: true
    explain: El artículo 5 prohíbe comportarse de modo que se cause o pueda causarse peligro, o que el tráfico sea o pueda ser estorbado. Frenar en pleno carril para mirar puede causar ambas cosas, aunque al final no pase nada.
    cites: ["wvw:5"]

  - id: accidente-carril-herido
    type: yesno
    prompt: Cambias de carril sin mirar, por tu culpa chocas con una motocicleta y su conductor sufre lesiones graves. Aparte de lo civil, ¿infringes el artículo 6 de la WVW?
    answer: true
    explain: El artículo 6 prohíbe comportarse de modo que, por tu culpa, ocurra un accidente en el que otra persona sufra lesiones graves.
    cites: ["wvw:6"]

  - id: accidente-policia-parar
    type: yesno
    prompt: Vas con prisa y un agente te ordena parar para mostrar tu permiso de conducir y los documentos del auto, aunque tú no has visto ninguna infracción. ¿Debes hacerlo?
    answer: true
    explain: A la primera orden debes detener el vehículo y mostrar los documentos.
    cites: ["wvw:160.1"]

  - id: accidente-ayuda-112
    type: order
    prompt: "Llegas a un accidente con un herido. Ordena los pasos:"
    answer: ["Parar seguro y luces de emergencia", "Llamar al 112", "Atender al herido"]
    explain: Primero tu seguridad, luego avisar al 112, luego ayudar al herido.
    cites: ["general"]

  - id: accidente-ayuda-mover
    type: yesno
    prompt: Un herido está dentro de su auto y no hay fuego ni tráfico que lo ponga en peligro. ¿Debes sacarlo enseguida?
    answer: false
    explain: No muevas a un herido salvo que corra peligro donde está. Llama al 112 y atiéndelo allí.
    cites: ["general"]
