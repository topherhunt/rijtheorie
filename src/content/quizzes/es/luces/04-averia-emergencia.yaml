questions:
  - id: triangulo-distancia
    type: number
    prompt: Tu auto averiado es un obstáculo que no se ve a tiempo en una carretera normal y no tienes luces de emergencia. ¿A qué distancia aproximada de tu auto colocas el triángulo?
    answer: 30
    unit: m
    explain: La ley dice "ongeveer 30 meter" (unos 30 m) del vehículo.
    cites: ["rvv:58.2"]

  - id: triangulo-cuando
    type: mc
    prompt: ¿Cuándo exige la ley colocar el triángulo?
    options: ["Siempre que te detienes, aunque sea en un lugar bien visible", "Si es un obstáculo no visible a tiempo y no hay luces de emergencia", "Solo de noche, aunque lleves las luces de emergencia puestas", "Solo en una autosnelweg, donde el tráfico va más rápido"]
    answer: 1
    explain: Artículo 58 lid 1 y 3. Si es un obstáculo no visible a tiempo, se señala con triángulo, salvo que lleves luces de emergencia intermitentes.
    cites: ["rvv:58.1", "rvv:58.3"]

  - id: triangulo-direccion
    type: mc
    prompt: Tu auto averiado está parado en una carretera de un solo sentido y el tráfico solo llega por detrás. ¿Dónde colocas el triángulo?
    options: ["Sobre la vía, bien visible, a unos 30 m detrás de tu auto", "A unos 30 m delante de tu auto, hacia donde apunta el capó", "Pegado al parachoques trasero para que no se pierda", "En la berma a unos 30 m sin importar la dirección"]
    answer: 0
    explain: "El triángulo se coloca bien visible sobre la vía, a unos 30 m y en la dirección del tráfico para el que el vehículo es un peligro: aquí, el que viene por detrás."
    cites: ["rvv:58.2"]

  - id: triangulo-vehiculos
    type: multi
    prompt: ¿Para cuáles de estos vehículos parados exige la ley el triángulo cuando son un obstáculo que no se ve a tiempo?
    options: [Un auto, Un remolque, Una motocicleta, Una bicicleta]
    answer: [0, 1]
    explain: El artículo 58 vale para vehículos de motor de más de dos ruedas y para remolques. La motocicleta tiene dos ruedas y la bicicleta no es un vehículo de motor.
    cites: ["rvv:58.1"]

  - id: averia-triangulo-sin-luces
    type: mc
    prompt: De noche tu auto se queda sin batería en la calzada, justo después de una curva, y las luces de emergencia no se encienden. Es un obstáculo que no se ve a tiempo. ¿Qué exige la ley?
    options: ["Triángulo en la vía a unos 30 m, hacia el tráfico que llega", "Nada especial, porque ya llamaste a la grúa y viene hacia ti", "Poner el triángulo pegado al auto para no alejarte de él", "Poner el triángulo solo si estás en una autosnelweg"]
    answer: 0
    explain: El deber de triángulo solo se anula si el vehículo lleva luces de emergencia intermitentes. Sin ellas, un obstáculo que no se ve a tiempo se señala con el triángulo a unos 30 m.
    cites: ["rvv:58.1", "rvv:58.2", "rvv:58.3"]

  - id: alarma-cuando
    type: multi
    prompt: Según el CBR, ¿en cuáles de estas situaciones se usan las luces de emergencia (waarschuwingslichten)?
    options: [Al llegar al final de una cola que se forma, Al detenerte en un lugar poco visible, Para estacionar un momento donde está prohibido, Al saludar a otro conductor]
    answer: [0, 1]
    explain: "La Rijprocedure las recomienda cuando hay que reducir mucho la velocidad o parar de repente: colas, lugares poco visibles y poca visibilidad."
    cites: ["cbr-rijprocedure:2"]

  - id: alarma-infraccion
    type: yesno
    prompt: Si pones las luces de emergencia, ¿puedes parar en un lugar donde está prohibido detenerse?
    answer: false
    explain: Las luces de emergencia no legalizan una infracción.
    cites: ["cbr-rijprocedure:2"]

  - id: alarma-triangulo
    type: yesno
    prompt: Tu auto parado lleva las luces de emergencia intermitentes encendidas. ¿La ley exige además poner el triángulo?
    answer: false
    explain: El artículo 58 lid 3 dice que el deber de triángulo no se aplica cuando hay luz intermitente de emergencia. Aun así, lo prudente es usar ambos si es seguro.
    cites: ["rvv:58.3"]

  - id: autopista-vluchtstrook-no-emergencia
    type: yesno
    prompt: Quieres revisar el navegador y paras un momento en la vluchtstrook, sin ninguna emergencia. ¿Está permitido?
    answer: false
    explain: La vluchtstrook solo se usa en caso de emergencia.
    cites: ["rvv:43.3"]

  - id: autopista-vluchtstrook-emergencia
    type: yesno
    prompt: Tu motor se para en una autosnelweg. ¿Puedes llegar a la vluchtstrook?
    answer: true
    explain: Una avería es un caso de emergencia (noodgeval), y en emergencias sí puedes usar la vluchtstrook.
    cites: ["rvv:43.3"]

  - id: autopista-vuelta
    type: yesno
    prompt: Te pasaste de la salida de una autosnelweg. ¿Puedes dar marcha atrás por la vluchtstrook hasta ella?
    answer: false
    explain: Dar la vuelta y la marcha atrás están prohibidos en una autosnelweg o autoweg.
    cites: ["rvv:43.1"]

