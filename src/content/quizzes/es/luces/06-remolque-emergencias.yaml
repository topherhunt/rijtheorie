questions:
  - id: remolque-seis
    type: yesno
    prompt: Remolcas un auto con una cuerda de 6 metros entre los dos vehículos. ¿Está permitido?
    answer: false
    explain: La distancia entre la parte trasera del que remolca y la delantera del remolcado no puede ser mayor de 5 m.
    cites: ["rvv:53"]

  - id: remolque-cinco-exacto
    type: yesno
    prompt: Remolcas un auto averiado y la distancia entre la parte trasera de tu auto y la delantera del remolcado es exactamente 5 metros. ¿Está permitido?
    answer: true
    explain: El artículo 53 prohíbe una distancia de MÁS de 5 metros; con 5 metros exactos está permitido.
    cites: ["rvv:53"]

  - id: emergencia-ciclista
    type: yesno
    prompt: Vas en bicicleta y se acerca por detrás una ambulancia con luz azul y bocina de dos tonos. ¿Estás obligado a dejarla pasar?
    answer: true
    explain: El artículo 50 se dirige a todos los weggebruikers, no solo a los conductores de auto. También un ciclista debe dejar pasar al vehículo prioritario.
    cites: ["rvv:50", "rvv:29.1"]

  - id: emergencia-amarilla
    type: yesno
    prompt: Ves un vehículo de trabajo con luz amarilla destellante, sin luz azul ni bocina de dos tonos. ¿Es la señal de urgencia que obliga a dejar pasar?
    answer: false
    explain: La luz amarilla o verde es la de vehículos de trabajo; la señal de urgencia de policía, bomberos y ambulancias es la luz azul con bocina de dos tonos.
    cites: ["rvv:30.1", "rvv:29.1", "rvv:50"]

  - id: emergencia-pasar
    type: yesno
    prompt: ¿Debes dejar pasar a una ambulancia con luz azul y sirena?
    answer: true
    explain: Todos los usuarios de la vía deben dejar pasar a un vehículo prioritario.
    cites: ["rvv:50"]

  - id: emergencia-peligro
    type: yesno
    prompt: Para dejar pasar a una ambulancia, ¿puedes hacer una maniobra que ponga en peligro a un ciclista?
    answer: false
    explain: "Hay que dejar pasar, pero sin causar peligro a otros: el artículo 5 de la WVW sigue vigente."
    cites: ["wvw:5", "rvv:50"]

  - id: agente-indicaciones
    type: yesno
    prompt: Un agente de policía te indica con la mano que sigas o pares en un cruce. ¿Debes seguir su indicación?
    answer: true
    explain: Los usuarios de la vía deben seguir las indicaciones que dan los agentes en relación con el tráfico.
    cites: ["wvw:12.1"]
