questions:
  - id: remolque-seis
    type: yesno
    prompt: Remolcas un auto averiado con una barra y mides 5,3 metros entre la parte trasera de tu auto y la delantera del remolcado. ¿Está permitido?
    answer: false
    explain: La distancia entre la parte trasera del que remolca y la delantera del remolcado no puede ser mayor de 5 m, y 5,3 m ya lo es.
    cites: ["rvv:53"]

  - id: remolque-cinco-exacto
    type: yesno
    prompt: Remolcas un auto averiado y la distancia entre la parte trasera de tu auto y la delantera del remolcado es exactamente 5 metros. ¿Está permitido?
    answer: true
    explain: El artículo 53 prohíbe una distancia de MÁS de 5 metros; con 5 metros exactos está permitido.
    cites: ["rvv:53"]

  - id: emergencia-amarilla
    type: yesno
    prompt: Ves un vehículo de trabajo con luz amarilla destellante, sin luz azul ni bocina de dos tonos. ¿Es la señal de urgencia que obliga a dejar pasar?
    answer: false
    explain: La luz amarilla o verde es la de vehículos de trabajo; la señal de urgencia de policía, bomberos y ambulancias es la luz azul con bocina de dos tonos.
    cites: ["rvv:30.1", "rvv:29.1", "rvv:50"]

  - id: emergencia-peligro
    type: mc
    prompt: Una ambulancia con luz azul y bocina de dos tonos se acerca por detrás. A tu derecha va un ciclista pegado al borde y no hay hueco para apartarte. ¿Qué haces?
    options: ["Dejo pasar a la ambulancia sin poner en peligro al ciclista", "Me aparto a la derecha de golpe, porque la ambulancia tiene paso", "Acelero para salir del camino de la ambulancia lo antes posible", "Me detengo en seco en mi carril para que la ambulancia me pase"]
    answer: 0
    explain: Hay que dejar pasar al vehículo prioritario, pero el artículo 5 de la WVW sigue prohibiendo maniobras que pongan en peligro a otros. Apartarte de golpe sobre el ciclista o frenar en seco crea otro peligro.
    cites: ["wvw:5", "rvv:50"]

  - id: emergencia-peaton
    type: yesno
    prompt: Cruzas la calle a pie y se acerca una ambulancia con luz azul y bocina de dos tonos. ¿Estás obligado a dejarla pasar?
    answer: true
    explain: El artículo 50 obliga a todos los usuarios de la vía, peatones incluidos, a dejar pasar a un vehículo prioritario.
    cites: ["rvv:50"]
