questions:
  - id: mistachter-40m
    type: mc
    prompt: Hay niebla y ves el auto de delante a unos 40 metros. ¿Qué dice la ley sobre tu luz antiniebla trasera?
    options: [La puedes llevar porque ves a menos de 50 m, Solo la puedes llevar si además llueve, Solo la puedes llevar si ves a menos de 20 m, La debes llevar y no puedes encender las de cruce]
    answer: 0
    explain: La antiniebla trasera se puede llevar con niebla o nieve que reduce la visibilidad a menos de 50 metros. La lluvia no es condición, y la ley no fija 20 m.
    cites: ["rvv:34.2"]

  - id: mistlicht-lluvia-delante-detras
    type: mc
    prompt: Llueve con tanta intensidad que casi no ves. ¿Qué antiniebla permite la ley?
    options: [Solo la delantera, Solo la trasera, Las dos, Ninguna de las dos]
    answer: 0
    explain: "El mistlicht delantero se permite con niebla, nieve o lluvia que reduce seriamente la visibilidad. La trasera se permite solo con niebla o nieve y menos de 50 m de visibilidad: la lluvia no cuenta."
    cites: ["rvv:34.1", "rvv:34.2"]

  - id: mistachter-80m
    type: yesno
    prompt: Hay niebla y ves a 80 metros. Un amigo dice que enciendas la antiniebla trasera por si acaso. ¿Lo permite la ley?
    answer: false
    explain: Con 80 m la visibilidad no es de menos de 50 m, así que la trasera no está permitida. Como los 50 m son el límite, el "por si acaso" no vale.
    cites: ["rvv:34.2"]

  - id: mistvoor-dimlicht
    type: yesno
    prompt: Con las antiniebla delanteras encendidas por niebla densa, ¿es obligatorio llevar además las luces de cruce?
    answer: false
    explain: La ley dice que en ese caso no hace falta llevar dimlicht.
    cites: ["rvv:34.1"]

  - id: detenido-luces
    type: mc
    prompt: De noche, tu auto está parado en la vluchtstrook de una autosnelweg. ¿Qué luces debe llevar?
    options: [Luces de posición (stadslicht) y luz trasera, Solo luces de emergencia, Solo la luz trasera, Solo luces de carretera]
    answer: 1
    explain: Un vehículo de más de dos ruedas parado en la vluchtstrook lleva stadslicht y luz trasera de noche. Las luces de emergencia solas o la luz trasera sin las de posición no bastan.
    cites: ["rvv:38"]

  - id: detenido-dia-niebla
    type: yesno
    prompt: De día, con niebla densa, tu auto está parado en la calzada fuera de poblado. ¿Debe llevar luces de posición y trasera?
    answer: true
    explain: El artículo 38 las exige de noche y de día cuando la visibilidad está seriamente reducida.
    cites: ["rvv:38"]

  - id: detenido-dos-ruedas
    type: yesno
    prompt: De noche una motocicleta está parada sobre la calzada fuera de la zona urbana. ¿Le exige el artículo 38 llevar stadslicht y luz trasera?
    answer: false
    explain: El artículo 38 habla de vehículos de motor de más de dos ruedas, y la motocicleta tiene dos.
    cites: ["rvv:38"]

  - id: detenido-dia-despejado
    type: yesno
    prompt: Es de día, hace sol y se ve perfectamente. Paras tu auto en una parkeerhaven junto a una autosnelweg. ¿El artículo 38 te exige llevar stadslicht y luz trasera?
    answer: false
    explain: El artículo 38 las exige de noche, y de día solo si la visibilidad está seriamente reducida.
    cites: ["rvv:38"]

  - id: bici-luz-pecho-espalda
    type: yesno
    prompt: De noche vas en bicicleta sin luces en la bici, pero llevas una luz blanca en el pecho y una luz roja en la espalda. ¿Cumples con la ley?
    answer: true
    explain: El artículo 35 permite sustituir la luz delantera por una luz blanca o amarilla en el pecho, y la trasera por una luz roja en la espalda.
    cites: ["rvv:35"]

  - id: remolque-luces-niebla-dia
    type: yesno
    prompt: Es de día pero hay niebla densa. Circulas con tu auto y un remolque enganchado. ¿Debe llevar el remolque luz trasera y luz de la matrícula encendidas?
    answer: true
    explain: El artículo 33 pide esas luces a los remolques enganchados de noche y de día cuando la visibilidad está seriamente reducida.
    cites: ["rvv:33"]

