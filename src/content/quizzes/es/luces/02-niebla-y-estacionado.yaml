questions:
  - id: mistachter-distancia
    type: number
    prompt: ¿La luz antiniebla trasera solo se permite si la niebla o la nieve reducen la visibilidad a menos de cuántos metros?
    answer: 50
    unit: m
    explain: El límite legal es una visibilidad de menos de 50 metros.
    cites: ["rvv:34.2"]

  - id: mistachter-lluvia
    type: yesno
    prompt: Llueve muy fuerte y casi no ves. ¿Puedes llevar la luz antiniebla trasera?
    answer: false
    explain: El artículo 34 lid 2 solo menciona niebla o nieve con menos de 50 m de visibilidad. La lluvia no cuenta.
    cites: ["rvv:34.2"]

  - id: mistachter-60m
    type: yesno
    prompt: Hay niebla y ves a 80 metros. ¿Puedes llevar la antiniebla trasera?
    answer: false
    explain: Con 80 m la visibilidad no es de menos de 50 m, así que no está permitida.
    cites: ["rvv:34.2"]

  - id: mistvoor-lluvia
    type: yesno
    prompt: ¿Pueden usarse las antiniebla delanteras cuando la lluvia reduce seriamente la visibilidad?
    answer: true
    explain: El artículo 34 lid 1 permite el mistlicht delantero con niebla, nieve o lluvia que reduce seriamente la visibilidad.
    cites: ["rvv:34.1"]

  - id: mistvoor-dimlicht
    type: yesno
    prompt: Con las antiniebla delanteras encendidas por niebla densa, ¿es obligatorio llevar además las luces de cruce?
    answer: false
    explain: La ley dice que en ese caso no hace falta llevar dimlicht.
    cites: ["rvv:34.1"]

  - id: mistvoor-sol
    type: yesno
    prompt: Es un día soleado y despejado. ¿Puedes llevar las antiniebla delanteras?
    answer: false
    explain: Solo se permiten con niebla, nieve o lluvia que reduzca seriamente la visibilidad.
    cites: ["rvv:34.1"]

  - id: detenido-luces
    type: mc
    prompt: De noche, tu auto está parado en la vluchtstrook de una autosnelweg. ¿Qué luces debe llevar?
    options: ["Ninguna, mejor apagarlo todo", Luces de posición (stadslicht) y luz trasera, Solo luces de carretera, Solo antiniebla traseras]
    answer: 1
    explain: Un vehículo de más de dos ruedas parado en la vluchtstrook lleva stadslicht y luz trasera de noche.
    cites: ["rvv:38"]

  - id: detenido-dia-niebla
    type: yesno
    prompt: De día, con niebla densa, tu auto está parado en la calzada fuera de poblado. ¿Debe llevar luces de posición y trasera?
    answer: true
    explain: El artículo 38 las exige de noche y de día cuando la visibilidad está seriamente reducida.
    cites: ["rvv:38"]

  - id: detenido-dos-ruedas
    type: yesno
    prompt: De noche una motocicleta (dos ruedas) está parada sobre la calzada fuera de la zona urbana. ¿Le exige el artículo 38 llevar stadslicht y luz trasera?
    answer: false
    explain: El artículo 38 habla de vehículos de motor de más de dos ruedas, y la motocicleta tiene dos.
    cites: ["rvv:38"]

  - id: detenido-dia-despejado
    type: yesno
    prompt: Es de día, hace sol y se ve perfectamente. Paras tu auto en una parkeerhaven junto a una autosnelweg. ¿El artículo 38 te exige llevar stadslicht y luz trasera?
    answer: false
    explain: El artículo 38 las exige de noche, y de día solo si la visibilidad está seriamente reducida.
    cites: ["rvv:38"]

  - id: bici-luz-pecho-espalda
    type: yesno
    prompt: De noche vas en bicicleta sin luces en la bici, pero llevas una luz blanca en el pecho y una luz roja en la espalda. ¿Cumples con la ley?
    answer: true
    explain: El artículo 35 permite sustituir la luz delantera por una luz blanca o amarilla en el pecho, y la trasera por una luz roja en la espalda.
    cites: ["rvv:35"]

  - id: remolque-luces-niebla-dia
    type: yesno
    prompt: Es de día pero hay niebla densa. Circulas con tu auto y un remolque enganchado. ¿Debe llevar el remolque luz trasera y luz de la matrícula encendidas?
    answer: true
    explain: El artículo 33 pide esas luces a los remolques enganchados de noche y de día cuando la visibilidad está seriamente reducida.
    cites: ["rvv:33"]

