questions:
  - id: intermitente-cuando
    type: multi
    prompt: ¿En cuáles de estas maniobras debes dar una señal con el intermitente?
    options: [Arrancar desde el borde, Cambiar de carril, Adelantar a otro vehículo de motor, Seguir recto por tu carril sin cambiar nada]
    answer: [0, 1, 2]
    explain: El artículo 55 incluye arrancar, adelantar, cambiar de carril y los desplazamientos laterales importantes. Seguir recto no.
    cites: ["rvv:55"]

  - id: intermitente-salir-autopista
    type: yesno
    prompt: Sales de una autosnelweg por el carril de salida. ¿Debes señalizar?
    answer: true
    explain: Entrar y salir de la calzada principal está entre los casos del artículo 55.
    cites: ["rvv:55"]

  - id: intermitente-girar
    type: yesno
    prompt: Vas a girar a la derecha en una calle vacía, sin nadie delante ni detrás. ¿Debes dar igualmente la señal con el intermitente?
    answer: true
    explain: "Antes de girar hay que dar señal con el intermitente o con el brazo, también cuando no ves a nadie: el artículo no depende de si hay otros usuarios."
    cites: ["rvv:17.2"]

  - id: intermitente-prioridad
    type: yesno
    prompt: Pones el intermitente para cambiar de carril. ¿Eso obliga a los demás a dejarte pasar?
    answer: false
    explain: "Cambiar de carril es una maniobra especial: quien la hace debe dejar pasar al demás tráfico. El intermitente solo informa."
    cites: ["rvv:54", "rvv:55"]

  - id: intermitente-arrancar
    type: yesno
    prompt: Estás parado en el borde de la calzada y quieres arrancar. ¿Debes dar señal y también dejar pasar al tráfico que viene?
    answer: true
    explain: Arrancar exige señal con el intermitente y es una maniobra especial en la que se cede el paso.
    cites: ["rvv:55", "rvv:54"]

  - id: bocina-apurar
    type: yesno
    prompt: El auto de delante no arranca cuando se pone el verde. ¿Puedes tocarle la bocina para que avance?
    answer: false
    explain: No hay peligro inminente, y el ruido innecesario está prohibido.
    cites: ["rvv:28", "rvv:57"]

  - id: rafaga-ceder
    type: yesno
    prompt: En una calle estrecha quieres dejar pasar a otro conductor que viene de frente y le haces una ráfaga con las luces. ¿Es lo correcto según la ley?
    answer: false
    explain: Las ráfagas de luz, igual que la bocina, solo se permiten para evitar un peligro inminente.
    cites: ["rvv:28", "rvv:31"]

  - id: ruido-innecesario
    type: yesno
    prompt: Esperas en un semáforo en rojo y el conductor de al lado acelera a fondo en vacío para que se oiga el motor. ¿Está permitido?
    answer: false
    explain: Los conductores de vehículos de motor, ciclomotores y snorfietsen no deben hacer ruido innecesario. Que no haya peligro no lo convierte en un ruido necesario.
    cites: ["rvv:57"]

  - id: bocina-primero-evitar
    type: mc
    prompt: Un ciclista delante de ti, a la derecha, empieza a desviarse hacia tu carril sin mirar. Aún tienes tiempo y espacio. ¿Qué haces primero?
    options: [Intentar quitar el peligro bajando la velocidad o esquivando, Tocar la bocina de inmediato, Hacer ráfagas con las luces, Acelerar para pasar antes]
    answer: 0
    explain: El CBR espera que primero intentes quitar el peligro (reducir la velocidad, esquivar, parar). La bocina o la ráfaga se reservan para cuando prevés que eso no bastará, y solo para evitar un peligro inminente.
    cites: ["cbr-rijprocedure:2", "rvv:28"]
