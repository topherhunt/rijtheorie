questions:
  - id: partes-via-weg
    type: yesno
    prompt: Un camino de grava propiedad de una empresa, abierto al tráfico público, ¿cuenta como "weg" para la ley?
    answer: true
    explain: Weg es todo camino abierto al tráfico público. No importa el dueño ni el pavimento.
    cites: ["wvw:1.1.b"]

  - id: partes-via-weg-cerrado
    type: yesno
    prompt: Un camino asfaltado dentro del recinto de una fábrica solo lo usan los empleados y hay una barrera en la entrada. ¿Es una "weg" para la ley?
    answer: false
    explain: Weg es el camino abierto al tráfico público. Que esté asfaltado no basta, y un camino cerrado al público, como este, no es una vía.
    cites: ["wvw:1.1.b"]

  - id: partes-via-fietspad-atajo
    type: yesno
    prompt: Vas en coche por una calzada atascada y a tu derecha hay un fietspad vacío que lleva al mismo cruce. ¿Puedes usarlo como atajo para pasar la fila?
    answer: false
    explain: El fietspad no es parte de la rijbaan, y el conductor de un coche usa la rijbaan. Que el fietspad esté vacío no cambia a quién corresponde.
    cites: ["rvv:1", "rvv:10.1"]

  - id: partes-via-kruispunt
    type: multi
    prompt: ¿Cuáles de estas situaciones son un "kruispunt" para el RVV?
    options: [Dos vías que se cruzan, Una vía que se divide en dos, Una vía recta que solo cambia de nombre, Dos vías paralelas que no se unen]
    answer: [0, 1]
    explain: Un kruispunt es una kruising (cruce) o una splitsing (bifurcación) de vías. Una vía que solo cambia de nombre o dos vías paralelas no se cruzan ni se dividen.
    cites: ["rvv:1"]

  - id: partes-via-estacionar-donde
    type: mc
    prompt: Necesitas estacionar tu coche. ¿En cuál de estas partes de la vía puedes hacerlo?
    options: ["En una parkeerhaven junto a la calzada", "En un fietspad vacío, solo un momento", "En un trottoir ancho, dejando espacio", "En un ruiterpad poco usado, si es breve"]
    answer: 0
    explain: La parkeerhaven está pensada para vehículos estacionados. El trottoir, el voetpad, el fietspad, el fiets/bromfietspad y el ruiterpad están prohibidos para estacionar, y el poco tiempo o el poco tráfico no cambian nada.
    cites: ["rvv:1", "rvv:10.1"]

  - id: partes-via-verdrijvingsvlak-atajo
    type: yesno
    prompt: Entre dos carriles hay una zona de la calzada cubierta de rayas diagonales (verdrijvingsvlak). El tráfico va lento y la zona está libre. ¿Puedes conducir por ella para adelantar la fila?
    answer: false
    explain: Los conductores no pueden usar los verdrijvingsvlakken ni los puntstukken, y las marcas que guían el tráfico se respetan. Las excepciones del art. 77 (spitsstrook, busbaan, busstrook) no se aplican a un coche normal en una calzada normal.
    cites: ["rvv:77", "rvv:1", "cbr-rijprocedure:3.3"]

  - id: partes-via-puntstuk-atajo
    type: yesno
    prompt: Llegas a una bifurcación donde la vía se divide y entre las dos ramas hay un puntstuk libre. Quieres pasar por encima para cortar camino. ¿Puedes?
    answer: false
    explain: El puntstuk es la superficie con varios ángulos entre las ramas, y los conductores no pueden usarla. Que esté libre no cambia la prohibición.
    cites: ["rvv:77", "rvv:1"]

  - id: partes-via-spitsstrook-bifurcacion
    type: yesno
    prompt: Sigues un spitsstrook abierto (C23-01) y el carril pasa por una bifurcación, sobre una zona con rayas diagonales. ¿Puedes seguir por él?
    sign: C23-01
    answer: true
    explain: La prohibición de usar verdrijvingsvlakken y puntstukken no se aplica a quien sigue un spitsstrook que pasa por una bifurcación o unión de vías.
    cites: ["rvv:77", "rvv:bijlage1.C23-01"]
