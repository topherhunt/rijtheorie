questions:
  - id: vehiculos-motorvoertuig
    type: multi
    prompt: ¿Cuáles de estos son motorvoertuigen según el RVV?
    options: [Un auto, Una motocicleta, Una bromfiets, Una bicicleta con asistencia al pedaleo]
    answer: [0, 1]
    explain: Motorvoertuig excluye las bromfietsen, las bicicletas con asistencia al pedaleo, los gehandicaptenvoertuigen y los vehículos sobre rieles.
    cites: ["rvv:1"]

  - id: vehiculos-bromfiets-no
    type: yesno
    prompt: ¿Es una bromfiets un motorvoertuig para el RVV?
    answer: false
    explain: La definición de motorvoertuig excluye las bromfietsen.
    cites: ["rvv:1"]

  - id: vehiculos-carril-izq-camion-furgoneta
    type: multi
    prompt: En una autosnelweg de tres carriles por sentido (sin necesidad de preseleccionar), ¿cuáles de estos vehículos tienen prohibido el carril izquierdo?
    options: [Una furgoneta de mercancías de 3500 kg de masa máxima autorizada sin remolque, Un camión de 3600 kg de masa máxima, Un coche con un remolque en un conjunto de 8 m, Un coche de pasajeros de 4,5 m]
    answer: [1, 2]
    explain: El art. 43.4 prohíbe usar otros carriles que los dos de la derecha a los vrachtauto (más de 3500 kg) y a los conjuntos de más de 7 m. Hasta 3500 kg es un bestelauto, que no está incluido.
    cites: ["rvv:43.4", "rvv:1"]

  - id: vehiculos-minibus-bus-lane
    type: yesno
    prompt: Conduces un autobús construido para 9 pasajeros además del conductor (no de línea). Sobre un carril se ilumina la palabra BUS. ¿Puedes usar ese carril?
    answer: true
    explain: Con BUS iluminado el carril lo usan los conductores de un lijnbus y de un autobus. Autobus es un vehículo de motor construido para más de ocho personas sin contar al conductor, y 9 son más de ocho.
    cites: ["rvv:1", "rvv:73"]

  - id: vehiculos-furgoneta-8-bus
    type: yesno
    prompt: Conduces un vehículo construido para 8 pasajeros además del conductor (no de línea). Sobre un carril se ilumina la palabra BUS. ¿Puedes usar ese carril?
    answer: false
    explain: Autobus es el vehículo construido para más de ocho personas sin contar al conductor. Con 8 pasajeros no lo es, así que no puedes usar un carril con BUS iluminado.
    cites: ["rvv:1", "rvv:73"]

  - id: vehiculos-reglas-brommobiel
    type: mc
    prompt: ¿Qué reglas sigue en general una brommobiel?
    options: [Las de la bicicleta, Las del vehículo de motor, Las de los peatones, Las de la bromfiets en todo caso]
    answer: 1
    explain: Salvo que se diga otra cosa, la brommobiel sigue las reglas de los vehículos de motor y no las de la bromfiets.
    cites: ["rvv:2a"]

  - id: vehiculos-reglas-snorfiets
    type: mc
    prompt: ¿Qué reglas sigue en general una snorfiets?
    options: [Las de la bicicleta, Las del vehículo de motor, Las de los peatones, Las de la brommobiel]
    answer: 0
    explain: Salvo que se diga otra cosa, la snorfiets sigue las reglas de la bicicleta y no las de la bromfiets.
    cites: ["rvv:2b"]

  - id: vehiculos-speed-pedelec-g12a
    type: mc
    prompt: Vas en una speed-pedelec. Junto a la calzada hay un camino con la señal G12a. ¿Por dónde vas?
    sign: G12a
    options: [Por el camino G12a, Por la rijbaan, Por donde prefieras, Por el trottoir]
    answer: 0
    explain: La speed-pedelec es una bromfiets, y el bromfietser usa el fiets/bromfietspad; la rijbaan solo si no hay uno. Aquí sí lo hay.
    cites: ["rvv:1", "rvv:6.1", "rvv:6.2"]

  - id: vehiculos-brommobiel-g12a
    type: mc
    prompt: Conduces una brommobiel (bromfiets de cuatro ruedas con carrocería). Junto a la calzada hay un camino con la señal G12a. ¿Por dónde vas?
    sign: G12a
    options: ["Por el camino G12a, como cualquier bromfiets", Por la rijbaan, Por donde prefieras, Por el camino solo si va vacío]
    answer: 1
    explain: Una brommobiel sigue las reglas de los vehículos de motor en lugar de las de la bromfiets (art. 2a), y los vehículos de motor usan la rijbaan (art. 10.1).
    cites: ["rvv:2a", "rvv:10.1"]

  - id: vehiculos-ebike-g11
    type: yesno
    prompt: Vas en una bicicleta eléctrica normal (la asistencia se corta a 25 km/h). Junto a la calzada hay un fietspad con la señal G11. ¿Debes usarlo?
    sign: G11
    answer: true
    explain: La bicicleta eléctrica normal es una bicicleta, y las bicicletas usan el fietspad obligatorio. Solo la speed-pedelec, que es bromfiets, va por otro lado.
    cites: ["wvw:1.1", "rvv:5.1"]

  - id: vehiculos-gehandicapten
    type: yesno
    prompt: Un vehículo para una persona con discapacidad de 1,40 m de ancho, ¿es un gehandicaptenvoertuig según el RVV?
    answer: false
    explain: El gehandicaptenvoertuig no puede ser más ancho que 1,10 m.
    cites: ["rvv:1"]
