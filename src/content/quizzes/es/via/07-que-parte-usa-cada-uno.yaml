questions:
  - id: parte-derecha-ciclista
    type: mc
    prompt: Vas en bicicleta por una rijbaan donde no hay fietspad, y la calle está vacía. ¿Dónde circulas?
    options: ["Lo más a la derecha posible", "Por el centro, para que te vean mejor", "Por donde quieras mientras no venga nadie", "Por la izquierda, para ver a los coches de frente"]
    answer: 0
    explain: Los bestuurders deben circular lo más a la derecha posible, y el ciclista que va por la rijbaan lo es. Que la calle esté vacía no cambia la regla.
    cites: ["rvv:3.1", "rvv:5.2"]

  - id: parte-peaton-sin-camino
    type: mc
    prompt: Caminas por una carretera donde no hay trottoir, voetpad, fietspad ni fiets/bromfietspad. ¿Por dónde vas?
    options: ["Por la berma o el borde exterior de la rijbaan", "Por el centro de la rijbaan", "Por un ruiterpad, si lo hay", "Por donde haya más espacio, sin regla"]
    answer: 0
    explain: El peatón usa el trottoir o el voetpad; si no hay, el fietspad o el fiets/bromfietspad; y solo si tampoco hay, la berma o el borde exterior de la rijbaan.
    cites: ["rvv:4"]

  - id: parte-peaton-con-acera-y-fietspad
    type: yesno
    prompt: Caminas por una calle que tiene trottoir y también un fietspad. El fietspad está más libre. ¿Puedes elegir cualquiera de los dos?
    answer: false
    explain: El peatón usa el trottoir o el voetpad; el fietspad solo si faltan el trottoir y el voetpad.
    cites: ["rvv:4"]

  - id: parte-patines
    type: mc
    prompt: Vas en patines en línea y no hay trottoir, voetpad, fietspad ni fiets/bromfietspad. ¿Dónde puedes ir?
    options: [Por la berma, Por la rijbaan, Por ningún lado, Solo por el ruiterpad]
    answer: 1
    explain: Quien se mueve con objetos que no son vehículos usa el fietspad, el fiets/bromfietspad, el trottoir o el voetpad, y si no existen, la rijbaan.
    cites: ["rvv:4.4"]

  - id: parte-patines-fietspad
    type: yesno
    prompt: Patinas con patines en línea por una calle que tiene trottoir y también un fietspad. ¿Puedes ir por el fietspad?
    answer: true
    explain: 'Quien va con patines no sigue el orden de los peatones: puede usar el fietspad, el fiets/bromfietspad, el trottoir o el voetpad, sin preferencia entre ellos.'
    cites: ["rvv:4.4"]

  - id: parte-jinete-fietspad
    type: mc
    prompt: Vas a caballo. No hay ruiterpad. Hay un fietspad, una berma y la rijbaan. ¿Cuáles puedes usar?
    options: [El fietspad y la berma, La berma o la rijbaan, Solo la rijbaan, El fietspad o la rijbaan]
    answer: 1
    explain: Los jinetes usan el ruiterpad; si no hay, la berm o la rijbaan. El fietspad no está entre las partes que la regla les asigna.
    cites: ["rvv:8"]

  - id: parte-gehandicapten-no-todo
    type: multi
    prompt: ¿Cuáles de estas partes de la vía puede usar el conductor de un gehandicaptenvoertuig?
    options: [Trottoir, Fietspad, Rijbaan, Ruiterpad, Berma]
    answer: [0, 1, 2]
    explain: El art. 7 le permite el trottoir, el voetpad, el fietspad, el fiets/bromfietspad y la rijbaan. El ruiterpad y la berma no están en la lista.
    cites: ["rvv:7"]

  - id: parte-columna
    type: yesno
    prompt: Un cortejo fúnebre de peatones avanza por la rijbaan de una calle que tiene trottoir. ¿Está permitido?
    answer: true
    explain: Los peatones pueden usar la rijbaan si forman una columna, un desfile o un cortejo fúnebre, aunque haya trottoir.
    cites: ["rvv:9"]
