questions:
  - id: parte-peaton-borde
    type: yesno
    prompt: No hay trottoir, voetpad, fietspad ni fiets/bromfietspad. ¿Puede el peatón ir por la berma?
    answer: true
    explain: Si no hay trottoir, voetpad, fietspad ni fiets/bromfietspad, el peatón usa la berma o el borde exterior de la rijbaan.
    cites: ["rvv:4"]

  - id: parte-patines
    type: mc
    prompt: Vas en patines en línea y no hay trottoir, voetpad, fietspad ni fiets/bromfietspad. ¿Dónde puedes ir?
    options: [Por la berma, Por la rijbaan, Por ningún lado, Solo por el ruiterpad]
    answer: 1
    explain: Quien se mueve con objetos que no son vehículos usa el fietspad, el fiets/bromfietspad, el trottoir o el voetpad, y si no existen, la rijbaan.
    cites: ["rvv:4"]

  - id: parte-columna
    type: yesno
    prompt: Una columna de peatones que forma un desfile, ¿puede usar la rijbaan?
    answer: true
    explain: Los peatones pueden usar la rijbaan si forman una columna, un desfile o un cortejo fúnebre.
    cites: ["rvv:9"]

  - id: parte-estacionar
    type: multi
    prompt: Para estacionar, ¿en cuáles de estas partes NO puedes dejar el auto?
    options: [Trottoir, Fietspad, Ruiterpad, Parkeerhaven]
    answer: [0, 1, 2]
    explain: Los conductores pueden usar otras partes para estacionar, excepto el trottoir, el voetpad, el fietspad, el fiets/bromfietspad y el ruiterpad.
    cites: ["rvv:10.1"]

  - id: parte-peaton-con-acera-y-fietspad
    type: yesno
    prompt: Caminas por una calle que tiene trottoir y también un fietspad. El fietspad está más libre. ¿Puedes elegir cualquiera de los dos?
    answer: false
    explain: El peatón usa el trottoir o el voetpad; el fietspad solo si faltan el trottoir y el voetpad.
    cites: ["rvv:4"]

  - id: parte-patines-trottoir
    type: mc
    prompt: Vas en patines en línea por una calle que tiene trottoir y rijbaan. ¿Por dónde vas?
    options: [Por el trottoir, Por la rijbaan, Por la berma, Por el ruiterpad]
    answer: 0
    explain: Quien se mueve con objetos que no son vehículos usa el fietspad, el fiets/bromfietspad, el trottoir o el voetpad, y la rijbaan solo si no existe ninguno de ellos.
    cites: ["rvv:4"]

  - id: parte-jinete-fietspad
    type: mc
    prompt: Vas a caballo. No hay ruiterpad. Hay un fietspad, una berma y la rijbaan. ¿Cuáles puedes usar?
    options: [El fietspad y la berma, La berma o la rijbaan, Solo la rijbaan, El fietspad o la rijbaan]
    answer: 1
    explain: Los jinetes usan el ruiterpad; si no hay, la berm o la rijbaan. El fietspad no está entre las partes que la regla les asigna.
    cites: ["rvv:8"]

  - id: parte-gehandicapten-no-todo
    type: multi
    prompt: ¿Cuáles de estas partes de la vía puede usar el conductor de un gehandicaptenvoertuig?
    options: [Trottoir, Fietspad, Rijbaan, Ruiterpad, Berma]
    answer: [0, 1, 2]
    explain: El art. 7 le permite el trottoir, el voetpad, el fietspad, el fiets/bromfietspad y la rijbaan. El ruiterpad y la berma no están en la lista.
    cites: ["rvv:7"]
