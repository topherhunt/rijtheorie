questions:
  - id: ordenes-sin-distintivo
    type: yesno
    prompt: Una persona sin uniforme ni ningún distintivo que la haga reconocible como agente o controlador te hace señas con la mano para que pares. ¿Estás obligado a obedecerla como a un agente?
    answer: false
    explain: La obligación vale para las órdenes de personas competentes y reconocibles como tales. Sin nada que la haga reconocible, no cumple la condición.
    cites: ["rvv:82.1"]

  - id: ordenes-rojo
    type: mc
    prompt: La persona que acompaña un tranvía te muestra una lámpara roja. ¿Qué haces?
    options: [Reduces la velocidad y sigues, Te detienes ante la lámpara, Sigues si no ves el tren, Tocas la bocina y pasas]
    answer: 1
    explain: Debes parar cuando quien acompaña a un vehículo sobre rieles muestra F10, una bandera roja o una lámpara roja.
    cites: ["rvv:82.4"]

  - id: ordenes-agente-regla-derecha
    type: mc
    prompt: Llegas a un cruce donde normalmente cederías el paso a quien viene por tu derecha, y un agente competente y reconocible te hace señal de que pases primero. ¿Qué haces?
    options: ["Paso, porque la orden del agente va primero", "Cedo el paso a la derecha, como manda la regla", "Paso solo si nadie viene por la derecha", "Me detengo hasta que el agente lo repita con la voz"]
    answer: 0
    explain: Las órdenes van por encima de las señales y de las reglas de tráfico, y la regla de la derecha es una regla de tráfico.
    cites: ["rvv:84"]

  - id: ordenes-interes
    type: multi
    prompt: ¿En interés de qué pueden las autoridades dar órdenes de tráfico?
    options: [La seguridad en la vía, El mantenimiento y la utilidad de la vía, La libertad del tráfico, La comodidad de los demás conductores del barrio]
    answer: [0, 1, 2]
    explain: El art. 12 WVW permite esas órdenes solo en interés de la seguridad, del mantenimiento y utilidad de la vía, o de la libertad del tráfico (y de estudios de tráfico autorizados por el ministro). La comodidad de otros conductores no está en la lista.
    cites: ["wvw:12"]

  - id: ordenes-practica-verkeersregelaar
    type: yesno
    prompt: Durante el examen práctico de un curso de verkeersregelaar, una persona con la ropa prescrita para controladores te indica con gestos que pares. ¿Debes obedecerla?
    answer: true
    explain: El art. 82.1 incluye a quienes actúan como controladores en las prácticas o el examen de un curso de verkeersregelaar, mientras duran y con la ropa prescrita.
    cites: ["rvv:82.1"]
