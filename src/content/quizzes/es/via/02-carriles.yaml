questions:
  - id: carriles-estrechos
    type: yesno
    prompt: En una calzada hay una franja marcada con líneas, pero tan estrecha que solo cabe una bicicleta y no cabría tu coche. ¿Es una rijstrook?
    answer: false
    explain: La rijstrook debe ser suficientemente ancha para vehículos de motor de más de dos ruedas. Que esté marcada con líneas no basta.
    cites: ["rvv:1"]

  - id: carriles-invoeg-obligaciones
    type: multi
    prompt: Estás en un invoegstrook y vas a incorporarte a la doorgaande rijbaan con tu coche. ¿Qué debes hacer?
    options: [Dejar pasar al tráfico de la doorgaande rijbaan, Dar la señal con el intermitente, Seguir adelante porque ya estás en la autopista y tienes preferencia, Entrar lo más despacio posible para no chocar con nadie]
    answer: [0, 1]
    explain: Pasar del invoegstrook a la doorgaande rijbaan es una maniobra especial; quien la hace deja pasar al resto del tráfico, y el art. 55 exige la señal con el intermitente. No tienes preferencia por estar ya en la autopista, y entrar muy despacio es un error, porque debes igualar tu velocidad a la del tráfico.
    cites: ["rvv:54", "rvv:55", "cbr-rijprocedure:3.4"]

  - id: carriles-invoeg-velocidad
    type: mc
    prompt: Circulas por un invoegstrook y el tráfico de la doorgaande rijbaan va a unos 100 km/h. ¿Qué haces con tu velocidad antes de incorporarte?
    options: ["La ajusto en el invoegstrook hasta igualarla a la del tráfico", "Me detengo al final del carril y espero un hueco amplio", "Entro a la velocidad que traigo y dejo que los demás se adapten", "La reduzco al mínimo para no molestar al tráfico"]
    answer: 0
    explain: Al incorporarte, tu velocidad debe ser casi igual a la del tráfico de la doorgaande rijbaan, y el invoegstrook sirve para ajustarla. Entrar mucho más despacio, o casi parado, entorpece al tráfico; entrar sin ajustarte tampoco vale, porque además debes dejar pasar al tráfico de la doorgaande rijbaan.
    cites: ["cbr-rijprocedure:3.4", "rvv:54"]

  - id: carriles-uitrijstrook-intermitente
    type: yesno
    prompt: Circulas por la doorgaande rijbaan de una autosnelweg y vas a tomar la salida (uitrijstrook). ¿Debes dar la señal con el intermitente?
    answer: true
    explain: El art. 55 obliga a los conductores de vehículos de motor a dar la señal al subir a la doorgaande rijbaan y también al dejarla. Y pasar al uitrijstrook es una maniobra especial en la que cedes el paso (art. 54).
    cites: ["rvv:55", "rvv:54"]

  - id: carriles-uitrijstrook-velocidad
    type: mc
    prompt: Circulas por la doorgaande rijbaan de una autosnelweg y vas a tomar la salida. En condiciones normales, ¿dónde reduces la velocidad?
    options: ["Ya dentro del uitrijstrook, tras dejar la doorgaande rijbaan", "En la doorgaande rijbaan, antes de pasar hacia la salida", "En la doorgaande rijbaan, junto a la blokmarkering", "En la doorgaande rijbaan, con el intermitente ya puesto"]
    answer: 0
    explain: En condiciones normales solo reduces la velocidad dentro del uitrijstrook, así el tráfico que sigue por la doorgaande rijbaan puede continuar sin que lo frenes. Las otras tres opciones frenan en la doorgaande rijbaan.
    cites: ["cbr-rijprocedure:3.4"]

  - id: carriles-busstrook
    type: mc
    prompt: En una calzada de dos carriles, el carril derecho está marcado con líneas y lleva pintada la palabra BUS; el izquierdo es normal. ¿Qué es ese carril derecho?
    options: [Una busstrook, Una busbaan, Una spitsstrook, Una vluchtstrook]
    answer: 0
    explain: Una parte marcada de la calzada con la palabra BUS o LIJNBUS es una busstrook. La busbaan es una calzada entera con esas palabras; spitsstrook y vluchtstrook son franjas de autosnelwegen y autowegen.
    cites: ["rvv:1"]

  - id: carriles-bus-luz-coche
    type: yesno
    prompt: Sobre el carril de tu coche se ilumina la palabra BUS. ¿Puedes seguir en ese carril?
    answer: false
    explain: Con BUS iluminado el carril solo lo usan los conductores de un lijnbus y de un autobus. Un coche no está entre ellos.
    cites: ["rvv:73"]

  - id: carriles-lijnbus-luz
    type: mc
    prompt: Sobre un carril se ilumina la palabra LIJNBUS. Conduces un autobús turístico (autobus, no de línea). ¿Puedes usar ese carril?
    options: ["Sí, un autobus siempre puede", "No, solo los conductores de un lijnbus", "Sí, si no hay ningún lijnbus a la vista", "Sí, a menos de 30 km/h"]
    answer: 1
    explain: Con LIJNBUS el carril solo lo usan los conductores de un lijnbus. Con BUS iluminado sí podría usarlo un autobus; la palabra LIJNBUS es más restrictiva.
    cites: ["rvv:73"]

  - id: carriles-vlucht-atajo
    type: yesno
    prompt: Estás en una autosnelweg con tráfico lento en tu carril. A tu derecha hay una vluchtstrook libre y no hay ninguna señal C23-01. ¿Puedes usarla para avanzar más rápido?
    answer: false
    explain: Fuera de una emergencia está prohibido usar la vluchtstrook en una autosnelweg o autoweg. El tráfico lento no es una emergencia.
    cites: ["rvv:43.3"]

  - id: carriles-vlucht-averia
    type: mc
    prompt: En una autosnelweg, ¿en cuál de estas situaciones puedes usar la vluchtstrook (sin ninguna señal C23-01)?
    options: [Hay tráfico lento en tu carril, Tu coche se avería y no puedes seguir, Necesitas mirar el mapa del móvil, Quieres dejar pasar a un coche más rápido]
    answer: 1
    explain: La vluchtstrook solo puede usarse en caso de emergencia, como una avería que te impide continuar. Los otros tres casos no son emergencias.
    cites: ["rvv:43.3"]

  - id: carriles-spits-abierto
    type: yesno
    prompt: Ves la señal C23-01 sobre la vluchtstrook de tu derecha. Vas en un coche normal, sin ninguna emergencia. ¿Puedes circular por esa franja?
    sign: C23-01
    answer: true
    explain: Con C23-01 la franja es un spitsstrook abierto, es decir, un carril de circulación. La prohibición de usar la vluchtstrook fuera de emergencias no se aplica mientras está abierto como spitsstrook.
    cites: ["rvv:1", "rvv:bijlage1.C23-01"]
