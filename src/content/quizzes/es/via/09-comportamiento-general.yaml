questions:
  - id: general-peaton-posible
    type: yesno
    prompt: Un peatón se queda parado en medio de la calzada sin ningún motivo, y los coches tendrían que esquivarlo. Nadie ha chocado todavía. ¿Le aplica la prohibición del art. 5 WVW?
    answer: true
    explain: El art. 5 vale para todos, no solo para los conductores, y prohíbe comportarse de manera que se cause o pueda causarse peligro. No hace falta que ya haya pasado algo.
    cites: ["wvw:5"]

  - id: general-obstaculizar-parar
    type: yesno
    prompt: Detienes tu coche sin motivo en medio de una calle estrecha y los vehículos de detrás no pueden pasar. Nadie corre peligro. ¿Cubre esto el art. 5 WVW?
    answer: true
    explain: El art. 5 prohíbe no solo causar peligro, sino también comportarse de manera que el tráfico sea o pueda ser obstaculizado. Que nadie corra peligro no basta para quedar fuera.
    cites: ["wvw:5"]

  - id: general-culpa
    type: multi
    prompt: ¿Qué consecuencias de un accidente culpable cubre el art. 6 WVW?
    options: [Muerte de otro, Lesiones graves de otro, Lesiones de otro que causan enfermedad temporal o impiden sus actividades normales, Daños solo materiales en el vehículo de otro]
    answer: [0, 1, 2]
    explain: El art. 6 se refiere a la muerte de otro, a lesiones graves y a lesiones que provocan enfermedad temporal o impiden las actividades normales. Los daños solo materiales no están en la lista.
    cites: ["wvw:6"]

  - id: general-art6-solo-chapa
    type: yesno
    prompt: Por tu culpa chocas contra un coche aparcado y solo hay daños materiales, sin heridos. ¿Se aplica el art. 6 WVW?
    answer: false
    explain: 'El art. 6 exige que alguien muera o sufra lesiones. Pero esto no te deja libre: el art. 7 sigue prohibiendo irte del lugar si causaste daños a otro, salvo que hayas dado oportunidad adecuada de establecer tu identidad y la de tu vehículo.'
    cites: ["wvw:6", "wvw:7.1", "wvw:7.2"]

  - id: general-huir
    type: yesno
    prompt: Chocas con otro auto y le haces daños. ¿Puedes irte sin más porque no hay heridos?
    answer: false
    explain: No puedes abandonar el lugar si causaste daños a otro, salvo que hayas dado oportunidad adecuada de establecer tu identidad y la del vehículo.
    cites: ["wvw:7.1", "wvw:7.2"]

  - id: general-identidad
    type: mc
    prompt: Causaste daños a otro vehículo y no hay heridos. ¿Qué te permite irte legalmente del lugar?
    options: ["Haber dado oportunidad adecuada de establecer tu identidad y la de tu vehículo", "Haberte disculpado con el otro conductor y prometido pagar los daños", "Haber comprobado que los daños son pequeños y que nadie ha salido herido", "Haber visto que el otro conductor no estaba enfadado y no quería dar problemas"]
    answer: 0
    explain: Según el art. 7.2, la prohibición no se aplica a quien dio oportunidad adecuada de establecer su identidad y la del vehículo de motor. Disculparte, que los daños sean pequeños o que el otro no se queje no sustituye esa oportunidad.
    cites: ["wvw:7.1", "wvw:7.2"]

  - id: general-herido
    type: yesno
    prompt: Un herido queda desamparado si te vas. ¿Te libra la excepción de haber dado tus datos?
    answer: false
    explain: La excepción del 7.2 no cubre la prohibición de dejar a un herido en estado de desamparo.
    cites: ["wvw:7.1", "wvw:7.2"]

  - id: general-sabiendo
    type: yesno
    prompt: Al maniobrar junto a un coche aparcado notas un golpe seco y no ves daños desde tu asiento. Un conductor razonable sospecharía que pudo causarlos. ¿Puedes irte sin más?
    answer: false
    explain: La prohibición de abandonar el lugar se aplica si sabes, o debes sospechar razonablemente, que causaste daños. No hace falta que estés seguro.
    cites: ["wvw:7.1"]
