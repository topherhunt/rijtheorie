questions:
  - id: usuarios-quien-es-bestuurder
    type: multi
    prompt: ¿Cuáles de estos usuarios son bestuurders?
    options: [Un ciclista, Un jinete, Un conductor de auto, Un peatón]
    answer: [0, 1, 2]
    explain: Todos los usuarios excepto los peatones son bestuurders.
    cites: ["rvv:1"]

  - id: usuarios-a-mano
    type: yesno
    prompt: Llevas tu bicicleta a mano por la acera. ¿Se te aplican las reglas de peatón?
    answer: true
    explain: Las reglas de peatones también valen para quien lleva a mano una motocicleta, bromfiets o bicicleta.
    cites: ["rvv:2.2"]

  - id: usuarios-patines
    type: mc
    prompt: Te mueves con patines en línea. ¿Qué reglas te aplican como regla general?
    options: [Las de los conductores de autos, Las de los peatones, Ninguna, Las de los ciclomotores]
    answer: 1
    explain: Las personas que se mueven con objetos que no son vehículos (como patines) siguen las reglas de peatones.
    cites: ["rvv:2.2"]

  - id: usuarios-patines-fietspad
    type: yesno
    prompt: Una calle tiene acera y, al lado, un fietspad. Una persona con patines en línea va por el fietspad. ¿Está en un sitio permitido?
    answer: true
    explain: Los patinadores siguen las reglas de los peatones, pero con su propia regla de lugar. Pueden usar el fietspad, el fiets/bromfietspad, el trottoir o el voetpad, sin tener que elegir la acera primero. Un peatón a pie, en cambio, usaría la acera.
    cites: ["rvv:4.4"]

  - id: usuarios-gehandicapten
    type: yesno
    prompt: Un conductor de gehandicaptenvoertuig que va por el voetpad, ¿sigue las reglas de peatones?
    answer: true
    explain: Las reglas de peatones también valen para el conductor de un gehandicaptenvoertuig cuando usa un voetpad o trottoir.
    cites: ["rvv:2.1"]

  - id: usuarios-columna
    type: mc
    prompt: Un cortejo fúnebre de peatones que sigue la calzada, ¿qué reglas se le aplican además de las de peatón?
    options: [Ninguna más, Las de las wagens, Las de los vehículos de motor, Las de los ciclistas]
    answer: 1
    explain: A las columnas, desfiles y cortejos fúnebres de peatones que siguen la rijbaan se les aplican también las reglas de las wagens.
    cites: ["rvv:2.3"]

  - id: usuarios-bici-a-mano-fietspad
    type: mc
    prompt: Llevas tu bicicleta a mano. En esa calle no hay trottoir ni voetpad, pero sí un fietspad junto a la calzada. ¿Por dónde caminas?
    options: [Por el fietspad, Por la rijbaan, Por la berma, Montas y pedaleas por el fietspad]
    answer: 0
    explain: Quien lleva a mano una bicicleta sigue las reglas de peatón (art. 2). El peatón usa el trottoir o el voetpad; si no hay, el fietspad o el fiets/bromfietspad; solo si tampoco hay, la berma o el borde de la rijbaan.
    cites: ["rvv:2.2", "rvv:4"]

  - id: usuarios-bromfiets-a-mano-trottoir
    type: mc
    prompt: Llevas tu bromfiets a mano (caminando a su lado) por una calle con trottoir. ¿Dónde vas?
    options: ["Por el trottoir, como un peatón", "Por la rijbaan, porque la bromfiets es un vehículo", Por el fietspad, Por donde quieras]
    answer: 0
    explain: Las reglas de peatón valen también para quien lleva a mano una motocicleta, bromfiets o bicicleta, así que usas el trottoir.
    cites: ["rvv:2.2", "rvv:4"]

  - id: usuarios-jinete-derecha
    type: yesno
    prompt: Un jinete a caballo circula por la rijbaan porque no hay ruiterpad. ¿Le aplica la regla de circular lo más a la derecha posible?
    answer: true
    explain: Bestuurders son todos los usuarios de la vía salvo los peatones, así que el jinete es un bestuurder y le aplica el art. 3.1.
    cites: ["rvv:3.1", "rvv:1", "rvv:8"]
