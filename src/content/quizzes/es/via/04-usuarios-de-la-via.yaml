questions:
  - id: usuarios-derecha-quienes
    type: multi
    prompt: La regla de circular lo más a la derecha posible vale para los bestuurders. ¿A cuáles de estos usuarios, que van por la rijbaan, les aplica?
    options: [Un ciclista, Un jinete, Un peatón que camina por el borde de la calzada, Un conductor de gehandicaptenvoertuig]
    answer: [0, 1, 3]
    explain: Bestuurder es cualquier usuario de la vía salvo los peatones. El ciclista, el jinete y el conductor de un gehandicaptenvoertuig que va por la rijbaan lo son. El peatón no es bestuurder, aunque camine por el borde de la calzada.
    cites: ["rvv:3.1", "rvv:1", "rvv:2.1"]

  - id: usuarios-jinete-derecha
    type: yesno
    prompt: Un jinete a caballo circula por la rijbaan porque no hay ruiterpad. ¿Le aplica la regla de circular lo más a la derecha posible?
    answer: true
    explain: Bestuurders son todos los usuarios de la vía salvo los peatones, así que el jinete es un bestuurder y le aplica el art. 3.1.
    cites: ["rvv:3.1", "rvv:1", "rvv:8"]

  - id: usuarios-peaton-quienes
    type: multi
    prompt: ¿A cuáles de estas personas se les aplican las reglas de peatón?
    options: [Quien lleva su bicicleta a mano, Una persona que va con patines en línea, Un ciclista que pedalea, Un bromfietser que va montado en su ciclomotor]
    answer: [0, 1]
    explain: Las reglas de peatón valen también para quien lleva a mano una bicicleta, bromfiets o motocicleta y para quien se mueve con objetos que no son vehículos, como los patines. El ciclista y el bromfietser que van montados conducen un vehículo y no entran.
    cites: ["rvv:2.2"]

  - id: usuarios-gehandicapten-rijbaan
    type: yesno
    prompt: Un conductor de gehandicaptenvoertuig circula por la rijbaan porque la calle no tiene acera ni voetpad. ¿Se le aplican las reglas de peatón?
    answer: false
    explain: Las reglas de peatón le valen al conductor de un gehandicaptenvoertuig solo cuando usa un voetpad o un trottoir, o cruza de uno a otro. Por la rijbaan es un usuario más, un bestuurder.
    cites: ["rvv:2.1", "rvv:1"]

  - id: usuarios-gehandicapten-cruzar
    type: yesno
    prompt: Un conductor de gehandicaptenvoertuig va por un trottoir y cruza la calle hasta el trottoir de enfrente. ¿Se le aplican las reglas de peatón mientras cruza?
    answer: true
    explain: Las reglas de peatón le valen al conductor de un gehandicaptenvoertuig cuando usa un voetpad o un trottoir y también cuando cruza de uno a otro.
    cites: ["rvv:2.1"]

  - id: usuarios-bici-a-mano-fietspad
    type: mc
    prompt: Llevas tu bicicleta a mano. En esa calle no hay trottoir ni voetpad, pero sí un fietspad junto a la calzada. ¿Por dónde caminas?
    options: [Por el fietspad, Por la rijbaan, Por la berma, "Por el fietspad, solo de noche"]
    answer: 0
    explain: Quien lleva a mano una bicicleta sigue las reglas de peatón (art. 2). El peatón usa el trottoir o el voetpad; si no hay, el fietspad o el fiets/bromfietspad; solo si tampoco hay, la berma o el borde de la rijbaan.
    cites: ["rvv:2.2", "rvv:4"]

  - id: usuarios-bromfiets-a-mano-trottoir
    type: mc
    prompt: Llevas tu bromfiets a mano (caminando a su lado) por una calle con trottoir. ¿Dónde vas?
    options: ["Por el trottoir, como un peatón", "Por la rijbaan, porque la bromfiets es un vehículo", Por el fietspad, Por donde quieras]
    answer: 0
    explain: Las reglas de peatón valen también para quien lleva a mano una motocicleta, bromfiets o bicicleta, así que usas el trottoir.
    cites: ["rvv:2.2", "rvv:4"]

  - id: usuarios-moto-a-mano-sin-acera
    type: mc
    prompt: Llevas tu motocicleta a mano, caminando a su lado. La calle no tiene trottoir, voetpad, fietspad ni fiets/bromfietspad. ¿Por dónde vas?
    options: ["Por la berma o el borde de la rijbaan", "Por el centro de la rijbaan, con luces", "Por la rijbaan, montado en la moto", "Por donde haya más espacio libre"]
    answer: 0
    explain: Quien lleva a mano una motocicleta sigue las reglas de peatón. Si no hay trottoir, voetpad ni fietspad, el peatón usa la berma o el borde de la rijbaan.
    cites: ["rvv:2.2", "rvv:4.3"]
