questions:
  - id: como-usar-solo-este-curso
    type: mc
    exam: false
    prompt: Una compañera te dice que estudiar solo este curso basta, porque cada regla trae su fuente. Tú ves una regla que te sorprende. ¿Qué haces?
    options: ["La das por buena, porque lleva una cita y eso garantiza que es oficial", "La compruebas en la fuente citada y, si dudas, en material actual", "La das por buena mientras este curso no la contradiga en otra lección", "La ignoras y repasas solo las reglas que ya conocías de antes"]
    answer: 1
    explain: El curso lo escriben voluntarios y puede tener errores o quedar desactualizado. La cita sirve justamente para que compruebes la regla; si el curso y la ley o el CBR dicen algo distinto, vale la fuente oficial.
    cites: ["curso"]

  - id: como-usar-conflicto
    type: mc
    exam: false
    prompt: Lo que dice este curso contradice lo que dice la ley o el CBR. ¿Qué vale?
    options: ["Lo que dice este curso, porque lo revisan voluntarios", "Lo que dicen la ley o el CBR", "Lo más estricto de los dos, sea cual sea", "Lo que dice tu instructor de manejo, siempre"]
    answer: 1
    explain: Este curso no es una fuente oficial. Si hay diferencias, valen la ley y el CBR.
    cites: ["curso"]

  - id: como-usar-reportar
    type: mc
    exam: false
    prompt: Encuentras una regla que crees incorrecta. ¿Cómo la reportas?
    options: ["Llamando al CBR para avisarles del error", "Con el enlace \"Reportar un problema\" del pie de cada página", "Escribiendo una nota en la lección para que los autores la lean", "No se puede reportar: el curso no admite cambios de los lectores"]
    answer: 1
    explain: El enlace "Reportar un problema" está en el pie de cada página y abre una plantilla de GitHub. Una nota en la lección es solo para ti y se guarda en tu navegador.
    cites: ["curso"]

  - id: como-usar-fuente
    type: yesno
    exam: false
    prompt: Un cuadro de regla de una lección muestra una cita como "rvv:15.1". ¿Indica de dónde sale la regla?
    answer: true
    explain: La cita indica la fuente. "rvv:15.1" es el artículo 15, primer apartado del RVV 1990, y puedes comprobarlo ahí.
    cites: ["curso"]

  - id: como-usar-repaso
    type: mc
    exam: false
    prompt: En el Repaso, ¿cuándo cuenta una pregunta como aprendida?
    options: ["Cuando la contestas bien la primera vez", "Cuando la contestas bien en días distintos", "Cuando la contestas bien el mismo día", "Cuando terminas la lección donde aparece"]
    answer: 1
    explain: Una pregunta cuenta como aprendida solo cuando la has contestado bien en días distintos. Una sola respuesta correcta el mismo día no basta.
    cites: ["curso"]

  - id: como-usar-repaso-error
    type: mc
    exam: false
    prompt: Contestas mal una pregunta en el Repaso. ¿Qué pasa con ella?
    options: ["Nada, conserva el avance que ya tenía", "Vuelve al inicio de su ciclo de repaso", "Se elimina del curso y no vuelve a salir", "Cuenta como aprendida si ya acertó antes"]
    answer: 1
    explain: Si fallas, la pregunta vuelve al principio de su ciclo y tendrás que acertarla de nuevo en días distintos.
    cites: ["curso"]

  - id: como-usar-progreso
    type: mc
    exam: false
    prompt: ¿Dónde se guardan tu progreso y tus notas?
    options: [En una cuenta en un servidor, Solo en tu navegador, En el CBR, En tu correo]
    answer: 1
    explain: No hay cuentas. Todo se guarda en tu navegador, por eso conviene exportar tu progreso desde "Mi progreso".
    cites: ["curso"]

  - id: como-usar-cuentas
    type: yesno
    exam: false
    prompt: Cambias de computador y no exportaste tu progreso. ¿Seguirá tu progreso disponible automáticamente en el computador nuevo?
    answer: false
    explain: No. El progreso está solo en el navegador del primer computador. Para pasarlo debes exportarlo y luego importarlo.
    cites: ["curso"]

  - id: como-usar-notas
    type: yesno
    exam: false
    prompt: ¿Puedes descargar todas tus notas juntas desde la página Notas?
    answer: true
    explain: En la página Notas ves las notas de todas las lecciones y puedes descargarlas como un archivo Markdown.
    cites: ["curso"]

  - id: como-usar-consejo
    type: mc
    exam: false
    prompt: En una lección ves un cuadro de "consejo" (Tip). ¿Qué es?
    options: ["Una regla de ley con su artículo citado", "Una técnica de examen, que no es ley", "Una pregunta real que salió en el CBR", "Una cita textual de un artículo de ley"]
    answer: 1
    explain: Los consejos son técnicas de examen. Las reglas de ley van en cuadros de regla con su fuente.
    cites: ["curso"]

  - id: como-usar-predecir
    type: mc
    exam: false
    prompt: "Quieres sacarle más partido a una pregunta de práctica. Antes de mirar las opciones, ¿qué es lo más útil?"
    options: ["Leer las opciones y descartar primero las que suenan raras", "Decidir qué harías tú y por qué, y después comparar", "Buscar la opción que repite palabras de la lección", "Fijarte en cuál opción es más larga que las demás"]
    answer: 1
    explain: Si decides primero, practicas aplicar la regla, que es lo que pide el examen. Descartar opciones por cómo suenan puede darte el acierto sin haber entendido la regla, y no te sirve cuando cambie la situación.
    cites: ["curso"]

  - id: como-usar-fallo
    type: mc
    exam: false
    prompt: Fallaste una pregunta de prioridad en el Repaso. ¿Qué anotación en Notas te ayudará más?
    options: ["Solo la letra de la opción correcta y la fecha del fallo", "La regla aplicable y el dato que decidía la respuesta", "Solo el número de la lección, para releerla entera después", "Una frase general como \"repasar bien prioridad\" y nada más"]
    answer: 1
    explain: Para no repetir el error necesitas la regla y el dato que te la hizo aplicar (una señal, un tipo de vehículo, una dirección). La letra de la opción no te sirve, porque las opciones se mezclan cada vez.
    cites: ["curso"]
