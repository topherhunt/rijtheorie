questions:
  - id: supuestos-mi-vehiculo
    type: mc
    exam: false
    prompt: "Una pregunta dice: \"Quieres adelantar a un ciclista en una calle de un solo carril por sentido\". No dice qué vehículo conduces. ¿Desde qué punto de vista la contestas?"
    options: ["Como conductor del auto del CBR, sin pensar en tu propio auto", "Como conductor de tu propio auto, con sus medidas y su motor", "Como ciclista, porque es quien sufre la maniobra", "Depende de si tu auto es más ancho que el del CBR"]
    answer: 0
    explain: Si la pregunta no nombra otro vehículo, eres el conductor del auto del CBR. Responder pensando en las medidas o la potencia de tu auto es el error típico.
    cites: ["cbr-examenplan:1"]

  - id: supuestos-lluvia
    type: mc
    exam: false
    prompt: La imagen de una pregunta muestra una calle con fuerte lluvia. ¿Qué debes suponer sobre el clima?
    options: ["Que el clima es normal, como en cualquier pregunta", "Que el clima no es normal, porque la imagen lo muestra claramente", "Que la lluvia solo cuenta si la pregunta la menciona por escrito", "Que debes responder como si la imagen mostrara un día seco"]
    answer: 1
    explain: El supuesto de condiciones normales no vale si la imagen o la pregunta indican claramente algo distinto. Una lluvia fuerte visible en la imagen lo cambia.
    cites: ["cbr-examenplan:1"]

  - id: supuestos-normal
    type: multi
    exam: false
    prompt: Según el CBR, ¿qué debes suponer al contestar una pregunta si no se indica nada distinto?
    options: [Que eres el conductor del auto del CBR, Que los demás cumplen las reglas, Que las condiciones de la vía y del clima son normales, Que algún conductor se saltará una regla, Que la vía está en obras]
    answer: [0, 1, 2]
    explain: Los tres supuestos son que eres el conductor del auto del CBR, que los demás cumplen las reglas y que la vía y el clima son normales.
    cites: ["cbr-examenplan:1"]

  - id: supuestos-semaforo-verde
    type: mc
    exam: false
    prompt: Llegas a un cruce con semáforo en verde para ti. La imagen no muestra ningún vehículo cruzando ni nada raro. ¿Qué respuesta da el examen?
    options: ["Pasas, porque supones que el tráfico cruzado respeta su semáforo en rojo", "Frenas y miras, porque alguien podría saltarse el rojo", "Pasas solo si ves el cruce completamente vacío", "Esperas a que cambie para estar seguro"]
    answer: 0
    explain: El examen parte de que los demás cumplen las reglas, y aquí nada en la imagen dice lo contrario. Frenar por si alguien se salta el rojo es prudencia de la calle, pero no es la respuesta que pide el examen.
    cites: ["cbr-examenplan:1"]

  - id: supuestos-exceso
    type: mc
    exam: false
    prompt: La pregunta dice claramente que un auto que viene hacia ti va a mucha más velocidad de la permitida. ¿Qué pasa con el supuesto de que los demás cumplen las reglas?
    options: ["Sigue valiendo: los demás cumplen las reglas en todo caso", "Ya no vale para ese auto, porque la pregunta indica claramente que no cumple", "Vale solo si el auto va por el carril contrario", "Ya no vale para ningún usuario de la imagen"]
    answer: 1
    explain: El supuesto se aplica salvo que la pregunta o la imagen indiquen claramente otra cosa. Aquí la pregunta lo dice.
    cites: ["cbr-examenplan:1"]

  - id: idioma-opciones
    type: multi
    exam: false
    prompt: ¿En qué idiomas puedes hacer el examen teórico de auto del CBR?
    options: [Neerlandés, Inglés, Cualquier otro idioma con un intérprete oficial reservado, Español sin ningún trámite adicional, Cualquier otro idioma con un amigo que traduzca]
    answer: [0, 1, 2]
    explain: El examen es en neerlandés o inglés. En otro idioma solo con un intérprete oficial reservado. No puedes llevar tu propio intérprete.
    cites: ["cbr-taal", "cbr-tolk"]

  - id: idioma-propio-interprete
    type: yesno
    exam: false
    prompt: ¿Puedes llevar a un amigo bilingüe como intérprete al examen teórico?
    answer: false
    explain: No. No se permite un intérprete propio; hay que reservar uno oficial en una agencia aprobada.
    cites: ["cbr-taal"]

  - id: idioma-pago-interprete
    type: mc
    exam: false
    prompt: Reservaste un examen con intérprete. ¿A quién pagas el costo del intérprete?
    options: [Al CBR junto con el examen, A la agencia de interpretación aprobada, Al instructor de manejo, Al municipio]
    answer: 1
    explain: Pagas el examen con intérprete al CBR, pero el costo del intérprete se paga a la agencia.
    cites: ["cbr-tolk"]

  - id: idioma-plazo
    type: number
    exam: false
    prompt: ¿Con cuántos días de anticipación, como mínimo, debes reservar el intérprete antes del examen?
    answer: 14
    unit: días
    explain: El intérprete se reserva al menos 14 días (2 semanas) antes del examen. Si no, el examen no puede realizarse.
    cites: ["cbr-tolk", "cbr-taal"]

  - id: idioma-orden
    type: mc
    exam: false
    prompt: Quieres hacer el examen con intérprete. ¿Qué debes hacer primero?
    options: [Reservar el intérprete en la agencia, Reservar y pagar en el CBR un examen con intérprete, Presentarte al examen y pedirlo allí, Llevar tu propio intérprete]
    answer: 1
    explain: Primero reservas y pagas el examen con intérprete en el CBR. Después organizas el intérprete oficial en una agencia aprobada.
    cites: ["cbr-tolk"]

  - id: idioma-producto
    type: mc
    exam: false
    prompt: En la agencia de interpretación, ¿qué producto debes elegir?
    options: ["El mismo que reservaste en el CBR (por ejemplo, el examen teórico de auto)", "Cualquiera: el que sea más barato", Uno de examen práctico, Uno de moto]
    answer: 0
    explain: Debes elegir el mismo producto que reservaste en el CBR, por ejemplo "theorie-examen auto".
    cites: ["cbr-tolk"]

  - id: idioma-ingles
    type: yesno
    exam: false
    prompt: ¿Puedes hacer el examen teórico de auto en inglés sin intérprete?
    answer: true
    explain: El CBR dice que el examen teórico de auto se puede hacer en inglés.
    cites: ["cbr-taal"]
