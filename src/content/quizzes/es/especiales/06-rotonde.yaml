questions:
  - id: rotonde-quien-no-derecha
    type: multi
    prompt: Estás en una rotonda marcada con D1. ¿Cuáles de estos conductores que siguen la calzada tienen el permiso especial de ir por un lugar distinto del lado derecho de la calzada?
    options:
      - El conductor de un auto
      - El conductor de una bromfiets
      - Un ciclista
    answer: [0, 1]
    explain: El art. 47 da ese permiso a los conductores de vehículos de motor y a los bromfietsers que siguen la calzada, cerca de las rotondas o en ellas. No nombra a los ciclistas.
    cites: ["rvv:47"]

  - id: rotonde-no-bloquear-fietspad
    type: mc
    prompt: Hay cola para entrar a la rotonda y un carril bici independiente cruza justo antes de la entrada. ¿Dónde esperas?
    options:
      - Antes del carril bici, sin bloquearlo
      - Encima del carril bici, para estar más cerca de la entrada
      - Con las ruedas delanteras sobre el carril bici, con el intermitente puesto
    answer: 0
    explain: Al acercarte a la rotonda, circular por ella y salir no debes bloquear los carriles bici independientes (vrijliggende fietspaden).
    cites: ["cbr-rijprocedure:3.6"]

  - id: rotonde-tres-cuartos
    type: mc
    prompt: Te acercas a una rotonda y tu salida es la tercera, tres cuartos de vuelta. ¿Qué señalizas al acercarte?
    options:
      - Intermitente izquierdo, y después señalizas la salida
      - Intermitente derecho, como en cualquier salida
      - Ningún intermitente hasta tener la salida a la vista
      - Los dos intermitentes a la vez
    answer: 0
    explain: Para tres cuartos de vuelta, intermitente izquierdo al acercarte; para la primera salida sería el derecho. Luego señalizas la salida.
    cites: ["cbr-rijprocedure:3.6"]

  - id: especial-rotonde-carril-media
    type: mc
    prompt: Rotonda de tres carriles sin flechas. Vas a tomar la segunda salida (media vuelta). ¿Cómo usas los carriles?
    options:
      - Entras por el carril medio y, pasada la primera salida, pasas al derecho
      - Entras por el carril derecho y sigues por él
      - Entras por el carril izquierdo y pasas al medio en la salida
      - Entras por el carril medio y sales desde él
    answer: 0
    explain: "Media vuelta: de preferencia el carril medio y, pasada la primera salida, el derecho."
    cites: ["cbr-rijprocedure:3.6"]

  - id: rotonde-carril-completa
    type: mc
    prompt: Rotonda de tres carriles sin flechas. Das una vuelta completa. ¿En qué orden usas los carriles?
    options:
      - Derecho, medio, izquierdo
      - Izquierdo, medio, derecho
      - Solo el medio
      - Solo el izquierdo
    answer: 1
    explain: Primero el carril izquierdo, luego el medio (pasada la salida de media vuelta) y por último el derecho (pasada la de tres cuartos).
    cites: ["cbr-rijprocedure:3.6"]

  - id: rotonde-no-siempre
    type: mc
    prompt: Llegas a una rotonda de tres carriles con semáforos y flechas pintadas en el pavimento. ¿Aplicas el procedimiento de carriles de las rotondas sin flechas?
    options:
      - No, usas el carril que corresponde a tu dirección según las flechas
      - Sí, es el procedimiento general de todas las rotondas
      - Sí, pero solo si no hay tráfico intenso
    answer: 0
    explain: El procedimiento no vale en plazas asimétricas, rotondas sin carriles, rotondas con semáforos y flechas, con tráfico intenso ni para todos los vehículos. Con flechas, usas el carril de tu dirección.
    cites: ["cbr-rijprocedure:3.6"]

  - id: rotonde-turbo-cambiar
    type: yesno
    prompt: Estás dentro de una turborrotonda en el carril equivocado. Según VVN, ¿puedes cambiar de carril?
    answer: false
    explain: En una turborrotonda no puedes cambiar de carril. Por eso eliges bien antes de entrar.
    cites: ["vvn-turborotonde"]
