questions:
  - id: erf-velocidad-situacion
    type: mc
    prompt: Entras a un erf con tu auto. La calle está vacía y recta. ¿A qué velocidad máxima puedes circular?
    sign: G5
    options: ["15 km/h, aunque la calle esté vacía", "20 km/h si la calle está vacía", "30 km/h, como en una zona 30", "50 km/h, como en el pueblo"]
    answer: 0
    explain: Dentro de un erf no puedes ir a más de 15 km/h, aunque la calle esté vacía y recta.
    cites: ["rvv:45", "rvv:bijlage1.G5"]

  - id: erf-peaton-medio
    type: yesno
    prompt: Dentro de un erf, un peatón camina por el medio de la calzada aunque hay un borde libre. ¿Está haciendo algo que la ley no permite?
    answer: false
    explain: Los peatones pueden usar todo el ancho de las vías dentro de un erf. Por eso hay que conducir a la defensiva y contar con encontrarlos en cualquier parte.
    cites: ["rvv:44"]

  - id: erf-estacionar-hueco
    type: mc
    prompt: Quieres dejar tu auto dentro de un erf. Junto a una fachada hay un espacio libre sin ninguna marca ni señal de estacionamiento. ¿Puedes estacionar ahí?
    options: ["No, solo en lugares señalados o marcados para estacionar", "Sí, siempre que no estorbes a los peatones ni a otros vehículos", "Sí, si dejas el auto bien pegado a la fachada y con freno", "Sí, si es solo por unos minutos y nadie espera para pasar"]
    answer: 0
    explain: En un erf los vehículos de motor solo pueden estacionar en los lugares señalados o marcados como estacionamiento. Que el espacio esté libre o que no estorbe no basta.
    cites: ["rvv:46"]

  - id: erf-parada-pasar
    type: mc
    prompt: Un tranvía está parado en su parada y quieres pasar por el lado donde suben y bajan los pasajeros. ¿Qué haces?
    options:
      - Les das oportunidad de subir y bajar antes de pasar
      - Pasas despacio sin detenerte, porque el tranvía ya está parado
      - Tocas la bocina para que se aparten
      - Pasas con las luces de emergencia puestas
    answer: 0
    explain: Si pasas por el lado donde suben y bajan los pasajeros, tienes que darles oportunidad de hacerlo. Además pueden cruzar de repente por delante o por detrás del tranvía.
    cites: ["rvv:52", "cbr-rijprocedure:3.6"]

  - id: erf-parada-fuera
    type: yesno
    prompt: Según el artículo 56, ¿tiene que dejar salir de la parada a un bus que pone el intermitente fuera de la bebouwde kom?
    answer: false
    explain: El artículo 56 solo vale dentro de la bebouwde kom (zona urbana).
    cites: ["rvv:56"]
    exam: false

  - id: erf-parada-charco
    type: mc
    prompt: Hay gente esperando en una parada y un charco entre tú y ellos. ¿Qué haces?
    options:
      - Reduces mucho o evitas el charco para no salpicarles
      - Pasas a velocidad normal, porque el charco es cosa de la calle
      - Pasas rápido para que el agua caiga lejos
      - Tocas la bocina para que se aparten
    answer: 0
    explain: El procedimiento dice que hay que dejar espacio y bajar la velocidad cuando hay gente esperando, y no salpicarles con charcos.
    cites: ["cbr-rijprocedure:3.6"]

  - id: erf-bus-semaforo
    type: mc
    prompt: Circulas por un carril de bus que puedes usar legalmente, y el semáforo de tranvía y bus de ese carril está en rojo. ¿Qué haces?
    options:
      - Te detienes, porque esos semáforos también valen para ti
      - Sigues, porque esos semáforos son solo para buses y tranvías
      - Sigues si no viene ningún bus ni tranvía
      - Te detienes solo si eres un autobús
    answer: 0
    explain: Los semáforos de tranvía y bus (tram/buslichten) también valen para los vehículos, distintos de un lijnbus, que usan el carril al que se refiere la luz.
    cites: ["rvv:70.4"]

  - id: erf-carril-f17-quien
    type: multi
    prompt: Un carril tiene la señal F17. ¿Quién puede usarlo?
    sign: F17
    options:
      - Una lijnbus
      - Un tranvía
      - Un autobús turístico (autobus, no lijnbus)
      - Un auto
    answer: [0, 1]
    explain: F17 marca una rijbaan o rijstrook exclusiva para lijnbussen y trams. Un autobus que no es de línea no puede usarla, y menos un auto.
    cites: ["rvv:bijlage1.F17"]

  - id: erf-puente
    type: mc
    prompt: Te acercas a un puente móvil y las luces del puente muestran rojo intermitente. Todavía no ves el puente levantado. ¿Qué haces?
    options:
      - Te detienes ante el puente
      - Reduces y cruzas con cuidado
      - Cruzas rápido antes de que se levante
      - Cruzas si no ves ningún barco
    answer: 0
    explain: En las luces de un puente móvil, rojo o rojo intermitente significa alto, aunque el puente aún no se haya movido.
    cites: ["rvv:72"]
