questions:
  - id: erf-velocidad-situacion
    type: mc
    prompt: Entras a un erf con tu auto. La calle está vacía y recta. ¿A qué velocidad máxima puedes circular?
    sign: G5
    options: [15 km/h, 20 km/h, 30 km/h, 50 km/h]
    answer: 0
    explain: Dentro de un erf no puedes ir a más de 15 km/h, aunque la calle esté vacía y recta.
    cites: ["rvv:45", "rvv:bijlage1.G5"]

  - id: erf-peaton-medio
    type: yesno
    prompt: Dentro de un erf, un peatón camina por el medio de la calzada aunque hay un borde libre. ¿Está haciendo algo que la ley no permite?
    answer: false
    explain: Los peatones pueden usar todo el ancho de las vías dentro de un erf. Por eso hay que conducir a la defensiva y contar con encontrarlos en cualquier parte.
    cites: ["rvv:44"]

  - id: erf-estacionar
    type: mc
    prompt: Dentro de un erf, ¿dónde puede estacionar un auto?
    options:
      - En cualquier lugar donde no moleste
      - Solo en lugares señalados o marcados como estacionamiento
      - En el borde de la calzada
      - En ninguna parte
    answer: 1
    explain: Los conductores de vehículos de motor solo pueden estacionar en los lugares señalados o marcados como estacionamiento.
    cites: ["rvv:46"]

  - id: erf-zona-disco
    type: yesno
    prompt: Un erf es además zona de disco (parkeerschijf-zone). ¿Valen también las reglas de estacionamiento con disco?
    answer: true
    explain: Si el erf es también zona de disco, valen los artículos 25 y 26.
    cites: ["rvv:46"]

  - id: erf-parada-pasar
    type: mc
    prompt: Vas a pasar junto a un tranvía parado, por el lado donde bajan los pasajeros. ¿Qué haces?
    options:
      - Pasas rápido para no bloquear
      - Les das oportunidad de subir y bajar
      - Tocas la bocina
      - Pasas por el otro lado siempre
    answer: 1
    explain: Debes darles oportunidad de subir y bajar si pasas por el lado donde lo hacen.
    cites: ["rvv:52"]

  - id: erf-parada-salida
    type: mc
    prompt: Estás en una calle dentro de la bebouwde kom (zona urbana). Un bus parado en la parada pone el intermitente. ¿Qué haces?
    options:
      - Le dejas salir de la parada
      - Pasas antes que él
      - Le tocas la bocina
      - Frenas fuerte sin avisar
    answer: 0
    explain: Dentro de la bebouwde kom debes dar oportunidad de salir a un bus que avisa con el intermitente.
    cites: ["rvv:56"]

  - id: erf-parada-fuera
    type: yesno
    prompt: Según el artículo 56, ¿tiene que dejar salir de la parada a un bus que pone el intermitente fuera de la bebouwde kom?
    answer: false
    explain: El artículo 56 solo vale dentro de la bebouwde kom (zona urbana).
    cites: ["rvv:56"]
    exam: false

  - id: erf-parada-charco
    type: yesno
    prompt: Hay gente esperando en una parada y un charco junto a ellos. Según el procedimiento, ¿pasas por el charco a la velocidad normal?
    answer: false
    explain: El procedimiento dice que no hay que pasar por charcos (o solo con muy poca velocidad) junto a gente que espera, para no salpicarles.
    cites: ["cbr-rijprocedure:3.6"]

  - id: erf-bus-quien
    type: mc
    prompt: Un carril tiene escrita la palabra BUS. ¿Quién puede usarlo?
    options:
      - Lijnbus, autobus y tranvía
      - Solo lijnbus
      - Todos los vehículos de motor
      - Solo tranvías
    answer: 0
    explain: En carriles con BUS pueden ir lijnbus, autobus y tram.
    cites: ["rvv:81"]

  - id: erf-bus-lijnbus
    type: mc
    prompt: Un carril tiene escrita la palabra LIJNBUS. ¿Puede usarlo un autobús turístico?
    options:
      - Sí, porque es un autobús
      - No, solo lijnbus y tranvía
      - Sí, si lleva pasajeros
      - Sí, con límite de velocidad
    answer: 1
    explain: Con LIJNBUS solo pueden usarlo lijnbus y tram.
    cites: ["rvv:81"]

  - id: erf-bus-semaforo
    type: yesno
    prompt: Usas legalmente un carril de bus y hay un semáforo de tranvía y bus para ese carril. ¿Tienes que obedecerlo?
    answer: true
    explain: Los tram/buslichten también valen para otros vehículos que usan una busbaan o busstrook.
    cites: ["rvv:70.4"]

  - id: erf-carril-f17-quien
    type: multi
    prompt: Un carril tiene la señal F17. ¿Quién puede usarlo?
    sign: F17
    options:
      - Una lijnbus
      - Un tranvía
      - Un autobús turístico (autobus, no lijnbus)
      - Un auto
    answer: [0, 1]
    explain: F17 marca una rijbaan o rijstrook exclusiva para lijnbussen y trams. Un autobus que no es de línea no puede usarla, y menos un auto.
    cites: ["rvv:bijlage1.F17"]

  - id: erf-puente
    type: mc
    prompt: Llegas a un puente móvil y ves luz roja o roja intermitente. ¿Qué significa?
    options: [Precaución, Alto, Puedes pasar despacio, El puente está libre]
    answer: 1
    explain: En las luces del puente, rojo o rojo intermitente significa alto.
    cites: ["rvv:72"]
