questions:
  - id: autosnelweg-vel-minima
    type: mc
    prompt: ¿Qué vehículos pueden usar una autosnelweg?
    options:
      - Cualquier vehículo, incluidas las bicicletas
      - Solo vehículos de motor que puedan y tengan permiso para ir al menos a 60 km/h
      - Solo vehículos de motor que puedan y tengan permiso para ir al menos a 50 km/h
      - Solo autos y motos
    answer: 1
    explain: La autosnelweg exige 60 km/h como mínimo (la autoweg, 50 km/h). Los dos requisitos, poder y tener permiso, deben cumplirse.
    cites: ["rvv:42.1"]

  - id: autosnelweg-vel-minima-autoweg
    type: number
    prompt: ¿Desde qué velocidad mínima (que el vehículo pueda y tenga permiso de alcanzar) se puede usar una autoweg?
    answer: 50
    unit: km/h
    explain: La autoweg exige al menos 50 km/h. Para la autosnelweg son 60 km/h.
    cites: ["rvv:42.2"]

  - id: autosnelweg-senal-g1
    type: mc
    prompt: ¿Qué vía marca esta señal?
    sign: G1
    options: [Autoweg, Autosnelweg, Erf, Vía con prioridad]
    answer: 1
    explain: G1 marca la autosnelweg. La autoweg se marca con G3.
    cites: ["rvv:bijlage1.G1", "rvv:1"]

  - id: autosnelweg-senal-g3
    type: mc
    prompt: ¿Qué vía marca esta señal?
    sign: G3
    options: [Autoweg, Autosnelweg, Erf, Zona de 30 km/h]
    answer: 0
    explain: G3 marca la autoweg. La autosnelweg se marca con G1.
    cites: ["rvv:bijlage1.G3", "rvv:1"]

  - id: autosnelweg-gasolinera-parte
    type: yesno
    prompt: ¿Es una gasolinera junto a la autosnelweg parte de la autosnelweg?
    answer: false
    explain: Los lugares de estacionamiento, gasolineras y paradas de bus junto a la autosnelweg o autoweg no son parte de esa vía.
    cites: ["rvv:1"]

  - id: autosnelweg-marcha-atras
    type: multi
    prompt: En una autosnelweg, ¿qué cosas te prohíbe la ley hacer?
    options:
      - Dar la vuelta
      - Ir marcha atrás
      - Dejar el vehículo parado en la calzada
      - Ir por el carril de la derecha
    answer: [0, 1, 2]
    explain: Están prohibidos keren, achteruitrijden y stilstaan en la rijbaan. Ir por el carril derecho está permitido (y es lo habitual).
    cites: ["rvv:43.1", "rvv:43.2"]

  - id: autosnelweg-perdi-salida
    type: mc
    prompt: Te pasaste de tu salida en la autosnelweg y no hay nadie detrás. ¿Qué haces?
    options:
      - Das marcha atrás por el arcén hasta la salida
      - Das la vuelta en un hueco de la mediana
      - Sigues hasta la siguiente salida
      - Te detienes en la calzada y pones las luces de emergencia
    answer: 2
    explain: Dar la vuelta y la marcha atrás están prohibidos en la autosnelweg, y usar el arcén sin emergencia también. Hay que seguir hasta la siguiente salida.
    cites: ["rvv:43.1", "rvv:43.3"]

  - id: autosnelweg-vluchtstrook-adelantar
    type: yesno
    prompt: Hay un atasco en la autosnelweg y la vluchtstrook está libre. Sin ninguna emergencia, ¿puedes usarla para avanzar?
    answer: false
    explain: Salvo en emergencias está prohibido usar la vluchtstrook, la vluchthaven o la berm. Una spitsstrook abierta con señal C23-01 es otra cosa, y se ve en otra lección.
    cites: ["rvv:43.3"]

  - id: autosnelweg-camion-carril
    type: mc
    prompt: Conduces un camión (vrachtauto) en una autosnelweg con 4 carriles por sentido. ¿Qué carriles puedes usar?
    options:
      - Cualquiera
      - Solo los dos carriles de más a la derecha, salvo si tienes que hacer voorsorteren
      - Solo el carril de la derecha
      - Solo los dos carriles de más a la izquierda
    answer: 1
    explain: En una rijbaan con tres o más carriles, el camión solo puede usar los dos de más a la derecha. La prohibición no vale si debes colocarte para una salida o bifurcación.
    cites: ["rvv:43.4"]

  - id: autosnelweg-camion-largo
    type: yesno
    prompt: Un auto con un remolque largo forma un conjunto de más de 7 m. ¿Tiene la misma restricción de carriles que un camión en una autosnelweg con 3 o más carriles?
    answer: true
    explain: La regla vale para vrachtauto y también para cualquier conjunto de vehículos de más de 7 m de longitud total.
    cites: ["rvv:43.4"]

  - id: autosnelweg-vel-remolque
    type: number
    prompt: Conduces un auto con un remolque de 750 kg (masa máxima) por una autosnelweg fuera de poblado y sin señales de límite. ¿Cuál es tu velocidad máxima?
    answer: 90
    unit: km/h
    explain: Un auto con remolque de hasta 3500 kg de masa máxima va como máximo a 90 km/h.
    cites: ["rvv:22"]

  - id: autosnelweg-vel-camion
    type: number
    prompt: ¿Cuál es el límite legal de un camión (vrachtauto) en una autosnelweg fuera de poblado, sin señales de límite?
    answer: 80
    unit: km/h
    explain: Camiones y autobuses (que no sean T100) tienen un máximo de 80 km/h, más bajo que el de 130 km/h de los autos.
    cites: ["rvv:22"]

  - id: autosnelweg-vel-general
    type: mc
    prompt: Sin señales de límite y fuera de poblado, ¿cuál es el máximo legal de un auto sin remolque en una autoweg?
    options: [80 km/h, 90 km/h, 100 km/h, 130 km/h]
    answer: 2
    explain: Fuera de poblado, el máximo legal es 130 en autosnelweg, 100 en autoweg y 80 en las demás vías.
    cites: ["rvv:21"]

  - id: autosnelweg-averia-hectometer
    type: mc
    prompt: Tu auto se avería en una autosnelweg y llamas a Wegenwacht. ¿Cómo das tu posición?
    options:
      - Con el número de la salida más cercana
      - Con el número de la carretera, la lectura del hectometerbordje más cercano y el lado
      - Con el nombre del pueblo más cercano
      - No hace falta, el teléfono lo detecta
    answer: 1
    explain: Rijkswaterstaat recomienda dar el número de la carretera, la lectura del poste hectométrico y si estás a la izquierda o a la derecha.
    cites: ["rws-pech"]

  - id: autosnelweg-averia-guardarrail
    type: mc
    prompt: No puedes llegar a una vluchthaven y paras en la berma junto a un guardarraíl. ¿Cómo recomienda Rijkswaterstaat dejar el auto?
    options:
      - Lo más lejos posible del guardarraíl
      - Lo más cerca posible, con las ruedas delanteras giradas hacia el guardarraíl
      - Con las ruedas delanteras giradas hacia la calzada
      - Mitad en la calzada para que te vean
    answer: 1
    explain: Rijkswaterstaat recomienda quedar lo más cerca posible del guardarraíl, con las ruedas delanteras giradas hacia él, para que los pasajeros puedan salir por la derecha.
    cites: ["rws-pech"]
