questions:
  - id: spitsstrook-cruz-vluchtstrook
    type: yesno
    prompt: Tu auto se avería y la vluchtstrook tiene una cruz roja sobre ella. ¿Puedes detenerte allí?
    answer: true
    explain: La cruz roja prohíbe usar el carril, pero en la vluchtstrook deja una excepción, las emergencias. Una avería que te impide seguir es el caso para el que sirve la vluchtstrook.
    cites: ["rvv:73"]

  - id: spitsstrook-abierta-es-legal
    type: yesno
    prompt: Sobre la vluchtstrook hay un panel C23-01 (spitsstrook open) y no hay ninguna emergencia. ¿Puedes circular por ella como por un carril más?
    sign: C23-01
    answer: true
    explain: Con C23-01 la vluchtstrook está designada como rijstrook, y eso es la spitsstrook. Entonces es un carril de circulación. La prohibición de usar la vluchtstrook sin emergencia (art. 43 lid 3) vale cuando es una vluchtstrook corriente, sin esa señal.
    cites: ["rvv:1", "rvv:43.3"]

  - id: spitsstrook-fin
    type: mc
    prompt: Circulas por la spitsstrook abierta y ves la señal C23-03. ¿Qué significa para ti?
    sign: C23-03
    options: ["Que la spitsstrook termina en ese punto", "Que la spitsstrook empieza justo en ese punto de la vía", "Que debes dejar libre el carril que está a tu derecha", "Que puedes seguir por la vluchtstrook hasta la próxima salida"]
    answer: 0
    explain: C23-03 es "einde spitsstrook". Fuera de la spitsstrook, la vluchtstrook vuelve a ser vluchtstrook, y sin emergencia está prohibido usarla.
    cites: ["rvv:bijlage1.C23-03", "rvv:43.3"]

  - id: spitsstrook-cruz-prohibida-retencion
    type: yesno
    prompt: "Hay retención en tu carril y la vluchtstrook, vacía, tiene una cruz roja. No hay ninguna emergencia. ¿Está prohibido usarla para avanzar?"
    answer: true
    explain: La cruz roja prohíbe usar el carril, y en la vluchtstrook solo deja una excepción, las emergencias. Que haya retención no es una emergencia.
    cites: ["rvv:73", "rvv:43.3"]

  - id: spitsstrook-bus-no-tram
    type: yesno
    prompt: Sobre un carril hay luces con la palabra BUS. ¿Puede usarlo un tranvía?
    answer: false
    explain: Con la palabra BUS en las luces sobre el carril solo pueden usarlo lijnbus y autobus. El tranvía solo se incluye en la palabra BUS pintada en la calzada (art. 81).
    cites: ["rvv:73", "rvv:81"]

  - id: spitsstrook-linea
    type: mc
    prompt: Vas por el carril derecho, la spitsstrook está abierta a tu derecha y entre tu carril y ella hay una línea continua. ¿Puedes cruzarla para pasar a la spitsstrook?
    options: ["Sí, la ley permite cruzarla para llegar a una spitsstrook junto a tu carril", "No, una línea continua nunca se cruza, tampoco para llegar a una spitsstrook abierta", "Solo si hay una cruz roja sobre tu carril y no viene ningún vehículo"]
    answer: 0
    explain: La regla general es no cruzar la línea continua, pero hay una excepción para llegar a (o salir de) una vluchthaven, una vluchtstrook o una spitsstrook junto al carril que sigues.
    cites: ["rvv:76.1", "rvv:76.2"]

  - id: spitsstrook-verdrijvingsvlak
    type: mc
    prompt: Sigues una spitsstrook que pasa por una bifurcación con un verdrijvingsvlak. ¿Puedes circular por él?
    options: ["Sí, es una excepción si sigues la spitsstrook abierta", "No, un verdrijvingsvlak o puntstuk no se puede usar nunca", "Solo si no viene tráfico por la bifurcación en ese momento", "Solo si vas a una velocidad baja, como en un atasco"]
    answer: 0
    explain: La regla es no usar el verdrijvingsvlak ni el puntstuk. La excepción es seguir una spitsstrook que pasa por una splitsing o samenvoeging (y lo mismo con una busbaan o busstrook usada legalmente).
    cites: ["rvv:77.1", "rvv:77.2", "rvv:77.3"]

  - id: spitsstrook-averia
    type: mc
    prompt: Tu auto se avería en una spitsstrook abierta. ¿A quién recomienda llamar Rijkswaterstaat?
    options: [A la Wegenwacht como en cualquier avería, Al 112, A la policía local, A tu aseguradora]
    answer: 1
    explain: En una spitsstrook abierta, o en peligro agudo, se llama al 112 en lugar de a la Wegenwacht.
    cites: ["rws-pech"]
