questions:
  - id: invoegen-quien-cede
    type: mc
    prompt: Vas por el invoegstrook y un auto circula ya muy cerca por el carril derecho de la calzada principal. Quieres pasar a la doorgaande rijbaan. ¿Quién deja pasar a quién?
    options: ["Tú lo dejas pasar, porque incorporarte es una maniobra especial", "Ese auto te deja pasar, porque tú ya llevas el intermitente", "Pasa primero quien vaya más rápido, porque la velocidad decide", "Nadie cede: se entra por orden de llegada al punto de unión"]
    answer: 0
    explain: Pasar del carril de incorporación a la calzada principal es una bijzondere manoeuvre, y quien la hace deja pasar primero al otro tráfico. Que ya estés en tu carril no te da prioridad.
    cites: ["rvv:54"]

  - id: invoegen-hombro
    type: mc
    prompt: Justo antes de incorporarte, ¿cómo revisas el ángulo muerto?
    options:
      - Mirando por encima del hombro izquierdo
      - Mirando por encima del hombro derecho
      - Girando todo el cuerpo para mirar hacia atrás
      - No hace falta si ya miraste los espejos
    answer: 0
    explain: Entras hacia la izquierda, así que revisas el dode hoek por encima del hombro izquierdo. Girar todo el cuerpo es un error, porque pierdes de vista lo que pasa delante.
    cites: ["cbr-rijprocedure:3.4"]

  - id: invoegen-hombro-cuando
    type: mc
    prompt: Vas por el invoegstrook, hay un auto frenando delante de ti y todavía no se ve ningún hueco en la calzada principal. ¿Cuándo miras por encima del hombro?
    options: ["Cuando aparece un hueco real, sin mirar mucho rato", "Ahora mismo y sin parar, hasta que aparezca el hueco de la calzada", "Nunca: con los espejos basta mientras no haya un hueco real", "Solo antes de empezar a acelerar, y ya no más durante el carril"]
    answer: 0
    explain: Mirar por encima del hombro no debe ser demasiado frecuente ni largo, porque no ves lo que pasa delante. Se hace cuando hay un hueco real.
    cites: ["cbr-rijprocedure:3.4"]

  - id: invoegen-vacia
    type: mc
    prompt: La autopista está vacía y tu invoegstrook es largo. ¿Qué haces?
    options: ["Usas la longitud necesaria del carril para mirar y acelerar bien", "Entras en cuanto empieza el carril, porque no molestas a nadie", "Esperas parado al inicio del carril hasta que pase algún auto"]
    answer: 0
    explain: El procedimiento pide usar el carril en la longitud necesaria incluso si la calzada está vacía, para poder mirar como se debe y subir la velocidad.
    cites: ["cbr-rijprocedure:3.4"]

  - id: invoegen-intermitente
    type: mc
    prompt: ¿Cuándo debes apagar el intermitente al incorporarte?
    options:
      - Apenas pones la rueda sobre la blokmarkering
      - Cuando todo el auto cruzó la blokmarkering
      - Al llegar al final del invoegstrook
      - Cuando ya alcanzaste la velocidad del tráfico
    answer: 1
    explain: El procedimiento recomienda apagarlo cuando todo el vehículo ya cruzó la blokmarkering.
    cites: ["cbr-rijprocedure:3.4"]

  - id: invoegen-forzar
    type: mc
    prompt: Hay mucho tráfico en la calzada principal y nadie te deja espacio. ¿Qué haces con el intermitente?
    options: ["Lo pones a tiempo para avisar, no para obligar a nadie", "Lo pones y entras de golpe, así los demás frenan y te hacen sitio enseguida", "No lo pones, para no molestar a quien viene por la calzada principal"]
    answer: 0
    explain: La ley obliga a señalizar al subir a la doorgaande rijbaan, pero el intermitente nunca es un medio para forzar. La obligación de ceder el paso sigue siendo tuya.
    cites: ["cbr-rijprocedure:3.4", "rvv:54", "rvv:55"]

  - id: invoegen-vluchtstrook
    type: mc
    prompt: El carril de incorporación se convierte en vluchtstrook. ¿Puedes seguir usándolo para incorporarte?
    options: ["Sí, porque sigue siendo el mismo carril de antes", "No, en principio no se usa para incorporarse", "Sí, pero solo con el intermitente puesto", "Sí, si no viene nadie por la calzada principal"]
    answer: 1
    explain: Si el carril pasa a vluchtstrook, en principio no se usa para la incorporación. La vluchtstrook solo se usa en emergencias.
    cites: ["cbr-rijprocedure:3.4", "rvv:43.3"]

  - id: invoegen-parar
    type: mc
    prompt: Tienes que parar en un invoegstrook corto por el tráfico de la calzada. ¿Dónde es preferible hacerlo?
    options: ["Al inicio del carril, para usar el resto en tomar velocidad", "Al final del carril, lo más cerca posible de la calzada principal", "En el centro del carril, con margen por los dos lados de tu auto", "En la calzada principal, para que te vean"]
    answer: 0
    explain: Si paras al final ya no puedes entrar a la velocidad correcta y esperas más tiempo un hueco. Parando al inicio te queda carril para acelerar.
    cites: ["cbr-rijprocedure:3.4"]

  - id: invoegen-segundo-carril
    type: mc
    prompt: Sales del invoegstrook a una calzada con dos carriles y el segundo está libre. ¿Cómo pasas?
    options:
      - Entras al carril derecho y, si lo necesitas, cambias después al segundo
      - Cruzas el carril derecho y entras directo al segundo en un solo movimiento
      - Esperas al final del carril para cruzar los dos carriles de golpe
    answer: 0
    explain: El procedimiento no permite pasar en un solo movimiento del carril de incorporación a un carril que no sea el más a la derecha.
    cites: ["cbr-rijprocedure:3.4"]

  - id: invoegen-ayudar
    type: mc
    prompt: Circulas por el carril derecho y te acercas a un invoegstrook donde un auto tiene espacio real para incorporarse. ¿Qué haces?
    options: ["Pasas al carril izquierdo si hay espacio, para no molestar a nadie", "No te mueves a la izquierda, porque ese auto puede incorporarse", "Aceleras para pasar delante de él antes de que se incorpore", "Frenas con fuerza para dejarle todo el sitio que necesita"]
    answer: 1
    explain: Si el tráfico del carril de incorporación tiene posibilidades reales de entrar, el procedimiento dice que no debes moverte a la izquierda. Acelerar o frenar con fuerza solo crea riesgo.
    cites: ["cbr-rijprocedure:3.2"]

  - id: invoegen-intermitente-sin-trafico
    type: mc
    prompt: La autopista está vacía y vas a pasar del invoegstrook a la doorgaande rijbaan. ¿Pones el intermitente?
    options: ["Sí, la ley lo exige al subir a la doorgaande rijbaan aunque esté vacía", "No, el intermitente es para avisar a otros usuarios y aquí no hay a quién avisar", "Solo si ves otro auto en el espejo o ya a la altura de tu carril"]
    answer: 0
    explain: El artículo 55 obliga a señalizar al subir a la doorgaande rijbaan sin condicionarlo a que haya otros usuarios cerca.
    cites: ["rvv:55"]

  - id: invoegen-vel-lenta
    type: mc
    prompt: Vas por el invoegstrook a 60 km/h y el tráfico de la calzada principal circula a unos 100 km/h. ¿Qué haces?
    options: ["Aceleras en el carril hasta casi igualar su velocidad antes de entrar", "Entras a 60 km/h, porque la ley dice que ellos deben dejarte pasar", "Entras a 60 km/h con el intermitente puesto, para que te vean", "Esperas parado al final del carril hasta que haya un hueco"]
    answer: 0
    explain: Quien se incorpora cede, y eso incluye no meter en apuros al tráfico de la calzada. Por eso el carril sirve para igualar la velocidad. Entrar con una velocidad muy distinta puede considerarse una falta grave en el examen práctico.
    cites: ["cbr-rijprocedure:3.4", "rvv:54"]

  - id: invoegen-file-lenta
    type: mc
    prompt: En la calzada principal hay una fila casi parada y estás al inicio del invoegstrook. ¿Cómo consigues espacio?
    options: ["Con contacto visual y el intermitente, desde el inicio del carril", "Tocando la bocina un par de veces para que te dejen pasar", "Avanzando hasta el final del carril y entrando en el primer hueco"]
    answer: 0
    explain: En una fila parada o muy lenta, el procedimiento pide "pedir" la oportunidad al inicio del carril con contacto visual y el intermitente. Ir hasta el final te deja sin espacio para entrar a la velocidad correcta.
    cites: ["cbr-rijprocedure:3.4"]

  - id: invoegen-ayudar-pesados
    type: mc
    prompt: Circulas por el carril derecho y en el invoegstrook ves un camión cargado que no consigue tomar velocidad, con la calzada muy ocupada. Según el procedimiento del CBR, ¿qué haces?
    options: ["Ajustas tu velocidad o pasas a la izquierda para ayudarle", "Mantienes carril y velocidad, porque legalmente quien entra es quien debe ceder", "Aceleras para pasar antes de que el camión llegue a la blokmarkering"]
    answer: 0
    explain: Legalmente cede quien se incorpora, pero el procedimiento del CBR pide ayudar cuando hay vehículos pesados que no logran tomar velocidad o varios conductores que no consiguen entrar.
    cites: ["cbr-rijprocedure:3.2", "rvv:54"]

  - id: invoegen-despues-adelantar
    type: mc
    prompt: Acabas de adelantar a un camión por el carril izquierdo y llegas a la altura de un invoegstrook con autos que se incorporan. ¿Vuelves ya al carril derecho?
    options: ["No, sigues por el carril izquierdo mientras haya tráfico incorporándose", "Sí, vuelves ya, porque la regla general es circular por el carril de la derecha", "Sí, si pones el intermitente derecho a tiempo y miras antes"]
    answer: 0
    explain: Tras adelantar, el procedimiento pide no pasar al carril más a la derecha a la altura de un invoegstrook con tráfico incorporándose. El intermitente no cambia eso.
    cites: ["cbr-rijprocedure:3.5"]
