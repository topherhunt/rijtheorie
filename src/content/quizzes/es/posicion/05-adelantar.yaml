questions:
  - id: adelantar-izquierda
    type: mc
    prompt: Vas detrás de un auto lento en una calle de doble sentido sin carriles marcados. A su derecha hay espacio de sobra y a su izquierda también. ¿Por dónde lo adelantas?
    options: ["Por la izquierda", "Por la derecha, porque así no invado el carril contrario", "Por el lado que tenga más espacio", "Por el lado del conductor más lento"]
    answer: 0
    explain: El art. 11 lid 1 dice que se adelanta por la izquierda. Las excepciones son concretas (se ven en la lección siguiente) y no incluyen "porque hay más sitio a la derecha".
    cites: ["rvv:11.1"]

  - id: adelantar-criterios
    type: multi
    prompt: Estás pensando en adelantar. ¿Qué debes valorar antes según la Rijprocedure B?
    options: [La visibilidad de la vía, El espacio disponible por el otro tráfico, Si puedes coger velocidad para que la maniobra sea corta, Que llevas prisa y el trayecto se alarga]
    answer: [0, 1, 2]
    explain: Los criterios incluyen la calzada, la posibilidad de coger velocidad, la visibilidad, el espacio disponible y la velocidad de quien adelantas. La prisa no es un criterio; no hace posible un adelantamiento que no lo es.
    cites: ["cbr-rijprocedure:3.5"]

  - id: adelantar-f1-bici
    type: yesno
    prompt: Ves la señal F1 y delante de ti va un ciclomotor (bromfiets). ¿La señal te prohíbe adelantarlo?
    answer: false
    explain: La F1 prohíbe adelantarse entre vehículos de motor. En el RVV, los vehículos de motor no incluyen los bromfietsen.
    cites: ["rvv:bijlage1.F1", "rvv:1"]
    sign: F1

  - id: adelantar-f3-quien
    type: mc
    prompt: Conduces un auto y ves la señal F3 mientras alcanzas a un camión. ¿Qué te prohíbe la señal?
    sign: F3
    options: ["Nada, la F3 prohíbe a los camiones adelantar vehículos de motor", "Adelantar al camión, igual que la F1", "Adelantar a cualquier vehículo de motor", "Adelantar a un camión con remolque"]
    answer: 0
    explain: La F3 prohíbe a los vrachtauto's adelantar vehículos de motor. Tú, con un auto, puedes adelantar a un camión; la F1 sí te lo prohibiría.
    cites: ["rvv:bijlage1.F3"]

  - id: adelantar-lugares
    type: multi
    prompt: Conduces un auto. ¿En cuáles de estas situaciones evitas adelantar según la Rijprocedure B?
    options: [Te acercas a un cruce sin semáforos entre dos vías iguales y ves poco, Entras en una curva sin visibilidad en una calzada de doble sentido sin carriles marcados, Te acercas a un paso a nivel con solo luces intermitentes, Estás en una vía recta con buena visibilidad y nadie de frente]
    answer: [0, 1, 2]
    explain: La Rijprocedure B cita cruces sin visibilidad sin semáforos, curvas y pendientes sin visibilidad (salvo carriles marcados sin invadir el contrario) y pasos a nivel solo con luces intermitentes. En una vía recta y despejada el adelantamiento puede ser posible.
    cites: ["cbr-rijprocedure:3.5"]

  - id: adelantar-por-que-paso-cebra
    type: mc
    prompt: Detrás de un autobús lento ves delante un paso de peatones sin semáforo. Hay hueco libre a la izquierda. ¿Por qué no puedes adelantar justo antes del paso?
    options: ["El autobús te tapa a un peatón que podría estar cruzando, y adelantar justo antes del paso está prohibido", "Adelantar a un autobús lento está prohibido porque frena mucho al volver", "Antes de un paso de peatones solo se adelanta a menos de 30 km/h", "Ahí solo se puede adelantar por la derecha"]
    answer: 0
    explain: 'El art. 12 RVV prohíbe adelantar vlak voor o sobre un paso de peatones. El motivo práctico (CBR) es la poca visibilidad: el vehículo adelantado te tapa al peatón.'
    cites: ["rvv:12", "cbr-rijprocedure:3.5"]

  - id: adelantar-curva-ciega
    type: mc
    prompt: Conduces un auto por una calzada de doble sentido sin carriles marcados. Delante de una curva sin visibilidad va un auto lento. ¿Qué haces?
    options: [Espero y no adelanto en la curva, Adelanto si no veo nada venir, Adelanto tocando la bocina para avisar, Adelanto rápido para que sea corto]
    answer: 0
    explain: Los vehículos de más de dos ruedas no se adelantan en curvas sin visibilidad, salvo que la calzada tenga carriles y no entres en el carril de los que vienen de frente. Aquí no hay carriles, así que no adelantas.
    cites: ["cbr-rijprocedure:3.5"]

  - id: adelantar-avisar
    type: yesno
    prompt: Vas a adelantar un auto que va despacio por una calle ancha y hay mucho espacio. Piensas que el movimiento lateral es pequeño y que no hace falta el intermitente. ¿Es correcto?
    answer: false
    explain: Al adelantar un vehículo de motor siempre se avisa (art. 55 y Rijprocedure B). El criterio de "movimiento lateral importante" se aplica al adelantar a un ciclista o pasar un obstáculo, no a otro vehículo de motor. Avisa también antes de volver a tu carril.
    cites: ["rvv:55", "cbr-rijprocedure:3.5"]

  - id: adelantar-volver
    type: mc
    prompt: Acabas de adelantar un camión. ¿Cuándo vuelves a tu carril?
    options: [Cuando veas toda la parte delantera del camión en el retrovisor interior, En cuanto lo pases, En cuanto el camión se haga a un lado, Cuando el camión te dé las luces]
    answer: 0
    explain: Solo cuando la parte delantera entera del vehículo adelantado se ve en el retrovisor interior, para no estorbar su paso normal. Volver en cuanto lo pasas lo obliga a frenar.
    cites: ["cbr-rijprocedure:3.5"]

  - id: adelantar-ceder
    type: mc
    prompt: Adelantas a un tractor en un camino rural y, para hacerlo, entras en la parte de la vía por donde viene un auto de frente. ¿Qué haces?
    options: [Dejo pasar al auto de frente, Sigo porque ya empecé el adelantamiento, Toco la bocina y acelero, Obligo al tractor a frenar para tener sitio]
    answer: 0
    explain: Si al adelantar entras en la parte de la vía de otro tráfico, deja pasar a ese tráfico, y también a quien tú mismo adelantas. Haber empezado no te da preferencia.
    cites: ["cbr-rijprocedure:3.5"]

  - id: adelantar-poca-vision
    type: mc
    prompt: Vas por una autopista y quieres adelantar a un camión cuyo conductor casi no ve hacia atrás. ¿Qué haces?
    options: [Salgo con tiempo de mi carril y busco contacto visual por los espejos, Acelero por sorpresa para pasar rápido, Me quedo pegado a su parte trasera para que me vea, Toco la bocina sin parar]
    answer: 0
    explain: 'Hay que asegurarse de que el conductor te vea: salir antes del carril en autopistas, dejar más distancia en vías de doble sentido y buscar contacto visual por los espejos. Pegarte atrás es lo peor: sigues en su zona ciega.'
    cites: ["cbr-rijprocedure:3.5"]

  - id: adelantar-ciclista
    type: mc
    prompt: Adelantas a una persona mayor en bicicleta por una calle con poco espacio lateral. ¿Qué haces con la velocidad?
    options: ["La adapto al espacio: cuanto menos sitio, menos diferencia con la suya", "Paso rápido para acabar cuanto antes", "Paso a la velocidad que llevaba", "Freno de golpe a su lado"]
    answer: 0
    explain: Cuanto menos espacio lateral, menor debe ser la diferencia de velocidad, sobre todo con ciclistas mayores, niños o personas con discapacidad. Pasar rápido con poco espacio asusta y desestabiliza.
    cites: ["cbr-rijprocedure:3.5"]

  - id: adelantar-coche-estacionado
    type: mc
    prompt: Hay un auto estacionado en tu lado de la calzada y no viene nadie de frente. ¿Cómo lo pasas?
    options: [Lo paso (voorbijgaan) en línea suave y vuelvo a la derecha después, Lo adelanto con el intermitente puesto hasta el final, Lo paso lo más pegado posible, Me detengo y espero a que se vaya]
    answer: 0
    explain: 'Un obstáculo no se adelanta, se pasa (voorbijgaan): esquivas en línea suave y vuelves a la derecha cuando lo has pasado. Pegarte no es buena idea, porque conviene dejar al menos el ancho de una puerta.'
    cites: ["cbr-rijprocedure:3.5"]

  - id: adelantar-puerta-sin-espacio
    type: mc
    prompt: Al pasar junto a un obstáculo no puedes dejar el ancho de una puerta de separación. ¿Qué haces?
    options: [Reduzco aún más la velocidad, Mantengo la velocidad para pasar rápido, Toco la bocina al pasar, Acelero para acabar antes]
    answer: 0
    explain: Si no puedes dejar la separación de una portierbreedte, reduces todavía más la velocidad. Pasar rápido con poco espacio es lo contrario.
    cites: ["cbr-rijprocedure:3.5"]
