questions:
  - id: atascos-no-cerrar
    type: mc
    prompt: Se forma una fila y ves que un auto del carril de al lado quiere ocupar el hueco que hay delante de ti. ¿Qué haces?
    options: [Lo dejo entrar sin acelerar para cerrar el hueco, Acelero de golpe para cerrar el hueco antes que él, Acorto la distancia con el de delante para que no quepa, Toco la bocina para que se quede donde está]
    answer: 0
    explain: La Rijprocedure B pide no acelerar de forma llamativa para cerrar un hueco que otro conductor quería usar; es una conducta social que irrita y puede provocar un roce.
    cites: ["cbr-rijprocedure:2"]

  - id: atascos-luces
    type: mc
    prompt: Circulas por una autopista y, detrás de una curva, ves una cola parada y tienes que frenar fuerte. ¿Qué haces con las luces para los que vienen detrás?
    options: ["Pongo las luces de emergencia", "Pongo el intermitente derecho", "Pongo las luces largas", "No hago nada: las luces de freno bastan"]
    answer: 0
    explain: La Rijprocedure B pide las luces de emergencia (waarschuwingslichten) para avisar a los de atrás si debes reducir o parar de repente, sobre todo cuando se forma una fila o paras en un lugar con poca visibilidad.
    cites: ["cbr-rijprocedure:2"]

  - id: atascos-cruce
    type: yesno
    prompt: La fila avanza a tirones. Estás a punto de entrar a un cruce sin semáforo y delante del cruce hay sitio solo para la mitad de tu auto. ¿Entras para no perder tu turno?
    answer: false
    explain: Los conductores no pueden bloquear un cruce (art. 14). Esperas antes de entrar, aunque otro se cuele delante.
    cites: ["rvv:14"]

  - id: atascos-cruce-semaforo-verde
    type: yesno
    prompt: Tienes semáforo en verde, pero la fila de delante está parada y al otro lado del cruce no hay sitio para tu auto. ¿Entras al cruce?
    answer: false
    explain: Los conductores no pueden bloquear un cruce. El verde te da paso, pero no te autoriza a quedarte parado en medio del cruce, y menos si bloqueas el tráfico transversal.
    cites: ["rvv:14", "cbr-rijprocedure:2"]

  - id: atascos-cremallera
    type: mc
    prompt: En un estrechamiento de la calzada los autos del otro carril quieren entrar delante de ti. ¿Qué pide la Rijprocedure B?
    options: ["Dejarles espacio, uno a uno (ritsen)", "Cerrarles el paso para ir primero", "Acelerar para que no se cuelen", "Pararme en medio hasta que pasen todos"]
    answer: 0
    explain: En un estrechamiento se deja espacio a los demás, intercalándose uno a uno. Cerrar el paso bloquea a todos.
    cites: ["cbr-rijprocedure:2", "cbr-rijprocedure:3.2"]

  - id: atascos-ritsen-carril-termina
    type: mc
    prompt: Dos carriles se juntan en uno; el tuyo sigue y el otro termina. Hay cola. Un auto del otro carril quiere entrar delante de ti. ¿Qué pide la Rijprocedure B?
    options: ["Dejo pasar uno por uno, alternando, sin cerrarle el paso", "Acorto la distancia con el de delante para que no entre", "Le toco la bocina para que espere detrás de todos", "Me paso yo al otro carril"]
    answer: 0
    explain: 'Por ley quien cambia de carril cede (art. 54), pero la Rijprocedure B pide ritsen: dejar entrar de uno en uno. Cerrar el paso bloquea a todos y no es comportamiento social.'
    cites: ["cbr-rijprocedure:2", "rvv:54"]

  - id: atascos-ritsen-ayuda
    type: mc
    prompt: Circulas por la calzada principal de una autosnelweg y ves en el carril de incorporación un camión que no logra coger velocidad. ¿Qué haces si puedes?
    options: [Ajusto mi velocidad o me muevo a la izquierda para dejarle sitio, Acelero para que no entre, Freno de golpe en mi carril, Toco la bocina para que se detenga]
    answer: 0
    explain: La Rijprocedure B pide ayudar a incorporarse al tráfico pesado que no coge velocidad, ajustando tu velocidad o moviéndote a la izquierda. La obligación legal de ceder sigue siendo de quien se incorpora.
    cites: ["cbr-rijprocedure:2", "cbr-rijprocedure:3.2"]
