questions:
  - id: derecha-giro-izquierda
    type: mc
    prompt: Delante de ti un auto está preseleccionado a la izquierda con el intermitente izquierdo, para girar. ¿Cómo lo pasas?
    options: [Por la derecha, Por la izquierda, Esperando detrás hasta que gire, Tocando la bocina para que se aparte]
    answer: 0
    explain: Quien ha preseleccionado a la izquierda e indica que girará a la izquierda se adelanta por la derecha (art. 11 lid 2). Pasar por la izquierda lo haría invadir el carril contrario.
    cites: ["rvv:11.2"]

  - id: derecha-giro-sin-senal
    type: yesno
    prompt: El auto de delante va pegado a la izquierda de su carril, pero no ha puesto ningún intermitente. No sabes si va a girar. ¿Puedes pasarlo por la derecha?
    answer: false
    explain: La excepción del art. 11 lid 2 exige las dos cosas, haber preseleccionado a la izquierda e indicado que se girará a la izquierda. Sin la señal vale la regla general, que se adelanta por la izquierda.
    cites: ["rvv:11.1", "rvv:11.2"]

  - id: derecha-recto-lento
    type: yesno
    prompt: Un auto lento va delante de ti por la calzada, sin indicar ningún giro, y a su derecha hay espacio de sobra. No hay fila, línea de bloques ni rotonda. ¿Puedes adelantarlo por la derecha?
    answer: false
    explain: El art. 11 lid 1 dice que se adelanta por la izquierda. Que haya espacio a la derecha o que el otro vaya lento no es ninguna de las excepciones del art. 11 (preselección con señal, ciclistas, línea de bloques, tranvías) ni del 13 y 48 (filas, rotondas).
    cites: ["rvv:11.1", "rvv:11.2"]

  - id: derecha-bloques
    type: mc
    prompt: Circulas en un tramo con una línea de bloques que separa dos carriles. Tú vas a la derecha de la línea y otro auto va a la izquierda de ella, más despacio. ¿Puedes pasarlo por la derecha?
    options: ["Sí, quien está a la derecha de una blokmarkering puede adelantar por la derecha", "Solo si hay atasco", "No, tengo que pasar al otro lado de la línea para adelantar", "Solo con permiso del otro conductor"]
    answer: 0
    explain: Quien está a la derecha de una blokmarkering puede adelantar por la derecha a quien está a su izquierda (art. 11 lid 4). No hace falta cruzar la línea ni que haya atasco.
    cites: ["rvv:11.4"]

  - id: derecha-fila
    type: mc
    prompt: En un atasco el carril izquierdo avanza muy despacio y tu carril derecho avanza algo más rápido. Pasas junto a la fila del carril izquierdo. ¿Es legal?
    options: ["Sí, las filas pueden adelantarse por la derecha", "No, hay que esperar a que la fila se mueva", "Solo si pongo el intermitente derecho", "Solo si el otro carril está del todo parado"]
    answer: 0
    explain: El art. 13 lid 2 permite adelantar las filas por la derecha. Ni el intermitente ni que la fila esté parada del todo son condiciones de esa regla.
    cites: ["rvv:13.2"]

  - id: derecha-rotonda
    type: yesno
    prompt: Circulas por una rotonda de dos carriles. Un auto va despacio en el carril de tu izquierda y tú vas por el exterior. ¿Es legal pasarlo por la derecha?
    answer: true
    explain: En o justo antes de una rotonda está permitido adelantar por la derecha (art. 48). Esto solo habla de adelantar, no de quién tiene prioridad al entrar.
    cites: ["rvv:48"]

  - id: derecha-lentos
    type: yesno
    prompt: Estás en un carril de preselección (voorsorteerstrook) y en el otro carril hay vehículos parados o lentos. Según la Rijprocedure B, ¿puedes adelantarlos por la derecha?
    answer: true
    explain: La Rijprocedure B lo indica así para los carriles de preselección. Es procedimiento del examen, no una excepción escrita en el art. 11.
    cites: ["cbr-rijprocedure:3.3"]

  - id: derecha-ciclistas-entre-si
    type: mc
    prompt: Un ciclista quiere adelantar a otro ciclista que va más lento. ¿Por dónde lo hace?
    options: [Por la izquierda, Por la derecha, Por cualquiera de los dos lados, No puede adelantarlo]
    answer: 0
    explain: Los ciclistas deben adelantarse entre sí por la izquierda. Solo pueden adelantar por la derecha a otros conductores (art. 11 lid 3).
    cites: ["rvv:11.3"]

  - id: derecha-cuales
    type: multi
    prompt: Conduces un auto. ¿A cuáles de estos puedes adelantar por la derecha, sin que se aplique otra excepción?
    options: [Un tranvía, Un autobús de línea que circula por la calzada, Un auto que ha preseleccionado a la izquierda e indicado giro a la izquierda, Un ciclista que circula despacio por la calzada]
    answer: [0, 2]
    explain: 'Los tranvías (art. 11 lid 5) y quien ha preseleccionado a la izquierda e indicado que girará a la izquierda (lid 2) se adelantan por la derecha. El permiso del lid 3 es de los ciclistas: un auto adelanta a ciclistas y a autobuses por la izquierda (lid 1).'
    cites: ["rvv:11.1", "rvv:11.2", "rvv:11.3", "rvv:11.5"]

  - id: derecha-auto-sobre-ciclista
    type: yesno
    prompt: Conduces un auto y delante va un ciclista despacio por la calzada, con mucho espacio libre a tu derecha. ¿Puedes adelantarlo por la derecha?
    answer: false
    explain: Los ciclistas pueden adelantar a otros conductores por la derecha, pero no al revés, y un auto adelanta por la izquierda.
    cites: ["rvv:11.1", "rvv:11.3"]

  - id: derecha-atencion
    type: multi
    prompt: Adelantas por la derecha. ¿A quién debes prestar atención extra según la Rijprocedure B?
    options: [A conductores que cambian de carril hacia la derecha, A conductores que quieren entrar al carril de salida, A conductores que ya adelantaste por la izquierda y todavía quieren salir, A conductores que vienen de frente por el carril contrario]
    answer: [0, 1, 2]
    explain: Los tres primeros casos están en la Rijprocedure B. El tráfico de frente no es el riesgo específico de adelantar por la derecha.
    cites: ["cbr-rijprocedure:3.5"]

  - id: derecha-incorporacion
    type: mc
    prompt: Acabas de adelantar por la izquierda y llegas a la altura de un carril de incorporación por el que entran vehículos. ¿Qué haces?
    options: [No paso al carril de más a la derecha en ese punto, Paso enseguida al carril más a la derecha, Acelero para pasar antes de que entren, Freno de golpe para dejarlos entrar]
    answer: 0
    explain: Después de adelantar no hay que ir al carril más a la derecha a la altura de un carril de incorporación con tráfico entrando, porque chocarías con quien se incorpora.
    cites: ["cbr-rijprocedure:3.5"]
