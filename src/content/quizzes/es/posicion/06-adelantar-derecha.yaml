questions:
  - id: derecha-giro-izquierda
    type: mc
    prompt: "Delante de ti un auto está preseleccionado a la izquierda con el intermitente izquierdo, para girar. ¿Cómo lo pasas?"
    options: [Por la derecha, Por la izquierda, Esperando detrás hasta que gire, Tocando la bocina]
    answer: 0
    explain: "Quien preselecciona a la izquierda e indica que girará a la izquierda se adelanta por la derecha."
    cites: ["rvv:11.2"]

  - id: derecha-ciclistas-entre-si
    type: mc
    prompt: "Un ciclista quiere adelantar a otro ciclista. ¿Por dónde?"
    options: [Por la izquierda, Por la derecha, Por cualquiera de los dos, No puede]
    answer: 0
    explain: "Los ciclistas deben adelantarse entre sí por la izquierda."
    cites: ["rvv:11.3"]

  - id: derecha-bloques
    type: mc
    prompt: "Estás a la derecha de una línea de bloques y otro auto está a la izquierda. ¿Puedes adelantarlo por la derecha?"
    options: [Sí, Solo si hay atasco, No, Solo con permiso del otro]
    answer: 0
    explain: "Quien está a la derecha de una blokmarkering puede adelantar por la derecha a quien está a su izquierda."
    cites: ["rvv:11.4"]

  - id: derecha-fila
    type: yesno
    prompt: "Hay una fila de autos en el carril izquierdo y tu carril avanza. ¿Puedes adelantar la fila por la derecha?"
    answer: true
    explain: "Las filas pueden adelantarse por la derecha."
    cites: ["rvv:13.2"]

  - id: derecha-rotonda
    type: yesno
    prompt: "Justo antes de una rotonda, ¿puedes adelantar por la derecha?"
    answer: true
    explain: "En o justo antes de una rotonda está permitido adelantar por la derecha."
    cites: ["rvv:48"]

  - id: derecha-lentos
    type: yesno
    prompt: "Estás en un carril de preselección (voorsorteerstrook). En otro carril hay vehículos parados o lentos. ¿Puedes adelantarlos por la derecha?"
    answer: true
    explain: "La Rijprocedure B lo indica así para los carriles de preselección: los vehículos parados o lentos en otro carril se pueden adelantar por la derecha."
    cites: ["cbr-rijprocedure:3.3"]

  - id: derecha-atencion
    type: multi
    prompt: "Al adelantar por la derecha, ¿a quién debes prestar atención extra según la Rijprocedure B?"
    options: [A conductores que cambian de carril hacia la derecha, A conductores que quieren entrar al carril de salida, A conductores que ya adelantaste por la izquierda y todavía quieren salir, A los peatones en la acera de enfrente]
    answer: [0, 1, 2]
    explain: "Los tres casos están en la Rijprocedure B. Los peatones de la acera de enfrente no se citan."
    cites: ["cbr-rijprocedure:3.5"]

  - id: derecha-incorporacion
    type: mc
    prompt: "Acabas de adelantar. A la altura de un carril de incorporación con vehículos entrando, ¿qué haces?"
    options: [No paso al carril de más a la derecha, Paso al carril más a la derecha, Freno de golpe, Cambio de carril sin avisar]
    answer: 0
    explain: "Después de adelantar no hay que ir al carril más a la derecha a la altura de un carril de incorporación con tráfico entrando."
    cites: ["cbr-rijprocedure:3.5"]

  - id: derecha-giro-sin-senal
    type: yesno
    prompt: "El auto de delante va pegado a la izquierda de su carril, pero no ha puesto ningún intermitente. No sabes si va a girar. ¿Puedes pasarlo por la derecha?"
    answer: false
    explain: "La excepción del art. 11 lid 2 exige las dos cosas: haber preseleccionado a la izquierda e indicado que se girará a la izquierda. Sin la señal vale la regla general: se adelanta por la izquierda."
    cites: ["rvv:11.1", "rvv:11.2"]

  - id: derecha-recto-lento
    type: yesno
    prompt: "Un auto lento va delante de ti por la calzada, sin indicar ningún giro, y a su derecha hay espacio de sobra. No hay fila, línea de bloques ni rotonda. ¿Puedes adelantarlo por la derecha?"
    answer: false
    explain: "Se adelanta por la izquierda. Que haya espacio a la derecha o que el otro vaya lento no es ninguna de las excepciones del art. 11 (preselección con señal, ciclistas, línea de bloques, tranvías) ni del 13 y 48 (filas, rotondas)."
    cites: ["rvv:11.1", "rvv:11.2"]

  - id: derecha-cuales
    type: multi
    prompt: "Conduces un auto. ¿A cuáles de estos puedes adelantar por la derecha, sin que se aplique otra excepción?"
    options: [Un tranvía, Un autobús de línea que circula por la calzada, Un auto que ha preseleccionado a la izquierda e indicado giro a la izquierda, Un ciclista que circula despacio por la calzada]
    answer: [0, 2]
    explain: "Los tranvías (art. 11 lid 5) y quien ha preseleccionado a la izquierda e indicado que girará a la izquierda (lid 2) se adelantan por la derecha. El permiso del lid 3 es de los ciclistas: un auto adelanta a ciclistas y a autobuses por la izquierda (lid 1)."
    cites: ["rvv:11.1", "rvv:11.2", "rvv:11.3", "rvv:11.5"]

  - id: derecha-auto-sobre-ciclista
    type: yesno
    prompt: "Conduces un auto y delante va un ciclista despacio por la calzada, con mucho espacio libre a tu derecha. ¿Puedes adelantarlo por la derecha?"
    answer: false
    explain: "Los ciclistas pueden adelantar a otros conductores por la derecha, pero no al revés: un auto adelanta por la izquierda."
    cites: ["rvv:11.1", "rvv:11.3"]
