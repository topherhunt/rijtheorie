questions:
  - id: rechts-houden-centro-carril
    type: mc
    prompt: Circulas por un carril de ancho normal, sin tráfico delante ni detrás. ¿Dónde esperan los examinadores que te coloques según la Rijprocedure B?
    options: ["Pegado a la línea derecha para dejar sitio", "En el centro del carril, sin tocar ninguna línea", "Pegado a la línea izquierda para ver mejor", "Sobre la línea que separa los carriles"]
    answer: 1
    explain: Según la Rijprocedure B, en un carril de ancho normal se circula por el centro del carril. "Lo más a la derecha posible" no significa pegado a la línea. Es un procedimiento del examen, no un artículo de ley.
    cites: ["cbr-rijprocedure:3.2"]

  - id: rechts-houden-distancia-estacionados
    type: mc
    prompt: Pasas junto a una fila continua de autos estacionados a tu derecha. ¿Qué margen lateral te piden según la Rijprocedure B?
    options: ["Pegarte lo más posible a los autos", "Como mínimo el ancho de una puerta, por si se abre", "Unos diez centímetros bastan si vas despacio", "El margen que quede sin invadir la línea central"]
    answer: 1
    explain: Se mantiene una distancia segura equivalente al ancho de una puerta (portierbreedte), por si alguien abre la puerta. Pegarte a los autos parece cortés, pero no deja margen.
    cites: ["cbr-rijprocedure:3.2"]

  - id: rechts-houden-huecos-recto
    type: yesno
    prompt: A tu derecha hay autos estacionados a trechos. Pasando de largo por la línea recta no invadirías la mitad de la calzada del tráfico que viene de frente. ¿Puedes seguir por la línea recta sin meterte en cada hueco?
    answer: true
    explain: Sí. La Rijprocedure B dice que no te metas en cada hueco si no hacerlo no te obliga a ocupar la mitad de la calzada del tráfico contrario. Ir y venir de hueco en hueco no es "rechts houden" mejor, solo es una conducción inquieta.
    cites: ["cbr-rijprocedure:3.2"]

  - id: rechts-houden-bici-ancha
    type: mc
    prompt: En una calle ancha vas detrás de dos ciclistas en la calzada y hay sitio de sobra. ¿Qué te pide la Rijprocedure B?
    options: ["Pegarte a la derecha cada vez que ellos se desvían un poco", "Mantener una línea recta, sin crear un tráfico agitado", "Adelantarlos por la derecha para no cruzar la línea central", "Avisar con la bocina para que se aparten de tu camino"]
    answer: 1
    explain: En una calle ancha no hace falta ir y venir entre los ciclistas si eso crea un tráfico agitado; se mantiene una línea recta. Adelantar por la derecha no es lo normal (el adelantamiento se hace por la izquierda) y la bocina no tiene motivo.
    cites: ["cbr-rijprocedure:3.2", "rvv:11.1"]

  - id: rechts-houden-fietspad-atasco
    type: mc
    prompt: Hay una cola larga en la calzada y, al lado, un fietspad completamente libre. ¿Qué haces con tu auto?
    options: ["Sigues en la calzada con el resto de la cola", "Pasas por el fietspad hasta el cruce", "Usas el fietspad si vas a menos de 25 km/h", "Usas el fietspad con luces de emergencia"]
    answer: 0
    explain: Un auto usa la rijbaan. El fietspad no es parte de la calzada y la ley no da ninguna excepción por atasco, velocidad o luces.
    cites: ["rvv:10.1"]

  - id: rechts-houden-ciclistas-paralelo
    type: mc
    prompt: En una calle sin carril bici, dos ciclistas van uno al lado del otro y no te dejan pasar de inmediato. ¿Qué haces?
    options: ["Tocas la bocina para que se pongan en fila india", "Esperas y adelantas por la izquierda cuando sea seguro", "Los adelantas por la derecha entre ellos y el borde", "Los adelantas ya por la izquierda, aunque veas poco"]
    answer: 1
    explain: Los ciclistas pueden ir de dos en dos (rvv art. 3 lid 2), así que no infringen nada. Se adelanta por la izquierda (rvv art. 11) y solo cuando sea seguro; la bocina y la prisa no cambian eso.
    cites: ["rvv:3.2", "rvv:11.1"]

  - id: rechts-houden-snorfiets
    type: yesno
    prompt: Dos conductores de snorfiets (ciclomotor lento, 25 km/h) van uno al lado del otro por la calzada. ¿Es legal?
    answer: false
    explain: El permiso de ir de a dos en paralelo vale para ciclistas, no para los conductores de snorfiets.
    cites: ["rvv:3.2"]

  - id: rechts-houden-curva-sin-vista
    type: mc
    prompt: Entras en una curva a la izquierda sin ver lo que viene. Hay tráfico poco frecuente, así que te vas hacia el centro de la calzada para trazarla más suave. ¿Qué has hecho mal?
    options: ["Nada, con poco tráfico se puede trazar por el centro", "No ir lo bastante a la derecha sin visibilidad", "Invadir la berma sin avisar a quien viene detrás", "Ir demasiado rápido para una curva a la izquierda"]
    answer: 1
    explain: La regla es rechts houden (rvv art. 3 lid 1). Sin visibilidad, la ley (wvw art. 5a) cita como conducta grave "onvoldoende rechts houden op onoverzichtelijke plaatsen" si se hace a propósito y pone a otro en peligro de muerte o lesión grave.
    cites: ["rvv:3.1", "wvw:5a"]
