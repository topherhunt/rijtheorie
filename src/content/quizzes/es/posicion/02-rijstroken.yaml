questions:
  - id: rijstroken-carril-defecto
    type: mc
    prompt: La calzada tiene tres carriles en tu sentido y no hay atasco ni vas a adelantar. ¿Qué carril sigues en principio según la Rijprocedure B?
    options: [El del medio para tener salida a ambos lados, El carril derecho, El carril izquierdo porque vas rápido, Cualquiera según tu velocidad]
    answer: 1
    explain: La Rijprocedure B dice que, si la calzada está dividida en carriles, se sigue en principio el carril derecho (también si hay un carril de hora punta abierto). Ir en el del medio "por si acaso" bloquea a quien quiere pasar.
    cites: ["cbr-rijprocedure:3.2", "rvv:3.1"]

  - id: rijstroken-niebla
    type: mc
    prompt: Conduces por una autopista de tres carriles con niebla densa y lluvia fuerte. ¿Qué carril es mejor según la Rijprocedure B?
    options: ["El izquierdo, para adelantar rápido y salir de la niebla", "El del medio, para estar lejos de los bordes", "El derecho, por la posibilidad de escape", "El que lleve más tráfico, para ir acompañado"]
    answer: 2
    explain: Con niebla, nieve, lluvia fuerte, oscuridad o agua que salpica se usa lo más posible el carril derecho, porque ofrece una posibilidad de escape.
    cites: ["cbr-rijprocedure:3.2"]

  - id: rijstroken-weefvak
    type: mc
    prompt: Tu calzada se divide con una línea de bloques y señales de dirección sobre los carriles. Quieres seguir recto. ¿Qué carril sigues en principio?
    options: [El carril más a la izquierda, El carril más a la derecha de la dirección que sigues, El carril del medio, Cualquiera pisando la línea de bloques]
    answer: 1
    explain: En un weefvak se sigue en principio el carril más a la derecha de la dirección que vas a seguir. No se circula por la línea de bloques.
    cites: ["cbr-rijprocedure:3.2"]

  - id: rijstroken-atasco-excepcion
    type: yesno
    prompt: Hay atasco y la calzada tiene dos carriles en tu sentido. El carril izquierdo avanza un poco más rápido que el derecho. ¿Estás obligado a quedarte en el carril más a la derecha?
    answer: false
    explain: En fileverkeer no es obligatorio seguir el carril más a la derecha, siempre que haya carriles del mismo sentido.
    cites: ["rvv:13.1"]

  - id: rijstroken-camion
    type: mc
    prompt: Conduces un camión por una autosnelweg con tres carriles en tu sentido. No vas a cambiar de dirección. ¿Qué carriles puedes usar?
    options: [Los tres, Solo los dos de la derecha, Solo el de la derecha, Solo el de la izquierda]
    answer: 1
    explain: En una autosnelweg con tres o más carriles, los camiones solo pueden usar los dos más a la derecha, salvo que deban preseleccionar.
    cites: ["rvv:43.4"]

  - id: rijstroken-remolque
    type: yesno
    prompt: Conduces un auto con un remolque. El conjunto mide más de 7 metros. En una autosnelweg de tres carriles, ¿puedes usar el carril izquierdo?
    answer: false
    explain: La prohibición del art. 43.4 afecta también a los conjuntos de vehículos con una longitud total de más de 7 metros, no solo a los camiones.
    cites: ["rvv:43.4"]

  - id: rijstroken-camion-giro-izquierda
    type: mc
    prompt: Conduces un camión por el carril central de una autosnelweg de tres carriles. En 500 metros tu salida está a la izquierda. ¿Qué haces?
    options: [Sigues en el carril central hasta pasar la salida, Pasas al carril izquierdo porque tienes que preseleccionar, Pasas al carril izquierdo solo si no hay coches, Tomas la salida desde el carril derecho]
    answer: 1
    explain: La prohibición de usar el carril izquierdo no vale cuando tienes que preseleccionar (voorsorteren). Salir a la izquierda es preseleccionar; la salida desde otro carril no es posible sin cruzar el tráfico.
    cites: ["rvv:43.4"]

  - id: rijstroken-luces-usar
    type: multi
    prompt: Conduces un coche. ¿En cuáles de estos carriles puedes circular?
    options: [Un carril con flecha verde encima, Un carril con cruz roja encima, Un carril con una velocidad máxima de la señal A3 encima, Un carril con la palabra BUS iluminada]
    answer: [0, 2]
    explain: La flecha verde o la velocidad máxima de la señal A3 significan que el carril puede usarse. La cruz roja lo prohíbe, y con BUS iluminado solo lo usan el lijnbus y el autobus, no un coche.
    cites: ["rvv:73"]

  - id: rijstroken-spitsstrook-seguir
    type: mc
    prompt: Una autosnelweg de dos carriles tiene un spitsstrook abierto (C23-01) a la derecha. No hay atasco ni vas a adelantar. ¿Qué carril sigues en principio según la Rijprocedure B?
    sign: C23-01
    options: [El carril izquierdo, "El carril derecho, incluido el spitsstrook abierto", Solo los dos carriles de la izquierda, Cualquiera según tu velocidad]
    answer: 1
    explain: Si la calzada está dividida en carriles se sigue en principio el carril derecho, y eso vale también para un spitsstrook abierto.
    cites: ["cbr-rijprocedure:3.2", "rvv:bijlage1.C23-01"]
