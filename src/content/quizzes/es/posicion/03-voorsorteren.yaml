questions:
  - id: voorsorteren-izquierda
    type: mc
    prompt: Vas a girar a la izquierda en una calle de doble sentido. ¿Dónde puedes preseleccionar?
    options: [Lo más cerca posible del eje de la calzada, Lo más a la derecha posible para no estorbar, En el centro del carril derecho, Detrás del tráfico que viene de frente]
    answer: 0
    explain: Para girar a la izquierda se puede ir con tiempo lo más cerca posible de la wegas (eje de la calzada). Ir a la derecha es la posición para girar a la derecha.
    cites: ["rvv:17.1"]

  - id: voorsorteren-izquierda-unico-sentido
    type: mc
    prompt: Vas a girar a la izquierda desde una calzada de un solo sentido, sin tráfico en contra. ¿Dónde puedes preseleccionar?
    options: [Lo más a la izquierda posible, Lo más a la derecha posible del carril, Lo más cerca posible del eje de la calzada, Junto a la acera de la derecha]
    answer: 0
    explain: En calzadas para un solo sentido se preselecciona lo más a la izquierda posible; no hay tráfico de frente ni eje al que acercarse.
    cites: ["rvv:17.1"]

  - id: voorsorteren-obligatorio
    type: yesno
    prompt: Según el RVV, ¿estás obligado a preseleccionar antes de cada giro?
    answer: false
    explain: El RVV dice que quien gira "mag" (puede) preseleccionar. Pero la Rijprocedure B lo considera lo mejor al girar, y lo exige cuando no hacerlo crea una situación insegura o estorba la fluidez.
    cites: ["rvv:17.1", "cbr-rijprocedure:3.3"]

  - id: voorsorteren-por-que-izquierda
    type: mc
    prompt: Vas a girar a la izquierda en una calle de doble sentido y un auto viene pegado detrás de ti. ¿Qué riesgo evita acercarte al eje antes de girar?
    options: ["Que el de atrás te adelante por la izquierda, hacia el de frente", "Que el tráfico de frente crea que vas a ceder el paso y se detenga", "Que el intermitente se vea poco desde los autos que vienen detrás", "Que el de atrás tenga que frenar hasta detenerse detrás de ti"]
    answer: 0
    explain: Según la Rijprocedure B, al preseleccionar a la izquierda el de atrás no te adelanta por la izquierda hacia el tráfico de frente, y a menudo tiene sitio para pasarte por la derecha. El intermitente se pone igual en cualquier posición.
    cites: ["cbr-rijprocedure:3.3"]

  - id: voorsorteren-no-estorbar
    type: mc
    prompt: Vas a girar a la derecha, pero tendrás que ir lento o parar, y por tu derecha circulan ciclistas y ciclomotores. ¿Qué dice la Rijprocedure B sobre preseleccionar?
    options: ["Preseleccionas igual, porque es siempre la posición más segura al girar", "En esa situación a veces es mejor no preseleccionar del todo", "Preseleccionas y les haces señas para que pasen por tu derecha", "Giras desde el fietsstrook para dejar libre la calzada a los demás"]
    answer: 1
    explain: La Rijprocedure B dice que a veces es mejor no preseleccionar si, parado o lento en esa posición, estorbarías sin necesidad a ciclistas y ciclomotores.
    cites: ["cbr-rijprocedure:3.3"]

  - id: voorsorteren-flecha
    type: mc
    prompt: Estás en un carril de preselección con una flecha a la derecha y tenías pensado seguir recto. ¿Qué haces?
    sign: L4
    options: ["Sigo recto de todos modos, como tenía pensado", "Sigo la dirección que marca la flecha del carril", "Cambio de carril dentro del cruce para seguir recto", "Giro a la izquierda desde ese carril de la derecha"]
    answer: 1
    explain: Quien sigue la calzada está obligado a seguir en el cruce la dirección que indica el carril de preselección en el que está. Si querías seguir recto, tenías que haber elegido otro carril antes.
    cites: ["rvv:78.1"]

  - id: voorsorteren-uitrijstrook
    type: mc
    prompt: Has tomado un uitrijstrook y, a la altura de las flechas pintadas, te das cuenta de que preferirías seguir por la autopista. ¿Qué haces?
    options: ["Sigo la dirección que indica el uitrijstrook", "Vuelvo a la calzada principal cruzando la línea", "Freno casi hasta parar y decido ahí mismo", "Sigo recto por encima de la línea de borde"]
    answer: 0
    explain: Quien deja la calzada principal por un uitrijstrook tiene que seguir, a la altura de las flechas, la dirección que indica el carril en el que está. Por eso hay que decidir antes de entrar.
    cites: ["rvv:78.2"]

  - id: voorsorteren-mantener-carril
    type: mc
    prompt: Hay dos carriles de preselección hacia la derecha y ya elegiste el derecho. El izquierdo parece avanzar más rápido. ¿Qué recomienda la Rijprocedure B?
    options: [Seguir en el carril elegido lo más posible, Cambiar de carril cada vez que el otro avanza más, Girar desde el carril que quede libre en cada momento, Quedarte entre los dos para elegir al final]
    answer: 0
    explain: Mantener el carril elegido da un tráfico más tranquilo; cambiar a cada rato lo vuelve inquieto.
    cites: ["cbr-rijprocedure:3.3"]

  - id: voorsorteren-espacio-ciclistas
    type: mc
    prompt: Estás en un carril de preselección a la derecha abierto a todos los que van en esa dirección. ¿Qué haces con el espacio a tu derecha?
    options: [Lo dejo libre para ciclistas y ciclomotores, Me pego al borde para dejar sitio a los de atrás, Lo dejo libre solo si ya hay un ciclista, Lo ocupo porque el carril es mío]
    answer: 0
    explain: La Rijprocedure B pide dejar a tu derecha espacio suficiente para ciclistas y ciclomotores. Pegarte al borde parece cortés, pero no deja ese espacio.
    cites: ["cbr-rijprocedure:3.3"]

  - id: voorsorteren-intermitente
    type: mc
    prompt: Estás a unos 100 metros del cruce donde vas a girar a la izquierda. ¿Cuándo das la señal según la Rijprocedure B?
    options: ["Ahora, con tiempo y después de mirar", "Cuando ya empiezas a girar el volante", "Cuando llegues al eje de la calzada", "Solo si ves otros autos cerca"]
    answer: 0
    explain: Hay que avisar con tiempo, después de haber mirado, para que los demás ajusten su conducción, y terminar la señal tras la curva. La obligación de avisar viene del art. 17 lid 2.
    cites: ["rvv:17.2", "cbr-rijprocedure:3.3"]
