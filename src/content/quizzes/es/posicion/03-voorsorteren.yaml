questions:
  - id: voorsorteren-izquierda
    type: mc
    prompt: Vas a girar a la izquierda en una calle de doble sentido. ¿Dónde puedes preseleccionar?
    options: [Lo más cerca posible del eje de la calzada, Lo más a la derecha posible, En el centro del carril derecho, Detrás del tráfico que viene de frente]
    answer: 0
    explain: Para girar a la izquierda se puede ir con tiempo lo más cerca posible de la wegas (eje de la calzada).
    cites: ["rvv:17.1"]

  - id: voorsorteren-izquierda-unico-sentido
    type: mc
    prompt: Vas a girar a la izquierda desde una calzada de un solo sentido. ¿Dónde puedes preseleccionar?
    options: [Lo más a la izquierda posible, Lo más a la derecha posible, En el centro, Pegado a la acera derecha]
    answer: 0
    explain: En calzadas para un solo sentido se preselecciona lo más a la izquierda posible.
    cites: ["rvv:17.1"]

  - id: voorsorteren-derecha
    type: yesno
    prompt: Para girar a la derecha, ¿puedes ir con tiempo lo más a la derecha posible?
    answer: true
    explain: Es lo que permite el art. 17 lid 1 onderdeel a.
    cites: ["rvv:17.1"]

  - id: voorsorteren-obligatorio
    type: yesno
    prompt: Según el RVV, ¿estás obligado a preseleccionar antes de cada giro?
    answer: false
    explain: El texto dice que quien gira "mag" (puede) preseleccionar. Es una facultad, no una obligación.
    cites: ["rvv:17.1"]

  - id: voorsorteren-no-estorbar
    type: mc
    prompt: Según la Rijprocedure B, ¿cuándo puede ser mejor no preseleccionar?
    options: [Si en posición preseleccionada y lento o parado estorbarías sin necesidad a ciclistas y ciclomotores, Nunca, Solo de noche, Solo en calles de un solo sentido]
    answer: 0
    explain: La Rijprocedure B dice que se evite estorbar sin necesidad a ciclistas y ciclomotores en posición preseleccionada.
    cites: ["cbr-rijprocedure:3.3"]

  - id: voorsorteren-flecha
    type: mc
    prompt: Estás en un carril de preselección con una flecha a la derecha y quieres seguir recto. ¿Qué haces?
    options: [Sigo recto de todos modos, Debo seguir la dirección que indica el carril, Cambio de carril dentro del cruce, Giro a la izquierda]
    answer: 1
    explain: Quien sigue la calzada está obligado a seguir en el cruce la dirección que indica el carril de preselección en el que está.
    cites: ["rvv:78.1"]
    sign: L4

  - id: voorsorteren-fietsstrook-parte
    type: yesno
    prompt: Dentro de un carril de preselección hay una fietsstrook. ¿Forma parte del carril de preselección?
    answer: true
    explain: El art. 78 lid 1 dice que una fietsstrook situada en una voorsorteerstrook forma parte de ella.
    cites: ["rvv:78.1"]

  - id: voorsorteren-uitrijstrook
    type: mc
    prompt: Sales de la calzada principal por un uitrijstrook con una flecha pintada. ¿Qué debes hacer a la altura de la flecha?
    options: [Seguir la dirección que indica la flecha, Seguir recto, Cambiar a la calzada principal, Frenar y esperar]
    answer: 0
    explain: A la altura de las flechas hay que seguir la dirección que indica el carril de salida.
    cites: ["rvv:78.2"]

  - id: voorsorteren-mantener-carril
    type: mc
    prompt: Con dos carriles de preselección a la derecha, ya elegiste uno. ¿Qué recomienda la Rijprocedure B?
    options: [Seguir en el carril elegido lo más posible, Cambiar al otro carril cada vez que avanza más rápido, Girar desde el carril que quede libre, Pararte entre los dos]
    answer: 0
    explain: Mantener el carril elegido da un tráfico más tranquilo.
    cites: ["cbr-rijprocedure:3.3"]

  - id: voorsorteren-espacio-ciclistas
    type: yesno
    prompt: Estás en un carril de preselección abierto a todos los que van en esa dirección. ¿Debes dejar a tu derecha espacio suficiente para ciclistas y ciclomotores?
    answer: true
    explain: La Rijprocedure B pide dejar espacio libre a la derecha para ciclistas y ciclomotores.
    cites: ["cbr-rijprocedure:3.3"]

  - id: voorsorteren-intermitente
    type: mc
    prompt: ¿Cuándo debes dar la señal para girar según la Rijprocedure B?
    options: [Con tiempo y después de mirar, Cuando ya estás girando, Solo si hay otros autos, Después de la curva]
    answer: 0
    explain: Hay que avisar con tiempo, después de haber mirado, y terminar la señal tras la curva. La obligación de avisar viene del art. 17 lid 2.
    cites: ["rvv:17.2", "cbr-rijprocedure:3.3"]

  - id: voorsorteren-ceder-lado
    type: yesno
    prompt: Vas a girar. Un ciclista viene muy cerca detrás de ti por el costado. ¿Debes dejarlo pasar?
    answer: true
    explain: Quien gira tiene que dejar pasar al tráfico que viene de frente por la misma vía y al que va a su lado o muy cerca detrás, a izquierda o derecha.
    cites: ["rvv:18.1"]

  - id: voorsorteren-izquierda-derecha
    type: mc
    prompt: Giras a la izquierda en un cruce. Un auto que viene de frente gira a la derecha en el mismo cruce. ¿Quién deja pasar a quién?
    options: [Tú le dejas pasar a él, Él te deja pasar a ti, El más rápido pasa primero, Los dos entran a la vez]
    answer: 0
    explain: Quien gira a la izquierda debe dejar pasar a los que vienen de frente y giran a la derecha en el mismo cruce.
    cites: ["rvv:18.2"]
