questions:
  - id: schijf-blauwe-streep
    type: yesno
    prompt: Estás en una zona de disco (E10) y ves un hueco libre sin línea azul ni marca de plaza. Vas a quedarte veinte minutos con el disco puesto. ¿Puedes estacionar allí?
    answer: false
    explain: En una zona de disco solo puedes estacionar en plazas señaladas como tales o con línea azul. Tener el disco no convierte cualquier hueco en una plaza permitida.
    cites: ["rvv:25.1"]

  - id: schijf-voorruit
    type: mc
    prompt: Tu auto tiene parabrisas y estacionas en un lugar con línea azul. ¿Dónde pones el disco?
    options:
      - Detrás del parabrisas, bien visible
      - En la ventana trasera, porque ahí no estorba
      - En la guantera, y lo muestras si te lo piden
      - Debajo del limpiaparabrisas, por fuera
    answer: 0
    explain: Un vehículo a motor de más de dos ruedas necesita un disco bien visible, y si tiene parabrisas el disco va detrás de él. En la guantera no se ve, y la ventana trasera o el exterior no son lo que dice la ley.
    cites: ["rvv:25.2"]

  - id: schijf-automatisch
    type: yesno
    prompt: Compras un disco electrónico que avanza solo la hora de llegada mientras estás estacionado, para ganar tiempo en la zona azul. ¿Puedes usarlo?
    answer: false
    explain: Un disco con mecanismo que desplaza automáticamente la hora de llegada no se puede usar. El disco debe mostrar la hora en que empezaste a estacionar.
    cites: ["rvv:25.3"]

  - id: schijf-afronden
    type: mc
    prompt: Llegas a las 10:10 a un lugar con línea azul. ¿A qué hora puedes poner el disco?
    options: [10:30, 10:00, 11:00, 9:30]
    answer: 0
    explain: Puedes redondear hacia arriba a la siguiente hora entera o media, nunca hacia abajo. Las 10:10 pasan a las 10:30.
    cites: ["rvv:25.4"]

  - id: schijf-uren
    type: yesno
    prompt: Un cartel adicional bajo la zona de disco dice "ma-za 9-18 uur". Es domingo a las 11:00 y estacionas en un lugar con línea azul sin disco. ¿Incumples las reglas del disco?
    answer: false
    explain: Con un cartel de días y horas, las reglas del disco solo valen en esos días y horas. El domingo no rigen.
    cites: ["rvv:25.5"]

  - id: schijf-e6-sin-tarjeta
    type: yesno
    prompt: Hay una plaza E6 libre junto a la tienda. No tienes tarjeta de estacionamiento para discapacitados y solo vas a quedarte cinco minutos. ¿Puedes estacionar allí?
    answer: false
    explain: En una plaza E6 solo puede estacionar un gehandicaptenvoertuig, un auto con tarjeta válida y visible (para el transporte de la persona titular) o el vehículo para el que está reservada. Que sean cinco minutos no cambia la lista.
    cites: ["rvv:26.1"]

  - id: schijf-e6-tarjeta
    type: yesno
    prompt: Llevas a una persona con discapacidad y la tarjeta válida, visible, está a su nombre. ¿Puedes estacionar en una plaza E6?
    answer: true
    explain: Se permite si el estacionamiento se relaciona directamente con el transporte de la persona a quien se dio la tarjeta.
    cites: ["rvv:26.1"]

  - id: schijf-e6-no-persona
    type: yesno
    prompt: Tienes la tarjeta de un familiar, pero vas solo a hacer compras. ¿Puedes usar una plaza E6?
    answer: false
    explain: El estacionamiento debe relacionarse directamente con el transporte de la persona con discapacidad. La tarjeta no es un permiso para quien la lleva.
    cites: ["rvv:26.1"]

  - id: schijf-kaart-schijf
    type: yesno
    prompt: Llevas a tu madre, titular de la tarjeta válida y visible, y estacionas en un lugar con línea azul. ¿Se aplica la regla del disco del artículo 25 a tu auto?
    answer: false
    explain: El artículo 25 no se aplica a quien tiene la tarjeta, si el estacionamiento se relaciona directamente con el transporte de la persona con discapacidad. Hasta tres horas, sin embargo, sigues necesitando un disco visible con la hora de inicio (artículo 85, lid 4).
    cites: ["rvv:85.1", "rvv:85.3", "rvv:85.4"]

  - id: schijf-kaart-e1-dos-horas
    type: mc
    prompt: Con la tarjeta válida, para llevar a su titular, estacionas dos horas bajo una señal E1 (parkeerverbod) en tu lado de la calle. ¿Qué es correcto?
    sign: E1
    options:
      - Está permitido si muestras un disco con la hora de inicio
      - Está permitido sin disco, porque la tarjeta basta
      - Está prohibido, porque E1 vale para todos
      - Está permitido solo los primeros diez minutos
    answer: 0
    explain: Con la tarjeta y para ese transporte, la señal E1 no se aplica si no estacionas más de tres horas, y en esos casos debes mostrar el disco con la hora de inicio. Sin disco o con más de tres horas, no cumples.
    cites: ["rvv:85.1", "rvv:85.3", "rvv:85.4"]

  - id: schijf-kaart-amarilla-cuatro
    type: yesno
    prompt: Con la tarjeta válida, para llevar a su titular, estacionas cuatro horas junto a una línea amarilla discontinua con el disco puesto. ¿Está permitido?
    answer: false
    explain: La excepción para la línea amarilla discontinua (y la E1) vale solo si no estacionas más de tres horas. A las cuatro horas ya no se aplica.
    cites: ["rvv:85.1", "rvv:85.3", "rvv:24.1"]
