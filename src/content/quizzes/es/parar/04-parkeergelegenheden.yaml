questions:
  - id: gelegenheid-horas-e7
    type: yesno
    prompt: Un lugar de carga y descarga (E7) tiene un cartel adicional "ma-vr 7-11 uur". Es sábado por la tarde, no hay otra señal ni prohibición, y vas a dejar el auto allí para hacer compras. ¿Está prohibido por esa señal E7?
    sign: E7
    answer: false
    explain: Con un cartel de días u horas, la señal solo vale en esos días y horas. Un sábado por la tarde el E7 no rige. Dentro del horario (lunes a viernes de 7 a 11), en cambio, no podrías estacionar allí.
    cites: ["rvv:24.2", "rvv:bijlage1.E7"]

  - id: gelegenheid-vakken
    type: yesno
    prompt: Un aparcamiento E4 tiene plazas marcadas. El único hueco libre es largo y dejas el auto atravesado, ocupando dos plazas. ¿Puedes?
    answer: false
    explain: Si el aparcamiento tiene plazas marcadas, solo puedes estacionar dentro de ellas, una por vehículo.
    cites: ["rvv:24.4"]

  - id: gelegenheid-zona-area
    type: yesno
    prompt: Una señal E10 con la palabra «zone» tiene debajo indicado el área "centrum". Estacionas dos calles fuera de ese centro, sin ninguna otra señal. ¿Te afecta esa zona de disco?
    sign: E10
    answer: false
    explain: Si la señal con «zone» indica un área, vale en ese área. Fuera de ella no rige.
    cites: ["rvv:66.1", "rvv:66.3"]

  - id: gelegenheid-e11-fuera
    type: yesno
    prompt: Entras en una zona de disco E10 sin área indicada, y poco después pasas por la señal E11. Cinco calles más allá estacionas cuatro horas, sin otra señal. ¿Te afecta el tiempo máximo del E10?
    sign: E11
    answer: false
    explain: E11 marca el fin de la zona. Una zona sin área indicada vale entre el E10 y las señales de fin, así que después del E11 ya no rige el tiempo máximo.
    cites: ["rvv:bijlage1.E11", "rvv:66.2", "rvv:66.3"]

  - id: gelegenheid-e7-prohibido
    type: yesno
    prompt: "Ves una señal E7 (lugar para cargar y descargar). Quieres dejar tu auto allí dos horas mientras haces compras. ¿Lo prohíbe la ley?"
    sign: E7
    answer: true
    explain: Está prohibido estacionar en un lugar destinado a cargar y descargar mercancías de inmediato. Dos horas de compras es estacionar, no cargar o descargar de inmediato.
    cites: ["rvv:bijlage1.E7", "rvv:24.1"]

  - id: gelegenheid-e8-camion-prohibido
    type: yesno
    prompt: "Un aparcamiento con señal E8 muestra el símbolo de un camión. Conduces un auto. ¿Te prohíbe estacionar allí?"
    sign: E8
    answer: true
    explain: E8 es un parkeergelegenheid solo para la categoría que indica el cartel. Un auto no pertenece a la categoría camión, así que no puedes estacionar allí.
    cites: ["rvv:bijlage1.E8", "rvv:24.1"]

  - id: gelegenheid-e5-taxi
    type: yesno
    prompt: Ves una parada de taxis (E5) libre. No eres taxista y quieres dejar tu auto particular allí media hora. ¿Puedes?
    sign: E5
    answer: false
    explain: E5 es una Taxistandplaats. En un lugar de estacionamiento no puedes estacionar con otro fin ni con un vehículo que no corresponde a lo indicado en el cartel.
    cites: ["rvv:bijlage1.E5", "rvv:24.1"]

  - id: gelegenheid-e12-otro-fin
    type: yesno
    prompt: Un aparcamiento con señal E12 (P+R) está pensado para quien deja el auto y sigue en transporte público. ¿Puedes estacionar allí para ir de compras al centro en tu propio auto, sin usar transporte público?
    sign: E12
    answer: false
    explain: En un lugar de estacionamiento no puedes estacionar con otro fin que el indicado en el cartel. E12 es para quien se cambia al transporte público.
    cites: ["rvv:bijlage1.E12", "rvv:24.1"]

  - id: gelegenheid-e10-tiempo
    type: mc
    prompt: Entras en una zona de disco con tiempo máximo de 2 horas y encuentras una plaza permitida. Dejas el auto 3 horas con el disco bien puesto. ¿Qué pasa?
    options: ["Está bien, porque tienes el disco bien puesto y visible", "Está prohibido, porque pasaste del tiempo máximo de la señal", "Está bien, porque una zona de disco no es una prohibición", "Solo está prohibido si ya hay una multa en el parabrisas"]
    answer: 1
    explain: E10 es también un parkeerverbod si estacionas más tiempo que el máximo indicado. Tener el disco puesto no te da más tiempo.
    cites: ["rvv:bijlage1.E10"]

  - id: gelegenheid-e10-dentro-tiempo
    type: yesno
    prompt: En una zona E10 con tiempo máximo de 2 horas dejas el auto una hora y media con el disco bien puesto. ¿Está permitido?
    sign: E10
    answer: true
    explain: E10 obliga a usar el disco y prohíbe quedarse más del tiempo máximo. Con el disco puesto y dentro del tiempo, no infringes la señal.
    cites: ["rvv:bijlage1.E10"]

  - id: gelegenheid-e10-zona-calles
    type: yesno
    prompt: Pasas una señal E10 con la palabra «zone» y sin área indicada. Giras por dos calles de la zona y todavía no has visto la señal E11. ¿Sigue valiendo la regla del E10?
    sign: E10
    answer: true
    explain: Sin área indicada, la señal vale en el área que va desde ella hasta las señales que marcan el fin de la zona. Mientras no llegues al E11, sigues dentro.
    cites: ["rvv:66.2", "rvv:66.3"]
