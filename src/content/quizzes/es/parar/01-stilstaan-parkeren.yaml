questions:
  - id: stilstaan-reloj
    type: mc
    prompt: Dejas el auto junto a la acera y entras en una tienda cinco minutos. Otro conductor dice que "hasta diez minutos no cuenta como estacionar". ¿Qué dice la definición legal?
    options:
      - Tiene razón, parkeren empieza después de unos diez minutos
      - Estás estacionando (parkeren), porque no fue para un ascenso, descenso, carga o descarga inmediatos
      - Solo estás parado (stilstaan) si dejas el motor encendido
      - Solo estás estacionando si la zona tiene una señal de parking
    answer: 1
    explain: La ley define parkeren por el motivo y la inmediatez, no por minutos. Ir a una tienda no es subir, bajar, cargar o descargar de inmediato, así que estacionas aunque sean cinco minutos. El motor y las señales no cambian la definición.
    cites: ["rvv:1"]

  - id: stilstaan-subir-bajar
    type: yesno
    prompt: Te detienes en la calle solo el tiempo necesario para que un pasajero baje. ¿Estás estacionando (parkeren)?
    answer: false
    explain: Parar el tiempo necesario para que suban o bajen pasajeros de inmediato no es parkeren. Solo estás parado (stilstaan).
    cites: ["rvv:1"]

  - id: stilstaan-carga
    type: yesno
    prompt: Te detienes lo necesario para descargar de inmediato unas cajas. ¿Eso es parkeren?
    answer: false
    explain: La carga o descarga inmediata de mercancías queda fuera de la definición de parkeren.
    cites: ["rvv:1"]

  - id: stilstaan-esperar
    type: mc
    prompt: Te detienes en la calle y esperas diez minutos con el motor encendido a un amigo que todavía no baja. ¿Qué haces según la definición legal?
    options:
      - Solo estás parado, no estacionas
      - Estás estacionando (parkeren), porque no es el tiempo necesario para el ascenso inmediato
      - Depende de si apagas el motor
      - Depende de si pones las luces de emergencia
    answer: 1
    explain: Esperar a alguien que todavía no sube o baja no es el tiempo necesario para el ascenso o descenso inmediato, así que cuenta como parkeren.
    cites: ["rvv:1"]

  - id: stilstaan-doble-fila-espera
    type: mc
    prompt: Hay coches aparcados junto a la acera. Paras a su lado, en la calzada, y esperas veinte minutos a que tu pareja salga de una oficina. ¿Qué haces según la ley?
    options:
      - Solo estás parado, porque sigues sentado en el auto
      - Estacionas (parkeren) y además en doble fila, que está prohibido
      - Estacionas en doble fila, pero está permitido si pones las luces de emergencia
      - Estacionas, pero no en doble fila porque los otros coches no te bloquean
    answer: 1
    explain: Esperar veinte minutos no es un ascenso inmediato, así que es parkeren (rvv:1), y hacerlo al lado de coches ya aparcados es estacionar en doble fila, que la ley prohíbe (rvv:24.3). Estar sentado en el auto o poner las luces de emergencia no lo cambia.
    cites: ["rvv:1", "rvv:24.3"]

  - id: stilstaan-acera
    type: yesno
    prompt: ¿Puede un auto estacionar en el trottoir (acera)?
    answer: false
    explain: Para estacionar se pueden usar otras partes de la vía, pero no el trottoir, el voetpad, el fietspad, el fiets/bromfietspad ni el ruiterpad.
    cites: ["rvv:10.1"]

  - id: stilstaan-bici
    type: multi
    prompt: ¿Dónde se colocan, según la ley, las bicicletas y los ciclomotores?
    options:
      - En el trottoir
      - En el voetpad
      - En la berm
      - En el centro de la calzada
    answer: [0, 1, 2]
    explain: Se colocan en el trottoir, en el voetpad, en la berm o en otros lugares que designe la autoridad.
    cites: ["rvv:27"]

  - id: stilstaan-lugar-previsto
    type: yesno
    prompt: Hay un tramo destinado a estacionar bicicletas. ¿Está permitido colocar allí una bicicleta aunque haya cerca una señal E3 (prohibido colocar bicicletas)?
    answer: true
    explain: La ley permite estacionar un vehículo y colocar una bicicleta o un ciclomotor en los tramos destinados a ello.
    cites: ["rvv:65.3", "rvv:65.2"]
    exam: false

  - id: stilstaan-cual-es-parkeren
    type: multi
    prompt: ¿Cuáles de estas situaciones cuentan como parkeren según la definición legal?
    options:
      - Esperar 10 minutos a un amigo que todavía no baja
      - Parar 20 segundos para que tu hijo baje del auto
      - Descargar de inmediato unas cajas y volver a arrancar
      - Dejar el auto para ir al cine
    answer: [0, 3]
    explain: Parkeren es dejar parado el vehículo salvo el tiempo necesario para el ascenso o descenso inmediato de pasajeros o la carga o descarga inmediata de mercancías. Bajar al niño y descargar de inmediato no cuentan; esperar y dejar el auto para ir al cine sí.
    cites: ["rvv:1"]
