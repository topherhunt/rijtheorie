questions:
  - id: licht-aanhanger
    type: mc
    prompt: Dejas un remolque desenganchado, de noche, sobre la calzada fuera de la zona urbana. ¿Qué luces debe llevar?
    options: ["Luz trasera y el stadslicht que prescribe la Regeling voertuigen", "Solo la luz trasera, porque el remolque no tiene faros propios", "Ninguna, porque un remolque no es un vehículo a motor", "Luz delantera y trasera, como en un carro de tracción"]
    answer: 0
    explain: "Un remolque parado en esos lugares lleva luz trasera y el stadslicht prescrito en la Regeling voertuigen. Que no sea un vehículo a motor no lo exime: el artículo 39 habla de remolques."
    cites: ["rvv:39"]

  - id: licht-wagen
    type: mc
    prompt: Un carro de tracción animal (wagen) está parado de noche en la calzada fuera de la zona urbana. ¿Qué luces lleva según la ley?
    options:
      - Luz delantera y trasera
      - Solo la luz trasera, como un remolque
      - Solo la luz delantera
      - Ninguna, porque no tiene motor
    answer: 0
    explain: Los wagens parados fuera de la zona urbana en la calzada llevan luz delantera y trasera, de noche y de día con visibilidad seriamente reducida.
    cites: ["rvv:40"]
    exam: false

  - id: licht-puerta-ciclista
    type: mc
    prompt: Aparcaste junto a la acera y vas a bajar por la puerta del lado de la calle. Por detrás se acerca un ciclista. ¿Qué haces antes de abrir?
    options: ["Miras los espejos y por encima del hombro, y abres si está libre", "Abres un poco la puerta y miras después, por si viene algún ciclista", "Tocas el claxon para avisar y abres la puerta enseguida", "Miras solo el espejo interior y abres si no ves a nadie"]
    answer: 0
    explain: El CBR espera que mires el espejo interior, el exterior izquierdo y por encima del hombro izquierdo antes de abrir. Abrir y mirar después, o avisar con el claxon, deja al ciclista sin tiempo para esquivar la puerta.
    cites: ["cbr-rijprocedure:3.7", "wvw:5"]

  - id: licht-puerta-tiempo
    type: yesno
    prompt: Has bajado junto a la calzada y dejas la puerta del lado de la calle abierta de par en par un minuto mientras charlas con un vecino. ¿Es lo que espera el CBR?
    answer: false
    explain: La puerta se mantiene abierta solo el tiempo necesario, porque una puerta abierta puede estorbar o poner en peligro a otros usuarios.
    cites: ["cbr-rijprocedure:3.7"]
    exam: false

  - id: licht-puerta-aparcamiento
    type: mc
    prompt: Estacionaste en un aparcamiento justo al lado de otro auto y vas a bajar. ¿Qué indica el procedimiento CBR?
    options:
      - Abrir la puerta con extra cuidado
      - Abrir la puerta del todo para bajar rápido
      - Bajar sin mirar porque el otro auto está parado
      - Esperar a que el otro auto se vaya
    answer: 0
    explain: Si el vehículo está estacionado junto a otro, la puerta se abre con extra cuidado, y se deja abierta solo el tiempo necesario.
    cites: ["cbr-rijprocedure:3.7"]
    exam: false

  - id: licht-puerta-sin-mirar-inaceptable
    type: yesno
    prompt: "Tu auto está bien estacionado junto a la calzada. Abres de golpe la puerta del lado de la calle sin mirar, y un ciclista que pasa tiene que esquivarla. No hay choque y nadie se hace daño. ¿Has cometido una infracción?"
    answer: true
    explain: Nadie debe comportarse en la vía de modo que cause o pueda causar peligro o estorbo (art. 5 WVW); estar bien estacionado no te dispensa. El procedimiento CBR pide mirar el espejo interior, el exterior y por encima del hombro antes de abrir.
    cites: ["wvw:5", "cbr-rijprocedure:3.7"]
    exam: false
