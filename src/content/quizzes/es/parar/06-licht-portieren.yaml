questions:
  - id: licht-buiten-bebouwde-kom
    type: yesno
    prompt: Tu auto está parado de noche en la calzada fuera de la zona urbana. ¿Debe llevar luz de posición y luz trasera?
    answer: true
    explain: De noche, fuera de la zona urbana, un vehículo a motor parado en la calzada lleva stadslicht y luz trasera.
    cites: ["rvv:38"]

  - id: licht-dag-zicht
    type: yesno
    prompt: De día, con niebla densa, tu auto está parado en una vluchtstrook de una autosnelweg. ¿Debe llevar luz de posición y trasera?
    answer: true
    explain: De día también, si la visibilidad está seriamente reducida.
    cites: ["rvv:38"]

  - id: licht-aanhanger
    type: mc
    prompt: ¿Qué luces lleva un remolque parado de noche fuera de la zona urbana, en la calzada?
    options:
      - Luz trasera y la luz de posición prescrita
      - Solo luz trasera
      - Ninguna
      - Luz larga
    answer: 0
    explain: Un remolque parado lleva luz trasera y el stadslicht prescrito en la Regeling voertuigen.
    cites: ["rvv:39"]

  - id: licht-puerta-miradas
    type: multi
    prompt: Según el procedimiento del CBR, ¿qué miras antes de bajar del auto?
    options:
      - El espejo interior
      - El espejo exterior izquierdo
      - Por encima del hombro izquierdo
      - El espejo exterior derecho solamente
    answer: [0, 1, 2]
    explain: El procedimiento indica espejo interior, espejo exterior izquierdo y por encima del hombro izquierdo.
    cites: ["cbr-rijprocedure:3.7"]
    exam: false

  - id: licht-puerta-tiempo
    type: yesno
    prompt: Según el procedimiento del CBR, ¿mantienes la puerta abierta el tiempo que haga falta más un rato extra?
    answer: false
    explain: La puerta se mantiene abierta solo el tiempo necesario.
    cites: ["cbr-rijprocedure:3.7"]
    exam: false

  - id: licht-wagen
    type: mc
    prompt: ¿Qué luces lleva un wagen parado de noche en la calzada fuera de la zona urbana?
    options: [Luz delantera y trasera, Solo luz trasera, Solo luz delantera, Ninguna]
    answer: 0
    explain: Los wagens parados llevan luz delantera y trasera.
    cites: ["rvv:40"]

  - id: licht-dag-buena-vista
    type: yesno
    prompt: De día y con buena visibilidad, tu auto está parado en la calzada fuera de la zona urbana. ¿Es obligatorio llevar la luz de posición y la trasera?
    answer: false
    explain: El art. 38 las exige de noche y, de día, solo si la visibilidad está seriamente reducida.
    cites: ["rvv:38"]

  - id: licht-puerta-aparcamiento
    type: mc
    prompt: Estacionaste en un aparcamiento justo al lado de otro auto y vas a bajar. ¿Qué indica el procedimiento CBR?
    options:
      - Abrir la puerta con extra cuidado
      - Abrir la puerta del todo para bajar rápido
      - Bajar sin mirar porque el otro auto está parado
      - Esperar a que el otro auto se vaya
    answer: 0
    explain: Si el vehículo está estacionado junto a otro, la puerta se abre con extra cuidado, y se deja abierta solo el tiempo necesario.
    cites: ["cbr-rijprocedure:3.7"]
    exam: false

  - id: licht-puerta-sin-mirar
    type: yesno
    prompt: Tu auto está bien estacionado junto a la calzada. Abres de golpe la puerta del lado de la calle sin mirar, y un ciclista que pasa tiene que esquivarla. ¿Es un comportamiento aceptable?
    answer: false
    explain: Nadie debe comportarse en la vía de modo que cause o pueda causar peligro o estorbo (art. 5 WVW); estar bien estacionado no te dispensa. El procedimiento CBR pide mirar el espejo interior, el exterior y por encima del hombro antes de abrir.
    cites: ["wvw:5", "cbr-rijprocedure:3.7"]
    exam: false
