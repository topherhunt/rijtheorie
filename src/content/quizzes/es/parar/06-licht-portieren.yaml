questions:
  - id: licht-buiten-bebouwde-kom
    type: yesno
    prompt: Tu auto está parado de noche en la calzada fuera de la zona urbana. ¿Debe llevar luz de posición y luz trasera?
    answer: true
    explain: De noche, fuera de la zona urbana, un vehículo a motor parado en la calzada lleva stadslicht y luz trasera.
    cites: ["rvv:38"]

  - id: licht-dag-zicht
    type: yesno
    prompt: De día, con niebla densa, tu auto está parado en una vluchtstrook de una autosnelweg. ¿Debe llevar luz de posición y trasera?
    answer: true
    explain: De día también, si la visibilidad está seriamente reducida.
    cites: ["rvv:38"]

  - id: licht-aanhanger
    type: mc
    prompt: ¿Qué luces lleva un remolque parado de noche fuera de la zona urbana, en la calzada?
    options:
      - Luz trasera y la luz de posición prescrita
      - Solo luz trasera
      - Ninguna
      - Luz larga
    answer: 0
    explain: Un remolque parado lleva luz trasera y el stadslicht prescrito en la Regeling voertuigen.
    cites: ["rvv:39"]

  - id: licht-puerta-miradas
    type: multi
    prompt: Según el procedimiento del CBR, ¿qué miras antes de bajar del auto?
    options:
      - El espejo interior
      - El espejo exterior izquierdo
      - Por encima del hombro izquierdo
      - El espejo exterior derecho solamente
    answer: [0, 1, 2]
    explain: El procedimiento indica espejo interior, espejo exterior izquierdo y por encima del hombro izquierdo.
    cites: ["cbr-rijprocedure:3.7"]
    exam: false

  - id: licht-puerta-tiempo
    type: yesno
    prompt: Según el procedimiento del CBR, ¿mantienes la puerta abierta el tiempo que haga falta más un rato extra?
    answer: false
    explain: La puerta se mantiene abierta solo el tiempo necesario.
    cites: ["cbr-rijprocedure:3.7"]
    exam: false

  - id: licht-dentro-zona
    type: mc
    prompt: ¿Qué dicen los artículos 38 a 40 sobre las luces de un vehículo parado?
    options:
      - Regulan los vehículos parados fuera de la zona urbana
      - Regulan solo los vehículos dentro de la zona urbana
      - Obligan a llevar luz larga
      - Prohíben cualquier luz
    answer: 0
    explain: Los artículos 38, 39 y 40 se refieren a vehículos parados fuera de la zona urbana.
    cites: ["rvv:38", "rvv:39", "rvv:40"]

  - id: licht-wagen
    type: mc
    prompt: ¿Qué luces lleva un wagen parado de noche en la calzada fuera de la zona urbana?
    options: [Luz delantera y trasera, Solo luz trasera, Solo luz delantera, Ninguna]
    answer: 0
    explain: Los wagens parados llevan luz delantera y trasera.
    cites: ["rvv:40"]

  - id: licht-algemeen
    type: yesno
    prompt: ¿Está permitido comportarte en la vía de modo que cause peligro para otros?
    answer: false
    explain: La ley prohíbe causar o poder causar peligro o estorbar el tráfico.
    cites: ["wvw:5"]
