questions:
  - id: parkeerverbod-inrit-prohibido
    type: yesno
    prompt: "Solo queda un hueco libre, justo delante de la salida de un garaje, y vas a dejar el auto allí una hora. ¿Lo prohíbe la ley aunque no haya otro sitio?"
    answer: true
    explain: "Estacionar delante de una inrit o una uitrit está prohibido, aunque no haya otro sitio. El motivo es de sentido común: bloquearías la salida de quien vive o trabaja allí."
    cites: ["rvv:24.1"]

  - id: parkeerverbod-voorrangsweg
    type: mc
    prompt: Conduces fuera de zona urbana por una voorrangsweg y quieres dejar el auto diez minutos en la calzada para comer algo. ¿Qué dice el artículo 24?
    options: ["Está prohibido estacionar en la calzada de una voorrangsweg", "Está permitido si pones las luces de emergencia al parar", "Está permitido porque son solo diez minutos y no molestas", "Está permitido de día, y prohibido solo de noche o con niebla"]
    answer: 0
    explain: Fuera de la zona urbana no puedes estacionar en la calzada de una voorrangsweg. Las luces de emergencia, los diez minutos o la hora del día no cambian la regla.
    cites: ["rvv:24.1"]

  - id: parkeerverbod-laden-tienda-prohibido
    type: yesno
    prompt: "En un lugar señalado para cargar y descargar mercancías descargas unas cajas de inmediato. Después dejas allí el auto media hora para hacer compras. ¿Infringes la prohibición de estacionar?"
    answer: true
    explain: Descargar de inmediato no es parkeren, pero dejar el auto media hora para hacer compras sí lo es, y en un lugar destinado a carga y descarga inmediatas está prohibido estacionar.
    cites: ["rvv:24.1", "rvv:1"]

  - id: parkeerverbod-e9
    type: yesno
    prompt: Visitas a un amigo en un barrio con plazas E9 (para titulares de permiso). Hay una libre, no tienes permiso para ella y solo te quedas una hora. ¿Puedes estacionar allí?
    answer: false
    explain: Sin permiso para esa plaza, estacionar en una plaza E9 está prohibido, sea cual sea el tiempo.
    cites: ["rvv:24.1", "rvv:bijlage1.E9"]

  - id: parkeerverbod-cruce-5m-prohibido
    type: yesno
    prompt: "Quieres dejar el auto dos horas a 3 m antes de un cruce, lejos de cualquier paso de peatones. ¿Lo prohíbe el artículo 24?"
    answer: true
    explain: Parkeren a menos de 5 m de un kruispunt está prohibido. Solo podrías detenerte un momento (por ejemplo, para que alguien baje). Dentro del cruce, ni eso.
    cites: ["rvv:24.1", "rvv:23.1"]

  - id: parkeerverbod-amarilla-diferencia
    type: multi
    prompt: ¿Cuáles de estas afirmaciones son correctas?
    options:
      - Junto a una línea amarilla continua no puedes detenerte
      - Junto a una línea amarilla discontinua no puedes estacionar
      - Junto a una línea amarilla discontinua no puedes detenerte nunca
      - Junto a una línea amarilla continua puedes estacionar
    answer: [0, 1]
    explain: La amarilla continua prohíbe stilstaan, la discontinua prohíbe parkeren.
    cites: ["rvv:23.1", "rvv:24.1"]

  - id: parkeerverbod-e1-carga
    type: yesno
    prompt: Bajo una señal E1 en tu lado de la calle paras un minuto para cargar de inmediato una maleta pesada y arrancas. ¿Está permitido?
    sign: E1
    answer: true
    explain: E1 es el parkeerverbod. Cargar de inmediato no es parkeren según el artículo 1, así que la señal no lo prohíbe.
    cites: ["rvv:bijlage1.E1", "rvv:1"]

  - id: parkeerverbod-e3-bici
    type: yesno
    prompt: Hay una señal E3 en tu lado de la calle. Llegas en bicicleta y la dejas apoyada en la pared. ¿Está permitido?
    sign: E3
    answer: false
    explain: E3 es el verbod fietsen en bromfietsen te plaatsen, así que no puedes dejar allí bicicletas ni ciclomotores (salvo en un tramo destinado a ello).
    cites: ["rvv:bijlage1.E3", "rvv:65.3"]

  - id: parkeerverbod-e1-lado
    type: yesno
    prompt: Hay una señal E1 en el lado izquierdo de la calle. ¿Te afecta si estacionas en el lado derecho?
    answer: false
    explain: E1 vale solo para el lado de la vía donde está puesta.
    cites: ["rvv:65.2"]

  - id: parkeerverbod-e1-bajar
    type: yesno
    prompt: Hay una señal E1 (parkeerverbod) en tu lado de la calle. Te detienes 20 segundos para que tu hijo baje y arrancas. ¿Está permitido?
    sign: E1
    answer: true
    explain: E1 prohíbe parkeren, y parar el tiempo justo para que alguien baje no es parkeren según el art. 1.
    cites: ["rvv:bijlage1.E1", "rvv:1"]

  - id: parkeerverbod-e1-esperar
    type: yesno
    prompt: Bajo una señal E1 en tu lado de la calle esperas 5 minutos con el motor encendido a que tu amigo salga de una tienda. ¿Está permitido?
    sign: E1
    answer: false
    explain: Esperar a alguien no es el tiempo necesario para un ascenso o descenso inmediato, así que es parkeren, que E1 prohíbe.
    cites: ["rvv:bijlage1.E1", "rvv:1"]

  - id: parkeerverbod-cruce-bajar
    type: yesno
    prompt: A 3 m de un cruce (fuera del cruce mismo) te detienes lo justo para que un pasajero baje de inmediato. ¿Lo prohíbe el artículo 24 (parkeren)?
    answer: false
    explain: Dejar bajar a un pasajero de inmediato no es parkeren, así que el art. 24 no se aplica. El art. 23 solo prohíbe detenerse dentro del cruce.
    cites: ["rvv:24.1", "rvv:1", "rvv:23.1"]

  - id: parkeerverbod-e3-auto
    type: yesno
    prompt: Hay una señal E3 (prohibido colocar bicicletas y ciclomotores) en tu lado de la calle. Conduces un auto. ¿Te prohíbe estacionar el auto?
    sign: E3
    answer: false
    explain: E3 es el Verbod fietsen en bromfietsen te plaatsen; se refiere a bicicletas y ciclomotores, no a autos.
    cites: ["rvv:bijlage1.E3"]
