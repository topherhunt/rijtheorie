questions:
  - id: mv-continua
    type: yesno
    prompt: Hay una línea continua entre tu carril y el contrario, y quieres adelantar a un ciclista por el otro lado. ¿Puedes circular a la izquierda de la línea?
    answer: false
    explain: No puedes circular a la izquierda de una línea continua que separa carriles con tráfico en ambos sentidos.
    cites: ["rvv:76.1"]

  - id: mv-discontinua-lado
    type: yesno
    prompt: "Hay una línea doble: de tu lado es discontinua y del otro lado continua. ¿Puedes cruzarla?"
    answer: true
    explain: Si hay una línea discontinua de tu lado, la excepción del art. 76.2 lo permite.
    cites: ["rvv:76.2"]

  - id: mv-vluchtstrook-emergencia
    type: yesno
    prompt: Tu coche se avería en una autosnelweg. Una línea continua te separa de la vluchtstrook. ¿Puedes cruzarla para llegar a ella?
    answer: true
    explain: El art. 76.2 levanta la prohibición de cruzar la línea para llegar a una vluchtstrook, y el art. 43.3 permite usarla en emergencias. Una avería lo es.
    cites: ["rvv:76.2", "rvv:43.3"]

  - id: mv-vluchtstrook-cola
    type: yesno
    prompt: Hay cola en la autosnelweg y la vluchtstrook está libre, separada por una línea continua. ¿Puedes cruzar la línea y avanzar por la vluchtstrook?
    answer: false
    explain: La excepción del art. 76.2 solo levanta la prohibición de cruzar la línea. Usar la vluchtstrook sin emergencia sigue prohibido (art. 43.3), y una cola no lo es.
    cites: ["rvv:76.2", "rvv:43.3"]

  - id: mv-flechas
    type: mc
    prompt: Estás en un voorsorteerstrook con una flecha a la derecha en un cruce. ¿Qué debes hacer?
    options: ["Girar a la derecha", "Seguir recto", "Girar a la izquierda", "Elegir la dirección"]
    answer: 0
    explain: En un cruce sigues la dirección del voorsorteerstrook en que estás.
    cites: ["rvv:78.1"]

  - id: mv-verdrijvingsvlak
    type: yesno
    prompt: Hay cola y quieres adelantarla usando un verdrijvingsvlak (zona rayada) en una bifurcación. ¿Puedes?
    answer: false
    explain: Los conductores no pueden usar verdrijvingsvlakken ni puntstukken, salvo las excepciones del art. 77.2 y 77.3 (seguir una spitsstrook o un carril de bus).
    cites: ["rvv:77.1"]

  - id: mv-puntstuk-spits
    type: yesno
    prompt: Sigues legalmente una spitsstrook que atraviesa una bifurcación con puntstuk. ¿Puedes usar el puntstuk?
    answer: true
    explain: La prohibición no se aplica al seguir una spitsstrook a través de la bifurcación (art. 77.2).
    cites: ["rvv:77.2"]

  - id: mv-haaientanden
    type: mc
    prompt: Delante de ti hay triángulos blancos pintados en el suelo (haaientanden) y por la vía que cruzas viene un coche. ¿Qué haces?
    options: ["Le cedo el paso", "Paso, porque yo sigo recto", "Paso, porque llegué primero", "Le cedo solo si va por la derecha"]
    answer: 0
    explain: Los haaientanden mandan ceder el paso a los conductores de la vía que cruzas, vengan por donde vengan y llegues cuando llegues.
    cites: ["rvv:80"]

  - id: mv-bus-coche
    type: yesno
    prompt: La calzada está atascada y hay un carril con la palabra BUS pintada, libre. Conduces tu coche. ¿Puedes usarlo para adelantar la cola?
    answer: false
    explain: El carril BUS es solo para autobuses de línea, autobuses y tranvías (art. 81). Un coche no está en la lista, aunque el carril esté libre.
    cites: ["rvv:81"]

  - id: mv-fietsstrook
    type: yesno
    prompt: Conduces un auto. ¿Puedes usar un fietsstrook con líneas continuas?
    answer: false
    explain: Los demás conductores no pueden usar fietsstroken con líneas continuas.
    cites: ["rvv:10.2"]

  - id: mv-amarilla-pasajero
    type: yesno
    prompt: Junto a una línea amarilla continua, paras unos segundos para que baje tu pasajero y sigues. ¿Está permitido?
    answer: false
    explain: Junto a una línea amarilla continua no puedes detenerte (stilstaan), ni siquiera un momento. La única excepción para dejar pasajeros es la parada de bus (art. 23.2).
    cites: ["rvv:23.1", "rvv:23.2"]

  - id: mv-amarilla-disc-pasajero
    type: yesno
    prompt: Junto a una línea amarilla discontinua, paras unos segundos para que baje tu pasajero y sigues. ¿Está permitido?
    answer: true
    explain: La línea discontinua solo prohíbe estacionar (art. 24.1). Estacionar no incluye el tiempo necesario para que suba o baje un pasajero (art. 1). Dejar el coche allí un rato sí estaría prohibido.
    cites: ["rvv:24.1", "rvv:1"]

  - id: mv-5m-cruce
    type: yesno
    prompt: Quieres dejar el coche aparcado una hora a 3 m de un cruce, en una calle sin ninguna línea pintada. ¿Puedes?
    answer: false
    explain: No puedes estacionar a menos de 5 m de un cruce (art. 24.1), aunque no haya líneas ni señales.
    cites: ["rvv:24.1"]

  - id: mv-5m-cebra
    type: yesno
    prompt: Paras 3 m antes de un paso de peatones solo para que baje tu pasajero. ¿Puedes?
    answer: false
    explain: No puedes detenerte (stilstaan) sobre un paso de peatones ni a menos de 5 m de él (art. 23.1). La excepción para pasajeros del art. 23.2 vale solo en la parada de bus.
    cites: ["rvv:23.1", "rvv:23.2"]
