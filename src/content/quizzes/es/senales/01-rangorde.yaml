questions:
  - id: rangorde-agente-semaforo
    type: mc
    prompt: El semáforo de tu dirección está en verde, pero un agente de policía te hace señal de parar. ¿Qué haces?
    options: ["Sigues, porque el semáforo está en verde", "Paras, porque la indicación del agente manda sobre el semáforo", "Esperas a que el semáforo cambie a amarillo"]
    answer: 1
    explain: Las indicaciones de un agente o de un controlador autorizado van por encima de las señales, los semáforos y las reglas.
    cites: ["rvv:84"]

  - id: rangorde-agente-rojo
    type: yesno
    prompt: El semáforo está en rojo y un agente te hace señal de que avances. ¿Debes seguir al agente?
    answer: true
    explain: La indicación del agente manda sobre el semáforo, tanto para parar como para avanzar.
    cites: ["rvv:84"]

  - id: rangorde-semaforo-b1
    type: mc
    prompt: Estás en una vía con prioridad y llegas a un cruce con el semáforo en rojo. ¿Qué haces?
    sign: B1
    options: ["Sigues, porque tienes prioridad", "Paras, porque el semáforo manda sobre las señales de prioridad", "Reduces y sigues si no viene nadie"]
    answer: 1
    explain: Los semáforos van por encima de las señales que regulan la prioridad. Con luz roja, paras aunque la vía tenga prioridad.
    cites: ["rvv:64", "rvv:68.1"]

  - id: rangorde-b6-izquierda
    type: mc
    prompt: Llegas a un cruce sin semáforo con esta señal delante. Por la vía que cruza, un auto se acerca desde tu izquierda. ¿Quién pasa primero?
    sign: B6
    options: ["Tú, porque la regla de la derecha solo te hace ceder a quien viene por tu derecha", "El otro auto, porque la señal manda sobre la regla general", "El que llegue primero al cruce, porque no hay semáforo"]
    answer: 1
    explain: La señal B6 te obliga a dar voorrang a la vía que cruza. Una señal pasa por encima de la regla general de la derecha, y aquí la señal te hace ceder aunque el otro venga por tu izquierda.
    cites: ["rvv:63", "rvv:bijlage1.B6", "rvv:80"]

  - id: rangorde-cadena-tres
    type: mc
    prompt: Llegas a un cruce de una vía con prioridad (B1). Tu semáforo está en verde y un agente te hace señal de parar. ¿Qué sigues?
    sign: B1
    options: ["Al agente: paras", "Al semáforo: sigues, porque está en verde", "La señal B1: sigues, porque tienes prioridad"]
    answer: 0
    explain: El agente va por encima del semáforo (art. 84) y el semáforo por encima de la señal de prioridad (art. 64). El agente gana a los dos.
    cites: ["rvv:84", "rvv:64"]

  - id: rangorde-prohibicion-navegador
    type: mc
    prompt: Conduces un auto y tu navegador te manda por una calle que tiene la señal C12 (cerrado para todos los vehículos de motor). ¿Qué haces?
    sign: C12
    options: ["Obedezco la señal y busco otra ruta", "Entro, porque el navegador conoce mejor la zona", "Entro solo si no veo a nadie en la calle"]
    answer: 0
    explain: Los usuarios de la vía deben obedecer las señales que contienen una prohibición (art. 62). El navegador no es un verkeersteken y no cambia la prohibición, haya o no gente en la calle.
    cites: ["rvv:62", "rvv:bijlage1.C12"]

  - id: rangorde-marcas-temporales
    type: mc
    prompt: En unas obras hay marcas viales temporales en la calzada que contradicen las marcas antiguas. ¿Cuáles sigues?
    options: ["Las antiguas, porque llevan más tiempo", "Las temporales, porque mandan sobre las otras marcas en lo incompatible", "La que te parezca más segura"]
    answer: 1
    explain: Las marcas temporales en la calzada van por encima de las marcas ya existentes, en lo que sean incompatibles.
    cites: ["rvv:63a"]

  - id: rangorde-b1-derecha
    type: mc
    prompt: Circulas por una vía con la señal B1. En un cruce sin semáforo, un auto sale de una vía lateral por tu derecha. ¿Quién pasa primero?
    sign: B1
    options: ["Tú, porque tu señal manda sobre la regla de la derecha", "El otro auto, porque viene por tu derecha", "El que llegue primero al cruce"]
    answer: 0
    explain: Una señal de prioridad va por encima de la regla general de la derecha (art. 63), así que la regla de la derecha no se aplica en ese cruce y el que viene de la vía lateral debe ceder.
    cites: ["rvv:63", "rvv:bijlage1.B1"]

  - id: rangorde-agente-b7
    type: mc
    prompt: Tienes una señal de stop en tu vía, pero un controlador de tráfico autorizado te hace gestos de que avances. ¿Qué haces?
    sign: B7
    options: ["Paras de todas formas, porque la señal de stop se cumple siempre", "Sigues la indicación del controlador", "Esperas a que el controlador salga del cruce"]
    answer: 1
    explain: Las indicaciones de un agente o controlador autorizado van por encima de las señales y las reglas.
    cites: ["rvv:84", "rvv:bijlage1.B7"]
