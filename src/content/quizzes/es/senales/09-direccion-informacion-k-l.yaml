questions:

  - id: kl-k2-salida
    type: mc
    prompt: Circulas por una autosnelweg y quieres tomar la salida 14. Ves esta señal, que indica salida 14 a 1 km con sus destinos. ¿Qué te dice?
    sign: K2
    options: ["Que la salida 14 está a 1 km y es hora de prepararte", "Que la salida 14 empieza ya", "Que debes tomar la salida 14", "Que la salida 14 está cerrada"]
    answer: 0
    explain: K2 es un preaviso de salida, con distancia, número y destinos. No es una orden de salir ni marca el punto exacto de la salida; te deja tiempo para elegir carril.
    cites: ["rvv:bijlage1.K2"]

  - id: kl-l4-direccion
    type: yesno
    prompt: Estás en un carril de preselección con una flecha a la izquierda y, en el cruce, decides seguir recto. ¿Puedes hacerlo desde ese carril?
    sign: L4
    answer: false
    explain: Quien circula por la calzada debe seguir en el cruce la dirección que indica el carril de preselección en el que está (art. 78.1). Hay que elegir el carril antes de entrar en él, y L4 te avisa para eso.
    cites: ["rvv:78.1", "rvv:bijlage1.L4"]

  - id: kl-l8-entrar
    type: yesno
    prompt: Tu destino está en una calle con esta señal de calle sin salida (L8) y no hay otra señal. ¿Puedes entrar?
    sign: L8
    answer: true
    explain: 'L8 es informativa (Doodlopende weg): avisa de que la calle no tiene salida, pero no la cierra. Una prohibición de entrada sería una señal C.'
    cites: ["rvv:bijlage1.L8"]

  - id: kl-l13-parar
    type: yesno
    prompt: Estás dentro de un túnel (L13) y quieres detenerte un momento a mirar el mapa, sin que el tráfico te obligue. ¿Puedes?
    sign: L13
    answer: false
    explain: No puedes detenerte (stilstaan) en un túnel (art. 23.1.d), ni siquiera un momento.
    cites: ["rvv:23.1.d", "rvv:bijlage1.L13"]

  - id: kl-l14-mapa
    type: yesno
    prompt: Circulas por una autosnelweg, tu auto funciona bien y quieres mirar el mapa del móvil. Ves una vluchthaven (L14) vacía. ¿Puedes parar allí?
    sign: L14
    answer: false
    explain: La vluchthaven, la vluchtstrook y la berma solo se pueden usar en casos de emergencia (art. 43.3). Mirar el mapa con el auto funcionando bien no es una emergencia.
    cites: ["rvv:43.3", "rvv:bijlage1.L14"]

  - id: kl-l14-averia
    type: yesno
    prompt: En una autosnelweg tu auto se avería y se para. A tu derecha hay una vluchthaven (L14). ¿Puedes usarla?
    sign: L14
    answer: true
    explain: La prohibición de usar la vluchtstrook, la vluchthaven y la berma tiene una excepción para los casos de emergencia (art. 43.3), y una avería lo es.
    cites: ["rvv:43.3", "rvv:bijlage1.L14"]

  - id: kl-l12-otro-carril
    type: mc
    prompt: Una vía tiene dos carriles. Sobre el carril derecho hay una señal de velocidad máxima de 70 km/h y, bajo ella, un panel L12 que indica solo ese carril. Tú circulas por el carril izquierdo. ¿Qué límite te afecta por esa señal?
    sign: L12
    options: ["Ninguno de esa señal: vale solo para el carril derecho", "70 km/h, porque la señal está en tu vía", "70 km/h, pero solo si cambias al carril derecho"]
    answer: 0
    explain: Una señal puede limitarse a uno o varios carriles (art. 65.1) y L12 indica que solo vale para el carril señalado. Por el carril izquierdo no te alcanza. Sigue valiendo, claro, el máximo general de la vía.
    cites: ["rvv:65.1", "rvv:bijlage1.L12"]
