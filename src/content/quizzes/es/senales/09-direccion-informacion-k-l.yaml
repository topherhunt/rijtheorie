    sign: K14
    options: ["Ruta para transporte de ciertas mercancías peligrosas", "Cerrado para mercancías peligrosas", "Desvío", "Zona ambiental"]
    answer: 0
    explain: K14 es una ruta para ciertos transportes de mercancías peligrosas. La prohibición para esas mercancías es C22.
