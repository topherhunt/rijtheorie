questions:
  - id: kl-k2-preaviso
    type: mc
    prompt: ¿Qué te da esta señal en una autosnelweg?
    sign: K2
    options: ["Preaviso de salida con distancia, número y destinos", "Un desvío", "Un área de servicio", "El fin de la autopista"]
    answer: 0
    explain: K2 es el preaviso de salida en una autosnelweg.
    cites: ["rvv:bijlage1.K2"]


  - id: kl-k9-omleiding
    type: mc
    prompt: ¿Qué indica esta señal?
    sign: K9
    options: ["Un desvío (omleiding)", "Calle sin salida", "Un destino de autopista", "Un barrio"]
    answer: 0
    explain: K9 es "Omleiding".
    cites: ["rvv:bijlage1.K9"]


  - id: kl-l5-fin-carril
    type: mc
    prompt: ¿Qué indica esta señal?
    sign: L5
    options: ["Fin de carril", "Bifurcación", "Preselección de carriles", "Estrechamiento"]
    answer: 0
    explain: L5 es "Einde rijstrook".
    cites: ["rvv:bijlage1.L5"]


  - id: kl-l8-sinsalida
    type: mc
    prompt: ¿Qué indica esta señal?
    sign: L8
    options: ["Calle sin salida", "Vía de sentido único", "Fin de zona urbana", "Callejón con prohibición"]
    answer: 0
    explain: L8 es "Doodlopende weg".
    cites: ["rvv:bijlage1.L8"]


  - id: kl-l16-l17
    type: mc
    prompt: ¿Qué indica esta señal?
    sign: L17
    options: ["Extintor", "Teléfono de emergencia", "Salida de emergencia", "Parada de bomberos"]
    answer: 0
    explain: L17 es el extintor. L16 es el teléfono de emergencia y L18 son ambos.
    cites: ["rvv:bijlage1.L17"]


  - id: kl-l13-parar
    type: yesno
    prompt: Estás dentro de un túnel (L13) y quieres detenerte un momento a mirar el mapa, sin que el tráfico te obligue. ¿Puedes?
    sign: L13
    answer: false
    explain: No puedes detenerte (stilstaan) en un túnel (art. 23.1.d), ni siquiera un momento.
    cites: ["rvv:23.1.d", "rvv:bijlage1.L13"]

  - id: kl-l3-pasajero
    type: mc
    prompt: Junto a una parada de bus (L3, con marca de bloques) necesitas detener tu auto. ¿Qué es lícito?
    sign: L3
    options: ["Detenerme el tiempo inmediato para que baje un pasajero", "Detenerme 5 minutos a esperar a alguien", "Estacionar si pongo las luces de emergencia"]
    answer: 0
    explain: A la altura de la marca de bloques no puedes detenerte, salvo para el in- o uitstappen inmediato de pasajeros (art. 23.1.e y 23.2). Esperar a alguien o estacionar no entra en esa excepción, y las luces de emergencia no cambian nada.
    cites: ["rvv:23.1.e", "rvv:23.2", "rvv:bijlage1.L3"]

  - id: kl-l3-espera
    type: yesno
    prompt: Llegas a una parada de bus (L3) con marca de bloques en la calzada. Un amigo sale de una tienda en un minuto y quieres esperarlo junto a la marca, con el motor en marcha. ¿Puedes?
    sign: L3
    answer: false
    explain: Esperar a alguien es detenerse (stilstaan) y no es el in- o uitstappen inmediato de pasajeros, así que no está dentro de la excepción (art. 23.1.e y 23.2).
    cites: ["rvv:23.1.e", "rvv:23.2", "rvv:bijlage1.L3"]

  - id: kl-l14-descansar
    type: yesno
    prompt: Ves L14 (vluchthaven) en una autosnelweg. Estás cansado pero tu auto funciona bien. ¿Puedes parar allí a descansar?
    sign: L14
    answer: false
    explain: Salvo en emergencias no puedes usar la vluchtstrook, la vluchthaven ni la berma (art. 43.3). Estar cansado no es una emergencia del vehículo.
    cites: ["rvv:43.3", "rvv:bijlage1.L14"]

  - id: kl-l14-averia
    type: yesno
    prompt: En una autosnelweg tu auto se avería y se para. A tu derecha hay una vluchthaven (L14). ¿Puedes usarla?
    sign: L14
    answer: true
    explain: La prohibición de usar la vluchtstrook, la vluchthaven y la berma tiene una excepción para los casos de emergencia (art. 43.3), y una avería lo es.
    cites: ["rvv:43.3", "rvv:bijlage1.L14"]

  - id: kl-l12-otro-carril
    type: mc
    prompt: Una vía tiene dos carriles. Sobre el carril derecho hay una señal de velocidad máxima de 70 km/h y, bajo ella, un panel L12 que indica solo ese carril. Tú circulas por el carril izquierdo. ¿Qué límite te afecta por esa señal?
    sign: L12
    options: ["Ninguno de esa señal: vale solo para el carril derecho", "70 km/h, porque la señal está en tu vía", "70 km/h, pero solo si cambias al carril derecho"]
    answer: 0
    explain: Una señal puede limitarse a uno o varios carriles (art. 65.1) y L12 indica que solo vale para el carril señalado. Por el carril izquierdo no te alcanza. Sigue valiendo, claro, el máximo general de la vía.
    cites: ["rvv:65.1", "rvv:bijlage1.L12"]
