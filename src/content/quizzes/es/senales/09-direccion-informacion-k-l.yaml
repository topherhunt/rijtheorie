questions:
  - id: kl-k2-preaviso
    type: mc
    prompt: ¿Qué te da esta señal en una autosnelweg?
    sign: K2
    options: ["Preaviso de salida con distancia, número y destinos", "Un desvío", "Un área de servicio", "El fin de la autopista"]
    answer: 0
    explain: K2 es el preaviso de salida en una autosnelweg.
    cites: ["rvv:bijlage1.K2"]

  - id: kl-k3-servicio
    type: mc
    prompt: ¿Qué indica esta señal en una autosnelweg?
    sign: K3
    options: ["Salida hacia un área de servicio", "Salida hacia una ciudad", "Parada de emergencia", "Peaje"]
    answer: 0
    explain: K3 es el indicador de salida hacia un área de servicio.
    cites: ["rvv:bijlage1.K3"]

  - id: kl-k4-portico
    type: mc
    prompt: Sobre los carriles de una autosnelweg ves esta señal. ¿Qué muestra?
    sign: K4
    options: ["Destinos por carril y la salida", "Velocidad máxima de cada carril", "Que el carril está cerrado", "Un peaje"]
    answer: 0
    explain: K4 es un cartel alto con un panel por carril para la dirección que continúa.
    cites: ["rvv:bijlage1.K4"]

  - id: kl-k9-omleiding
    type: mc
