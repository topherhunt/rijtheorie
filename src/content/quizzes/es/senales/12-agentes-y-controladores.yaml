questions:
  - id: ag-quien
    type: multi
    prompt: ¿De quién debes seguir las instrucciones orales o con gestos?
    options: ["Un funcionario competente y reconocible", "Un militar de la Koninklijke Marechaussee", "Un verkeersregelaar competente y reconocible", "Un vigilante de un aparcamiento privado con chaleco"]
    answer: [0, 1, 2]
    explain: Art. 82.1 nombra a los funcionarios competentes, la Marechaussee y los verkeersregelaars. Un vigilante privado con chaleco no está en la lista.
    cites: ["rvv:82.1"]

  - id: ag-no-reconocible
    type: mc
    prompt: Con el semáforo en rojo, un hombre en ropa de calle, sin nada que lo identifique, te hace gestos para que pases. ¿Qué haces?
    options: ["Sigo el semáforo y espero", "Paso, porque me hace gestos", "Paso si no viene nadie", "Paso despacio, como con un amarillo"]
    answer: 0
    explain: Solo obligan las instrucciones de personas competentes y reconocibles como tales (art. 82.1). Sin eso no tienes que seguirlo y el semáforo manda.
    cites: ["rvv:82.1", "rvv:84"]

  - id: ag-brigadier-verde
    type: mc
    prompt: Tienes verde. Junto a una escuela, un verkeersbrigadier reconocible te muestra la señal de parar para dejar cruzar a los niños. ¿Qué haces?
    options: ["Me detengo, aunque el semáforo esté en verde", "Sigo, porque tengo verde", "Reduzco y paso si los niños aún están lejos", "Toco la bocina y sigo"]
    answer: 0
    explain: Los conductores deben obedecer la instrucción de parar del verkeersbrigadier (art. 82.3), y las instrucciones van por encima de los semáforos (art. 84).
    cites: ["rvv:82.3", "rvv:84"]

  - id: ag-lampara-roja
    type: mc
    prompt: Un agente reconocible, desde el arcén, te muestra una lámpara roja. ¿Qué debes hacer?
    options: ["Detenerme", "Reducir la velocidad", "Ceder el paso", "Continuar con cuidado"]
    answer: 0
    explain: "Art. 83: una lámpara roja mostrada como stopteken obliga a parar."
    cites: ["rvv:83"]

  - id: ag-stop-politie
    type: mc
    prompt: Un coche de la policía tiene un letrero iluminado con las palabras "stop politie" en rojo. ¿Qué debes hacer?
    options: ["Detenerme", "Adelantar al coche de policía", "Cambiar de carril y continuar", "Reducir y continuar si no hay peligro"]
    answer: 0
    explain: El letrero iluminado en un vehículo policial con "stop" o "stop politie" obliga a parar; reducir o esquivar no basta.
    cites: ["rvv:83"]

  - id: ag-gesto-brazo-arriba
    type: mc
    prompt: Un agente en un cruce levanta un brazo en vertical, como en el dibujo. ¿Qué significa?
    image: rvv-gesto-1.webp
    imageAlt: Agente de tráfico con un brazo levantado en vertical.
    options: ["Todos paran", "Solo para el tráfico que viene por su derecha", "Reduce la velocidad", "Puedes pasar"]
    answer: 0
    explain: "Gesto 1 del anexo II: algemeen stopteken, la señal general de parar."
    cites: ["rvv:82.2", "rvv:bijlage2"]

  - id: ag-gesto-dedo
    type: mc
    prompt: Un agente levanta el brazo con el dedo índice hacia arriba. Tú tenías paso y aún no has entrado en el cruce. ¿Qué haces?
    image: rvv-gesto-6.webp
    imageAlt: Agente de tráfico con el brazo levantado y el dedo índice hacia arriba.
    options: ["Paro", "Sigo, porque tenía paso", "Acelero para pasar antes del cambio", "Toco la bocina"]
    answer: 0
    explain: "Gesto 6: parar para el tráfico que tenía paso (vrije richtingen), atención para el que estaba parado, y quien ya está en el cruce lo deja libre."
    cites: ["rvv:82.2", "rvv:bijlage2"]

  - id: ag-gesto-brazos
    type: yesno
    prompt: Un agente te mira de frente con los dos brazos extendidos a los lados. ¿Debes parar?
    image: rvv-gesto-4.webp
    imageAlt: Agente de tráfico de frente, con los dos brazos extendidos horizontalmente a los lados.
    answer: true
    explain: "Gesto 4: parar el tráfico que se acerca al agente por delante y por detrás. Tú llegas por delante."
    cites: ["rvv:82.2", "rvv:bijlage2"]

  - id: ag-gesto-lento
    type: mc
    prompt: Un agente extiende el brazo y lo mueve hacia arriba y hacia abajo. ¿Qué significa?
    image: rvv-gesto-7.webp
    imageAlt: Agente de tráfico de perfil, con el brazo extendido que sube y baja.
    options: ["Reduce la velocidad", "Para", "Acelera", "Gira a la derecha"]
    answer: 0
    explain: "Gesto 7: teken tot snelheid verminderen, reducir la velocidad."
    cites: ["rvv:82.2", "rvv:bijlage2"]
