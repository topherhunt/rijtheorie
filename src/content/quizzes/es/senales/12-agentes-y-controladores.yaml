questions:
  - id: ag-agente-sobre-semaforo
    type: mc
    prompt: El semáforo está en rojo, pero un agente te hace señas para que avances. ¿Qué haces?
    options: ["Sigo la instrucción del agente", "Espero el verde", "Avanzo solo si no viene nadie y luego sigo al agente", "Ignoro al agente"]
    answer: 0
    explain: Las instrucciones de personas autorizadas van por encima de los verkeerstekens y las reglas.
    cites: ["rvv:84"]

  - id: ag-quien
    type: multi
    prompt: ¿De quién debes seguir las instrucciones orales o con gestos?
    options: ["Un funcionario competente y reconocible", "Un militar de la Koninklijke Marechaussee", "Un verkeersregelaar competente y reconocible", "Cualquier peatón que haga gestos"]
    answer: [0, 1, 2]
    explain: Art. 82.1. Un peatón cualquiera no tiene autoridad.
    cites: ["rvv:82.1"]

  - id: ag-oral
    type: yesno
    prompt: ¿Debes obedecer una instrucción dada solo de palabra por un agente reconocible?
    answer: true
    explain: Las instrucciones valen tanto orales como con gestos.
    cites: ["rvv:82.1"]

  - id: ag-brigadier
    type: yesno
    prompt: Un verkeersbrigadier reconocible te muestra la instrucción de parar. ¿Estás obligado a obedecer?
    answer: true
    explain: El art. 82.3 obliga a los conductores a obedecerla.
    cites: ["rvv:82.3"]

  - id: ag-lampara-roja
    type: mc
    prompt: Alguien te muestra una lámpara roja. ¿Qué debes hacer?
    options: ["Detenerme", "Reducir la velocidad", "Ceder el paso", "Continuar con cuidado"]
    answer: 0
    explain: "Art. 83: una lámpara roja es una señal de stop."
    cites: ["rvv:83"]

  - id: ag-stop-politie
    type: mc
    prompt: Un coche de la policía tiene un letrero iluminado con las palabras "stop politie" en rojo. ¿Qué debes hacer?
    options: ["Detenerme", "Adelantar", "Reducir y continuar", "Ignorarlo si voy con prisa"]
    answer: 0
    explain: El letrero iluminado en un vehículo policial con "stop" o "stop politie" obliga a parar.
    cites: ["rvv:83"]

  - id: ag-f10-rail
    type: yesno
    prompt: El acompañante de un vehículo sobre raíles te muestra una bandera roja. ¿Debes parar?
    sign: F10
    answer: true
    explain: "Art. 82.4: señal F10, bandera roja o lámpara roja."
    cites: ["rvv:82.4"]

  - id: ag-gestos-anexo
    type: mc
    prompt: ¿Qué modelos siguen, en lo posible, los gestos de los controladores?
    options: ["Los del anexo II del RVV", "Los del anexo 1 (señales)", "Los que decida cada agente", "Los del reglamento europeo"]
    answer: 0
    explain: Art. 82.2.
    cites: ["rvv:82.2"]
    exam: false

  - id: ag-orden
    type: mc
    prompt: ¿Cuál de estas cosas manda sobre todas las demás?
    options: ["La instrucción de un agente o controlador", "El semáforo", "Una señal de prioridad", "La regla general de tráfico"]
    answer: 0
    explain: Las instrucciones van sobre los verkeerstekens y las reglas (art. 84). Los semáforos van sobre las señales de prioridad (art. 64).
    cites: ["rvv:84", "rvv:64"]

  - id: ag-gesto-brazo-arriba
    type: mc
    prompt: Un agente en un cruce levanta un brazo en vertical, como en el dibujo. ¿Qué significa?
    image: rvv-gesto-1.webp
    imageAlt: Agente de tráfico con un brazo levantado en vertical.
    options: ["Todos paran", "Solo para el tráfico que viene por su derecha", "Reduce la velocidad", "Puedes pasar"]
    answer: 0
    explain: "Gesto 1 del anexo II: algemeen stopteken, la señal general de parar."
    cites: ["rvv:82.2", "rvv:bijlage2"]

  - id: ag-gesto-dedo
    type: mc
    prompt: Un agente levanta el brazo con el dedo índice hacia arriba. Tú tenías paso y aún no has entrado en el cruce. ¿Qué haces?
    image: rvv-gesto-6.webp
    imageAlt: Agente de tráfico con el brazo levantado y el dedo índice hacia arriba.
    options: ["Paro", "Sigo, porque tenía paso", "Acelero para pasar antes del cambio", "Toco la bocina"]
    answer: 0
    explain: "Gesto 6: parar para el tráfico que tenía paso (vrije richtingen), atención para el que estaba parado, y quien ya está en el cruce lo deja libre."
    cites: ["rvv:82.2", "rvv:bijlage2"]

  - id: ag-gesto-brazos
    type: yesno
    prompt: Un agente te mira de frente con los dos brazos extendidos a los lados. ¿Debes parar?
    image: rvv-gesto-4.webp
    imageAlt: Agente de tráfico de frente, con los dos brazos extendidos horizontalmente a los lados.
    answer: true
    explain: "Gesto 4: parar el tráfico que se acerca al agente por delante y por detrás. Tú llegas por delante."
    cites: ["rvv:82.2", "rvv:bijlage2"]

  - id: ag-gesto-lento
    type: mc
    prompt: Un agente extiende el brazo y lo mueve hacia arriba y hacia abajo. ¿Qué significa?
    image: rvv-gesto-7.webp
    imageAlt: Agente de tráfico de perfil, con el brazo extendido que sube y baja.
    options: ["Reduce la velocidad", "Para", "Acelera", "Gira a la derecha"]
    answer: 0
    explain: "Gesto 7: teken tot snelheid verminderen, reducir la velocidad."
    cites: ["rvv:82.2", "rvv:bijlage2"]
