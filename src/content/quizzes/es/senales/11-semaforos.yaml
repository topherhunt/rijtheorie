questions:
  - id: sf-amarillo
    type: mc
    prompt: El semáforo cambia a amarillo cuando aún puedes frenar con seguridad antes de la línea. ¿Qué haces?
    options: ["Me detengo antes de la línea blanca", "Acelero un poco para pasar antes del rojo", "Paso si no hay nadie en el cruce ni detrás", "Paso si voy rápido y veo que está libre"]
    answer: 0
    explain: El amarillo manda detenerse. Solo continúas si estás tan cerca que ya no puedes parar razonablemente.
    cites: ["rvv:68.1", "cbr-rijprocedure:3.3"]

  - id: sf-amarillo-frenada
    type: mc
    prompt: Vas a 50 km/h y el semáforo pasa a amarillo cuando estás casi sobre la línea. Un camión viene pegado detrás de ti y frenar en seco crearía peligro. ¿Qué haces?
    options: ["Continúo, porque ya no puedo parar razonablemente", "Freno a fondo, porque el amarillo siempre manda parar", "Acelero para cruzar antes del rojo", "Paro justo encima de la línea"]
    answer: 0
    explain: El art. 68.1 te deja continuar si estás tan cerca que ya no puedes parar razonablemente, y el CBR concreta que no frenes si eso crea peligro para el tráfico de detrás. Frenar a fondo aquí es el error; acelerar tampoco es necesario.
    cites: ["rvv:68.1", "cbr-rijprocedure:3.3"]

  - id: sf-rojo-stopstreep
    type: mc
    prompt: Te acercas a un semáforo en rojo. Delante de él hay una línea blanca de parada. ¿Dónde te detienes?
    options: ["Detrás de la línea blanca, sin pasarla", "Con las ruedas delanteras sobre la línea", "Pasada la línea, para ver mejor el semáforo", "Donde quede sitio, aunque pases la línea"]
    answer: 0
    explain: Si debes detenerte (rojo) y hay una stopstreep para ti, paras antes de ella.
    cites: ["rvv:68.1", "rvv:79"]

  - id: sf-verde-cola
    type: mc
    prompt: Tienes verde, pero la cola de delante avanza tan despacio que, al volverse rojo, te quedarías parado en medio del cruce. ¿Qué haces?
    options: ["Espero antes del cruce hasta poder salir de él", "Entro, porque el verde me da derecho a pasar", "Entro y toco la bocina para que avancen", "Entro solo si no vienen coches de los lados"]
    answer: 0
    explain: El verde te deja avanzar, pero no te permite bloquear el cruce. Entras solo si puedes seguir de largo o dejarlo libre; que no vengan coches de los lados no cambia eso.
    cites: ["rvv:14", "cbr-rijprocedure:3.3"]

  - id: sf-flecha-recto
    type: mc
    prompt: Tu semáforo está en rojo, pero a su lado se enciende una flecha verde hacia la derecha. Quieres seguir recto. ¿Qué haces?
    options: ["Me quedo parado: la flecha vale solo para la derecha", "Sigo recto, porque la flecha verde me deja pasar", "Sigo recto si no viene nadie por los lados", "Giro a la izquierda, porque la flecha no lo prohíbe"]
    answer: 0
    explain: Una flecha iluminada hace que la luz valga solo para esa dirección. Para seguir recto sigue valiendo el rojo.
    cites: ["rvv:68.2", "rvv:68.1"]

  - id: sf-bici-coche
    type: mc
    prompt: Estás en tu coche ante un semáforo en rojo. Al lado, el semáforo con la imagen de una bicicleta está en verde. ¿Puedes avanzar?
    options: ["No, esa luz es para los ciclistas", "Sí, porque hay una luz verde delante de mí", "Sí, si avanzo muy despacio y con cuidado", "Sí, si no hay ningún ciclista cerca del cruce"]
    answer: 0
    explain: La luz con la imagen de bicicleta vale para ciclistas, ciclomotoristas en un fiets/bromfietspad y vehículos para discapacitados, no para un coche.
    cites: ["rvv:68.3", "rvv:68.1"]

  - id: sf-derecha-bici
    type: yesno
    prompt: Con el panel "Rechtsaf voor (brom)fietsers vrij", un ciclista llega con luz roja y gira a la derecha. ¿Tiene prioridad sobre el resto del tráfico?
    answer: false
    explain: El rojo y el amarillo no le valen, pero debe dejar pasar primero al resto del tráfico.
    cites: ["rvv:68.5"]

  - id: sf-tram-blanca
    type: mc
    prompt: Una luz blanca en un semáforo de tranvía o bus, ¿qué significa?
    options: ["Vía libre, solo en las direcciones marcadas", "Vía libre en cualquier dirección que quieras", "Detenerse hasta que cambie de color", "Precaución, se acerca un tranvía o un bus"]
    answer: 0
    explain: La luz blanca (fija o intermitente) autoriza el paso, y solo en las direcciones indicadas.
    cites: ["rvv:70"]

  - id: sf-overweg-cola
    type: mc
    prompt: La luz blanca del paso a nivel parpadea, pero la cola de delante te dejaría parado encima de las vías al otro lado. ¿Qué haces?
    options: ["Espero antes de las vías del paso a nivel", "Entro, porque no viene ningún tren por las vías", "Entro y acelero para salir pronto de las vías", "Entro hasta la mitad y espero ahí"]
    answer: 0
    explain: La luz blanca dice que no se acerca ningún tren, pero solo puedes entrar en un paso a nivel si puedes seguir de inmediato y dejarlo del todo libre.
    cites: ["rvv:71", "rvv:15a.1"]

  - id: sf-brug
    type: mc
    prompt: En un puente móvil la luz está roja. ¿Qué haces?
    options: ["Me detengo y espero a que cambie la luz", "Paso si no hay ningún barco a la vista del puente", "Paso con precaución a baja velocidad por el puente", "Paso si la barrera todavía está levantada"]
    answer: 0
    explain: "Rojo o rojo intermitente en un bruglicht: detenerse."
    cites: ["rvv:72"]

  - id: sf-amarillo-intermitente
    type: mc
    prompt: El semáforo de un cruce muestra solo amarillo intermitente. ¿Qué haces?
    options: ["Extremo la precaución: es un punto peligroso", "Me detengo como si fuera un semáforo en rojo", "Me detengo como con un amarillo normal fijo", "Cedo el paso a todo el tráfico que venga"]
    answer: 0
    explain: Amarillo intermitente señala un punto peligroso y pide precaución; no es una orden de detenerte.
    cites: ["rvv:75"]
