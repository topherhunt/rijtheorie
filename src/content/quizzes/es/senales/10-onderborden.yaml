questions:
  - id: ob-c12-solo-camion
    type: yesno
    prompt: Conduces un auto. Una señal C12 (cerrado para todos los vehículos de motor) lleva debajo un panel que muestra solo el símbolo de un camión. ¿Puedes entrar?
    sign: C12
    answer: true
    explain: Un panel con solo símbolos limita la señal a los usuarios representados. La prohibición vale solo para camiones, y tu auto no lo es.
    cites: ["rvv:67.1", "rvv:bijlage1.C12"]

  - id: ob-paneles-contrario
    type: mc
    prompt: Conduces un auto y llegas a dos calles con C12. La primera lleva debajo un panel con solo el símbolo de un camión. La segunda, un panel con "uitgezonderd" y el símbolo de un camión. ¿En cuál puedes entrar?
    sign: C12
    options: ["Solo en la primera", "Solo en la segunda", "En las dos calles", "En ninguna de las dos"]
    answer: 0
    explain: Con solo símbolos, la señal se limita a los camiones y tu auto puede entrar. Con "uitgezonderd", la señal vale para todos menos los camiones, así que el auto queda cerrado. Sin la palabra clave se limita; con ella se excluye.
    cites: ["rvv:67.1", "rvv:bijlage1.C12"]

  - id: ob-c12-uitgezonderd-moto
    type: yesno
    prompt: Conduces un auto. Una señal C12 lleva debajo un panel con "uitgezonderd" y el símbolo de una moto. ¿Puedes entrar?
    sign: C12
    answer: false
    explain: '"Uitgezonderd" más un símbolo exceptúa solo a lo representado: las motos. Para el auto, C12 sigue cerrando la vía.'
    cites: ["rvv:67.1", "rvv:bijlage1.C12"]

  - id: ob-uitgezonderd-camion
    type: yesno
    prompt: Conduces un camión. Una señal C12 lleva debajo un panel con "uitgezonderd" y el símbolo de un camión. ¿Puedes entrar?
    sign: C12
    answer: true
    explain: El panel con "uitgezonderd" y el símbolo de un camión exceptúa a los camiones de la prohibición.
    cites: ["rvv:67.1", "rvv:bijlage1.C12"]

  - id: ob-c1-uitgezonderd-bici
    type: mc
    prompt: Una señal C1 (cerrado para vehículos en ambos sentidos) lleva debajo un panel con "uitgezonderd" y el símbolo de una bicicleta. ¿Quién puede entrar?
    sign: C1
    options: ["Ciclistas y peatones, pero no los autos", "Solo los ciclistas, pero no los peatones", "Los ciclistas y también los autos", "Nadie, porque C1 no admite excepciones"]
    answer: 0
    explain: Con "uitgezonderd", C1 deja de valer para las bicicletas. Los peatones nunca estuvieron cerrados por C1 (no son voertuigen), y el auto sigue excluido.
    cites: ["rvv:67.1", "rvv:bijlage1.C1", "rvv:1"]

  - id: ob-bestemmingsverkeer
    type: mc
    prompt: Una calle cerrada tiene una casa al fondo que solo se alcanza por esa calle. Según la definición del RVV, ¿cuál de estos conductores es bestemmingsverkeer?
    options: [El que visita a alguien en esa casa, "El que usa la calle para evitar un atasco", "El que vive en el barrio pero va a otra calle", "El que ya ha pasado antes por esa calle"]
    answer: 0
    explain: Bestemmingsverkeer es quien tiene como destino una parcela situada en la calle cerrada (o cerca) y a la que solo se llega por ella. Lo decide el destino, no que pases por allí o vivas cerca.
    cites: ["rvv:1"]

  - id: ob-bestemmingsverkeer-lijnbus
    type: yesno
    prompt: Una calle está cerrada a los vehículos de motor salvo bestemmingsverkeer. Un conductor de autobús de línea (lijnbus) cuya ruta pasa por esa calle, sin parar en ninguna parcela de ella, ¿cuenta como bestemmingsverkeer?
    answer: true
    explain: La definición del art. 1 incluye expresamente a los conductores de lijnbussen, aunque su destino no sea una parcela de esa calle.
    cites: ["rvv:1"]

  - id: ob-c22e-furgoneta
    type: yesno
    prompt: Conduces una furgoneta de empresa diésel y llegas a una señal C22e de una milieuzone cuyo panel incluye a tu vehículo. No te aplica ninguna excepción. ¿Puedes entrar?
    sign: C22e
    answer: false
    explain: La geslotenverklaring de una milieuzone se aplica a autos, vehículos de empresa, camiones y autobuses con motor diésel (art. 86d.1). Sin excepción del art. 86d.3, tu furgoneta diésel queda cerrada.
    cites: ["rvv:86d.1", "rvv:86d.3", "rvv:bijlage1.C22e"]
