questions:
  - id: ob-solo-simbolos
    type: mc
    prompt: Bajo una señal de prohibición hay un panel que muestra solo el símbolo de un camión. ¿A quién se aplica la prohibición?
    options: ["Solo a los camiones", "A todos menos a los camiones", "A todos los vehículos", "A nadie"]
    answer: 0
    explain: Un onderbord con solo símbolos limita la señal a los usuarios representados.
    cites: ["rvv:67.1"]

  - id: ob-c12-solo-camion
    type: yesno
    prompt: Conduces un auto. Una señal C12 (cerrado para todos los vehículos de motor) lleva debajo un panel que muestra solo el símbolo de un camión. ¿Puedes entrar?
    sign: C12
    answer: true
    explain: Un panel con solo símbolos limita la señal a los usuarios representados. La prohibición vale solo para camiones, y tu auto no lo es.
    cites: ["rvv:67.1", "rvv:bijlage1.C12"]

  - id: ob-uitgezonderd
    type: mc
    prompt: Bajo una señal de prohibición hay un panel con la palabra "uitgezonderd" y el símbolo de una bicicleta. ¿Qué significa?
    options: ["La prohibición no se aplica a las bicicletas", "La prohibición se aplica solo a las bicicletas", "La prohibición se aplica a todos por igual", "La bicicleta debe esperar"]
    answer: 0
    explain: '"Uitgezonderd" más símbolos excluye a los usuarios representados.'
    cites: ["rvv:67.1"]

  - id: ob-c12-uitgezonderd-moto
    type: yesno
    prompt: Conduces un auto. Una señal C12 lleva debajo un panel con "uitgezonderd" y el símbolo de una moto. ¿Puedes entrar?
    sign: C12
    answer: false
    explain: '"Uitgezonderd" más un símbolo exceptúa solo a lo representado: las motos. Para el auto, C12 sigue cerrando la vía.'
    cites: ["rvv:67.1", "rvv:bijlage1.C12"]

  - id: ob-uitgezonderd-camion
    type: yesno
    prompt: Conduces un camión. Una señal C12 lleva debajo un panel con "uitgezonderd" y el símbolo de un camión. ¿Puedes entrar?
    sign: C12
    answer: true
    explain: El panel con "uitgezonderd" y el símbolo de un camión exceptúa a los camiones de la prohibición.
    cites: ["rvv:67.1", "rvv:bijlage1.C12"]

  - id: ob-texto
    type: mc
    prompt: Un panel complementario lleva un texto con días y horas. ¿De dónde sale el comportamiento que debes seguir?
    options: ["Del propio onderbord", "De la señal de arriba únicamente", "De una ley local sin señal", "Del semáforo"]
    answer: 0
    explain: Si el comportamiento se indica con textos o signos, resulta del onderbord.
    cites: ["rvv:67.2"]

  - id: ob-carril-f1-l12
    type: yesno
    prompt: Sobre el carril derecho hay una señal F1 con un panel L12 que indica que vale solo para ese carril. Circulas en el carril izquierdo con tu auto. ¿Puedes adelantar a otro auto?
    sign: F1
    answer: true
    explain: Una señal puede limitarse a un carril. La prohibición de F1 no te alcanza si tu carril no es el indicado.
    cites: ["rvv:65.1", "rvv:bijlage1.L12", "rvv:bijlage1.F1"]

  - id: ob-lado-e1
    type: yesno
    prompt: La señal E1 (prohibido estacionar) está en el lado derecho de la calle. ¿Vale también para el lado izquierdo?
    sign: E1
    answer: false
    explain: E1, E2 y E3 valen solo para el lado de la vía donde están colocadas.
    cites: ["rvv:65.2"]

  - id: ob-zone-fin
    type: mc
    prompt: Una señal lleva la palabra "zone" y no indica área. ¿Hasta dónde vale?
    options: ["Hasta la señal de fin de zona", "Hasta el siguiente cruce", "Solo en el punto de la señal", "Cien metros"]
    answer: 0
    explain: Sin área indicada, vale hasta la señal de fin de zona.
    cites: ["rvv:66.2"]
