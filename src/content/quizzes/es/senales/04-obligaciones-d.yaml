questions:
  - id: d-d1-contramano
    type: yesno
    prompt: Quieres girar a la izquierda en una rotonda con esta señal, cuyas flechas van hacia la derecha. Por la izquierda el camino es más corto. ¿Puedes entrar en sentido contrario?
    sign: D1
    answer: false
    explain: D1 es un gebod, una orden de circular en el sentido que muestra la señal. Un camino más corto no cambia nada.
    cites: ["rvv:bijlage1.D1", "rvv:62"]

  - id: d-d2-isleta
    type: yesno
    prompt: Hay un obstáculo en la calzada con esta señal, y la flecha apunta a la derecha. ¿Puedes pasar por su izquierda?
    sign: D2
    answer: false
    explain: D2 te ordena pasar la señal por el lado que indica la flecha. Si la flecha apunta a la derecha, solo puedes pasar por la derecha.
    cites: ["rvv:bijlage1.D2", "rvv:62"]

  - id: d-d3-isleta
    type: yesno
    prompt: Hay un obstáculo en la calzada con esta señal. ¿Puedes pasarlo por la izquierda?
    sign: D3
    answer: true
    explain: D3 significa que la señal puede pasarse por ambos lados.
    cites: ["rvv:bijlage1.D3"]

  - id: d-d4-significado
    type: mc
    prompt: Llegas a un cruce con esta señal. ¿Qué haces?
    sign: D4
    options: ["Sigo en la dirección que indica la flecha", "Puedo elegir cualquier dirección", "Solo cedo el paso", "Giro a la izquierda"]
    answer: 0
    explain: D4 te obliga a seguir la dirección de la flecha.
    cites: ["rvv:bijlage1.D4"]

  - id: d-d4-recto
    type: yesno
    prompt: Quieres girar a la derecha en este cruce, pero la señal tiene una flecha recta. ¿Puedes girar?
    sign: D4
    answer: false
    explain: 'D4 es un gebod: debes seguir la dirección que muestra la flecha. Solo puedes ir recto.'
    cites: ["rvv:bijlage1.D4", "rvv:62"]

  - id: d-d6-varias
    type: yesno
    prompt: Esta señal muestra flechas hacia adelante y hacia la derecha. ¿Puedes girar a la izquierda?
    sign: D6
    answer: false
    explain: D6 te obliga a seguir una de las direcciones indicadas. Ir a la izquierda no es una de ellas.
    cites: ["rvv:bijlage1.D6"]

  - id: d-d6-recto
    type: yesno
    prompt: Esta señal muestra flechas hacia adelante y hacia la derecha. ¿Puedes seguir recto?
    sign: D6
    answer: true
    explain: Una de las direcciones indicadas es seguir recto.
    cites: ["rvv:bijlage1.D6"]

  - id: d-familia
    type: mc
    prompt: ¿Qué tipo de señal es una D (círculo azul con flecha blanca)?
    options: ["Un gebod (orden)", "Un aviso de peligro", "Una prohibición", "Una información"]
    answer: 0
    explain: Las señales D son órdenes. Las C son prohibiciones, las J avisan de peligros.
    cites: ["rvv:62", "rvv:bijlage1.D4"]
    exam: false
