questions:
  - id: d-d1-contramano
    type: yesno
    prompt: Quieres girar a la izquierda en una rotonda con esta señal, cuyas flechas van hacia la derecha. Por la izquierda el camino es más corto. ¿Puedes entrar en sentido contrario?
    sign: D1
    answer: false
    explain: D1 es un gebod, una orden de circular en el sentido que muestra la señal. Un camino más corto no cambia nada.
    cites: ["rvv:bijlage1.D1", "rvv:62"]

  - id: d-d2-derecha
    type: yesno
    prompt: "Hay un obstáculo en la calzada con esta señal. La izquierda está más despejada, pero la flecha apunta a la derecha. ¿Cumples la señal pasando por la derecha?"
    sign: D2
    answer: true
    explain: D2 te ordena pasar la señal por el lado que indica la flecha. Si la flecha apunta a la derecha, solo puedes pasar por la derecha.
    cites: ["rvv:bijlage1.D2", "rvv:62"]

  - id: d-d2-d3-diferencia
    type: mc
    prompt: Hay un obstáculo en la calzada y puedes pasarlo por el lado que quieras. ¿Cuál de estas señales lo permite?
    options: ["D3 (los dos lados)", "D2 (flecha a la derecha)", "D2 (flecha a la izquierda)", "D4 (flecha recta)"]
    answer: 0
    explain: D3 permite pasar la señal por ambos lados. D2 te fija el lado que marca la flecha, y D4 no trata de pasar un obstáculo sino de la dirección que debes seguir.
    cites: ["rvv:bijlage1.D3", "rvv:bijlage1.D2", "rvv:bijlage1.D4"]

  - id: d-d4-seguir-recto
    type: yesno
    prompt: "Llegas a un cruce con esta señal y quieres girar a la derecha. ¿Te lo impide la señal?"
    sign: D4
    answer: true
    explain: 'D4 es un gebod: debes seguir la dirección que muestra la flecha. Solo puedes ir recto.'
    cites: ["rvv:bijlage1.D4", "rvv:62"]

  - id: d-d5-derecha
    type: mc
    prompt: Tu casa queda recto, pero en el cruce hay esta señal con una flecha que gira a la derecha. ¿Qué haces?
    sign: D5
    options: ["Giro a la derecha: es la única dirección posible", "Sigo recto: la flecha solo orienta, no obliga", "Giro a la derecha o sigo recto, como prefiera", "Sigo recto si no viene nadie por la derecha"]
    answer: 0
    explain: D5 es un gebod de seguir la dirección que muestra el dibujo, igual que D4. Que tu destino esté recto o que no venga nadie no cambia la orden.
    cites: ["rvv:bijlage1.D5", "rvv:62"]

  - id: d-d6-varias
    type: yesno
    prompt: Tu destino queda a la izquierda. En el cruce hay esta señal con flechas hacia adelante y hacia la derecha. ¿Puedes girar a la izquierda?
    sign: D6
    answer: false
    explain: D6 te obliga a seguir una de las direcciones indicadas. Ir a la izquierda no es una de ellas.
    cites: ["rvv:bijlage1.D6", "rvv:62"]

  - id: d-d7-recto
    type: yesno
    prompt: Llegas a un cruce con esta señal, que muestra una flecha a la izquierda y otra a la derecha. Quieres seguir recto. ¿Puedes?
    sign: D7
    answer: false
    explain: D7 te obliga a seguir una de las direcciones indicadas, que aquí son izquierda o derecha. Seguir recto no está entre ellas; es D6 la que permite recto y derecha.
    cites: ["rvv:bijlage1.D7", "rvv:62"]

  - id: d-d4-vs-d6
    type: mc
    prompt: En un cruce ves D4 con una flecha recta, y en otro D6 con flechas hacia adelante y hacia la derecha. ¿En cuál de los dos puedes girar a la derecha?
    options: ["Solo en el de D6", "Solo en el de D4", "En los dos", "En ninguno de los dos"]
    answer: 0
    explain: D4 te obliga a seguir la dirección única que muestra, aquí recto. D6 te deja elegir una de las direcciones indicadas, y la derecha es una de ellas.
    cites: ["rvv:bijlage1.D4", "rvv:bijlage1.D6"]

  - id: d-carril-limitada
    type: yesno
    prompt: La calzada tiene dos carriles y una D5 con flecha a la derecha vale solo para el carril derecho. Vas por el carril izquierdo y quieres seguir recto. ¿Te obliga a girar a la derecha?
    sign: D5
    answer: false
    explain: Una señal puede limitarse a uno o varios carriles. Esta obliga a quien va por el carril derecho, no a quien va por el izquierdo.
    cites: ["rvv:65.1", "rvv:bijlage1.D5"]
