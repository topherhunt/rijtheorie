questions:
  - id: e-e1-pasajero
    type: mc
    prompt: Delante de ti está esta señal. Te detienes unos segundos para que baje un pasajero y sigues. ¿Está permitido?
    sign: E1
    options: ["Sí, parar para que baje alguien no es parkeren", "No, E1 prohíbe cualquier parada", "Sí, pero solo si apagas el motor", "No, solo se puede en el lado contrario"]
    answer: 0
    explain: E1 prohíbe estacionar, y estacionar no incluye el tiempo justo para que alguien suba o baje. Detenerte un instante está permitido. Lo que E1 no deja es quedarte esperando.
    cites: ["rvv:1", "rvv:bijlage1.E1"]

  - id: e-e2-pasajero
    type: yesno
    prompt: Delante de ti está esta señal. ¿Puedes detenerte unos segundos para que baje un pasajero?
    sign: E2
    answer: false
    explain: E2 prohíbe stilstaan, y detenerse para que baje alguien también es stilstaan. La excepción de "bajar o subir un momento" existe solo para estacionar (E1), no para detenerse.
    cites: ["rvv:1", "rvv:bijlage1.E2"]

  - id: e-e3-auto
    type: yesno
    prompt: Junto a una señal E3 hay un hueco libre en la calle, sin otras señales ni normas que lo impidan. ¿Puedes dejar ahí tu auto?
    sign: E3
    answer: true
    explain: E3 prohíbe dejar bicicletas y ciclomotores (fietsen en bromfietsen). No menciona los autos, así que la señal no te afecta.
    cites: ["rvv:bijlage1.E3"]

  - id: e-e8-categoria
    type: yesno
    prompt: Un parking tiene una señal E8 con un panel que indica solo camiones. Conduces un auto. ¿Puedes estacionar allí?
    sign: E8
    answer: false
    explain: E8 es una parkeergelegenheid solo para la categoría indicada. Un auto no pertenece a ella.
    cites: ["rvv:24.1", "rvv:bijlage1.E8"]

  - id: e-e9-permiso
    type: yesno
    prompt: Un parking tiene esta señal. No tienes permiso. ¿Puedes estacionar?
    sign: E9
    answer: false
    explain: E9 es solo para titulares de permiso. Sin permiso, no puedes estacionar.
    cites: ["rvv:24.1", "rvv:bijlage1.E9"]

  - id: e-e7-estacionar
    type: yesno
    prompt: Esta señal marca una zona para carga y descarga inmediata de mercancías. ¿Puedes estacionar tu auto allí para ir de compras?
    sign: E7
    answer: false
    explain: En un lugar destinado a carga y descarga inmediata no se puede estacionar.
    cites: ["rvv:24.1", "rvv:bijlage1.E7"]

  - id: e-e8c-cargar
    type: yesno
    prompt: Tienes un auto eléctrico y ves una plaza E8c (solo para cargar vehículos eléctricos). No vas a cargarlo, solo quieres estacionar para ir a comprar. ¿Puedes?
    sign: E8c
    answer: false
    explain: 'E8c es solo para cargar vehículos eléctricos. Ser eléctrico no basta: estacionar con otro fin que el indicado en la señal está prohibido.'
    cites: ["rvv:24.1", "rvv:bijlage1.E8c"]

  - id: e-e6-discapacidad
    type: yesno
    prompt: Vas a estar veinte minutos haciendo una compra y quieres dejar tu auto en una plaza con esta señal. No tienes tarjeta de discapacidad. ¿Puedes?
    sign: E6
    answer: false
    explain: Solo puede estacionar quien tiene tarjeta válida visible (y transporta a esa persona) o un vehículo para personas con discapacidad.
    cites: ["rvv:26.1"]

  - id: e-e6-tarjeta
    type: yesno
    prompt: Llevas a tu abuela, que tiene la tarjeta de estacionamiento para discapacitados bien visible en el parabrisas, a una cita médica. Dejas el auto en una plaza con esta señal mientras ella entra. ¿Puedes?
    sign: E6
    answer: true
    explain: Un auto con tarjeta visible puede estacionar en la plaza si el estacionamiento está directamente relacionado con el transporte de esa persona, como aquí.
    cites: ["rvv:26.1"]

  - id: e-vakken
    type: yesno
    prompt: Un parking con señal E4 tiene plazas marcadas. ¿Puedes estacionar parcialmente fuera de ellas?
    sign: E4
    answer: false
    explain: Si hay parkeervakken, solo puedes estacionar en esos espacios.
    cites: ["rvv:24.4"]

  - id: e-e10-disco
    type: mc
    prompt: Estacionas tu auto en una plaza con línea azul, dentro de una zona con esta señal. ¿Qué debes hacer?
    sign: E10
    options: ["Poner el disco de estacionamiento visible detrás del parabrisas", "Pagar en el parquímetro", "Dejar una nota con tu hora de llegada", "Dejar el motor encendido"]
    answer: 0
    explain: En las plazas con línea azul, un vehículo de motor de más de dos ruedas debe llevar el disco visible detrás del parabrisas, y no puedes pasar del tiempo indicado.
    cites: ["rvv:25.2", "rvv:bijlage1.E10"]

  - id: e-e10-redondeo
    type: mc
    prompt: Llegas a una plaza de disco a las 10:10. ¿Qué hora puedes poner en el disco?
    sign: E10
    options: ["10:30, el siguiente medio hora", "10:00", "10:10 exactas, no se puede redondear", "11:00"]
    answer: 0
    explain: Puedes redondear hacia arriba al siguiente medio o hora entera. 10:30 es el siguiente. Redondear hacia abajo no es lo que dice la ley.
    cites: ["rvv:25.4"]

  - id: e-e10-moto
    type: yesno
    prompt: Dejas tu moto en una plaza con línea azul de una zona de disco. ¿Puedes hacerlo sin poner el disco?
    sign: E10
    answer: true
    explain: La obligación de llevar disco en las plazas con línea azul es para vehículos de motor de más de dos ruedas. La moto tiene dos.
    cites: ["rvv:25.2"]

  - id: e-e12-compras
    type: yesno
    prompt: Estacionas en una plaza P+R (E12) para ir de compras al centro, sin cambiar a otro transporte. ¿Está permitido?
    sign: E12
    answer: false
    explain: E12 es para quienes cambian al transporte público. Usar la plaza con otro fin es una infracción del art. 24.
    cites: ["rvv:24.1", "rvv:bijlage1.E12"]

  - id: e-panel-horas
    type: yesno
    prompt: Bajo una señal E4 hay un panel con "08-18 h, lunes a viernes". ¿Vale la orden de la señal también un sábado?
    sign: E4
    answer: false
    explain: Si el panel indica días y horas, la señal solo vale en esos días y horas.
    cites: ["rvv:24.2"]
