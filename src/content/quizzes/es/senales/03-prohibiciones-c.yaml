questions:

  - id: c-c2-significado
    type: mc
    prompt: Llegas en auto a una calle y ves esta señal frente a ti. ¿Qué haces?
    sign: C2
    options: ["No entro: en esta dirección está cerrado", "Entro: es una calle de sentido único en mi dirección", "No entro: está cerrado en ambos sentidos", "Entro solo si no viene nadie de frente"]
    answer: 0
    explain: "C2 es un eenrichtingsweg visto desde el lado prohibido: en esta dirección está cerrado para vehículos. No es C1, que cierra en ambos sentidos, y que no venga nadie no cambia la prohibición."
    cites: ["rvv:bijlage1.C2"]

  - id: c-c6-c12
    type: mc
    prompt: Conduces un auto y ves esta señal. ¿Puedes entrar?
    sign: C6
    options: ["No, cierra los vehículos de motor de más de dos ruedas", "Sí, solo está cerrado para camiones y autobuses pesados", "Sí, solo está cerrado para motocicletas y ciclomotores", "Sí, los autos particulares no están incluidos en C6"]
    answer: 0
    explain: C6 cierra los vehículos de motor de más de dos ruedas. Tu auto lo es.
    cites: ["rvv:bijlage1.C6"]

  - id: c-c6-moto
    type: mc
    prompt: Vas en moto y tu amigo en auto por la misma calle. Ante esta señal, ¿quién puede entrar?
    sign: C6
    options: ["Los dos", "Solo yo, en moto", "Solo mi amigo, en auto", "Ninguno de los dos"]
    answer: 1
    explain: C6 cierra los vehículos de motor de más de dos ruedas, así que el auto queda fuera y la moto pasa. Si fuera C12, que cierra todos los vehículos de motor, la moto tampoco pasaría.
    cites: ["rvv:bijlage1.C6", "rvv:bijlage1.C12"]

  - id: c-c10-cierra-remolque
    type: yesno
    prompt: "Conduces un auto con remolque y llegas a esta señal C10. ¿Te cierra el paso?"
    sign: C10
    answer: true
    explain: "C10 cierra los vehículos de motor con remolque. El auto sin remolque sí pasaría, pero con remolque queda cerrado."
    cites: ["rvv:bijlage1.C10"]

  - id: c-c1-peaton
    type: mc
    prompt: Una calle tiene en su entrada esta señal. ¿Cuál de estos todavía puede pasar por ella?
    sign: C1
    options: ["Un peatón", "Un ciclista", "Un auto", "Un ciclomotor (bromfiets)"]
    answer: 0
    explain: C1 cierra para voertuigen, jinetes y conductores de animales. El peatón no es un voertuig, así que pasa. La bicicleta, el auto y el ciclomotor sí lo son.
    cites: ["rvv:bijlage1.C1", "rvv:1"]

  - id: c-c12-bromfiets
    type: yesno
    prompt: Con esta señal, ¿puede entrar un ciclomotor (bromfiets)?
    sign: C12
    answer: true
    explain: C12 cierra los motorvoertuigen, y para el RVV una bromfiets no es un motorvoertuig. El que le cierra el paso es C13 (o C15 o C9).
    cites: ["rvv:bijlage1.C12", "rvv:1"]

  - id: c-c14-bromfiets
    type: yesno
    prompt: Con esta señal, ¿puede entrar una bromfiets (de las de 45 km/h, no un snorfiets)?
    sign: C14
    answer: true
    explain: C14 cierra las bicicletas y los vehículos para personas con discapacidad sin motor. Una bromfiets no es una fiets, así que no está incluida.
    cites: ["rvv:bijlage1.C14", "rvv:1"]

  - id: c-ciclomotor-no-bici
    type: mc
    prompt: Conduces un ciclomotor (bromfiets) con el motor en marcha. ¿Cuál de estas señales te cierra el paso?
    options: ["C10", "C11", "C12", "C13"]
    answer: 3
    explain: "C13 cierra bromfietsen, snorfietsen y vehículos para personas con discapacidad con el motor en marcha. C10, C11 y C12 cierran motorvoertuigen, y la bromfiets no lo es."
    cites: ["rvv:bijlage1.C13", "rvv:bijlage1.C12", "rvv:bijlage1.C11", "rvv:bijlage1.C10", "rvv:1"]

  - id: c-c19-carga
    type: yesno
    prompt: Tu furgoneta mide 2,6 m de altura, pero con la carga llega a 3,3 m. Ves C19 con 3,0 m. ¿Puedes pasar?
    sign: C19
    answer: false
    explain: C19 cierra los vehículos que, con la carga incluida, sean más altos de lo indicado. La furgoneta sola cabe, pero con la carga no.
    cites: ["rvv:bijlage1.C19"]

  - id: c-c22e-benzine
    type: mc
    prompt: Conduces un auto de gasolina y llegas a esta señal de una milieuzone. ¿Qué dice la ley?
    sign: C22e
    options: ["Puedo entrar: la milieuzone solo cierra los autos con motor diésel", "No puedo entrar: C22e cierra todos los autos con cualquier motor", "No puedo entrar: solo pasan los autos eléctricos o de hidrógeno", "Puedo entrar solo si el auto lleva un distintivo ambiental"]
    answer: 0
    explain: El art. 86d dice que la geslotenverklaring de una milieuzone se aplica a autos, vehículos de empresa, camiones y autobuses con dieselmotor. Un auto de gasolina no queda cerrado. La excepción de los 40 años es para vehículos que sí estarían cerrados.
    cites: ["rvv:86d.1", "rvv:bijlage1.C22e"]

  - id: c-c22e-diesel-antiguo
    type: mc
    prompt: Conduces un auto diésel, matriculado por primera vez hace 45 años, y llegas a la señal de una milieuzone. ¿Puedes entrar?
    sign: C22e
    options: ["Sí, la prohibición no alcanza a los de 40 años o más", "No, es diésel y la milieuzone cierra todos los autos diésel", "No, los autos antiguos contaminan más y la zona los excluye", "Sí, pero solo si lleva un panel adicional que lo permita"]
    answer: 0
    explain: El art. 86d.1 cierra los autos diésel, pero el 86d.3 exceptúa los vehículos con fecha de primera admisión de cuarenta años o más. Que sea diésel es lo que te haría pensar que no pasas.
    cites: ["rvv:86d.1", "rvv:86d.3"]
