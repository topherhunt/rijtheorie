questions:

  - id: c-c2-significado
    type: mc
    prompt: Llegas a una calle y ves esta señal frente a ti. ¿Qué significa?
    sign: C2
    options: ["No puedes entrar en esta dirección", "Calle de sentido único en tu dirección: puedes entrar", "Cerrado en ambos sentidos", "Solo pueden entrar los residentes"]
    answer: 0
    explain: "C2 es un eenrichtingsweg visto desde el lado prohibido: en esta dirección está cerrado para vehículos."
    cites: ["rvv:bijlage1.C2"]

  - id: c-c6-c12
    type: mc
    prompt: Conduces un auto y ves esta señal. ¿Puedes entrar?
    sign: C6
    options: ["No, está cerrado para vehículos de motor de más de dos ruedas", "Sí, solo está cerrado para camiones", "Sí, solo está cerrado para motocicletas", "Sí, si vas despacio"]
    answer: 0
    explain: C6 cierra los vehículos de motor de más de dos ruedas. Tu auto lo es.
    cites: ["rvv:bijlage1.C6"]

  - id: c-c12-motos
    type: yesno
    prompt: Con esta señal, ¿puede entrar una motocicleta?
    sign: C12
    answer: false
    explain: C12 cierra todos los vehículos de motor, motos incluidas.
    cites: ["rvv:bijlage1.C12"]

  - id: c-c7-auto
    type: yesno
    prompt: Con esta señal, ¿puede entrar tu auto?
    sign: C7
    answer: true
    explain: C7 cierra solo los camiones. Un auto puede entrar.
    cites: ["rvv:bijlage1.C7"]

  - id: c-c10-remolque
    type: yesno
    prompt: Conduces un auto con remolque. ¿Puedes entrar donde hay esta señal?
    sign: C10
    answer: false
    explain: C10 cierra los vehículos de motor con remolque.
    cites: ["rvv:bijlage1.C10"]

  - id: c-c22e-milieuzone
    type: mc
    prompt: Esta señal marca una zona con restricción por emisiones. ¿A qué vehículos se aplica una milieuzone?
    sign: C22e
    options: ["Autos, furgonetas, camiones o autobuses diésel, según el panel", "Todos los vehículos de gasolina", "Solo a motocicletas", "A todos los vehículos de motor"]
    answer: 0
    explain: La prohibición de una milieuzone se aplica a vehículos con motor diésel, según la clase de emisión que indique el panel.
    cites: ["rvv:86d.1", "rvv:bijlage1.C22e"]

  - id: c-c1-peaton
    type: multi
    prompt: Una calle tiene en su entrada esta señal. ¿Quién de estos todavía puede pasar por ella?
    sign: C1
    options: ["Un peatón", "Un ciclista", "Un auto", "Un ciclomotor (bromfiets)"]
    answer: [0]
    explain: C1 cierra para voertuigen, jinetes y conductores de animales. El peatón no es un voertuig, así que pasa. La bicicleta, el auto y el ciclomotor sí lo son.
    cites: ["rvv:bijlage1.C1", "rvv:1"]

  - id: c-c12-bromfiets
    type: yesno
    prompt: Con esta señal, ¿puede entrar un ciclomotor (bromfiets)?
    sign: C12
    answer: true
    explain: C12 cierra los motorvoertuigen, y para el RVV una bromfiets no es un motorvoertuig. El que le cierra el paso es C13 (o C15 o C9).
    cites: ["rvv:bijlage1.C12", "rvv:1"]

  - id: c-c14-bromfiets
    type: yesno
    prompt: Con esta señal, ¿puede entrar una bromfiets (de las de 45 km/h, no un snorfiets)?
    sign: C14
    answer: true
    explain: C14 cierra las bicicletas y los vehículos para personas con discapacidad sin motor. Una bromfiets no es una fiets, así que no está incluida.
    cites: ["rvv:bijlage1.C14", "rvv:1"]

  - id: c-ciclomotor-no-bici
    type: mc
    prompt: Conduces un ciclomotor (bromfiets) con el motor en marcha. ¿Cuál de estas señales te cierra el paso?
    options: ["C6", "C11", "C12", "C13"]
    answer: 3
    explain: C13 cierra bromfietsen, snorfietsen y vehículos para personas con discapacidad con el motor en marcha. C6, C11 y C12 cierran motorvoertuigen, y la bromfiets no lo es.
    cites: ["rvv:bijlage1.C13", "rvv:bijlage1.C12", "rvv:1"]

  - id: c-c19-carga
    type: yesno
    prompt: Tu furgoneta mide 2,6 m de altura, pero con la carga llega a 3,3 m. Ves C19 con 3,0 m. ¿Puedes pasar?
    sign: C19
    answer: false
    explain: C19 cierra los vehículos que, con la carga incluida, sean más altos de lo indicado. La furgoneta sola cabe, pero con la carga no.
    cites: ["rvv:bijlage1.C19"]
