questions:
  - id: mx-velocidad-baja
    type: mc
    prompt: Una señal fija muestra 100 km/h y el panel electrónico sobre tu carril muestra 80. ¿Qué velocidad máxima rige?
    options: ["80 km/h, la menor de las dos señales", "100 km/h, porque la señal fija manda", "120 km/h, el máximo de la autosnelweg", "Cualquiera de las dos, a mi elección"]
    answer: 0
    explain: Cuando una señal y un panel electrónico muestran velocidades, rige la más baja. La señal fija no manda sobre el panel.
    cites: ["rvv:63b.2"]

  - id: mx-f9-fin
    type: yesno
    prompt: Un panel electrónico mostraba una prohibición, y después ves esta señal. ¿Terminó esa prohibición?
    sign: F9
    answer: true
    explain: F9 pone fin a todas las prohibiciones indicadas en un panel electrónico.
    cites: ["rvv:bijlage1.F9"]

  - id: mx-cruz-roja
    type: mc
    prompt: Sobre tu carril aparece una cruz roja. ¿Qué haces?
    options: ["Cambio de carril y no lo uso", "Reduzco y sigo usándolo con cuidado", "Lo uso solo si no hay tráfico detrás de mí", "Paro en el carril hasta que se abra"]
    answer: 0
    explain: "Cruz roja: el carril no puede usarse. Parar en él sería además lo peor: bloquearías un carril cerrado y te detendrías en la calzada."
    cites: ["rvv:73", "rvv:43.2"]

  - id: mx-flecha-blanca-cambio
    type: mc
    prompt: Ves una flecha blanca inclinada sobre tu carril. ¿Qué haces?
    options: ["Me preparo para dejar el carril, que se cerrará más adelante", "Sigo como si nada, porque la flecha blanca es solo un aviso informativo", "Acelero para pasar el tramo antes de que se cierre el carril", "Paro en el carril, porque ya está cerrado del todo"]
    answer: 0
    explain: La flecha blanca es el aviso previo de una cruz roja (art. 73). Todavía puedes usar el carril, pero debes prepararte para salir de él a tiempo.
    cites: ["rvv:73"]

  - id: mx-c23-02-desalojar
    type: mc
    prompt: Circulas por un spitsstrook abierto y el panel muestra esta señal. ¿Qué haces?
    sign: C23-02
    options: ["Salgo del spitsstrook, aunque deba cruzar la línea", "Sigo por el spitsstrook hasta el final del carril", "Me detengo en el carril y espero instrucciones", "Sigo en el spitsstrook si voy rápido y no estorbo a nadie"]
    answer: 0
    explain: C23-02 (Spitsstrook vrijmaken) ordena dejar libre el spitsstrook. Para salir de él puedes cruzar la línea continua (art. 76.2). Detenerte en el carril sería peor, y seguir es ignorar la orden.
    cites: ["rvv:bijlage1.C23-02", "rvv:76.2"]

  - id: mx-parar-pasajero
    type: yesno
    prompt: Circulas por el carril derecho de una autosnelweg y tu pasajero quiere bajar ya. ¿Puedes pararte un momento en la calzada?
    answer: false
    explain: En la calzada de una autosnelweg o autoweg no puedes dejar tu vehículo detenido (art. 43.2), ni siquiera un momento.
    cites: ["rvv:43.2"]

  - id: mx-bus-lijnbus-turistico
    type: mc
    prompt: Conduces un autobús turístico (autobus, no de línea) y sobre un carril se ilumina una palabra. ¿Con cuál puedes usar ese carril?
    options: ["Con BUS, pero no con LIJNBUS", "Con LIJNBUS, pero no con BUS", "Con las dos palabras por igual", "Con ninguna de las dos"]
    answer: 0
    explain: BUS admite lijnbus y autobus; LIJNBUS admite solo el autobús de línea. Un autobús turístico no es lijnbus.
    cites: ["rvv:73"]
