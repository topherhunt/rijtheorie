questions:
  - id: gh-g1-bromfiets
    type: mc
    prompt: Ves la señal G1 (autosnelweg). ¿Cuál de estos vehículos NO puede entrar?
    sign: G1
    options: ["Una motocicleta de gran cilindrada", "Un auto de pasajeros", "Un ciclomotor (bromfiets)", "Un camión de carga pesada"]
    answer: 2
    explain: La autosnelweg es solo para vehículos de motor que pueden y son capaces de ir al menos a 60 km/h. Una bromfiets no es un motorvoertuig para el RVV (art. 1), aunque tenga motor.
    cites: ["rvv:42.1", "rvv:1", "rvv:bijlage1.G1"]

  - id: gh-erf-velocidad
    type: number
    prompt: Entras con tu auto en un camino dentro de un erf. No hay nadie a la vista. ¿Qué velocidad máxima rige?
    sign: G5
    answer: 15
    unit: km/h
    explain: Dentro de un erf no puedes ir a más de 15 km/h, haya o no gente a la vista.
    cites: ["rvv:45", "rvv:bijlage1.G5"]

  - id: gh-erf
    type: yesno
    prompt: Dentro de un erf, un peatón camina por el centro del camino. ¿Está en un sitio indebido?
    sign: G5
    answer: false
    explain: Los peatones pueden usar los caminos del erf en todo su ancho (art. 44). Tú tienes que adaptarte y no superar los 15 km/h.
    cites: ["rvv:44", "rvv:45"]

  - id: gh-erf-parking
    type: yesno
    prompt: Dentro de un erf, ¿puedes estacionar tu auto donde quieras si no molestas?
    sign: G5
    answer: false
    explain: Dentro de un erf los vehículos de motor solo pueden estacionar en plazas marcadas o indicadas como tales.
    cites: ["rvv:46.1"]

  - id: gh-fietspad-circular
    type: yesno
    prompt: Hay una cola en la calzada y, a tu lado, un camino con la señal G13 (carril bici no obligatorio). ¿Puedes pasar con tu auto por ese camino para evitar la cola?
    sign: G13
    answer: false
    explain: Los conductores que no son ciclistas, jinetes ni peatones usan la calzada (rijbaan), y la rijbaan no incluye los fietspaden. "No obligatorio" habla de los ciclistas, no te abre el camino a ti.
    cites: ["rvv:10.1", "rvv:1", "rvv:bijlage1.G13"]

  - id: gh-zone
    type: mc
    prompt: Sobre una señal está escrita la palabra "zone", sin indicar un área. ¿Hasta dónde vale?
    options: ["Hasta la señal que marca el fin de la zona", "Hasta el siguiente cruce con otra calle", "Solo en el punto donde está la señal"]
    answer: 0
    explain: Sin indicar el área, la señal vale hasta la señal que marca el fin de la zona.
    cites: ["rvv:66.2"]
