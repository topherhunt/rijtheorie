questions:
  - id: gh-g1-bromfiets
    type: mc
    prompt: Ves la señal G1 (autosnelweg). ¿Cuál de estos vehículos NO puede entrar?
    sign: G1
    options: ["Un auto", "Una motocicleta", "Un ciclomotor (bromfiets)", "Un camión"]
    answer: 2
    explain: La autosnelweg es solo para vehículos de motor que pueden y son capaces de ir al menos a 60 km/h. Una bromfiets no es un motorvoertuig para el RVV (art. 1), aunque tenga motor.
    cites: ["rvv:42.1", "rvv:1", "rvv:bijlage1.G1"]

  - id: gh-g3-lento
    type: yesno
    prompt: Ves G3 (autoweg). Conduces un vehículo de motor que, por construcción, no puede pasar de 40 km/h. ¿Puedes usar esa autoweg?
    sign: G3
    answer: false
    explain: La autoweg es solo para vehículos de motor que pueden y son capaces de ir al menos a 50 km/h. Uno que no es capaz de llegar a 50 no puede entrar.
    cites: ["rvv:42.2", "rvv:bijlage1.G3"]

  - id: gh-erf-velocidad
    type: number
    prompt: Entras con tu auto en un camino dentro de un erf. No hay nadie a la vista. ¿Qué velocidad máxima rige?
    sign: G5
    answer: 15
    unit: km/h
    explain: Dentro de un erf no puedes ir a más de 15 km/h, haya o no gente a la vista.
    cites: ["rvv:45", "rvv:bijlage1.G5"]

  - id: gh-erf
    type: yesno
    prompt: Dentro de un erf, un peatón camina por el centro del camino. ¿Está en un sitio indebido?
    sign: G5
    answer: false
    explain: Los peatones pueden usar los caminos del erf en todo su ancho (art. 44). Tú tienes que adaptarte y no superar los 15 km/h.
    cites: ["rvv:44", "rvv:45"]

  - id: gh-erf-parking
    type: yesno
    prompt: Dentro de un erf, ¿puedes estacionar tu auto donde quieras si no molestas?
    sign: G5
    answer: false
    explain: Dentro de un erf los vehículos de motor solo pueden estacionar en plazas marcadas o indicadas como tales.
    cites: ["rvv:46.1"]

  - id: gh-fietspad-circular
    type: yesno
    prompt: Hay una cola en la calzada y, a tu lado, un camino con la señal G13 (carril bici no obligatorio). ¿Puedes pasar con tu auto por ese camino para evitar la cola?
    sign: G13
    answer: false
    explain: Los conductores que no son ciclistas, jinetes ni peatones usan la calzada (rijbaan), y la rijbaan no incluye los fietspaden. "No obligatorio" habla de los ciclistas, no te abre el camino a ti.
    cites: ["rvv:10.1", "rvv:1", "rvv:bijlage1.G13"]

  - id: gh-bromfiets-g11
    type: mc
    prompt: Conduces un ciclomotor (bromfiets). Junto a la calzada hay un carril bici con la señal G11 y no hay ningún fiets/bromfietspad. ¿Por dónde circulas?
    sign: G11
    options: ["Por el carril bici G11", "Por la calzada", "Por la acera"]
    answer: 1
    explain: El bromfietser usa el fiets/bromfietspad y, si no existe, la calzada. El G11 es para ciclistas, no para ciclomotores.
    cites: ["rvv:6.1", "rvv:6.2", "rvv:bijlage1.G11"]

  - id: gh-remolque-autosnelweg
    type: number
    prompt: Conduces un auto con un remolque de masa máxima autorizada de 750 kg por una autosnelweg sin otras señales de velocidad. ¿Cuál es tu velocidad máxima?
    answer: 90
    unit: km/h
    explain: El máximo general de la autosnelweg es 130 km/h, pero un auto con un remolque de hasta 3500 kg de masa máxima tiene un máximo propio de 90 km/h, y vale el más bajo.
    cites: ["rvv:22", "rvv:21", "rvv:63b.1"]

  - id: gh-zone
    type: mc
    prompt: Sobre una señal está escrita la palabra "zone", sin indicar un área. ¿Hasta dónde vale?
    options: ["Hasta la señal que marca el fin de la zona", "Solo hasta el siguiente cruce", "Solo en el punto donde está la señal"]
    answer: 0
    explain: Sin indicar el área, la señal vale hasta la señal que marca el fin de la zona.
    cites: ["rvv:66.2"]

  - id: gh-g1-vs-g3-55
    type: mc
    prompt: Conduces un vehículo de motor que, por construcción, no puede pasar de 55 km/h. ¿Dónde puedes entrar?
    options: ["Solo en una autoweg (G3)", "Solo en una autosnelweg (G1)", "En las dos", "En ninguna de las dos"]
    answer: 0
    explain: La autoweg exige un vehículo que pueda y sea capaz de ir al menos a 50 km/h, y el tuyo llega a 55. La autosnelweg pide al menos 60, y no los alcanza.
    cites: ["rvv:42.1", "rvv:42.2"]

  - id: gh-h1-inicio
    type: mc
    prompt: Pasas junto a una señal H1 (Bebouwde kom) circulando con tu auto por una carretera local, sin otras señales de velocidad. ¿Qué cambia?
    sign: H1
    options: ["Empieza la zona urbana: el máximo pasa a 50 km/h", "Termina la zona urbana: el máximo pasa a 80 km/h", "Empieza una zona de 30 km/h", "Empieza un erf y el máximo es 15 km/h"]
    answer: 0
    explain: H1 marca el inicio de la bebouwde kom, donde rige el máximo de 50 km/h para vehículos de motor. H2 es la que la termina. El erf lo marca G5, y las zonas de 30 las marca una señal A1 con la palabra zone.
    cites: ["rvv:bijlage1.H1", "rvv:20"]

  - id: gh-h2-fin
    type: mc
    prompt: Circulas en auto a 50 km/h por una calle del pueblo y pasas esta señal, en una carretera normal (no autoweg ni autosnelweg) sin otras señales de velocidad. ¿Qué máximo rige después?
    sign: H2
    options: ["80 km/h", "50 km/h", "100 km/h", "130 km/h"]
    answer: 0
    explain: H2 marca el fin de la bebouwde kom. Fuera de ella, en las vías que no son autoweg ni autosnelweg, el máximo general es 80 km/h. 100 es de la autoweg y 130 de la autosnelweg.
    cites: ["rvv:bijlage1.H2", "rvv:21"]
