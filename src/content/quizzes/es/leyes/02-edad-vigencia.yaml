questions:
  - id: edad-vigencia-edad
    type: yesno
    prompt: Cumpliste 18 años ayer, tienes tu permiso B y ya no vas con acompañante. ¿Puedes conducir un auto de categoría B tú sola?
    answer: true
    explain: La edad mínima para B es de 18 años; desde ahí no necesitas begeleider ni begeleiderspas. A los 17 solo podías conducir acompañada.
    cites: ["rr:5.1", "rr:5.8"]

  - id: edad-vigencia-17
    type: yesno
    prompt: Tienes 17 años, un permiso B y una begeleiderspas válida. ¿Puedes conducir si vas con tu acompañante registrado?
    answer: true
    explain: A los 17 años se puede conducir la categoría B con permiso B, begeleiderspas válida y un acompañante.
    cites: ["rr:5.8"]

  - id: edad-vigencia-17-solo
    type: yesno
    prompt: Tienes 17 años, un permiso B y una begeleiderspas válida. ¿Puedes conducir solo?
    answer: false
    explain: A los 17 años solo puedes conducir si te acompaña un acompañante (begeleider). Solo, necesitas tener 18.
    cites: ["rr:5.8", "rr:5.1.f"]

  - id: edad-vigencia-toets
    type: yesno
    prompt: Tu hija tiene 16 años y 5 meses y quiere hacer ya el examen intermedio del begeleid rijden. ¿Puede?
    answer: false
    explain: El examen intermedio se puede hacer desde los 16 años y 6 meses, así que todavía le falta un mes.
    cites: ["rr:5.9"]

  - id: edad-vigencia-vigencia
    type: mc
    prompt: Te dieron el permiso B el 1 de marzo de 2016, a los 30 años, sin limitación médica. ¿Hasta cuándo vale?
    options: ["Hasta el 1 de marzo de 2026", "Hasta el 1 de marzo del 2021", "Hasta que cumplas 75 años", "Hasta el 1 de marzo de 2031"]
    answer: 0
    explain: Con menos de 65 años al emitirlo, vale 10 años desde la fecha de emisión que figura en el permiso. Los otros plazos son de otras edades.
    cites: ["rr:25a"]

  - id: edad-vigencia-70
    type: mc
    prompt: A los 72 años, el 10 de junio de 2024, te dan un permiso B nuevo. ¿Hasta cuándo vale?
    options: ["Hasta el 10 de junio de 2029", "Hasta el 10 de junio del 2034", "Hasta que cumplas 75 años", "Hasta que cumplas 80 años"]
    answer: 0
    explain: Con 70 años o más al emitirlo, la vigencia es de 5 años desde la fecha de emisión. "Hasta los 75" es la regla de los 65 a 69 años.
    cites: ["rr:25a"]

  - id: edad-vigencia-65
    type: mc
    prompt: Un conductor de 66 años recibe un permiso B nuevo. ¿Cuánto dura?
    options: ["Hasta que cumpla 75 años", "10 años, como para casi todos", "5 años, como a partir de 70", "Hasta que cumpla 70 años"]
    answer: 0
    explain: Entre 65 y menos de 70 años al emitirlo, el permiso vale hasta que el titular cumple 75. Los 10 años son para menores de 65 y los 5 años para quienes tienen 70 o más.
    cites: ["rr:25a"]

  - id: edad-vigencia-vencido
    type: yesno
    prompt: Tu permiso B (emitido a los 40 años) venció hace dos semanas y no lo renovaste. Lo llevas encima. ¿Puedes seguir conduciendo con él?
    answer: false
    explain: El permiso vale 10 años desde su emisión. Pasado ese plazo ya no está vigente, y la ley exige que el permiso no haya perdido su validez. Llevarlo encima no lo arregla.
    cites: ["rr:25a", "wvw:107"]

  - id: edad-vigencia-perdido
    type: yesno
    prompt: Reportaste tu permiso como perdido y te dieron uno nuevo. ¿Sigue valiendo el antiguo si lo encuentras?
    answer: false
    explain: Un permiso deja de valer cuando se reporta perdido o cuando lo reemplazan por otro.
    cites: ["wvw:123"]

  - id: edad-vigencia-multi
    type: multi
    prompt: ¿En cuáles de estos casos el permiso deja de ser válido?
    options: ["Durante una rijontzegging", "Después de cambiar tu apellido", "Cuando lo reportas perdido", "Cuando te mudas a otra dirección"]
    answer: [0, 1, 2]
    explain: Pierde validez durante una rijontzegging, si cambia el apellido, los nombres, el lugar o la fecha de nacimiento o el sexo, y si se reporta perdido. Mudarte de dirección no figura entre los casos del artículo 123.
    cites: ["wvw:123"]

  - id: edad-vigencia-begeleider-joven
    type: yesno
    prompt: Tu hermana tiene un permiso B desde hace 8 años y 26 años de edad. ¿Puede figurar como tu begeleider en la begeleiderspas?
    answer: false
    explain: El begeleider debe tener al menos 27 años, además de un permiso B desde hace al menos 5 años. Los años de permiso no compensan la edad.
    cites: ["rr:49b"]

  - id: edad-vigencia-begeleider-reciente
    type: yesno
    prompt: Tu tío tiene 35 años y un permiso B desde hace 3 años. ¿Puede figurar como begeleider en tu begeleiderspas?
    answer: false
    explain: Deben haber pasado al menos 5 años desde la primera emisión de su permiso B. La edad por sí sola no basta (salvo un instructor con certificado).
    cites: ["rr:49b"]

  - id: edad-vigencia-begeleider-seis
    type: yesno
    prompt: Cumples los requisitos y quieres que seis personas, todas aptas, figuren como begeleiders en tu begeleiderspas. ¿Es posible?
    answer: false
    explain: En la begeleiderspas se pueden mencionar como máximo cinco begeleiders.
    cites: ["rr:49a.5"]

  - id: edad-vigencia-begeleider-rijverbod
    type: yesno
    prompt: Tu begeleider registrado recibe de la policía un rijverbod de 12 horas porque está bajo la influencia de una sustancia. ¿Puede acompañarte durante esas 12 horas?
    answer: false
    explain: El rijverbod impuesto a quien figura como begeleider cuenta también como begeleidingsverbod. No puede conducir ni acompañar mientras dure.
    cites: ["wvw:162.1", "wvw:162.4"]
