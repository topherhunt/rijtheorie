questions:
  - id: alcohol-novel-anos
    type: number
    prompt: Te dieron tu primer permiso a los 25 años. ¿Durante cuántos años desde esa fecha rige el límite más bajo?
    answer: 5
    unit: años
    explain: Si el primer permiso se emitió a los 18 años o más, el límite bajo rige 5 años desde esa fecha.
    cites: ["wvw:8.3"]

  - id: alcohol-novel-menor
    type: number
    prompt: Te dieron el permiso AM (ciclomotor) a los 16 años. ¿Cuántos años rige el límite bajo desde esa fecha?
    answer: 7
    unit: años
    explain: Para un primer permiso AM o T obtenido siendo menor de 18, son 7 años.
    cites: ["wvw:8.3"]

  - id: alcohol-novel-b17
    type: number
    prompt: Te dieron tu primer permiso B a los 17 años (conducción acompañada), sin haber tenido antes un permiso AM ni T. ¿Cuántos años rige el límite bajo desde esa fecha?
    answer: 5
    unit: años
    explain: Para el primer permiso B emitido antes de los 18 años son 5 años desde la emisión.
    cites: ["wvw:8.3"]

  - id: alcohol-novel-dejar
    type: yesno
    prompt: Tu amigo está muy borracho. ¿Está prohibido dejarle conducir tu auto?
    answer: true
    explain: Está prohibido dejar conducir a alguien que está en un estado que no se lo permite.
    cites: ["wvw:8.6"]

  - id: alcohol-novel-drogas
    type: yesno
    prompt: Tomaste un medicamento que te hace menos capaz de conducir bien. ¿Está permitido conducir?
    answer: false
    explain: Está prohibido conducir bajo la influencia de una sustancia que reduce tu capacidad de conducir bien.
    cites: ["wvw:8.1"]

  - id: alcohol-experiencia-sangre-06
    type: yesno
    prompt: Tienes el permiso desde hace 12 años. Un análisis de sangre da 0,6 mg/ml. ¿Superas el límite que te corresponde?
    answer: true
    explain: Para un conductor con experiencia el límite en sangre es de 0,5 mg/ml, y 0,6 lo supera. El 0,2 es el límite del novel, que ya no es el tuyo.
    cites: ["wvw:8.2"]

  - id: alcohol-experiencia-400
    type: yesno
    prompt: Tienes el permiso desde hace 12 años y soplas 400 µg/l. ¿Se te retira el permiso en el acto por esa cifra?
    answer: false
    explain: 400 supera el límite general de 220, así que es una infracción. Pero el retiro inmediato del permiso por la cifra exige más de 570 µg/l (o más de 1,3 mg/ml) para un conductor con experiencia.
    cites: ["wvw:8.2", "wvw:164.2"]

  - id: alcohol-novel-lectura-400
    type: yesno
    prompt: Obtuviste tu primer permiso hace 2 años, a los 24 años. Soplas 400 µg/l. ¿Se te puede retirar el permiso en el acto por esa cifra?
    answer: true
    explain: Siendo novel, el umbral de retiro es más de 350 µg/l (o más de 0,8 mg/ml en sangre), y 400 lo supera. El umbral de 570 es el del conductor con experiencia.
    cites: ["wvw:8.3", "wvw:164.2"]

  - id: alcohol-novel-lectura-300
    type: yesno
    prompt: Obtuviste tu primer permiso hace 2 años, a los 24 años. Soplas 300 µg/l. ¿Se te retira el permiso en el acto por esa cifra?
    answer: false
    explain: Con 300 superas tu límite de 88, así que es una infracción, pero el retiro inmediato del permiso del novel exige más de 350 µg/l.
    cites: ["wvw:8.3", "wvw:164.2"]

  - id: alcohol-novel-rijontzegging-conducir
    type: yesno
    prompt: Un juez te impuso una rijontzegging de 6 meses por una infracción grave. Aún tienes el carné físico en la cartera. ¿Puedes conducir un auto durante esos meses?
    answer: false
    explain: Mientras dure la rijontzegging está prohibido conducir un vehículo de motor, tengas o no el carné contigo.
    cites: ["wvw:9.1"]

  - id: alcohol-novel-begeleider-300
    type: yesno
    prompt: Eres el begeleider de un conductor de 17 años y has bebido y soplas 300 µg/l. ¿Cometes una infracción por actuar como acompañante?
    answer: true
    explain: El límite general de 220 µg/l vale también para quien actúa como begeleider, y 300 lo supera.
    cites: ["wvw:8.2"]

