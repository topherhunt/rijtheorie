questions:
  - id: alcohol-novel-anos
    type: yesno
    prompt: Te dieron tu primer permiso B a los 25 años, hace 4 años y 10 meses. En un control soplas 120 µg/l. ¿Cometes una infracción de alcohol por la cifra?
    answer: true
    explain: Con el primer permiso a los 18 años o más, el límite bajo (88 µg/l) rige 5 años desde la emisión, y aún no han pasado. 120 lo supera. Pasado el plazo, el límite sería el general de 220.
    cites: ["wvw:8.3"]

  - id: alcohol-novel-menor
    type: yesno
    prompt: Tienes 22 años. Te dieron el permiso AM a los 16 (hace 6 años) y el B a los 17 (hace 5 años). Soplas 100 µg/l. ¿Cometes una infracción de alcohol por la cifra?
    answer: true
    explain: Desde el primer AM o T obtenido siendo menor de 18 rigen 7 años de límite bajo, y solo pasaron 6. Que ya hayan pasado 5 años desde el B no lo cancela, porque basta con que se cumpla uno de los casos del artículo 8 lid 3.
    cites: ["wvw:8.3"]

  - id: alcohol-novel-b17
    type: yesno
    prompt: Te dieron tu primer permiso B a los 17 años (conducción acompañada), sin AM ni T antes. Hoy tienes 22 años y 3 meses y soplas 150 µg/l. ¿Cometes una infracción de alcohol por la cifra?
    answer: false
    explain: Para un primer B obtenido antes de los 18, el límite bajo rige 5 años desde la emisión, y ya pasaron (5 años y 3 meses). Te corresponde el límite general de 220 µg/l, y 150 no lo supera.
    cites: ["wvw:8.3", "wvw:8.2"]

  - id: alcohol-experiencia-400
    type: yesno
    prompt: Tienes el permiso desde hace 12 años y soplas 400 µg/l. ¿Se te retira el permiso en el acto por esa cifra?
    answer: false
    explain: 400 supera el límite general de 220, así que es una infracción. Pero el retiro inmediato del permiso por la cifra exige más de 570 µg/l (o más de 1,3 mg/ml) para un conductor con experiencia.
    cites: ["wvw:8.2", "wvw:164.2"]

  - id: alcohol-experiencia-sangre-15
    type: yesno
    prompt: Tienes el permiso desde hace 12 años. Un análisis de sangre da 1,5 mg/ml. ¿Se te puede retirar el permiso en el acto por esa cifra?
    answer: true
    explain: Para un conductor con experiencia, el retiro inmediato exige más de 1,3 mg/ml en sangre (el equivalente a 570 µg/l en aliento), y 1,5 lo supera. Con 0,6 solo habría infracción, no retiro.
    cites: ["wvw:164.2"]

  - id: alcohol-novel-lectura-400
    type: yesno
    prompt: Obtuviste tu primer permiso hace 2 años, a los 24 años. Soplas 400 µg/l. ¿Se te puede retirar el permiso en el acto por esa cifra?
    answer: true
    explain: Siendo novel, el umbral de retiro es más de 350 µg/l (o más de 0,8 mg/ml en sangre), y 400 lo supera. El umbral de 570 es el del conductor con experiencia.
    cites: ["wvw:8.3", "wvw:164.2"]

  - id: alcohol-novel-lectura-300
    type: yesno
    prompt: Obtuviste tu primer permiso hace 2 años, a los 24 años. Soplas 300 µg/l. ¿Se te retira el permiso en el acto por esa cifra?
    answer: false
    explain: Con 300 superas tu límite de 88, así que es una infracción, pero el retiro inmediato del permiso del novel exige más de 350 µg/l.
    cites: ["wvw:8.3", "wvw:164.2"]

  - id: alcohol-novel-rijontzegging-conducir
    type: yesno
    prompt: Un juez te impuso una rijontzegging de 6 meses por una infracción grave. Aún tienes el carné físico en la cartera. ¿Puedes conducir un auto durante esos meses?
    answer: false
    explain: Mientras dure la rijontzegging está prohibido conducir un vehículo de motor, tengas o no el carné contigo.
    cites: ["wvw:9.1"]
