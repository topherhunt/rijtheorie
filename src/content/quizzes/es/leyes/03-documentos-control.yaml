questions:
  - id: documentos-control-ilegible
    type: yesno
    prompt: Tu permiso de conducir sigue vigente, pero está tan desgastado que los datos ya no se pueden leer. ¿Cumples con el artículo 107 de la WVW?
    answer: false
    explain: El artículo 107 exige que el permiso no haya perdido su validez y sea legible. Vigente pero ilegible no cumple.
    cites: ["wvw:107"]

  - id: documentos-control-parar
    type: mc
    prompt: Un policía te hace señal de parar y te pide los documentos. ¿Qué debes hacer?
    options: ["Seguir hasta un lugar más cómodo y mostrarlos allí", "Parar y mostrar los documentos a la primera orden", "Mostrarlos al día siguiente en la comisaría", "Solo mostrarlos si cometiste una infracción"]
    answer: 1
    explain: A la primera orden de un funcionario autorizado debes parar y mostrar correctamente los documentos pedidos.
    cites: ["wvw:160.1"]

  - id: documentos-control-auto-amigo
    type: mc
    prompt: Conduces el auto de un amigo y la policía te manda parar y pide los documentos. ¿Qué debes mostrar?
    options: ["Tu permiso de conducir y el kentekenbewijs (kentekencard) de ese auto", "Solo tu permiso, porque el auto no es tuyo", "Solo el kentekenbewijs, que lo lleva el dueño", "Tu DNI y el seguro"]
    answer: 0
    explain: A la primera orden el conductor debe mostrar su permiso y el kentekenbewijs del vehículo que conduce (y el del remolque si lo arrastra), sea o no suyo. Para la kentekencard, la obligación rige desde que se entrega y en todo caso desde 14 días después de la tenaamstelling.
    cites: ["wvw:160.1", "kr:22"]

  - id: documentos-control-remolque
    type: yesno
    prompt: Conduces tu auto con un remolque que tiene su propio kentekenbewijs y la policía te manda parar. ¿Debes mostrar también el kentekenbewijs del remolque?
    answer: true
    explain: El artículo 160 lid 1 pide también las partes del kentekenbewijs del remolque cuando el vehículo lo arrastra.
    cites: ["wvw:160.1"]

  - id: documentos-control-begeleider-soplar
    type: yesno
    prompt: Eres el begeleider de tu hijo de 17 años, que conduce, y la policía os para y te pide hacer la prueba de aliento previa a ti. ¿Estás obligado a colaborar, aunque no conduces?
    answer: true
    explain: El artículo 160 lid 5 obliga a colaborar con esas pruebas al conductor, a quien se dispone a conducir y al begeleider.
    cites: ["wvw:160.5"]

  - id: documentos-control-ordenes-multiples
    type: yesno
    prompt: Un agente te sorprende cometiendo una infracción y te ordena apartar el auto de la calzada para no estorbar. ¿Debes obedecer la orden?
    answer: true
    explain: El artículo 160 lid 6 obliga al conductor a seguir las órdenes que el funcionario da, al encontrarlo en infracción, para proteger los intereses del tráfico.
    cites: ["wvw:160.6"]

  - id: documentos-control-185-aplicado
    type: yesno
    prompt: Te instalaste en los Países Bajos hace 120 días con un permiso válido de Colombia para la categoría B. ¿Puedes conducir aquí con ese permiso?
    answer: true
    explain: Con un permiso de fuera de la UE, el EEE y Suiza puedes conducir hasta 185 días después de instalarte; con 120 días todavía estás dentro del plazo.
    cites: ["wvw:108.1.g"]

  - id: documentos-control-185-pasado
    type: yesno
    prompt: Vives en los Países Bajos desde hace 200 días con un permiso válido de Colombia para la categoría B. ¿Puedes seguir conduciendo aquí solo con ese permiso?
    answer: false
    explain: La excepción del artículo 108 dura mientras no hayan pasado 185 días desde que te instalaste. Pasado ese plazo ese permiso ya no basta.
    cites: ["wvw:108.1.g", "wvw:107"]

  - id: documentos-control-ue-restante
    type: number
    prompt: Te instalas hoy en los Países Bajos con un permiso B válido de otro país de la UE, emitido hace 10 años. ¿Cuántos años más puedes seguir usándolo (como máximo 15 desde su emisión)?
    answer: 5
    unit: años
    explain: Un permiso B de la UE puede usarse hasta que hayan pasado 15 años desde su emisión; si ya pasaron 10, quedan 5.
    cites: ["wvw:108.1.h"]
