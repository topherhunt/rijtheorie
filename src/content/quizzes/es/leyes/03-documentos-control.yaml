questions:
  - id: documentos-control-ilegible
    type: yesno
    prompt: Tu permiso de conducir sigue vigente, pero está tan desgastado que los datos ya no se pueden leer. ¿Puedes seguir conduciendo con él?
    answer: false
    explain: El artículo 107 exige que el permiso no haya perdido su validez y sea legible. Vigente pero ilegible no cumple.
    cites: ["wvw:107"]

  - id: documentos-control-parar
    type: mc
    prompt: Vas con prisa y un agente te hace señal de parar en un control rutinario; no has cometido ninguna infracción. ¿Qué debes hacer?
    options: ["Parar y mostrar los documentos que te pida", "Seguir hasta un lugar más cómodo y mostrarlos allí", "Mostrarlos solo si el agente te acusa de algo", "Mostrarlos al día siguiente en la comisaría"]
    answer: 0
    explain: A la primera orden de un funcionario autorizado debes parar y mostrar correctamente los documentos, sin que haga falta una infracción previa ni un lugar más cómodo para ti.
    cites: ["wvw:160.1"]

  - id: documentos-control-auto-amigo
    type: mc
    prompt: Conduces el auto de un amigo y la policía te manda parar y pide los documentos. ¿Qué debes mostrar?
    options: ["Tu permiso de conducir y el kentekenbewijs de ese auto", "Solo tu permiso, porque el auto es de tu amigo", "Solo el kentekenbewijs del auto, que lo lleva su dueño", "Tu documento de identidad y el seguro del auto"]
    answer: 0
    explain: A la primera orden el conductor debe mostrar su permiso y el kentekenbewijs del vehículo que conduce (y el del remolque si lo arrastra), sea o no suyo.
    cites: ["wvw:160.1"]

  - id: documentos-control-remolque
    type: mc
    prompt: Conduces tu auto con un remolque que tiene su propio kentekenbewijs y un agente te manda parar. ¿Qué documentos debes poder mostrar?
    options: ["Mi permiso y el kentekenbewijs del auto y el del remolque", "Mi permiso y solo el kentekenbewijs del auto", "Solo el kentekenbewijs del remolque, que arrastro", "Mi permiso y el seguro del remolque"]
    answer: 0
    explain: El artículo 160 lid 1 pide tu permiso y el kentekenbewijs del vehículo que conduces, y también el del remolque cuando lo arrastras. Mostrar solo el del auto deja fuera una parte pedida.
    cites: ["wvw:160.1"]

  - id: documentos-control-begeleider-soplar
    type: yesno
    prompt: Eres el begeleider de tu hija de 17 años, que conduce. La policía os para y te pide soplar en la prueba de aliento previa. Tú no conduces. ¿Tienes que soplar igualmente?
    answer: true
    explain: El artículo 160 lid 5 obliga a colaborar con la prueba de aliento previa y con las demás pruebas no solo al conductor, sino también al begeleider. No conducir no te exime.
    cites: ["wvw:160.5"]

  - id: documentos-control-orden-infraccion
    type: mc
    prompt: Un agente te ve cometer una infracción y te ordena detenerte en un lado. Piensas seguir de largo, "ya me llegará la multa". ¿Qué dice la ley?
    options: ["Debes obedecer la orden del agente para proteger el tráfico", "Puedes seguir y recibir la multa por correo después", "Solo debes parar si el agente va uniformado y en vehículo oficial", "Puedes ignorar la orden si la infracción fue leve"]
    answer: 0
    explain: El artículo 160 lid 6 obliga a quien se encuentra cometiendo una infracción a seguir las órdenes del funcionario para proteger el tráfico. Que la infracción sea leve no cambia la obligación.
    cites: ["wvw:160.6"]

  - id: documentos-control-indicaciones
    type: mc
    prompt: Un agente dirige el tráfico en un cruce con obras y te indica seguir recto. Tú querías girar a la derecha. ¿Qué haces?
    options: ["Sigo recto, como indica el agente", "Giro a la derecha: es mi trayecto y no hay señal que lo prohíba", "Pregunto con la bocina si puedo girar", "Espero a que otro conductor gire primero"]
    answer: 0
    explain: Los usuarios de la vía deben seguir las indicaciones que dan los agentes y otros funcionarios autorizados sobre el tráfico (art. 12 WVW), aunque cambien tu plan.
    cites: ["wvw:12.1"]

  - id: documentos-control-185-aplicado
    type: mc
    prompt: Vives en los Países Bajos. Tú te instalaste hace 120 días y tu amiga hace 200 días, las dos con un permiso colombiano válido para la categoría B. ¿Quién puede conducir aquí solo con ese permiso?
    options: ["Solo tú", "Solo tu amiga", "Las dos", "Ninguna de las dos"]
    answer: 0
    explain: Con un permiso de fuera de la UE, el EEE y Suiza se puede conducir hasta 185 días desde que te instalas. Tú vas por 120; tu amiga ya pasó el plazo y necesita un permiso neerlandés.
    cites: ["wvw:108.1.g", "wvw:107"]

  - id: documentos-control-ue-restante
    type: mc
    prompt: Te instalas hoy en los Países Bajos con un permiso B de otro país de la UE, emitido hace 10 años. ¿Hasta cuándo puedes usarlo para la categoría B?
    options: ["Hasta que pasen 15 años desde su emisión, es decir, 5 más", "Durante 185 días desde que te instalaste", "Durante 15 años desde que te instalaste en el país", "Hasta que pasen 5 años desde su emisión, como en C y D"]
    answer: 0
    explain: Un permiso B de la UE puede usarse hasta que hayan pasado 15 años desde su emisión; si ya pasaron 10, quedan 5. Los 185 días son para permisos de fuera de la UE, y el plazo de 5 años es el de las categorías C y D.
    cites: ["wvw:108.1.h"]
