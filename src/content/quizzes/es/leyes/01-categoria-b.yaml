questions:
  - id: categoria-b-asientos
    type: yesno
    prompt: Un monovolumen está hecho para 9 personas contando al conductor y tiene una masa máxima de 3.000 kg. ¿Se puede conducir con la categoría B?
    answer: true
    explain: La categoría B admite hasta 8 personas además del conductor, es decir 9 en total, y hasta 3.500 kg. Cumple las dos condiciones.
    cites: ["rr:15.1"]

  - id: categoria-b-diez-asientos
    type: yesno
    prompt: Una furgoneta con una masa máxima de 3.000 kg está hecha para 10 personas además del conductor. ¿Se puede conducir con la categoría B?
    answer: false
    explain: Aunque el peso cabe, la categoría B admite como máximo 8 personas además del conductor. Con más plazas necesitas la categoría D1 o D.
    cites: ["rr:15.1"]

  - id: categoria-b-furgoneta-pesada
    type: yesno
    prompt: Una furgoneta de reparto con cuatro ruedas tiene una masa máxima de 3.800 kg. ¿Se puede conducir con la categoría B?
    answer: false
    explain: La categoría B llega hasta 3.500 kg de masa máxima. Por encima necesitas la categoría C1, aunque el vehículo parezca una furgoneta normal.
    cites: ["rr:15.1"]

  - id: categoria-b-remolque-ligero-independiente
    type: yesno
    prompt: Tu auto tiene una masa máxima de 3.000 kg y arrastras un remolque con una masa máxima de 700 kg. El conjunto pasa de 3.500 kg. ¿Basta la categoría B?
    answer: true
    explain: Un remolque de hasta 750 kg entra en la categoría B sin mirar el conjunto. El tope de 3.500 kg para el conjunto solo cuenta si el remolque pasa de 750 kg.
    cites: ["rr:15.1"]

  - id: categoria-b-conjunto
    type: yesno
    prompt: Tu auto tiene una masa máxima de 1.800 kg y el remolque, 1.500 kg. El conjunto es de 3.300 kg. ¿Puedes conducirlo solo con la categoría B?
    answer: true
    explain: Un remolque de más de 750 kg se permite con la categoría B si la masa máxima del conjunto no pasa de 3.500 kg.
    cites: ["rr:15.1"]

  - id: categoria-b-conjunto-pesado
    type: yesno
    prompt: Tu auto tiene una masa máxima de 2.000 kg y el remolque, 2.000 kg (conjunto de 4.000 kg). ¿Basta la categoría B normal, sin ningún código?
    answer: false
    explain: El conjunto pasa de 3.500 kg. Con la categoría B hasta 4.250 kg solo se permite si tu permiso tiene el código que se obtiene aprobando el examen correspondiente. Si no, necesitas BE.
    cites: ["rr:15.1", "rr:15.5"]

  - id: categoria-be
    type: mc
    prompt: Tu auto tiene una masa máxima de 2.000 kg y el remolque, 2.500 kg (conjunto de 4.500 kg). Tienes la categoría B sin ningún código. ¿Qué te falta para conducirlo?
    options: ["La categoría BE", "La categoría C1", "El código de los 4.250 kg", "Nada: el remolque pesa menos de 3.500 kg"]
    answer: 0
    explain: El conjunto pasa de 4.250 kg, así que ni siquiera el código de la categoría B sirve. Un remolque de hasta 3.500 kg con un auto de la categoría B es lo que cubre la BE. Que el remolque solo pese 2.500 kg no basta con la B.
    cites: ["rr:15.1", "rr:15.5"]

  - id: categoria-b-lectura
    type: mc
    prompt: Tu remolque está vacío y hoy pesa 600 kg, pero en sus papeles figura una masa máxima de 1.200 kg. Tu auto tiene 1.800 kg de masa máxima. ¿Qué cuenta para saber si basta la categoría B?
    options: ["Los 1.200 kg: se mira la masa máxima y el conjunto de 3.000 kg cabe en B", "Los 600 kg de hoy: como son menos de 750, basta B sin más", "Solo la masa del auto, porque el remolque no se cuenta", "Los 1.200 kg: pasa de 750 kg, así que necesitas BE"]
    answer: 0
    explain: Los límites se miden con la masa máxima permitida según los papeles, no con la carga de hoy. El remolque de 1.200 kg pasa de 750 kg, pero el conjunto (3.000 kg) no pasa de 3.500 kg, así que la B basta. Que pase de 750 kg solo exige mirar el conjunto, no la BE.
    cites: ["rr:15.1"]
