questions:
  - id: categoria-b-masa
    type: number
    prompt: ¿Cuál es la masa máxima, en kg, de un auto que se puede conducir con la categoría B?
    answer: 3500
    unit: kg
    explain: La categoría B cubre vehículos de motor de cuatro o más ruedas con masa máxima de hasta 3.500 kg.
    cites: ["rr:15.1.e"]

  - id: categoria-b-pasajeros
    type: number
    prompt: ¿Para cuántas personas, además del conductor, puede estar hecho como máximo un vehículo de la categoría B?
    answer: 8
    unit: personas
    explain: La categoría B cubre vehículos hechos para como máximo 8 personas además del conductor.
    cites: ["rr:15.1.e"]

  - id: categoria-b-remolque
    type: number
    prompt: ¿Hasta qué masa máxima (en kg) puede ser un remolque que arrastras con la categoría B sin ninguna otra condición?
    answer: 750
    unit: kg
    explain: Un remolque de hasta 750 kg siempre entra en la categoría B. Uno más pesado solo si el conjunto completo no pasa de 3.500 kg.
    cites: ["rr:15.1.e"]

  - id: categoria-b-conjunto
    type: yesno
    prompt: Tu auto tiene una masa máxima de 1.800 kg y el remolque, 1.500 kg. El conjunto es de 3.300 kg. ¿Puedes conducirlo solo con la categoría B?
    answer: true
    explain: Un remolque de más de 750 kg se permite con la categoría B si la masa máxima del conjunto no pasa de 3.500 kg.
    cites: ["rr:15.1.e"]

  - id: categoria-b-conjunto-pesado
    type: yesno
    prompt: Tu auto tiene una masa máxima de 2.000 kg y el remolque, 2.000 kg (conjunto de 4.000 kg). ¿Basta la categoría B normal, sin ningún código?
    answer: false
    explain: El conjunto pasa de 3.500 kg. Con la categoría B hasta 4.250 kg solo se permite si tu permiso tiene el código que se obtiene aprobando el examen correspondiente. Si no, necesitas BE.
    cites: ["rr:15.1.e", "rr:15.5"]

  - id: categoria-be
    type: mc
    prompt: ¿Qué categoría te permite conducir un auto de la categoría B con un remolque de hasta 3.500 kg de masa máxima?
    options: [AM, BE, C1, T]
    answer: 1
    explain: La categoría BE cubre un vehículo de la categoría B con otro remolque de hasta 3.500 kg de masa máxima.
    cites: ["rr:15.1.k"]

  - id: categoria-b-ruedas
    type: yesno
    prompt: ¿La categoría B se refiere a vehículos de motor con cuatro o más ruedas?
    answer: true
    explain: Así lo define el reglamento de permisos de conducir para la categoría B.
    cites: ["rr:15.1.e"]

  - id: categoria-b-lectura
    type: mc
    prompt: Los límites de 750 kg y 3.500 kg para el remolque se miden por...
    options: [El peso que lleva el remolque hoy, La masa máxima permitida del remolque y del conjunto, El peso del conductor, El largo del remolque]
    answer: 1
    explain: Se usa la masa máxima permitida según los papeles del vehículo, no la carga de hoy.
    cites: ["rr:15.1.e"]
