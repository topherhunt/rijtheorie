questions:
  - id: sanciones-accidente-rijverbod-aun-no-conduce
    type: yesno
    prompt: Un agente ve a una persona que se tambalea y arrastra las palabras, con las llaves en la mano, abriendo la puerta de su auto. Todavía no ha arrancado. ¿Puede imponerle un rijverbod?
    answer: true
    explain: El rijverbod puede imponerse también a quien se dispone a conducir (aanstalten maakt), no solo a quien ya está al volante, y dura hasta 24 horas.
    cites: ["wvw:162"]

  - id: sanciones-accidente-ongeldig
    type: mc
    prompt: El CBR te pidió un examen de aptitud y no cooperas. ¿Qué pasa con tu permiso?
    options: ["El CBR lo declara inválido desde el séptimo día tras notificarte", "Queda suspendido solo hasta que pagues una multa al CBR", "Sigue válido mientras el CBR te vuelve a citar para otra fecha de examen", "Se invalida al instante, incluso antes de que te notifiquen"]
    answer: 0
    explain: Si no cooperas, el CBR declara el permiso inválido; la decisión entra en vigor el séptimo día después de la notificación y debes entregar el permiso.
    cites: ["wvw:132"]

  - id: sanciones-accidente-123b
    type: yesno
    prompt: Hace 3 años te condenaron (sentencia firme) por soplar 300 µg/l. Ahora te condenan por conducir con 650 µg/l. ¿Pierde tu permiso la validez para todas las categorías?
    answer: true
    explain: El nuevo nivel supera 570 µg/l y tienes una condena anterior por alcohol dentro de los 5 años, a cualquier nivel. Se cumplen las dos condiciones del artículo 123b.
    cites: ["wvw:123b"]

  - id: sanciones-123b-nivel-bajo
    type: yesno
    prompt: Hace 3 años te condenaron (sentencia firme) por soplar 400 µg/l. Ahora te condenan solo por soplar 300 µg/l, sin otra circunstancia. ¿Pierde tu permiso automáticamente la validez para todas las categorías por esta reincidencia?
    answer: false
    explain: El artículo 123b exige que la condena nueva sea de las graves (más de 570 µg/l, art. 8 lid 1 o 5, o negarte a lo ordenado por el art. 163). Con 300 µg/l no se cumple, aunque tengas un antecedente reciente.
    cites: ["wvw:123b"]

  - id: sanciones-accidente-carreras
    type: yesno
    prompt: Quedas con un amigo en una carretera pública a una hora tranquila para comparar cuál de vuestros autos acelera más rápido. ¿Infringes la ley?
    answer: true
    explain: El artículo 10 prohíbe participar en la vía en una competición, que incluye cualquier conducción para medir o comparar el rendimiento de vehículos o conductores. Que haya poco tráfico no lo cambia.
    cites: ["wvw:10"]

  - id: sanciones-multa-titular
    type: yesno
    prompt: Una cámara capta tu auto a demasiada velocidad mientras lo conducía un amigo. ¿La multa llega a tu nombre, como titular de la matrícula?
    answer: true
    explain: Si no se para al conductor en el momento, la multa administrativa se envía al kentekenhouder.
    cites: ["general"]

  - id: sanciones-puntos-novel
    type: mc
    prompt: Tienes el beginnersrijbewijs y la policía te para por segunda vez por una infracción grave. ¿Qué pasa?
    options: ["El OM te comunica al CBR, que investiga tu aptitud", "Nada: los puntos solo cuentan a partir de 5 infracciones", "Pagas una multa más alta y no pasa nada más", "Te quitan el auto durante un mes"]
    answer: 0
    explain: Con el 2.º strafpunt del beginnersrijbewijs, el OM te comunica al CBR.
    cites: ["rijksoverheid-beginners"]

  - id: sanciones-velocidad-80-en-50
    type: yesno
    prompt: Conduces un auto a 80 km/h en un tramo limitado a 50 km/h y la policía te detiene. ¿Pueden retirarte el permiso en el acto por esa velocidad?
    answer: false
    explain: Son 30 km/h de exceso. El umbral de 30 km/h es solo para la bromfiets; para un auto el retiro inmediato exige 50 km/h o más. Seguirá habiendo multa.
    cites: ["wvw:164.2"]

  - id: sanciones-velocidad-bromfiets-35
    type: yesno
    prompt: Conduces una bromfiets y la policía te detiene por pasar el máximo de velocidad en 35 km/h. ¿Pueden retirarte el permiso en el acto?
    answer: true
    explain: Para la bromfiets el umbral es de 30 km/h o más sobre el máximo, con detención en el momento. Con 35 lo superas.
    cites: ["wvw:164.2"]

  - id: sanciones-rijontzegging-reincidencia
    type: mc
    prompt: Hace 3 años terminó una rijontzegging que te impusieron por conducir bajo influencia. Ahora te condenan otra vez por conducir bajo influencia. ¿Cuánto puede durar como máximo la nueva rijontzegging?
    options: ["2 años", "5 años", "10 años", "No puede haber otra"]
    answer: 2
    explain: Si cometes una de esas infracciones graves antes de que pasen 5 años desde el fin de la rijontzegging anterior, el máximo sube de 5 a 10 años.
    cites: ["wvw:179.1", "wvw:179.4"]

  - id: sanciones-rijontzegging-peligro-menos
    type: mc
    prompt: Sin antecedentes, un juez te condena por poner en peligro el tráfico, por ejemplo por haber frenado a propósito delante de otro conductor. ¿Hasta cuántos años de rijontzegging puede imponerte?
    options: ["Hasta 2 años", "Hasta 5 años", "Hasta 10 años", "Hasta 1 año"]
    answer: 0
    explain: El artículo 5 está entre las infracciones del segundo apartado (hasta 2 años). Los 5 años son para las graves, como conducir bajo influencia o huir de un accidente.
    cites: ["wvw:179.2", "wvw:179.1"]

  - id: sanciones-accidente-5h-danos
    type: yesno
    prompt: Te fuiste de un accidente con solo daños materiales sin dar tu identidad. A las 5 horas, y antes de que te detengan o interroguen, avisas voluntariamente a la policía y das tu identidad y la de tu auto. ¿Queda excluida la persecución penal por haberte ido?
    answer: true
    explain: El artículo 184 excluye la persecución si avisas voluntariamente dentro de las 12 horas siguientes y antes de ser detenido o interrogado como sospechoso.
    cites: ["wvw:184"]

  - id: sanciones-accidente-20h
    type: yesno
    prompt: Te fuiste de un accidente con daños sin dar tu identidad. A las 20 horas te presentas voluntariamente en la policía. ¿Te libra eso de ser perseguido por haberte ido?
    answer: false
    explain: El artículo 184 solo cubre el aviso voluntario dentro de las 12 horas siguientes al accidente. A las 20 horas ya no.
    cites: ["wvw:184"]
