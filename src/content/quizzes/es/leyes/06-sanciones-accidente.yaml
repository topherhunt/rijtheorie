questions:
  - id: sanciones-accidente-rijverbod
    type: yesno
    prompt: Tienes un rijverbod vigente. ¿Puedes conducir si ya te sientes mejor?
    answer: false
    explain: Está prohibido conducir mientras dure el rijverbod.
    cites: ["wvw:162"]

  - id: sanciones-accidente-huir
    type: mc
    prompt: Chocas con un auto estacionado y rompes un espejo. No hay nadie cerca. ¿Qué dice la ley?
    options: [Puedes irte porque el daño es pequeño, No puedes irte sin dar la oportunidad de verificar tu identidad, Solo debes llamar al seguro al día siguiente, Puedes irte si pagas en efectivo]
    answer: 1
    explain: Está prohibido abandonar el lugar si hay daños a otra persona, salvo que hayas dado la oportunidad de verificar tu identidad y la del vehículo.
    cites: ["wvw:7"]

  - id: sanciones-accidente-herido
    type: yesno
    prompt: Hubo un herido en un accidente en el que participaste. Nadie ha verificado aún tu identidad. ¿Está prohibido abandonar el lugar?
    answer: true
    explain: Con muertos, heridos o daños no puedes irte sin dar antes la oportunidad de verificar tu identidad. Y nunca puedes irte si dejas a un herido desamparado.
    cites: ["wvw:7"]

  - id: sanciones-accidente-ongeldig
    type: mc
    prompt: Si no cooperas con el CBR, ¿qué pasa con tu permiso?
    options: [Nada, El CBR lo declara inválido y debes entregarlo, Te dan uno nuevo, Solo te multan]
    answer: 1
    explain: El CBR declara el permiso inválido; entra en vigor el séptimo día tras la notificación.
    cites: ["wvw:132"]

  - id: sanciones-accidente-123b
    type: yesno
    prompt: Te condenan otra vez por conducir bajo influencia dentro de 5 años de una condena anterior similar. ¿Puede tu permiso perder validez para todas las categorías?
    answer: true
    explain: En ese caso el permiso pierde validez y, para obtener uno nuevo, debes demostrar tu aptitud.
    cites: ["wvw:123b"]

  - id: sanciones-accidente-carreras
    type: yesno
    prompt: ¿Se pueden hacer carreras en una vía pública si no hay tráfico?
    answer: false
    explain: Las carreras en la vía pública están prohibidas.
    cites: ["wvw:10"]

  - id: sanciones-multa-titular
    type: yesno
    prompt: Una cámara capta tu auto a demasiada velocidad mientras lo conducía un amigo. ¿La multa llega a tu nombre, como titular de la matrícula?
    answer: true
    explain: Si no se para al conductor en el momento, la multa administrativa se envía al kentekenhouder.
    cites: ["general"]

  - id: sanciones-puntos-novel
    type: mc
    prompt: Tienes el beginnersrijbewijs y la policía te para por segunda vez por una infracción grave. ¿Qué pasa?
    options: ["El Openbaar Ministerie te comunica al CBR, que investiga tu aptitud", "Nada, los puntos solo cuentan a partir de 5", "Pagas una multa más alta y nada más", "Te quitan el auto"]
    answer: 0
    explain: Con el 2.º strafpunt del beginnersrijbewijs, el OM te comunica al CBR.
    cites: ["rijksoverheid-beginners"]

  - id: sanciones-velocidad-100-en-50
    type: yesno
    prompt: Conduces un auto a 100 km/h en un tramo limitado a 50 km/h y la policía te detiene en el momento. ¿Pueden retirarte el permiso en el acto?
    answer: true
    explain: Pasar el máximo por 50 km/h o más, siendo conductor de un vehículo de motor que no es bromfiets y con detención en el momento, permite el retiro inmediato del permiso.
    cites: ["wvw:164.2"]

  - id: sanciones-velocidad-80-en-50
    type: yesno
    prompt: Conduces un auto a 80 km/h en un tramo limitado a 50 km/h y la policía te detiene. ¿Pueden retirarte el permiso en el acto por esa velocidad?
    answer: false
    explain: Son 30 km/h de exceso. El umbral de 30 km/h es solo para la bromfiets; para un auto el retiro inmediato exige 50 km/h o más. Seguirá habiendo multa.
    cites: ["wvw:164.2"]

  - id: sanciones-velocidad-bromfiets-35
    type: yesno
    prompt: Conduces una bromfiets y la policía te detiene por pasar el máximo de velocidad en 35 km/h. ¿Pueden retirarte el permiso en el acto?
    answer: true
    explain: Para la bromfiets el umbral es de 30 km/h o más sobre el máximo, con detención en el momento. Con 35 lo superas.
    cites: ["wvw:164.2"]

  - id: sanciones-rijontzegging-reincidencia
    type: mc
    prompt: Hace 3 años terminó una rijontzegging que te impusieron por conducir bajo influencia. Ahora te condenan otra vez por conducir bajo influencia. ¿Cuánto puede durar como máximo la nueva rijontzegging?
    options: ["2 años", "5 años", "10 años", "No puede haber otra"]
    answer: 2
    explain: Si cometes una de esas infracciones graves antes de que pasen 5 años desde el fin de la rijontzegging anterior, el máximo sube de 5 a 10 años.
    cites: ["wvw:179.1", "wvw:179.4"]

  - id: sanciones-rijontzegging-peligro-menos
    type: yesno
    prompt: Sin antecedentes, un juez te condena por conducir bajo influencia (art. 8) y a otra persona por poner en peligro el tráfico (art. 5). ¿Puede la rijontzegging del primero llegar a 5 años y la del segundo solo a 2?
    answer: true
    explain: El artículo 8 está entre las infracciones del primer apartado (hasta 5 años). El artículo 5 está en el segundo (hasta 2 años).
    cites: ["wvw:179.1", "wvw:179.2"]

  - id: sanciones-accidente-5h-danos
    type: yesno
    prompt: Te fuiste de un accidente con solo daños materiales sin dar tu identidad. A las 5 horas, y antes de que te detengan o interroguen, avisas voluntariamente a la policía y das tu identidad y la de tu auto. ¿Queda excluida la persecución penal por haberte ido?
    answer: true
    explain: El artículo 184 excluye la persecución si avisas voluntariamente dentro de las 12 horas siguientes y antes de ser detenido o interrogado como sospechoso.
    cites: ["wvw:184"]

  - id: sanciones-accidente-20h
    type: yesno
    prompt: Te fuiste de un accidente con daños sin dar tu identidad. A las 20 horas te presentas voluntariamente en la policía. ¿Te protege el artículo 184 contra la persecución por haberte ido?
    answer: false
    explain: El artículo 184 solo cubre el aviso voluntario dentro de las 12 horas siguientes al accidente. A las 20 horas ya no.
    cites: ["wvw:184"]

