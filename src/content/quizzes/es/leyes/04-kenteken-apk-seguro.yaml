questions:
  - id: kenteken-apk-seguro-garaje
    type: yesno
    prompt: Tu auto está registrado a tu nombre, pero lleva meses guardado en el garaje sin circular. ¿Sigues obligado a mantener el seguro de responsabilidad civil?
    answer: true
    explain: La WAM exige el seguro también cuando el vehículo está inscrito y a nombre de alguien en el kentekenregister, aunque no circule.
    cites: ["wam:2.1"]

  - id: kenteken-apk-seguro-tapar
    type: mc
    prompt: Vas a viajar con un portabicicletas cargado que tapa la matrícula trasera. ¿Qué es lo correcto?
    options: ["Poner en el portabicicletas una placa con el mismo kenteken", "Nada, si la matrícula delantera sigue visible desde delante", "Quitar la matrícula trasera y llevarla en el maletero durante el viaje", "Llevar la placa trasera dentro del auto, visible por la luneta"]
    answer: 0
    explain: El kenteken debe verse. Si el portabultos o la carga tapan la placa, el portabultos debe llevar una placa con el mismo kenteken (y su luz si es obligatoria).
    cites: ["wvw:40", "rv:5.18.7/1"]

  - id: kenteken-apk-seguro-camaras
    type: yesno
    prompt: Para que las cámaras de control no te lean la matrícula, pones una cubierta sobre ella al circular. ¿Es una infracción?
    answer: true
    explain: El artículo 41 prohíbe poner algo en el vehículo con el fin de dificultar el reconocimiento del kenteken, y también circular con el vehículo así.
    cites: ["wvw:41"]

  - id: kenteken-apk-seguro-remolque
    type: mc
    prompt: Tu remolque tiene una masa máxima de 600 kg y no tiene matrícula propia. ¿Qué placa lleva?
    options: ["Ninguna, porque no circula por su cuenta", "La misma del auto que lo arrastra", "Una placa temporal de papel del RDW", "La del dueño del remolque, sea quien sea"]
    answer: 1
    explain: Un remolque de hasta 750 kg sin kenteken propio lleva el kenteken del vehículo que lo arrastra.
    cites: ["rv:5.18.10/1"]

  - id: kenteken-apk-seguro-card-reciente
    type: yesno
    prompt: Compraste el auto hace 5 días y se puso a tu nombre, pero la kentekencard aún no te la han entregado. La policía te para. ¿Estás obligado a mostrarla?
    answer: false
    explain: La obligación rige desde que la kentekencard se entrega, y en todo caso desde 14 días después de la tenaamstelling. Aún no se cumple ninguna de las dos.
    cites: ["kr:22"]

  - id: kenteken-apk-seguro-conductor-kenteken
    type: yesno
    prompt: Un amigo te presta su auto, y su placa trasera se soltó y viaja en el maletero, con lo que el kenteken ya no se ve en la parte de atrás. Lo conduces tú. ¿Puedes ser responsable tú, y no solo tu amigo?
    answer: true
    explain: Según los artículos 40 y 36, además del propietario o poseedor responde el conductor cuando se circula con el vehículo.
    cites: ["wvw:40.4", "wvw:36.6"]

  - id: kenteken-apk-seguro-apk-prestado
    type: yesno
    prompt: Conduces el auto prestado de un amigo y su keuringsbewijs (APK) ya no es válido. ¿Puedes ser responsable tú también, y no solo tu amigo?
    answer: true
    explain: El artículo 72 hace responsables al propietario o poseedor y, cuando se circula con el vehículo, también al conductor.
    cites: ["wvw:72"]

  - id: kenteken-apk-diesel
    type: mc
    prompt: Tu auto diésel tiene 5 años y pasó su último APK hace 11 meses. ¿Cuándo toca el siguiente?
    options: ["En aproximadamente 1 mes, porque ahora es cada año", "Dentro de 13 meses, cuando se cumplan 2 años del primero", "Dentro de 2 años, como en los de gasolina", "Ya no hace falta, porque pasó el primero"]
    answer: 0
    explain: Los diésel y GLP tienen el primer APK a los 3 años y después cada año.
    cites: ["anwb-apk"]

  - id: kenteken-apk-gasolina-vieja
    type: yesno
    prompt: Compras un auto de gasolina de 9 años. El vendedor te dice que su último APK fue hace 14 meses. ¿Está el APK al día?
    answer: false
    explain: Un auto de gasolina de 8 años o más pasa el APK cada año, así que el plazo ya venció. Los 2 años son para el tramo de 4 a 8 años del auto.
    cites: ["anwb-apk"]

  - id: kenteken-apk-gasolina-joven
    type: yesno
    prompt: Tu auto de gasolina tiene 5 años y pasó el APK hace 18 meses. ¿Todavía está dentro del plazo?
    answer: true
    explain: Entre los 4 y los 8 años de edad, un auto de gasolina pasa el APK cada 2 años. A los 18 meses aún falta para el siguiente. A partir de los 8 años sería cada año.
    cites: ["anwb-apk"]

  - id: kenteken-apk-antes
    type: mc
    prompt: El APK de tu auto de gasolina de 5 años vence el 1 de junio y lo haces el 20 de abril. ¿Cuándo vence el nuevo?
    options: ["El 1 de junio, dos años después", "El 20 de abril, dos años después", "El 20 de abril del año siguiente", "El 1 de junio del año siguiente"]
    answer: 0
    explain: Hacer el APK hasta 2 meses antes del vencimiento no cambia la fecha de vencimiento, así que se cuenta desde el 1 de junio. Para este auto el intervalo es de 2 años.
    cites: ["anwb-apk"]
