questions:
  - id: via-y-lugares-berm
    type: mc
    prompt: ¿Qué significa "berm"?
    options: [Acera, Berma (franja lateral de tierra o hierba), Carril bus, Paso a nivel]
    answer: 1
    explain: "La berm es la berma: la franja lateral de tierra o hierba junto a la calzada."
    cites: ["cbr-examenplan:4"]
    exam: false

  - id: via-y-lugares-uitvoeg
    type: mc
    prompt: ¿Cuál es el carril para salir de una autopista?
    options: ["invoegstrook", "uitvoegstrook", "busstrook", "spitsstrook"]
    answer: 1
    explain: Uitvoegstrook es el carril de salida/desaceleración.
    cites: ["cbr-examenplan:4"]
    exam: false

  - id: via-y-lugares-berm-adelantar
    type: yesno
    prompt: Por una autoweg circulas detrás de un vehículo lento. No hay ninguna emergencia. ¿Puedes adelantarlo por la berm?
    answer: false
    explain: En una autosnelweg o autoweg está prohibido usar la berm (igual que la vluchtstrook y la vluchthaven) salvo en un noodgeval. Adelantar no es una emergencia.
    cites: ["rvv:43.3"]

  - id: via-y-lugares-spitsstrook-a3
    type: yesno
    prompt: Sobre la spitsstrook de una autosnelweg se ilumina un panel con una velocidad máxima (señal A3). No hay cruz roja. ¿Puedes circular por ese carril?
    answer: true
    explain: Con una flecha verde o con una velocidad máxima iluminada (A3) el carril puede usarse. Solo la cruz roja lo cierra, y entonces la vluchtstrook queda para emergencias.
    cites: ["rvv:73"]

  - id: via-y-lugares-inrit-ceder
    type: mc
    prompt: Circulas por una calle y giras a la izquierda para entrar en el garaje de una casa (una inrit). Viene un coche de frente por la calzada. ¿Quién debe dejar pasar al otro?
    options: [Tú dejas pasar al coche que viene de frente, El coche de frente te deja pasar a ti porque ya has puesto el intermitente, Pasa quien llegue antes al garaje, Pasa quien vaya más despacio]
    answer: 0
    explain: 'Girar para entrar en una inrit es una maniobra especial del art. 54: quien la hace deja pasar al resto del tráfico. El intermitente avisa, pero no te da preferencia.'
    cites: ["rvv:54"]

  - id: via-y-lugares-erf-situacion
    type: multi
    prompt: Entras en un erf. ¿Cuáles de estas afirmaciones son correctas?
    options: [No puedes ir a más de 15 km/h, Los peatones pueden usar el camino en todo su ancho, Puedes ir a 30 km/h si no hay nadie, Los peatones deben apartarse a un lado del camino]
    answer: [0, 1]
    explain: En un erf el máximo es 15 km/h y los peatones pueden usar toda la anchura. No hay excepción "si no hay nadie", y los peatones no tienen que apartarse.
    cites: ["rvv:44", "rvv:45", "rvv:46"]

  - id: via-y-lugares-erf-aparcar
    type: yesno
    prompt: Dentro de un erf ves un hueco libre delante de una casa, sin ninguna plaza marcada. ¿Puedes aparcar tu coche ahí?
    answer: false
    explain: Un vehículo de motor solo puede aparcar en un erf en plazas señaladas o marcadas como parkeerplaats.
    cites: ["rvv:46"]
