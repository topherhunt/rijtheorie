questions:
  - id: via-y-lugares-berm
    type: mc
    prompt: ¿Qué significa "berm"?
    options: [Acera, Berma (franja lateral de tierra o hierba), Carril bus, Paso a nivel]
    answer: 1
    explain: "La berm es la berma: la franja lateral de tierra o hierba junto a la calzada."
    cites: ["cbr-examenplan:4"]
    exam: false

