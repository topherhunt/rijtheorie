questions:
  - id: via-y-lugares-berm
    type: mc
    prompt: ¿Qué significa "berm"?
    options: [Acera, Berma (franja lateral de tierra o hierba), Carril bus, Paso a nivel]
    answer: 1
    explain: "La berm es la berma: la franja lateral de tierra o hierba junto a la calzada."
    cites: ["cbr-examenplan:4"]
    exam: false

  - id: via-y-lugares-uitvoeg
    type: mc
    prompt: ¿Cuál es el carril para salir de una autopista?
    options: [invoegstrook, uitvoegstrook, busstrook, spitsstrook]
    answer: 1
    explain: Uitvoegstrook es el carril de salida/desaceleración.
    cites: ["cbr-examenplan:4"]
    exam: false

  - id: via-y-lugares-vluchtstrook-uso
    type: yesno
    prompt: Circulas por una autosnelweg y quieres parar a leer un mensaje. La vluchtstrook está libre y no hay ninguna emergencia. ¿Puedes parar ahí?
    answer: false
    explain: En una autosnelweg o autoweg la vluchtstrook solo se puede usar en un noodgeval (emergencia). Leer un mensaje no lo es.
    cites: ["rvv:43.3"]

  - id: via-y-lugares-berm-adelantar
    type: yesno
    prompt: Por una autoweg circulas detrás de un vehículo lento. No hay ninguna emergencia. ¿Puedes adelantarlo por la berm?
    answer: false
    explain: En una autosnelweg o autoweg está prohibido usar la berm (igual que la vluchtstrook y la vluchthaven) salvo en un noodgeval. Adelantar no es una emergencia.
    cites: ["rvv:43.3"]

  - id: via-y-lugares-spitsstrook-cruz
    type: mc
    prompt: En una autosnelweg con spitsstrook, el panel sobre ese carril muestra una cruz roja. ¿Qué haces?
    options: [Circulo por ese carril si hay poco tráfico, No circulo por ese carril y lo uso solo en una emergencia, Circulo por él si voy despacio, Circulo por él solo para adelantar]
    answer: 1
    explain: Con la cruz roja el carril no se puede usar, y la vluchtstrook solo se usa en emergencias. Solo una flecha verde habilita el carril.
    cites: ["rvv:73", "rvv:1"]

  - id: via-y-lugares-invoeg-ceder
    type: mc
    prompt: Circulas por una invoegstrook y te incorporas a la doorgaande rijbaan. ¿Quién debe dejar pasar al otro?
    options: [Tú dejas pasar al tráfico de la doorgaande rijbaan, El tráfico de la doorgaande rijbaan te deja pasar siempre, Pasa quien llegue primero, Pasa el que va más rápido]
    answer: 0
    explain: Quien pasa de la invoegstrook a la doorgaande rijbaan hace una maniobra especial y deja pasar al resto del tráfico.
    cites: ["rvv:54"]

  - id: via-y-lugares-uitrit-ceder
    type: yesno
    prompt: Sales de un uitrit (la salida de un garaje) hacia la calle y se acerca un coche por la calzada. ¿Debes dejarlo pasar?
    answer: true
    explain: Salir de un uitrit a la vía es una maniobra especial. Quien la hace deja pasar al resto del tráfico.
    cites: ["rvv:54"]

  - id: via-y-lugares-erf-situacion
    type: multi
    prompt: Entras en un erf. ¿Cuáles de estas afirmaciones son correctas?
    options: [No puedes ir a más de 15 km/h, Los peatones pueden usar el camino en todo su ancho, Puedes ir a 30 km/h si no hay nadie, Un coche puede aparcar en cualquier sitio libre]
    answer: [0, 1]
    explain: En un erf el máximo es 15 km/h y los peatones pueden usar toda la anchura. No hay excepción "si no hay nadie", y un vehículo de motor solo puede aparcar en plazas señaladas.
    cites: ["rvv:44", "rvv:45", "rvv:46"]

  - id: via-y-lugares-erf-aparcar
    type: yesno
    prompt: Dentro de un erf ves un hueco libre delante de una casa, sin ninguna plaza marcada. ¿Puedes aparcar tu coche ahí?
    answer: false
    explain: Un vehículo de motor solo puede aparcar en un erf en plazas señaladas o marcadas como parkeerplaats.
    cites: ["rvv:46"]

  - id: via-y-lugares-autoweg-velocidad
    type: mc
    prompt: Un vehículo de motor solo puede alcanzar 55 km/h como máximo. ¿A qué vía puede entrar?
    options: [A la autosnelweg y a la autoweg, Solo a la autoweg, Solo a la autosnelweg, A ninguna de las dos]
    answer: 1
    explain: La autoweg exige poder circular al menos a 50 km/h y la autosnelweg al menos a 60 km/h. Con 55 km/h solo cumple la autoweg.
    cites: ["rvv:42"]
