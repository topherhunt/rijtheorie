questions:
  - id: auto-y-equipo-reserveband
    type: mc
    prompt: ¿Qué es una "reserveband"?
    options: [Una rueda de repuesto, Un neumático de invierno, Un freno, Una llanta deportiva]
    answer: 0
    explain: Reserveband es la rueda de repuesto.
    cites: ["cbr-examenplan:4"]
    exam: false

  - id: auto-y-equipo-dode-hoek
    type: mc
    prompt: ¿Qué es la "dode hoek"?
    options: [El ángulo muerto, Una curva cerrada, Una esquina de la calle, Un estacionamiento]
    answer: 0
    explain: Dode hoek es el ángulo muerto.
    cites: ["cbr-examenplan:4"]
    exam: false

  - id: auto-y-equipo-claxon-semaforo
    type: yesno
    prompt: El auto de delante tarda en arrancar con el semáforo ya en verde. ¿Puedes tocar la bocina para que avance?
    answer: false
    explain: La bocina y la ráfaga solo se usan para evitar un peligro inminente. Apurar a otro conductor no lo es.
    cites: ["rvv:28"]

  - id: auto-y-equipo-claxon-peligro
    type: yesno
    prompt: Un ciclista se cruza delante de ti sin mirar y vas a chocar con él si no avisas. ¿Puedes tocar la bocina?
    answer: true
    explain: La bocina se puede usar para evitar un peligro inminente, y un choque que se acerca lo es.
    cites: ["rvv:28"]

  - id: auto-y-equipo-rafaga-gracias
    type: yesno
    prompt: Un conductor se detiene para dejarte pasar. ¿Puedes darle una ráfaga (knippersignaal) para agradecérselo?
    answer: false
    explain: Las ráfagas, igual que la bocina, solo se dan para evitar un peligro inminente. Agradecer no lo es.
    cites: ["rvv:28"]

  - id: auto-y-equipo-nino-1-30
    type: mc
    prompt: Llevas en el asiento trasero a una niña de 10 años que mide 1,30 m. ¿Cómo debe ir?
    options: [Con el cinturón normal de adulto, En un sistema de retención infantil con homologación, Con el cinturón y un cojín sin homologar, Solo con el cinturón de regazo]
    answer: 1
    explain: Un pasajero menor de 18 años y de menos de 1,35 m debe usar un sistema de retención infantil con homologación.
    cites: ["rvv:59"]

  - id: auto-y-equipo-examen-aceite
    type: mc
    prompt: En el examen práctico el examinador te pregunta por el nivel de aceite. ¿Qué esperan de ti?
    options: [Que midas tú el nivel con el motor caliente, Que nombres el tipo de aceite del motor, Que señales con qué se comprueba y expliques cómo, Que expliques de qué está compuesto el aceite]
    answer: 2
    explain: El examinador no te pide comprobar el nivel ni pregunta por tipos o composición del aceite; debes poder señalar con qué se controla y explicar cómo.
    cites: ["cbr-rijprocedure:3.7"]

  - id: auto-y-equipo-examen-frenos
    type: mc
    prompt: En el examen práctico, ¿qué debes poder hacer con el líquido de frenos (remvloeistof)?
    options: [Explicar de qué está compuesto, Señalar el depósito y explicar cómo se lee el nivel, Explicar cómo funciona dentro del sistema, Rellenarlo tú si está bajo]
    answer: 1
    explain: No se pregunta por el doble propósito, el funcionamiento ni la composición del líquido. Lo que se espera es señalar el depósito y explicar cómo se lee el nivel.
    cites: ["cbr-rijprocedure:3.7"]

  - id: auto-y-equipo-examen-neumaticos-dano
    type: multi
    prompt: Sobre los neumáticos, ¿cuáles de estos temas puede preguntarte el examinador del práctico?
    options: [La profundidad del dibujo, De qué materiales están hechos, El riesgo de un neumático dañado, La composición química de la goma]
    answer: [0, 2]
    explain: Puede preguntar por la profundidad del dibujo, la diferencia entre neumáticos de verano e invierno, el riesgo de un neumático dañado y para qué sirve el tapón de la válvula. No pregunta por la composición ni por los materiales.
    cites: ["cbr-rijprocedure:3.7"]
