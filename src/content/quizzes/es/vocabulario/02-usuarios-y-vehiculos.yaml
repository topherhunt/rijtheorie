questions:
  - id: usuarios-y-vehiculos-ruiter
    type: mc
    prompt: ¿Qué es un "ruiter"?
    options: [Un ciclista, Un jinete, Un patinador, Un motociclista]
    answer: 1
    explain: Ruiter es el jinete.
    cites: ["cbr-examenplan:4"]
    exam: false

  - id: usuarios-y-vehiculos-tegenpartij
    type: mc
    prompt: ¿Qué es la "tegenpartij" en un accidente?
    options: [El testigo que presenció todo el choque, La otra parte implicada en el choque, El agente que atendió el choque, La aseguradora que paga el choque]
    answer: 1
    explain: Tegenpartij es la otra parte.
    cites: ["cbr-examenplan:4"]
    exam: false

  - id: usuarios-y-vehiculos-brommobiel-autoweg
    type: yesno
    prompt: Una brommobiel, construida para un máximo de 45 km/h, se acerca a la entrada de una autoweg. ¿Puede entrar?
    answer: false
    explain: Aunque la brommobiel siga las reglas de los motorvoertuigen, la autoweg exige poder ir al menos a 50 km/h (art. 42), y una bromfiets no pasa de 45 km/h. Seguir esas reglas no le da esa velocidad.
    cites: ["rvv:42", "rvv:2a", "wvw:1.1"]

  - id: usuarios-y-vehiculos-motorrijtuig-cuales
    type: multi
    prompt: Según la WVW, ¿cuáles de estos vehículos son un motorrijtuig?
    options: [Una bromfiets, Una brommobiel, Una bicicleta con pedaleo asistido, Una bicicleta normal]
    answer: [0, 1]
    explain: La WVW llama motorrijtuig a todo vehículo con fuerza mecánica, salvo las bicicletas con pedaleo asistido. La bromfiets y la brommobiel entran; la bicicleta con pedaleo asistido queda excluida expresamente y la normal no tiene motor.
    cites: ["wvw:1.1"]

  - id: usuarios-y-vehiculos-voorrangsvoertuig
    type: mc
    prompt: Por detrás se acerca un vehículo con luz azul intermitente y bocina de dos tonos. ¿Qué debes hacer?
    options: [Dejarlo pasar, Mantener tu posición porque tienes prioridad, Acelerar para no estorbarlo, Detenerte donde estés aunque cierres el paso]
    answer: 0
    explain: Es un voorrangsvoertuig y los usuarios de la vía deben dejarlo pasar, es decir, permitirle seguir sin estorbos. No tienes prioridad sobre él ni debes bloquear el paso.
    cites: ["rvv:50", "rvv:29", "rvv:1"]

  - id: usuarios-y-vehiculos-tegenpartij-datos
    type: yesno
    prompt: Rozas el auto de otro conductor, que está presente, y le haces daño. ¿Debes darle la oportunidad de establecer tu identidad y la de tu auto antes de irte?
    answer: true
    explain: Quien está implicado en un accidente con daño a otro tiene prohibido irse del lugar, salvo que haya dado la oportunidad de establecer su identidad y la de su vehículo. Sin dar tus datos no se cumple esa salvedad.
    cites: ["wvw:7"]

  - id: usuarios-y-vehiculos-slachtoffer-desamparo
    type: yesno
    prompt: Has chocado con un ciclista que está herido y quedaría sin ayuda si te vas. Ya le diste tus datos y los de tu auto. ¿Puedes irte?
    answer: false
    explain: Dejar a un herido en situación de desamparo está prohibido y la excepción por haber dado tus datos no cubre ese caso. Dar tus datos no basta.
    cites: ["wvw:7"]
