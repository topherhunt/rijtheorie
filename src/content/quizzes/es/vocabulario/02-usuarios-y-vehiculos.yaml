questions:
  - id: usuarios-y-vehiculos-ruiter
    type: mc
    prompt: ¿Qué es un "ruiter"?
    options: [Un ciclista, Un jinete, Un peatón, Un motociclista]
    answer: 1
    explain: Ruiter es el jinete.
    cites: ["cbr-examenplan:4"]
    exam: false

  - id: usuarios-y-vehiculos-tegenpartij
    type: mc
    prompt: ¿Qué es la "tegenpartij" en un accidente?
    options: [El testigo, La otra parte involucrada, El policía, La aseguradora]
    answer: 1
    explain: Tegenpartij es la otra parte.
    cites: ["cbr-examenplan:4"]
    exam: false

  - id: usuarios-y-vehiculos-brommobiel-autoweg
    type: yesno
    prompt: Una brommobiel se acerca a la entrada de una autoweg. ¿Puede entrar?
    answer: false
    explain: La autoweg es solo para vehículos de motor (motorvoertuigen). Una brommobiel es una bromfiets, y las bromfietsen quedan fuera de esa definición.
    cites: ["rvv:42", "rvv:1"]

  - id: usuarios-y-vehiculos-motorrijtuig-bromfiets
    type: yesno
    prompt: Según la WVW, ¿una bromfiets es un motorrijtuig?
    answer: true
    explain: La WVW llama motorrijtuig a todo vehículo con fuerza mecánica salvo las bicicletas con pedaleo asistido, así que incluye a la bromfiets. El RVV, en cambio, deja a la bromfiets fuera de "motorvoertuigen".
    cites: ["wvw:1.1", "rvv:1"]

  - id: usuarios-y-vehiculos-voorrangsvoertuig
    type: mc
    prompt: Por detrás se acerca un vehículo con luz azul intermitente y bocina de dos tonos. ¿Qué debes hacer?
    options: [Dejarlo pasar, Mantener tu posición porque tienes prioridad, Acelerar para no estorbarlo, Detenerte donde estés aunque cierres el paso]
    answer: 0
    explain: Es un voorrangsvoertuig y los usuarios de la vía deben dejarlo pasar, es decir, permitirle seguir sin estorbos. No tienes prioridad sobre él ni debes bloquear el paso.
    cites: ["rvv:50", "rvv:29", "rvv:1"]

  - id: usuarios-y-vehiculos-ruiter-calzada
    type: yesno
    prompt: Una jinete va por la calzada de una calle donde no hay ruiterpad. ¿Está permitido?
    answer: true
    explain: Los jinetes usan el ruiterpad, y si no existe pueden usar la berm o la calzada.
    cites: ["rvv:8"]

  - id: usuarios-y-vehiculos-regelaar-obedecer
    type: multi
    prompt: Estás en un cruce y alguien dirige el tráfico con gestos. ¿A cuáles de estas personas estás obligado a obedecer?
    options: [Un agente de policía en servicio, Un verkeersregelaar autorizado y reconocible como tal, Un peatón cualquiera que decide dirigir el tráfico por su cuenta, El pasajero del auto de delante]
    answer: [0, 1]
    explain: Debes seguir las indicaciones de los agentes competentes y de los verkeersregelaars competentes y reconocibles. Una persona sin esa condición no tiene ese poder.
    cites: ["rvv:82"]

  - id: usuarios-y-vehiculos-tegenpartij-irse
    type: yesno
    prompt: Rozas el auto de otro conductor, que está presente, y le haces daño. ¿Puedes irte sin darle tus datos?
    answer: false
    explain: Quien está implicado en un accidente con daño a otro tiene prohibido irse del lugar, salvo que haya dado la oportunidad de establecer su identidad y la de su vehículo. Sin dar tus datos no se cumple esa salvedad.
    cites: ["wvw:7"]

  - id: usuarios-y-vehiculos-slachtoffer-desamparo
    type: yesno
    prompt: Has chocado con un ciclista que está herido y quedaría sin ayuda si te vas. Ya le diste tus datos y los de tu auto. ¿Puedes irte?
    answer: false
    explain: Dejar a un herido en situación de desamparo está prohibido y la excepción por haber dado tus datos no cubre ese caso. Dar tus datos no basta.
    cites: ["wvw:7"]
