questions:
  - id: conduccion-y-accidentes-remweg
    type: mc
    prompt: ¿Qué es la "remweg"?
    options: [La distancia de frenado, La distancia de detención total, El tiempo de reacción, El freno de mano]
    answer: 0
    explain: Remweg es la distancia de frenado; stopafstand incluye además la reacción.
    cites: ["cbr-examenplan:4"]
    exam: false

  - id: conduccion-y-accidentes-blikschade
    type: mc
    prompt: ¿Qué es la "blikschade"?
    options: [Daños solo materiales, Lesiones graves, Una multa, Un seguro]
    answer: 0
    explain: Blikschade es daño material (chapa) sin heridos.
    cites: ["cbr-examenplan:4"]
    exam: false

  - id: conduccion-y-accidentes-gesloten-entrar
    type: yesno
    prompt: Una calle tiene una geslotenverklaring para tu categoría de vehículo, sin ninguna excepción indicada. Quieres cortar camino solo por 200 metros. ¿Puedes entrar?
    answer: false
    explain: La geslotenverklaring prohíbe entrar en la vía y también usarla. Que el tramo sea corto no cambia nada.
    cites: ["rvv:1"]

  - id: conduccion-y-accidentes-matrixbord-def
    type: mc
    prompt: ¿Qué es un "matrixbord"?
    options: [Un panel electrónico sobre los carriles de la autopista, Un semáforo de un cruce, Una señal de prohibición fija, Un mapa de la ruta]
    answer: 0
    explain: Un matrixbord es el panel electrónico encima de los carriles de la autopista que muestra velocidades, flechas o una cruz roja.
    cites: ["cbr-examenplan:4"]
    exam: false

  - id: conduccion-y-accidentes-adviessnelheid-def
    type: mc
    prompt: ¿Qué es la "adviessnelheid"?
    options: [La velocidad recomendada, La velocidad máxima permitida, La velocidad mínima, La velocidad media del tráfico]
    answer: 0
    explain: Adviessnelheid es la velocidad recomendada (señal A4); no es el límite legal, que se llama maximumsnelheid.
    cites: ["cbr-examenplan:4"]
    exam: false

  - id: conduccion-y-accidentes-schadeformulier-def
    type: mc
    prompt: ¿Qué es el "schadeformulier"?
    options: [El parte amistoso de accidente, La multa por un accidente, El permiso de conducir, El seguro del auto]
    answer: 0
    explain: El Europees schadeformulier es el formulario europeo de declaración de accidente que rellenan los implicados.
    cites: ["cbr-examenplan:4"]
    exam: false
