questions:
  - id: conduccion-y-accidentes-remweg
    type: mc
    prompt: ¿Qué es la "remweg"?
    options: [La distancia de frenado, La distancia de detención total, El tiempo de reacción, El freno de mano]
    answer: 0
    explain: Remweg es la distancia de frenado; stopafstand incluye además la reacción.
    cites: ["cbr-examenplan:4"]
    exam: false

  - id: conduccion-y-accidentes-blikschade
    type: mc
    prompt: ¿Qué es la "blikschade"?
    options: [Daños solo materiales, Lesiones graves, Una multa, Un seguro]
    answer: 0
    explain: Blikschade es daño material (chapa) sin heridos.
    cites: ["cbr-examenplan:4"]
    exam: false

  - id: conduccion-y-accidentes-movil-mano
    type: yesno
    prompt: Conduces y sostienes el móvil en la mano para cambiar de canción. ¿Está permitido?
    answer: false
    explain: Está prohibido sostener un teléfono, una tableta o un reproductor de música mientras conduces.
    cites: ["rvv:61a"]

  - id: conduccion-y-accidentes-matrix-cruz
    type: mc
    prompt: Sobre el carril por el que circulas se enciende una cruz roja en el panel. ¿Qué debes hacer?
    options: [Seguir porque el panel solo recomienda, Dejar de usar ese carril y pasar a otro, Aumentar la velocidad para salir rápido, Detenerte en el carril]
    answer: 1
    explain: La cruz roja significa que el carril no puede usarse.
    cites: ["rvv:73"]

  - id: conduccion-y-accidentes-matrix-flecha-blanca
    type: mc
    prompt: Sobre tu carril ves una flecha blanca en el panel. ¿Qué indica?
    options: [Un preaviso de que más adelante habrá una cruz roja, Que el carril ya está cerrado, Que el carril es solo para bus, Que puedes aumentar la velocidad]
    answer: 0
    explain: La flecha blanca es una voorwaarschuwing (preaviso) de la cruz roja. La flecha verde es la que permite usar el carril.
    cites: ["rvv:73"]

  - id: conduccion-y-accidentes-bus-lane-panel
    type: yesno
    prompt: Sobre un carril se ve la palabra BUS en el panel. ¿Puedes usarlo con tu auto?
    answer: false
    explain: Con BUS el carril solo puede ser usado por un lijnbus y un autobus.
    cites: ["rvv:73"]

  - id: conduccion-y-accidentes-lijnbus-autobus
    type: yesno
    prompt: Sobre un carril se ve la palabra LIJNBUS en el panel. Eres conductor de un autobús turístico (autobus) que no hace servicio de línea. ¿Puedes usarlo?
    answer: false
    explain: Con LIJNBUS el carril solo puede usarlo un lijnbus. Con la palabra BUS sí podría usarlo un autobus, pero aquí no.
    cites: ["rvv:73"]

  - id: conduccion-y-accidentes-gesloten-entrar
    type: yesno
    prompt: Una calle tiene una geslotenverklaring para tu categoría de vehículo, sin ninguna excepción indicada. Quieres cortar camino solo por 200 metros. ¿Puedes entrar?
    answer: false
    explain: La geslotenverklaring prohíbe entrar en la vía y también usarla. Que el tramo sea corto no cambia nada.
    cites: ["rvv:1"]

  - id: conduccion-y-accidentes-irse-del-lugar
    type: mc
    prompt: Chocas con otro auto y hay solo daños materiales (blikschade). ¿Cuándo puedes irte?
    options: [Cuando hayas dado la oportunidad de establecer tu identidad y la de tu vehículo, Cuando creas que el daño es pequeño, Cuando el otro conductor se haya ido, "Nunca, aunque hayas dado tus datos"]
    answer: 0
    explain: Con daño material puedes irte solo si diste la oportunidad de establecer tu identidad y la del vehículo. Que el daño te parezca pequeño no cuenta.
    cites: ["wvw:7"]
