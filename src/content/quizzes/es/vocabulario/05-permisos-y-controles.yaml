questions:
  - id: permisos-y-controles-apk
    type: mc
    prompt: ¿Qué significa "APK-gekeurd"?
    options: [Con la inspección técnica aprobada, Con el seguro pagado, Con permiso nuevo, Recién matriculado]
    answer: 0
    explain: APK-gekeurd significa que pasó la inspección APK.
    cites: ["cbr-examenplan:4"]
    exam: false

  - id: permisos-y-controles-lema
    type: mc
    prompt: ¿Qué es la EMA/LEMA?
    options: [Un curso obligatorio sobre alcohol y tráfico, Un curso sobre velocidad, Una prueba de drogas, Un permiso]
    answer: 0
    explain: LEMA/EMA es la Educatieve maatregel alcohol en verkeer.
    cites: ["cbr-examenplan:4"]
    exam: false

  - id: permisos-y-controles-kentekenbewijs-control
    type: yesno
    prompt: Un agente te hace señal de parar y te pide la documentación. ¿Debes detener el auto y mostrar el kentekenbewijs y el rijbewijs?
    answer: true
    explain: Ante la primera orden de un agente competente, el conductor de un motorrijtuig debe detener el vehículo y mostrar el kentekenbewijs y el rijbewijs.
    cites: ["wvw:160.1"]

  - id: permisos-y-controles-soplar-negarse
    type: yesno
    prompt: En un control un agente te pide soplar en el alcoholímetro (blaastest). ¿Puedes negarte?
    answer: false
    explain: Debes colaborar con el examen de aliento ante la primera orden del agente y seguir sus indicaciones.
    cites: ["wvw:160.5"]

  - id: permisos-y-controles-saliva-colaborar
    type: yesno
    prompt: En un control un agente quiere hacerte una prueba de saliva (speekseltest). ¿Estás obligado a colaborar?
    answer: true
    explain: Ante la primera orden de un agente competente debes colaborar con el examen de saliva, igual que con el de aliento.
    cites: ["wvw:160.5"]

  - id: permisos-y-controles-rijverbod-sientes-bien
    type: mc
    prompt: La policía te impone un rijverbod por drogas. Una hora después te sientes bien. ¿Puedes conducir?
    options: ["Sí, porque ya te sientes bien", "No, mientras dure el rijverbod", "Sí, si conduces despacio", "Sí, si te acompaña otro conductor"]
    answer: 1
    explain: Durante el tiempo que dura el rijverbod (como máximo 24 horas) está prohibido conducir, aunque te sientas bien.
    cites: ["wvw:162"]

  - id: permisos-y-controles-rijverbod-24h
    type: yesno
    prompt: Un agente te impone un rijverbod porque has consumido una sustancia y no puedes conducir bien. ¿Puede durar una semana?
    answer: false
    explain: El rijverbod dura el tiempo en que se espera que dure ese estado, como máximo 24 horas.
    cites: ["wvw:162"]

  - id: permisos-y-controles-rijontzegging-agente
    type: yesno
    prompt: Un agente te para por conducir bajo los efectos del alcohol. ¿Puede imponerte en ese momento una rijontzegging?
    answer: false
    explain: La rijontzegging es una pena que se impone al condenar por una infracción. Lo que sí puede imponer un agente en el momento es un rijverbod de hasta 24 horas.
    cites: ["wvw:179", "wvw:162"]

  - id: permisos-y-controles-rijverbod-vs-ontzegging
    type: mc
    prompt: ¿Cuál es la diferencia entre un rijverbod y una rijontzegging?
    options: ["El rijverbod lo impone un agente y dura como máximo 24 horas, la rijontzegging es una pena al condenar", El rijverbod lo impone un juez y la rijontzegging un agente, Son lo mismo, Los dos los impone el CBR]
    answer: 0
    explain: El rijverbod es inmediato y lo impone un agente competente por un máximo de 24 horas. La rijontzegging es una pena al condenar por ciertas infracciones.
    cites: ["wvw:162", "wvw:179"]
