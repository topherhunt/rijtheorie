questions:
  - id: paciencia-calma
    type: mc
    prompt: Otro conductor no te cede el paso cuando debía y tuviste que frenar. ¿Qué reacción espera el CBR de ti?
    options: ["Seguir con calma, sin mostrar agresividad", "Acelerar para recuperar el sitio que perdiste", "Pegarte a su parachoques para que note el error", "Tocar la bocina varias veces para avisarle"]
    answer: 0
    explain: Un buen conductor es paciente y no muestra agresividad; si alguien no te cede el paso, frenas o te detienes. Las otras reacciones suman peligro o ruido sin necesidad.
    cites: ["cbr-rijprocedure:2"]

  - id: paciencia-leccion
    type: yesno
    prompt: Otro conductor te cierra el paso. Para "darle una lección" frenas bruscamente delante de él. ¿Infringes algo?
    answer: true
    explain: El artículo 5 de la WVW prohíbe comportarse de modo que se cause o pueda causarse peligro. Que el otro empezara no lo justifica, y la infracción existe aunque no pase nada.
    cites: ["wvw:5"]

  - id: paciencia-claxon
    type: mc
    prompt: El semáforo se pone en verde y el auto de delante, con el conductor distraído, no arranca. No hay peligro. ¿Qué haces?
    options: ["Espero un momento sin tocar la bocina", "Doy un toque corto de bocina como recordatorio", "Hago destellos con las luces para apurarlo", "Toco la bocina hasta que arranque"]
    answer: 0
    explain: Las señales sonoras y luminosas solo se pueden dar para evitar un peligro inminente, y un auto que tarda en arrancar no lo es. Un toque "corto" tampoco está permitido.
    cites: ["rvv:28"]

  - id: paciencia-bocina-peligro
    type: yesno
    prompt: Un auto sale marcha atrás de un aparcamiento y va a chocar contra el tuyo, que está parado. El conductor no te ve. ¿Puedes tocar la bocina?
    answer: true
    explain: Los avisos sonoros y luminosos están permitidos para evitar un peligro inminente, y un choque que se aproxima lo es. Es el caso para el que existe la regla; no sirve para apurar ni protestar.
    cites: ["rvv:28"]

  - id: paciencia-ritsen-situacion
    type: mc
    prompt: Dos carriles se reducen a uno por obras y el tráfico avanza despacio. Un auto del otro carril quiere incorporarse delante de ti. ¿Qué haces?
    options: ["Le dejo espacio y entra a su turno", "Cierro el hueco: yo llegué primero a la cola", "Acelero para pasar antes del estrechamiento", "Toco la bocina para que espere detrás"]
    answer: 0
    explain: Dejar espacio en un estrechamiento de la calzada (ritsen) es conducta social según el CBR. Cerrar el hueco o acelerar solo bloquea el flujo.
    cites: ["cbr-rijprocedure:2"]

  - id: paciencia-cortejo
    type: mc
    prompt: Vas a cruzar una calle y pasa un cortejo fúnebre al que todavía faltan coches por pasar. ¿Qué haces?
    options: ["Espero a que pasen todos, dándoles paso libre", "Me meto en un hueco entre dos coches del cortejo", "Cruzo rápido en cuanto pasa el primero", "Toco la bocina para que se den prisa"]
    answer: 0
    explain: El CBR cita como conducta social dejar pasar a los coches que forman parte del cortejo y darles un paso lo más libre posible. Colarte entre ellos lo rompe.
    cites: ["cbr-rijprocedure:2"]

  - id: paciencia-charco
    type: mc
    prompt: Hay un charco grande en tu carril y varios peatones esperan en la acera pegada. ¿Qué haces?
    options: ["Lo evito o paso despacio para no salpicarlos", "Paso rápido para que el charco se vacíe", "Paso rozando la acera para no mojar mis ruedas", "Toco la bocina para que se aparten"]
    answer: 0
    explain: El CBR cita como conducta social evitar rodar por charcos cuando otros sufren las consecuencias. Pasar rápido o cerca de la acera es lo que empapa a los peatones.
    cites: ["cbr-rijprocedure:2"]

  - id: paciencia-uitrit
    type: mc
    prompt: Estás en una cola detenida y un auto espera para salir de un acceso (uitrit) justo delante de ti. ¿Qué haces?
    options: ["Dejo un hueco para que pueda salir", "Cierro el hueco: yo estoy en la calzada y él debe esperar", "Avanzo hasta tocar al auto de delante", "Le hago señas para que se vaya por otro lado"]
    answer: 0
    explain: Permitir que un conductor salga de un acceso es una de las conductas sociales que cita el CBR. Aunque la cola no te obligue a hacerlo, bloquearle la salida no ayuda a nadie.
    cites: ["cbr-rijprocedure:2"]

  - id: paciencia-frenazo
    type: mc
    prompt: Vas por una avenida con un auto pegado detrás y ves que pasaste sin querer la entrada del estacionamiento al que ibas. ¿Qué haces?
    options: ["Sigo y busco otro sitio donde dar la vuelta", "Freno en seco en el carril y retrocedo", "Freno en seco y giro desde donde estoy", "Paro con los intermitentes y espero que me dejen"]
    answer: 0
    explain: El CBR pide no frenar ni detenerse de forma innecesaria y brusca, porque sorprende a quien viene detrás (y puede causar peligro, art. 5 WVW). Seguir y dar la vuelta más adelante no molesta a nadie.
    cites: ["cbr-rijprocedure:2", "wvw:5"]

  - id: paciencia-adelantar-rojo
    type: mc
    prompt: Ves un semáforo en rojo cercano, con un auto lento delante de ti. ¿Qué es lo adecuado?
    options: ["Quedarme detrás: adelantar solo me haría llegar al mismo semáforo", "Adelantar a toda prisa para llegar el primero al semáforo", "Acelerar, adelantar y frenar fuerte justo antes de la línea", "Adelantarlo y seguir pegado a su carril por si cambia"]
    answer: 0
    explain: "El CBR pide no adelantar a toda prisa justo antes de un semáforo en rojo (o paso a nivel, puente o cola detenida): irrita a los demás y no gana nada, porque de todas formas tendrás que parar."
    cites: ["cbr-rijprocedure:2"]

  - id: paciencia-ruido
    type: yesno
    prompt: Estás parado frente a tu casa a las 10 de la noche y aceleras varias veces el motor en vacío sin ningún motivo. ¿Infringes el artículo 57 del RVV?
    answer: true
    explain: El artículo 57 prohíbe a los conductores de vehículos de motor hacer ruido innecesario con su vehículo. Acelerar en vacío sin motivo lo es.
    cites: ["rvv:57"]
