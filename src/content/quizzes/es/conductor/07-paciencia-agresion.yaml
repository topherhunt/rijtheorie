questions:
  - id: paciencia-calma
    type: mc
    prompt: Otro conductor no te cede el paso cuando debía. ¿Qué recomienda el CBR?
    options: ["Acelerar para no dejarlo pasar", "Frenar o detenerte y mantener la calma", "Tocar la bocina con insistencia", "Seguirlo de cerca para que se dé cuenta"]
    answer: 1
    explain: "Un buen conductor es paciente y no muestra agresividad: frena o se detiene."
    cites: ["cbr-rijprocedure:2"]

  - id: paciencia-leccion
    type: yesno
    prompt: Otro conductor te cierra el paso. Para "darle una lección" frenas bruscamente delante de él. ¿Infringes algo?
    answer: true
    explain: El artículo 5 de la WVW prohíbe comportarse de modo que se cause o pueda causarse peligro. Que el otro empezara no lo justifica.
    cites: ["wvw:5"]

  - id: paciencia-claxon
    type: yesno
    prompt: ¿Puedes tocar la bocina porque el auto de delante arranca despacio en el semáforo?
    answer: false
    explain: Solo se puede usar la bocina o las luces para evitar un peligro inminente.
    cites: ["rvv:28"]

  - id: paciencia-ritsen-situacion
    type: mc
    prompt: Dos carriles se reducen a uno por obras y el tráfico avanza despacio. Un auto del otro carril quiere incorporarse delante de ti. Según el CBR, ¿qué es conducta social?
    options: ["Dejarle espacio para que se incorpore", "Cerrar el hueco para que no entre", "Tocar la bocina para que espere", "Acelerar para pasar antes"]
    answer: 0
    explain: El CBR cita como conducta social dejar espacio a quien adelanta en un estrechamiento de la calzada (ritsen).
    cites: ["cbr-rijprocedure:2"]

  - id: paciencia-cortejo
    type: mc
    prompt: Esperas para cruzar y pasa un cortejo fúnebre. Todavía faltan coches del cortejo por pasar. Según el CBR, ¿qué es conducta social?
    options: ["Dejar pasar a los coches del cortejo con el mínimo estorbo", "Meterte en un hueco entre dos coches del cortejo", "Tocar la bocina para que se den prisa", "Adelantar al cortejo para llegar antes"]
    answer: 0
    explain: El CBR cita como conducta social dejar pasar a los vehículos que forman parte de un cortejo fúnebre y darles el paso más libre posible.
    cites: ["cbr-rijprocedure:2"]

  - id: paciencia-charco
    type: mc
    prompt: Hay un charco grande en tu carril y varios peatones esperan en la acera pegada. Según el CBR, ¿qué es conducta social?
    options: ["Evitar pasar por el charco de forma que los salpiques", "Pasar rápido para que el charco se vacíe", "Pasar rozando la acera para no mojar tus ruedas", "Tocar la bocina para que se aparten"]
    answer: 0
    explain: El CBR cita como conducta social evitar rodar por charcos cuando otros sufren las consecuencias.
    cites: ["cbr-rijprocedure:2"]

  - id: paciencia-uitrit
    type: yesno
    prompt: Estás en una cola detenida y un auto espera para salir de un acceso (uitrit) justo delante de ti. Según el CBR, ¿es conducta social dejarlo salir?
    answer: true
    explain: El CBR cita entre las conductas sociales permitir a un conductor salir de un acceso.
    cites: ["cbr-rijprocedure:2"]

  - id: paciencia-ruido
    type: yesno
    prompt: Estás parado frente a tu casa a las 10 de la noche y aceleras varias veces el motor en vacío sin ningún motivo. ¿Infringes el artículo 57 del RVV?
    answer: true
    explain: El artículo 57 prohíbe a los conductores de vehículos de motor hacer ruido innecesario con su vehículo. Acelerar en vacío sin motivo lo es.
    cites: ["rvv:57"]
