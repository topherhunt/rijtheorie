questions:
  - id: drogas-medicamento
    type: yesno
    prompt: Tomaste un medicamento recetado que te produce somnolencia. ¿Puedes conducir porque es legal?
    answer: false
    explain: Que sea legal no importa. Si una sustancia reduce tu capacidad y no estás en condiciones, está prohibido conducir.
    cites: ["wvw:8.1"]

  - id: drogas-bicicleta
    type: yesno
    prompt: ¿La prohibición de conducir bajo influencia de sustancias vale también para una bicicleta?
    answer: true
    explain: El artículo 8 lid 1 habla de conducir un vehículo, sin limitarlo a vehículos de motor.
    cites: ["wvw:8.1"]

  - id: drogas-limite-sin-sentirse-mal
    type: yesno
    prompt: Consumiste una droga listada en la ley. Te sientes perfectamente y conduces bien, pero un análisis de sangre supera el límite fijado para esa sustancia. ¿Es una infracción?
    answer: true
    explain: El artículo 8 lid 5 prohíbe conducir con una concentración en sangre superior al límite de la sustancia listada. No depende de cómo te sientas.
    cites: ["wvw:8.5"]

  - id: drogas-acompanar
    type: yesno
    prompt: Acompañas a un conductor en práctica y estás bajo influencia de una sustancia que reduce tu capacidad. ¿Es una infracción?
    answer: true
    explain: El artículo 8 lid 1 prohíbe conducir y también acompañar en ese estado.
    cites: ["wvw:8.1"]

  - id: drogas-acompanante-limite
    type: yesno
    prompt: Eres el acompañante (begeleider) de un conductor en práctica. Un análisis de sangre muestra una droga listada por encima de su límite, aunque tú no conduces. ¿Es una infracción?
    answer: true
    explain: El artículo 8 lid 5 prohíbe expresamente actuar como begeleider por encima del límite.
    cites: ["wvw:8.5"]

  - id: drogas-prestar
    type: yesno
    prompt: Sabes que un amigo consumió drogas. ¿Puedes dejarle conducir tu auto?
    answer: false
    explain: Está prohibido dejar conducir a quien sabes o deberías saber que no está en condiciones.
    cites: ["wvw:8.6"]

  - id: drogas-saliva
    type: yesno
    prompt: La policía quiere hacerte una prueba de saliva. ¿Debes colaborar?
    answer: true
    explain: Debes colaborar con las pruebas que ordene la policía.
    cites: ["wvw:160.5"]

  - id: drogas-rijverbod-aanstalten
    type: yesno
    prompt: Un agente ve que estás claramente bajo el efecto de una droga y estás a punto de subir a tu auto para arrancar, todavía sin haber conducido. ¿Puede imponerte ya un rijverbod?
    answer: true
    explain: El artículo 162 aplica el rijverbod también a quien "aanstalten maakt" (se dispone) a conducir. No hace falta esperar a que arranques.
    cites: ["wvw:162.1"]
