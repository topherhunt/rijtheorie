questions:
  - id: drogas-medicamento
    type: yesno
    prompt: Tomaste un medicamento recetado que te produce somnolencia. ¿Puedes conducir porque es legal?
    answer: false
    explain: Que sea legal no importa. Si una sustancia reduce tu capacidad y no estás en condiciones, está prohibido conducir.
    cites: ["wvw:8.1"]

  - id: drogas-bici-fiesta
    type: mc
    prompt: Sales de una fiesta tras consumir una droga y notas que reaccionas con lentitud. Tu casa está cerca y vuelves en bicicleta. ¿Qué dice la ley?
    options: ["Está permitido: la prohibición es solo para vehículos de motor", "Está prohibido: la regla vale para cualquier vehículo, también la bicicleta", "Está permitido si vas despacio", "Está permitido si es de noche y hay poco tráfico"]
    answer: 1
    explain: El artículo 8 lid 1 habla de conducir un vehículo, sin limitarlo a los de motor. Si la sustancia te deja sin condiciones, tampoco puedes ir en bici.
    cites: ["wvw:8.1"]

  - id: drogas-limite-sin-sentirse-mal
    type: yesno
    prompt: Consumiste una droga listada en la ley. Te sientes perfectamente y conduces bien, pero un análisis de sangre supera el límite fijado para esa sustancia. ¿Es una infracción?
    answer: true
    explain: El artículo 8 lid 5 prohíbe conducir con una concentración en sangre superior al límite de la sustancia listada. No depende de cómo te sientas.
    cites: ["wvw:8.5"]

  - id: drogas-bajo-limite-afectado
    type: mc
    prompt: Consumiste una droga y un análisis de sangre no supera el límite de esa sustancia, pero sigues mareado y con los reflejos lentos. ¿Puedes conducir?
    options: ["Sí, porque no superas el límite", "No: si no estás en condiciones de conducir, está prohibido aunque no superes el límite", "Sí, si conduces despacio", "Sí, pero solo en trayectos cortos"]
    answer: 1
    explain: El límite en sangre es una infracción aparte. La regla de fondo del artículo 8 lid 1 prohíbe conducir sin estar capaz, superes o no el límite.
    cites: ["wvw:8.1", "wvw:8.5"]

  - id: drogas-acompanante-limite
    type: yesno
    prompt: Eres el acompañante (begeleider) de un conductor en práctica. Un análisis de sangre muestra una droga listada por encima de su límite, aunque tú no conduces. ¿Es una infracción?
    answer: true
    explain: El artículo 8 lid 5 prohíbe expresamente actuar como begeleider por encima del límite.
    cites: ["wvw:8.5"]

  - id: drogas-begeleider-medicamento
    type: mc
    prompt: Vas a acompañar como begeleider a tu hijo que conduce. Has tomado un medicamento que avisa de somnolencia y te notas adormilado, pero "tú no conduces". ¿Qué haces?
    options: ["Lo acompaño: el acompañante no conduce", "No lo acompaño: la prohibición alcanza también al begeleider", "Lo acompaño si me siento con el cinturón puesto", "Lo acompaño si él conduce despacio"]
    answer: 1
    explain: El artículo 8 lid 1 prohíbe también acompañar como begeleider cuando una sustancia te deja sin condiciones. Que no conduzcas no te exime.
    cites: ["wvw:8.1"]

  - id: drogas-prestar-medicamento
    type: mc
    prompt: Tu pareja acaba de tomar un medicamento cuyo prospecto dice que no se conduzca, y está adormilada. Te pide el coche para ir a la farmacia. ¿Qué ocurre si se lo das?
    options: ["Nada para ti: la responsable es ella", "También infringes tú: está prohibido dejar conducir a quien sabes que no está en condiciones", "Solo infringes si ocurre un accidente", "Es legal si el trayecto es corto"]
    answer: 1
    explain: Dejar conducir a alguien de quien sabes, o deberías saber, que no está en condiciones es una infracción tuya. Que el trayecto sea corto no cambia nada.
    cites: ["wvw:8.6"]

  - id: drogas-saliva
    type: yesno
    prompt: Un agente te pide una prueba de saliva. Estás seguro de no haber consumido nada y te parece una molestia. ¿Debes colaborar?
    answer: true
    explain: La obligación de colaborar con las pruebas que ordena la policía no depende de que tú creas que no hace falta.
    cites: ["wvw:160.5"]

  - id: drogas-rijverbod-aanstalten
    type: yesno
    prompt: Un agente ve que estás claramente bajo el efecto de una droga y estás a punto de subir a tu auto para arrancar, todavía sin haber conducido. ¿Puede imponerte ya un rijverbod?
    answer: true
    explain: El artículo 162 aplica el rijverbod también a quien "aanstalten maakt" (se dispone) a conducir. No hace falta esperar a que arranques.
    cites: ["wvw:162.1"]
