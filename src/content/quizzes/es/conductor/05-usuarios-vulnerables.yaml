questions:
  - id: vulnerables-pelota
    type: mc
    prompt: Circulas por una calle residencial y ves rodar una pelota desde entre dos coches aparcados hacia la calzada. Hay niños en la acera. ¿Qué haces?
    options: ["Mantengo la velocidad: una pelota no es un peatón", "Suelto el acelerador y me preparo a frenar, porque puede salir un niño tras ella", "Toco la bocina para que los niños se queden donde están", "Acelero para pasar antes de que llegue a la calzada"]
    answer: 1
    explain: Los niños son impredecibles. La pelota anuncia que puede salir uno corriendo tras ella; hay que anticiparse y no esperar a verlo en la calzada.
    cites: ["cbr-rijprocedure:2"]

  - id: vulnerables-baston-sin-paso
    type: mc
    prompt: En una calle sin paso de peatones, una persona con bastón blanco con anillos rojos está al borde de la acera, con claras dudas sobre si cruzar. ¿Qué haces?
    options: ["La dejo pasar: debo dejar pasar a estas personas aunque no haya paso de peatones", "Sigo: sin paso de peatones no tengo que ceder", "Hago ráfagas de luces para que cruce deprisa", "Sigo despacio y ella decide cuándo cruzar"]
    answer: 0
    explain: La obligación de dejar pasar a ciegos con bastón blanco con anillos rojos (y a quienes se mueven con dificultad) no depende de que haya paso de peatones. Una persona ciega no ve tus luces; se orienta por el oído.
    cites: ["rvv:49.1", "cbr-rijprocedure:2"]

  - id: vulnerables-cebra-listo
    type: mc
    prompt: Te acercas a un paso de peatones sin semáforo. Un peatón está de pie en el borde, mirando el tráfico y con un pie ya fuera de la acera, pero todavía no ha puesto el pie en el paso. ¿Qué haces?
    options: ["Paso rápido: todavía no ha empezado a cruzar", "Me detengo y lo dejo pasar: evidentemente está a punto de cruzar", "Hago ráfagas de luces para que se espere", "Reduzco un poco y paso si no cruza en ese momento"]
    answer: 1
    explain: La obligación de dejar pasar incluye al peatón que evidentemente está a punto de cruzar un paso de peatones, no solo al que ya está en él.
    cites: ["rvv:49.2"]

  - id: vulnerables-cebra-semaforo-rojo
    type: mc
    prompt: Llegas a un paso de peatones. El semáforo de peatones está en rojo, pero un peatón ya ha empezado a cruzar. ¿Qué haces?
    options: ["Sigo sin cambiar nada: el peatón cruza con el semáforo en rojo", "Espero a que pase, porque no puedo ponerlo en peligro aunque el semáforo esté en rojo", "Hago ráfagas de luces para que vuelva a la acera", "Acelero para pasar antes de que llegue a mi carril"]
    answer: 1
    explain: Con el semáforo de peatones en rojo no rige la obligación especial del artículo 49, pero el artículo 5 sigue vigente y te prohíbe causar peligro. Por eso no sigues contra alguien que ya está cruzando.
    cites: ["rvv:49.4", "wvw:5"]

  - id: vulnerables-bus-parado-lado
    type: yesno
    prompt: Un autobús está detenido y los pasajeros bajan por el lado contrario al que quieres pasar. ¿Tienes que esperar por esos pasajeros?
    answer: false
    explain: La obligación vale para pasar por el lado donde los pasajeros suben o bajan. Por el otro lado no los estorbas.
    cites: ["rvv:52"]

  - id: vulnerables-giro-secuencia
    type: mc
    prompt: Vas a girar a la derecha. ¿En qué orden miras?
    options: ["Retrovisor interior, hacia delante, retrovisor exterior derecho, por encima del hombro derecho", "Por encima del hombro derecho, retrovisor exterior derecho, hacia delante, retrovisor interior", "Hacia delante, retrovisor interior, por encima del hombro derecho, retrovisor exterior derecho", "Retrovisor exterior derecho, retrovisor interior, hacia delante, por encima del hombro derecho"]
    answer: 0
    explain: El orden del CBR para girar a la derecha termina con el hombro derecho, justo antes de girar, porque es lo que permite ver el tráfico que va pegado a tu lado.
    cites: ["cbr-rijprocedure:3"]

  - id: vulnerables-giro-ciclista
    type: mc
    prompt: Estás a punto de girar a la derecha. Hace un momento viste a un ciclista a tu derecha, pero ya no lo ves en el espejo exterior. ¿Qué haces antes de girar?
    options: ["Giro: si no está en el espejo, ya no está", "Miro por encima del hombro derecho: puede estar en el ángulo muerto", "Toco la bocina y giro", "Me quedo mirando atrás todo el tiempo necesario hasta verlo"]
    answer: 1
    explain: "Lo que no sale en el espejo puede estar en el ángulo muerto, y ahí se mira por encima del hombro. Pero no debes quedarte mirando atrás mucho tiempo: el auto puede desviarse y no ves lo que ocurre delante."
    cites: ["cbr-rijprocedure:3"]
