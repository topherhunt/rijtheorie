questions:
  - id: atencion-celular
    type: yesno
    prompt: Conduces por la ciudad y sostienes el celular en la mano para leer un mensaje. ¿Está prohibido?
    answer: true
    explain: El artículo 61a prohíbe a quien conduce sostener un aparato electrónico móvil durante la marcha, aunque sea un momento.
    cites: ["rvv:61a"]

  - id: atencion-reproductor
    type: yesno
    prompt: Conduces y sostienes un reproductor de música en la mano para cambiar de canción. ¿Está permitido?
    answer: false
    explain: Un reproductor multimedia es un aparato cubierto por el artículo 61a.
    cites: ["rvv:61a"]

  - id: atencion-soporte-fijo
    type: yesno
    prompt: Llevas el celular en un soporte fijo del tablero con el navegador encendido y no lo tocas con la mano mientras conduces. ¿Infringes por sostenerlo?
    answer: false
    explain: La norma prohíbe SOSTENER (vast te houden) el aparato durante la marcha. Un soporte fijo sin tocarlo no es sostenerlo.
    cites: ["rvv:61a"]

  - id: atencion-pasajero
    type: yesno
    prompt: Tu acompañante sostiene el celular con el mapa y te lo muestra mientras conduces. ¿Infringes tú la norma del celular al volante?
    answer: false
    explain: La prohibición es para quien conduce y sostiene el aparato. Tú no lo sostienes y el acompañante no conduce, así que la prohibición no es suya.
    cites: ["rvv:61a"]

  - id: atencion-bici-celular
    type: mc
    prompt: Vas en bicicleta por un fietspad y sostienes el celular con una mano para contestar un mensaje. ¿Qué dice la norma?
    options: ["Está permitido: la prohibición es solo para quienes conducen un coche", "Está prohibido: la norma vale para quien conduce cualquier vehículo", "Está permitido si solo lo miras y no escribes ni hablas", "Está permitido en un fietspad, porque ahí no hay tráfico de coches"]
    answer: 1
    explain: El artículo 61a se dirige a quien conduce un vehículo, y la bicicleta lo es. No depende del tipo de vía ni de que escribas o solo mires.
    cites: ["rvv:61a"]

  - id: atencion-soporte-escribir
    type: yesno
    prompt: Con el celular en un soporte fijo, escribes un mensaje mirando la pantalla varios segundos mientras circulas por una autosnelweg. Aunque no lo sostienes, ¿puede ser una infracción?
    answer: true
    explain: El artículo 5 de la WVW prohíbe comportarse de modo que se cause o pueda causarse peligro. Quitar los ojos de la vía varios segundos a esa velocidad puede causar peligro, aunque no sostengas el aparato.
    cites: ["wvw:5"]

  - id: atencion-cansado-salir
    type: mc
    prompt: Vas a empezar un viaje largo y estás muy cansado porque dormiste poco. Según el CBR, ¿qué haces?
    options: ["Descansar o posponer el viaje antes de salir", "Salir y poner la radio fuerte para mantenerme despierto", "Salir y parar solo cuando me dé mucho sueño al volante", "Salir y compensar con un café en cuanto arranque"]
    answer: 0
    explain: La guía del CBR dice que no se empieza un viaje cansado o irritado. La radio, parar tarde o el café no quitan el cansancio ni garantizan que reacciones a tiempo.
    cites: ["cbr-rijprocedure:2"]

  - id: atencion-irritado
    type: mc
    prompt: Acabas de discutir fuerte con tu jefe y sales furioso hacia casa. Según el CBR, ¿qué es lo adecuado?
    options: ["Calmarme antes de arrancar: no se empieza un viaje irritado", "Salir ya: conducir un rato me ayudará a desahogarme y calmarme", "Salir, pero conducir más deprisa para llegar antes y acabar con esto", "Salir y poner música para no pensar en la discusión"]
    answer: 0
    explain: "La guía del CBR pide no empezar un viaje cansado o irritado: el enfado te distrae y te hace reaccionar peor. Desahogarte conduciendo o ir más deprisa aumenta el riesgo."
    cites: ["cbr-rijprocedure:2"]

  - id: atencion-distracciones-reales
    type: multi
    prompt: Vas en el coche con tres amigos. ¿Cuáles de estas cosas son distracciones de las que el CBR recomienda protegerse?
    options: ["Girarte para seguir una conversación con el pasajero de atrás", "Cambiar la emisora de radio mientras te acercas a un cruce", "Coger el celular para contestar una llamada", "Mirar el retrovisor interior antes de frenar"]
    answer: [0, 1, 2]
    explain: El CBR cita pasajeros, radio y teléfono como fuentes de distracción. Mirar el retrovisor es parte de observar bien, no una distracción.
    cites: ["cbr-rijprocedure:2"]
