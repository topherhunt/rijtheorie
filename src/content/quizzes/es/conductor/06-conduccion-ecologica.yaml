questions:
  - id: eco-hora-punta
    type: mc
    prompt: Puedes salir a las 7:00 o a las 8:30, cuando suele haber atasco en tu ruta. ¿Qué conviene para gastar menos y contaminar menos?
    options: ["Salir a la hora y por la ruta que evitan los atascos", "Salir a cualquier hora y compensar acelerando más", "Salir en hora punta, porque con atasco el motor consume menos", "Da igual la hora, solo importa la marcha que uses"]
    answer: 0
    explain: Estar atascado gasta más combustible. La guía del CBR pide elegir el momento y la ruta para evitar horas y tramos con atasco.
    cites: ["cbr-rijprocedure:1"]

  - id: eco-peso
    type: yesno
    prompt: Volviste de vacaciones y tu cofre de techo está vacío, pero lo dejas puesto en tu trayecto diario. ¿Es lo más adecuado para gastar poco?
    answer: false
    explain: El peso innecesario y los accesorios que aumentan la resistencia al aire, como los cofres de techo, hacen gastar más. Si no los usas, quítalos.
    cites: ["cbr-rijprocedure:1"]

  - id: eco-presion-habito
    type: mc
    prompt: Llevas meses sin mirar la presión de los neumáticos y últimamente el coche te parece "pesado" y gasta más. ¿Qué es lo adecuado?
    options: ["Revisar la presión ahora y hacerlo como costumbre periódica", "Esperar a que un neumático se vea claramente desinflado", "Mirarla solo antes de las vacaciones", "Subir la marcha para compensar el gasto"]
    answer: 0
    explain: La guía del CBR incluye revisar la presión de los neumáticos como parte de la preparación, de forma periódica. Neumáticos con poca presión aumentan el consumo, y subir de marcha no lo arregla.
    cites: ["cbr-rijprocedure:1"]

  - id: eco-luneta
    type: yesno
    prompt: Ya se desempañó la luneta trasera, pero sigues con la luneta calefactada y el aire acondicionado encendidos "por costumbre". ¿Conviene apagarlos?
    answer: true
    explain: El CBR pide no tener encendidos sin necesidad los consumidores de energía como el aire acondicionado y la calefacción de lunas, porque consumen combustible.
    cites: ["cbr-rijprocedure:1"]

  - id: eco-rpm-alta
    type: mc
    prompt: En un tramo sin tráfico delante, el motor de tu auto manual gira muy alto en tercera y no hay motivo para ello. ¿Qué haces para consumir menos?
    options: ["Mantengo la marcha: así tengo más potencia disponible", "Bajo a segunda para tener más freno motor", "Subo de marcha: una marcha más alta reduce el consumo", "Pongo el punto muerto y dejo rodar"]
    answer: 2
    explain: "Conducir en una marcha relativamente alta reduce el consumo, siempre que sea seguro y no frene el tráfico. El punto muerto no ahorra: el motor sigue gastando al ralentí."
    cites: ["cbr-rijprocedure:1"]

  - id: eco-salida-semaforo
    type: mc
    prompt: El semáforo se pone en verde y no hay nadie cerca delante de ti. ¿Cómo aceleras para gastar poco?
    options: ["Con el pedal apenas rozado, para gastar lo mínimo", "A fondo hasta que el motor llegue a sus revoluciones máximas", "Con decisión, sin aceleración tímida ni a fondo", "Muy despacio con el pie a medias en el embrague"]
    answer: 2
    explain: Si la distancia con el auto de delante lo permite, el CBR recomienda acelerar con decisión, al menos hasta la mitad del recorrido del pedal. Acelerar muy flojo alarga la aceleración sin ahorrar de verdad; a fondo gasta de más.
    cites: ["cbr-rijprocedure:1"]

  - id: eco-semaforo-adelante
    type: mc
    prompt: Ves que el semáforo, 200 m adelante, estará en rojo cuando llegues y tendrás que parar. ¿Qué haces?
    options: ["Sigo acelerando y freno fuerte al final", "Pongo el punto muerto enseguida y ruedo hasta la línea", "Piso el embrague desde lejos y dejo que ruede", "Levanto el pie ya, dejo el auto engranado y piso el embrague justo antes de parar"]
    answer: 3
    explain: Soltar el acelerador con anticipación, con el auto engranado, corta el consumo mientras el auto sigue rodando. Se pisa el embrague justo antes de que el motor llegue al ralentí.
    cites: ["cbr-rijprocedure:1"]

  - id: eco-crucero
    type: mc
    prompt: Circulas por una carretera larga con poco tráfico y tu auto tiene control de crucero. ¿Qué te ayuda más a mantener una velocidad constante y gastar menos?
    options: ["Ir acelerando y soltando según me parezca", "Usar el control de crucero cuando sea seguro", "Ir pegado al auto de delante para seguir su ritmo", "Ir un poco más rápido para llegar antes y compensar"]
    answer: 1
    explain: El CBR dice que el control de crucero ayuda a mantener una velocidad constante. Pegarte al de delante resta seguridad y obliga a frenar y acelerar.
    cites: ["cbr-rijprocedure:1"]

  - id: eco-paso-a-nivel
    type: yesno
    prompt: Esperas en un paso a nivel con barrera cerrada y calculas que el tren tardará unos tres minutos. Es seguro y podrías volver a arrancar enseguida. ¿Conviene apagar el motor?
    answer: true
    explain: En una parada larga y segura se apaga el motor (un motor al ralentí gasta y contamina sin que avances), y se mantienen encendidas las luces obligatorias.
    cites: ["cbr-rijprocedure:1"]

  - id: eco-parada-corta
    type: yesno
    prompt: Esperas en un semáforo en rojo que sabes que dura solo unos 20 segundos. ¿Te pide la guía del CBR que apagues el motor?
    answer: false
    explain: La guía habla de apagar el motor cuando prevés estar parado más de un minuto, siempre que sea seguro. En una parada de pocos segundos no se pide.
    cites: ["cbr-rijprocedure:1"]
