questions:
  - id: alcohol-limite-aire
    type: number
    prompt: ¿Cuál es el límite general de alcohol en el aire espirado? Está prohibido conducir con más de este valor.
    answer: 220
    unit: µg/l
    explain: El límite general es de 220 µg por litro de aire espirado.
    cites: ["wvw:8.2"]

  - id: alcohol-limite-sangre
    type: number
    prompt: ¿Cuál es el límite general de alcohol en sangre? Está prohibido conducir con más de este valor.
    answer: 0.5
    unit: mg/ml
    explain: El límite general es de 0,5 mg por mililitro de sangre.
    cites: ["wvw:8.2"]

  - id: alcohol-principiante-aire
    type: number
    prompt: ¿Cuál es el límite de alcohol en el aire espirado para un conductor principiante?
    answer: 88
    unit: µg/l
    explain: Para principiantes es de 88 µg por litro de aire espirado.
    cites: ["wvw:8.3"]

  - id: alcohol-principiante-sangre
    type: number
    prompt: ¿Cuál es el límite de alcohol en sangre para un conductor principiante?
    answer: 0.2
    unit: mg/ml
    explain: Para principiantes es de 0,2 mg por mililitro de sangre.
    cites: ["wvw:8.3"]

  - id: alcohol-principiante-quien
    type: mc
    prompt: Obtuviste tu primer permiso a los 25 años, hace 3 años. ¿Qué límite de alcohol te corresponde?
    options: ["El límite general (220 µg/l)", "El límite de principiante (88 µg/l)", "Ninguno, porque ya eres adulto", "Cero alcohol siempre"]
    answer: 1
    explain: Si el primer permiso se expidió a los 18 años o más, eres principiante durante los primeros 5 años.
    cites: ["wvw:8.3"]

  - id: alcohol-sin-permiso
    type: yesno
    prompt: Alguien conduce sin tener permiso. ¿Le corresponde el límite bajo de principiante?
    answer: true
    explain: El artículo 8 lid 4 aplica el límite de principiante a quien conduce sin permiso.
    cites: ["wvw:8.4"]

  - id: alcohol-capacidad
    type: yesno
    prompt: Estás por debajo del límite numérico pero te sientes mareado por lo que bebiste. ¿Puedes conducir?
    answer: false
    explain: Está prohibido conducir sin estar en condiciones, aunque estés bajo los límites numéricos.
    cites: ["wvw:8.1"]

  - id: alcohol-prestar
    type: yesno
    prompt: Sabes que tu amigo bebió demasiado. ¿Puedes dejarle tu auto para que conduzca?
    answer: false
    explain: Está prohibido dejar conducir a alguien de quien sabes o deberías saber que no está en condiciones.
    cites: ["wvw:8.6"]

  - id: alcohol-negarse
    type: yesno
    prompt: La policía te pide soplar en la prueba de aliento. ¿Puedes negarte?
    answer: false
    explain: Debes colaborar con la prueba de aliento y otras pruebas.
    cites: ["wvw:160.5"]

  - id: alcohol-rijverbod
    type: number
    prompt: ¿Hasta cuántas horas puede durar un rijverbod impuesto por la policía?
    answer: 24
    unit: horas
    explain: La policía puede imponer una prohibición de conducir de hasta 24 horas.
    cites: ["wvw:162.1"]

  - id: alcohol-sangre-orden
    type: yesno
    prompt: Si te niegas a la prueba de aliento, ¿se puede ordenar un análisis de sangre?
    answer: true
    explain: El artículo 163 prevé el análisis de sangre si se niega el consentimiento o la prueba de aliento falla.
    cites: ["wvw:163"]
