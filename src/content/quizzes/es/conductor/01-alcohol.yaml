questions:
  - id: alcohol-lectura-230
    type: yesno
    prompt: Tienes el permiso desde hace 10 años. En un control soplas 230 µg/l. ¿Cometes una infracción de alcohol?
    answer: true
    explain: El límite general es de 220 µg por litro de aire espirado, y 230 lo supera.
    cites: ["wvw:8.2"]

  - id: alcohol-lectura-220-exacto
    type: yesno
    prompt: Tienes el permiso desde hace 10 años. En un control soplas exactamente 220 µg/l. ¿Cometes una infracción de alcohol por la cifra?
    answer: false
    explain: La ley prohíbe conducir con MÁS de 220 µg/l. Con exactamente 220 no lo superas, así que la cifra no es infracción (el artículo 8 lid 1 sigue exigiendo que estés en condiciones de conducir).
    cites: ["wvw:8.2"]

  - id: alcohol-principiante-quien
    type: mc
    prompt: Obtuviste tu primer permiso a los 25 años, hace 3 años. ¿Qué límite de alcohol te corresponde al conducir?
    options: ["El límite general (220 µg/l)", "El límite de principiante (88 µg/l)", "El de principiante, pero solo hasta los 30 años de edad", "Ninguno, porque ya eres adulto"]
    answer: 1
    explain: Si el primer permiso se expidió a los 18 años o más, eres principiante durante los primeros 5 años, sin importar tu edad. Que seas adulto no cambia el plazo.
    cites: ["wvw:8.3"]

  - id: alcohol-novel-100
    type: yesno
    prompt: Obtuviste tu primer permiso B a los 30 años, hace 2 años. En un control soplas 100 µg/l. ¿Cometes una infracción de alcohol?
    answer: true
    explain: Siguen los 5 años de principiante (primer permiso a los 18 o más), y el límite para ti es de 88 µg/l. Con 100 lo superas.
    cites: ["wvw:8.3"]

  - id: alcohol-fin-periodo-novel
    type: yesno
    prompt: Tu primer permiso, de la categoría B, lo obtuviste a los 19 años, hace 6 años. En un control soplas 150 µg/l. ¿Cometes una infracción de alcohol por la cifra?
    answer: false
    explain: Ya pasaron los 5 años de principiante, así que rige el límite general de 220 µg/l, y 150 no lo supera.
    cites: ["wvw:8.3", "wvw:8.2"]

  - id: alcohol-sangre-novel
    type: yesno
    prompt: Obtuviste tu primer permiso hace 1 año, a los 22 años. Un análisis de sangre da 0,3 mg/ml. ¿Superas el límite que te corresponde?
    answer: true
    explain: Para el principiante el límite en sangre es de 0,2 mg/ml, y 0,3 lo supera. El límite general de 0,5 no es el tuyo.
    cites: ["wvw:8.3"]

  - id: alcohol-ciclista-novel
    type: yesno
    prompt: Sacaste el carnet B hace un año (a los 25). Esta noche vas en bicicleta y en un control soplas 150 µg/l. ¿Superas el límite de alcohol que te corresponde?
    answer: false
    explain: "El límite de principiante (88 µg/l) vale para quien conduce un vehículo de motor que exige permiso. En bicicleta rige el límite general de 220 µg/l, y 150 no lo supera. Ojo: aun así no puedes ir en bici si no estás en condiciones de hacerlo."
    cites: ["wvw:8.2", "wvw:8.3", "wvw:8.1"]

  - id: alcohol-begeleider-limite
    type: yesno
    prompt: Acompañas como begeleider a tu hija, que conduce con la begeleiderspas. Tú tienes el permiso desde hace 20 años y en un control soplas 150 µg/l. ¿Cometes una infracción de alcohol por la cifra?
    answer: false
    explain: El begeleider está sujeto al límite general de 220 µg/l, no al de 88 de los principiantes, que es solo para quien conduce. Con 150 no lo superas.
    cites: ["wvw:8.2", "wvw:8.3"]

  - id: alcohol-sin-permiso-limite
    type: mc
    prompt: Alguien conduce un coche sin haber obtenido nunca un permiso y en un control sopla 150 µg/l. ¿Qué límite se le aplica?
    options: ["El general (220 µg/l), así que no supera el límite", "El de principiante (88 µg/l), así que sí lo supera", "Ninguno, porque sin permiso se trata como otra infracción", "Cero alcohol"]
    answer: 1
    explain: "Quien conduce sin permiso un vehículo de motor que lo exige se trata como principiante: le corresponde el límite de 88 µg/l. Conducir sin permiso es además otra infracción."
    cites: ["wvw:8.4"]

  - id: alcohol-capacidad
    type: mc
    prompt: Has tomado dos copas, soplas 150 µg/l (por debajo del límite) pero te notas mareado y con la vista borrosa. Tienes que volver a casa. ¿Qué haces?
    options: ["Conduzco: la cifra está por debajo del límite", "No conduzco: sin estar en condiciones de conducir está prohibido aunque no supere el límite", "Conduzco despacio y por calles tranquilas", "Conduzco solo si pongo la ventanilla abierta"]
    answer: 1
    explain: El artículo 8 lid 1 prohíbe conducir cuando no estás en condiciones de hacerlo, aunque estés bajo los límites numéricos.
    cites: ["wvw:8.1"]

  - id: alcohol-prestar-amigo
    type: mc
    prompt: Tu amigo se tambalea y arrastra las palabras después de la fiesta, pero te pide tu coche "para llegar antes". Sabes que ha bebido mucho. ¿Qué pasa si se lo dejas?
    options: ["Nada para ti: si lo paran, la infracción es solo suya", "También cometes una infracción tú, por dejar conducir a quien sabes que no está en condiciones", "Solo es infracción si le pasa algo", "Está permitido si tú vas de copiloto"]
    answer: 1
    explain: Está prohibido dejar conducir a quien sabes, o deberías saber, que no está en condiciones. La infracción es tuya aunque no conduzcas.
    cites: ["wvw:8.6"]

  - id: alcohol-negarse-consecuencia
    type: mc
    prompt: Un agente sospecha que has bebido y te ordena soplar en el aparato. Te niegas porque "seguro que no llego al límite". ¿Qué puede pasar?
    options: ["Nada, porque soplar es voluntario", "Negarte es una infracción por sí sola y te pueden retirar el permiso en el acto", "Solo te multan si luego un análisis de sangre da positivo", "Solo te piden que lo repitas al día siguiente"]
    answer: 1
    explain: Quien recibe la orden está obligado a soplar. Negarte tiene consecuencias propias, incluida la retirada inmediata del permiso (invordering), sin importar cuánto alcohol tuvieras.
    cites: ["wvw:163", "wvw:164"]

  - id: alcohol-rijverbod-sin-cifra
    type: yesno
    prompt: Tienes el permiso desde hace 10 años y tu prueba da 200 µg/l, por debajo del límite general. Pero te tambaleas y hablas con dificultad. ¿Puede la policía prohibirte conducir durante unas horas?
    answer: true
    explain: El rijverbod (art. 162) no depende de una cifra, sino de que por el efecto de la sustancia no estés en condiciones de conducir bien, y puede durar hasta 24 horas. Además, el artículo 8 lid 1 prohíbe conducir sin estar capaz aunque no superes el límite.
    cites: ["wvw:162.1", "wvw:8.1"]

  - id: alcohol-sangre-sin-consentimiento
    type: mc
    prompt: No consigues completar la prueba de aliento y el agente te pide permiso para un análisis de sangre. Dices que no. ¿Qué ocurre?
    options: ["Se acaba el procedimiento: sin tu consentimiento no hay análisis", "Un oficial autorizado puede ordenarte el análisis y debes cumplir la orden", "Te lo hacen solo si firmas después", "Solo pueden hacértelo si ya has causado un accidente"]
    answer: 1
    explain: Primero se te pide consentimiento. Si no lo das, el fiscal, un hulpofficier de justitie u otro funcionario autorizado puede ordenarte el análisis, y debes cumplirlo.
    cites: ["wvw:163"]
