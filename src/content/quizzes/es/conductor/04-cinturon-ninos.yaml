questions:
  - id: cinturon-nino-bajo
    type: yesno
    prompt: Llevas a tu sobrino de 10 años, que mide 1,30 m, en el asiento trasero de un auto con cinturones. ¿Basta con que use el cinturón normal?
    answer: false
    explain: Es menor de 18 años y mide menos de 1,35 m, así que debe usar un kinderbeveiligingssysteem adecuado y homologado.
    cites: ["rvv:59.1"]

  - id: cinturon-adolescente-alto
    type: yesno
    prompt: Llevas a tu hija de 14 años, que mide 1,50 m. ¿Necesita un sistema de retención infantil?
    answer: false
    explain: El sistema infantil se exige a menores de 18 años que miden MENOS de 1,35 m. Ella mide más, así que le corresponde el cinturón normal. Sigue siendo obligatorio que lo use.
    cites: ["rvv:59.1"]

  - id: cinturon-nino-alto-sin-cinturon
    type: yesno
    prompt: Tu sobrino de 9 años mide 1,40 m y dice que ya es grande y no necesita cinturón. ¿Puede viajar sin cinturón?
    answer: false
    explain: Aunque mida más de 1,35 m y no necesite sistema infantil, debe usar el cinturón disponible. Además, al conductor se le prohíbe llevar a menores de 12 años de otra forma que la prescrita.
    cites: ["rvv:59.1", "rvv:59.8"]

  - id: cinturon-tres-detras
    type: mc
    prompt: Quieres llevar a tres adultos en el asiento trasero, que tiene dos cinturones. El trayecto es de solo 500 metros. ¿Qué dice la norma?
    options: ["Puedes, porque el trayecto es corto", "No más pasajeros que cinturones: solo dos en ese asiento", "Puedes si el del medio va sin cinturón", "Puedes si el del medio es el más delgado"]
    answer: 1
    explain: En los asientos con cinturones no se llevan más pasajeros que cinturones. Ni el trayecto corto ni la complexión de la persona cambian esto.
    cites: ["rvv:59.1"]

  - id: cinturon-sin-cinturones
    type: mc
    prompt: Un auto sin cinturones ni sistemas de retención. ¿Qué pasa con un niño de 5 años que mide menos de 1,35 m?
    options: ["Va en cualquier asiento", "Va en un asiento que no sea uno de los delanteros", "No se puede llevar ningún niño", "Va sentado en las piernas del conductor"]
    answer: 1
    explain: Los de 3 a 18 años y menos de 1,35 m van en un asiento que no sea uno de los delanteros.
    cites: ["rvv:59.2"]

  - id: cinturon-menor-3
    type: yesno
    prompt: Tienes un coche antiguo sin cinturones y quieres llevar a tu hija de 2 años en el asiento trasero. ¿Se puede?
    answer: false
    explain: En un auto sin cinturones ni sistemas de retención no se llevan pasajeros menores de 3 años, vayan donde vayan.
    cites: ["rvv:59.2"]

  - id: cinturon-taxi-nino
    type: mc
    prompt: Tomas un taxi con tu hijo de 5 años, que mide 1,10 m. El taxi no tiene sistema de retención infantil. ¿Dónde puede ir el niño?
    options: ["En el asiento delantero, porque en un taxi no se exige el sistema infantil", "En un asiento que no sea el delantero", "En ninguna parte: sin sistema infantil no puede ir en taxi", "En el delantero, con el cinturón de adulto"]
    answer: 1
    explain: En un taxi el sistema infantil no es obligatorio, pero si no lo hay, un menor de 18 años y de menos de 1,35 m no va en un asiento delantero.
    cites: ["rvv:59.5"]

  - id: cinturon-airbag-bebe
    type: mc
    prompt: Tu coche solo tiene dos plazas y tienes que llevar a tu bebé en una silla orientada hacia atrás, en el asiento delantero. El airbag del copiloto está activo. ¿Qué haces?
    options: ["Pongo la silla igual: la silla lo protege del airbag", "Desactivo el airbag antes (o compruebo que se desactiva automáticamente)", "Bajo el respaldo del asiento para alejar la silla del airbag", "Dejo que el copiloto lleve al bebé en brazos"]
    answer: 1
    explain: Una silla orientada hacia atrás no va en un asiento con airbag delantero activo, porque al inflarse golpearía la silla. Solo se permite si el airbag está desactivado o se desactiva automáticamente de forma suficiente.
    cites: ["rvv:59.3"]

  - id: cinturon-silla-adelante
    type: yesno
    prompt: Llevas a tu hijo de 4 años en una silla orientada hacia ADELANTE, en el asiento delantero con el airbag activo. ¿Infringes la norma del airbag?
    answer: false
    explain: La prohibición es para el sistema orientado hacia ATRÁS en un asiento con airbag delantero activo. Orientada hacia adelante no entra en esa prohibición.
    cites: ["rvv:59.3"]

  - id: cinturon-arnes-flojo
    type: yesno
    prompt: Llevas a un niño de 4 años en su silla homologada, pero dejas el arnés flojo para que esté más cómodo. ¿Infringes la norma?
    answer: true
    explain: Hay que usar el cinturón o el sistema infantil de modo que su efecto protector no se vea afectado. Que la silla sea homologada no basta si la usas mal.
    cites: ["rvv:59.7"]

  - id: cinturon-maletero
    type: yesno
    prompt: En tu station wagon hay asientos traseros libres, pero un amigo adulto prefiere ir sentado en el maletero. ¿Puedes llevarlo así?
    answer: false
    explain: El artículo 58a exige que conductor y pasajeros vayan sentados en los asientos que son para ellos. El maletero no lo es, y hay asientos libres.
    cites: ["rvv:58a"]

  - id: cinturon-responsable-nino
    type: mc
    prompt: Tu sobrino de 8 años, que mide 1,25 m, se niega a ir en su silla y tú arrancas igual. Si te para la policía, ¿quién incumple?
    options: ["El niño, que no quiso", "Tú, que conduces: la norma prohíbe al conductor llevar a menores de 12 años de otra manera que la prescrita", "Nadie, si el niño llevaba el cinturón de adulto", "Los padres del niño, aunque no estuvieran en el coche"]
    answer: 1
    explain: La responsabilidad es de quien conduce, no del niño. Con 1,25 m le corresponde un sistema de retención infantil.
    cites: ["rvv:59.1", "rvv:59.8"]

  - id: cinturon-casco-pasajero
    type: yesno
    prompt: Llevas a un amigo de pasajero en tu motocicleta, solo hasta la esquina. ¿Debe llevar casco abrochado?
    answer: true
    explain: El artículo 60 exige casco al conductor y a los pasajeros de motocicletas, sin importar lo corto del trayecto. Las excepciones del artículo son casos concretos (por ejemplo, vehículos con celda de seguridad), no los trayectos cortos.
    cites: ["rvv:60"]
