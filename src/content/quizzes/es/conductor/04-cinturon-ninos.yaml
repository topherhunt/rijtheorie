questions:
  - id: cinturon-nino-bajo
    type: yesno
    prompt: Llevas a tu sobrino de 10 años, que mide 1,30 m, en el asiento trasero de un auto con cinturones. ¿Basta con que use el cinturón normal?
    answer: false
    explain: Es menor de 18 años y mide menos de 1,35 m, así que debe usar un kinderbeveiligingssysteem adecuado y homologado.
    cites: ["rvv:59.1"]

  - id: cinturon-adolescente-alto
    type: yesno
    prompt: Llevas a tu hija de 14 años, que mide 1,50 m. ¿Necesita un sistema de retención infantil?
    answer: false
    explain: El sistema infantil se exige a menores de 18 años que miden MENOS de 1,35 m. Ella mide más, así que le corresponde el cinturón normal. Sigue siendo obligatorio que lo use.
    cites: ["rvv:59.1"]

  - id: cinturon-nino-alto-sin-cinturon
    type: yesno
    prompt: Tu sobrino de 9 años mide 1,40 m y dice que ya es grande y no necesita cinturón. ¿Puede viajar sin cinturón?
    answer: false
    explain: Aunque mida más de 1,35 m y no necesite sistema infantil, debe usar el cinturón disponible. Además, al conductor se le prohíbe llevar a menores de 12 años de otra forma que la prescrita.
    cites: ["rvv:59.1", "rvv:59.8"]

  - id: cinturon-mas-pasajeros
    type: yesno
    prompt: En el asiento trasero hay dos cinturones. ¿Puedes llevar tres pasajeros en esos asientos?
    answer: false
    explain: En los asientos con cinturones no se llevan más pasajeros que cinturones.
    cites: ["rvv:59.1"]

  - id: cinturon-sin-cinturones
    type: mc
    prompt: Un auto sin cinturones ni sistemas de retención. ¿Qué pasa con un niño de 5 años que mide menos de 1,35 m?
    options: ["Va en cualquier asiento", "Va en un asiento que no sea uno de los delanteros", "No se puede llevar ningún niño", "Va sentado en las piernas del conductor"]
    answer: 1
    explain: Los de 3 a 18 años y menos de 1,35 m van en un asiento que no sea uno de los delanteros.
    cites: ["rvv:59.2"]

  - id: cinturon-menor-3
    type: yesno
    prompt: En un auto sin cinturones ni sistemas de retención, ¿se puede llevar a un niño de 2 años?
    answer: false
    explain: En ese caso no se llevan pasajeros menores de 3 años.
    cites: ["rvv:59.2"]

  - id: cinturon-airbag
    type: yesno
    prompt: ¿Puedes poner una silla infantil orientada hacia atrás en el asiento delantero con el airbag activo?
    answer: false
    explain: Está prohibido, salvo que el airbag esté desactivado o se desactive automáticamente de forma suficiente.
    cites: ["rvv:59.3"]

  - id: cinturon-silla-adelante
    type: yesno
    prompt: Una silla infantil orientada hacia ADELANTE va en el asiento delantero con el airbag activo. ¿Lo prohíbe el artículo 59 lid 3?
    answer: false
    explain: El lid 3 prohíbe el sistema orientado hacia ATRÁS en un asiento con airbag delantero activo. Orientada hacia adelante no entra en esa prohibición.
    cites: ["rvv:59.3"]

  - id: cinturon-arnes-flojo
    type: yesno
    prompt: Llevas a un niño de 4 años en su silla homologada, pero dejas el arnés flojo para que esté más cómodo. ¿Infringes el artículo 59?
    answer: true
    explain: El lid 7 exige usar el cinturón o el sistema infantil de modo que su efecto protector no se vea afectado ni pueda verse afectado. Que la silla sea homologada no basta si la usas mal.
    cites: ["rvv:59.7"]

  - id: cinturon-maletero
    type: yesno
    prompt: En tu station wagon hay asientos traseros libres, pero un amigo adulto prefiere ir sentado en el maletero. ¿Puedes llevarlo así?
    answer: false
    explain: El artículo 58a exige que conductor y pasajeros vayan sentados en los asientos que son para ellos. El maletero no lo es, y hay asientos libres.
    cites: ["rvv:58a"]

  - id: cinturon-casco-pasajero
    type: yesno
    prompt: Llevas a un amigo de pasajero en tu motocicleta, solo hasta la esquina. ¿Debe llevar casco abrochado?
    answer: true
    explain: El artículo 60 exige casco al conductor y a los pasajeros de motocicletas, sin importar lo corto del trayecto. Las excepciones del artículo son casos concretos (por ejemplo, vehículos con celda de seguridad), no los trayectos cortos.
    cites: ["rvv:60"]
