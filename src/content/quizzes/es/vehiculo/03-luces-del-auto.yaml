questions:
  - id: luces-del-auto-tercera-freno-falta
    type: yesno
    prompt: "Un auto puesto en uso en 2015 tiene sus dos luces de freno funcionando, pero no tiene tercera luz de freno. ¿Le falta una luz obligatoria?"
    answer: true
    explain: Los autos puestos en uso después del 30 de septiembre de 2001 deben llevar, además de las dos luces de freno, una tercera luz de freno. Que las dos luces funcionen no suple la que falta.
    cites: ["rv:5.2.51"]

  - id: luces-del-auto-colores-cambio
    type: mc
    prompt: Quieres cambiar las luces de tu auto por otras de color. ¿Cuál de estos cambios está permitido?
    options: ["Luces de freno ámbar en lugar de rojas", "Luces traseras de posición de color blanco", "Una luz de marcha atrás de color rojo", "Luz de la matrícula de color azulado"]
    answer: 0
    explain: Las luces de freno pueden ser rojas o ámbar. Las luces traseras deben ser rojas, la de marcha atrás blanca o amarilla y la de la matrícula blanca; un color válido para una luz no vale para otra.
    cites: ["rv:5.2.53"]

  - id: luces-del-auto-trasero-ambar-rojo
    type: yesno
    prompt: "Quieres cambiar los intermitentes traseros de tu auto por unos que dan luz blanca. Delante el blanco está permitido. ¿Tienen que ser ámbar o rojos los traseros?"
    answer: true
    explain: Los intermitentes delanteros pueden ser ámbar o blancos, pero los traseros solo ámbar o rojos. Que el blanco valga delante no lo hace válido detrás.
    cites: ["rv:5.2.53"]

  - id: luces-del-auto-led-fundidos
    type: mc
    prompt: Una luz de freno tiene 8 LED del mismo tamaño. ¿Con cuántos LED fundidos como máximo sigue estando permitida?
    options: [Con 1, Con 2, Con 3, Con 4]
    answer: 1
    explain: Una luz hecha de varias fuentes no puede perder más del 25% de su superficie. 2 de 8 son justo el 25%, así que sigue permitida; con 3 de 8 (37,5%) ya no.
    cites: ["rv:5.2.55"]

  - id: luces-del-auto-lamina-incumple
    type: yesno
    prompt: "Pegas una lámina oscura que tapa un tercio de la luz trasera de tu auto, y la luz funciona perfectamente. ¿Superas el límite de lo que se puede tapar?"
    answer: true
    explain: La parte de la luz por donde sale la luz no puede estar tapada en más del 25%, y un tercio es más. Que la luz funcione no cambia el límite de lo tapado.
    cites: ["rv:5.2.55"]

  - id: luces-del-auto-freno-colores-mezclados
    type: yesno
    prompt: Las luces de freno pueden ser rojas o ámbar. Tu auto tiene la luz de freno izquierda roja y la derecha ámbar. ¿Está en regla?
    answer: false
    explain: Cada color es válido por separado, pero las luces con la misma función deben tener casi el mismo color, tamaño y fuerza. Dos colores distintos en las dos luces de freno no cumplen.
    cites: ["rv:5.2.53", "rv:5.2.55"]

  - id: luces-del-auto-parpadean
    type: multi
    prompt: ¿Cuáles de estas luces de un auto particular pueden parpadear?
    options: [Los intermitentes, Las luces de emergencia, Las luces de freno al hacer un frenado de emergencia, Las antiniebla delanteras]
    answer: [0, 1, 2]
    explain: Solo los intermitentes, las luces de emergencia y las luces de freno del aviso de frenado de emergencia pueden parpadear. Unas luces de cruce o antiniebla que parpadean están prohibidas.
    cites: ["rv:5.2.64"]

  - id: luces-del-auto-testigo-antiniebla
    type: yesno
    prompt: Enciendes la antiniebla trasera de tu auto. ¿Debe haber una señal óptica en el tablero que te lo diga?
    answer: true
    explain: La antiniebla trasera encendida debe avisar al conductor con una señal óptica, para que no la dejes encendida sin necesidad.
    cites: ["rv:5.2.62"]

  - id: luces-del-auto-azul-prohibido
    type: yesno
    prompt: "Quieres montar una luz azul intermitente en el techo de tu auto particular para que te dejen pasar en los atascos. ¿Está prohibido?"
    answer: true
    explain: Las luces azules intermitentes solo están permitidas para los servicios autorizados.
    cites: ["rv:5.2.65"]

  - id: luces-del-auto-deslumbrar
    type: yesno
    prompt: Montas en el frente de tu auto unos faros adicionales muy potentes para ver mejor de noche, y a los coches que vienen de frente los deslumbran. Aparte de las luces largas, ¿está permitido?
    answer: false
    explain: La ley prohíbe luces que deslumbren, con la excepción de las luces largas.
    cites: ["rv:5.2.64"]
