questions:
  - id: neumaticos-minimo-cambiar
    type: yesno
    prompt: "Mides el dibujo de un neumático con un medidor y en una de las ranuras principales marca 1,4 mm. ¿Debes cambiarlo antes de seguir circulando?"
    answer: true
    explain: "La profundidad de las ranuras principales debe ser de al menos 1,6 mm en toda la circunferencia. Con 1,4 mm el neumático ya no cumple y hay que cambiarlo."
    cites: ["rv:5.2.27"]

  - id: neumaticos-revision-cuatro
    type: multi
    prompt: Revisas los cuatro neumáticos antes de un viaje. ¿Cuáles de estos hallazgos hacen que el neumático NO cumpla los requisitos?
    options: ["Un corte en el costado que deja ver la carcasa", "Un bulto en el costado", "3 mm de dibujo en toda la circunferencia", "1,5 mm de dibujo en una ranura principal"]
    answer: [0, 1, 3]
    explain: Un daño que deja ver la carcasa, un bulto y menos de 1,6 mm de dibujo incumplen rv:5.2.27. Con 3 mm uniformes el dibujo sí cumple; el error típico es rechazarlo por "parecer gastado".
    cites: ["rv:5.2.27"]

  - id: neumaticos-circunferencia
    type: mc
    prompt: El dibujo mide 3 mm en casi todo el neumático pero solo 1 mm en una parte de la circunferencia. ¿Cumple?
    options: ["Sí, porque el promedio de todo el neumático supera 1,6 mm", "No, el mínimo de 1,6 mm vale en toda la circunferencia", "Sí, porque 1 mm en una parte tan pequeña no importa", "Sí, si el neumático es nuevo y el resto tiene buen dibujo"]
    answer: 1
    explain: El mínimo de 1,6 mm rige sobre toda la circunferencia del dibujo.
    cites: ["rv:5.2.27"]

  - id: neumaticos-carcasa-cambiar
    type: yesno
    prompt: "Un neumático tiene 5 mm de dibujo y un corte en el costado por el que se ve la carcasa. ¿Tienes que cambiarlo?"
    answer: true
    explain: Los requisitos son independientes. Aunque el dibujo supere 1,6 mm, el neumático no puede tener daños que dejen ver la carcasa, así que un dibujo profundo no lo salva.
    cites: ["rv:5.2.27"]

  - id: neumaticos-recortado-incumple
    type: yesno
    prompt: "Un neumático normal, sin la marca \"regroovable\", está gastado. ¿Incumples los requisitos si lo recortas a mano para recuperar dibujo?"
    answer: true
    explain: Los neumáticos no pueden estar recortados, salvo los marcados "regroovable" y mientras no se vea la carcasa.
    cites: ["rv:5.2.27"]

  - id: neumaticos-regroovable-incumple
    type: yesno
    prompt: "Un neumático marcado \"regroovable\" fue recortado y ahora se ve la carcasa en el fondo de las ranuras. ¿Incumple los requisitos?"
    answer: true
    explain: El recorte solo se permite en neumáticos marcados regroovable y siempre que la carcasa no sea visible. Que esté marcado no basta.
    cites: ["rv:5.2.27"]

  - id: neumaticos-sentido-incumple
    type: yesno
    prompt: "Montas un neumático con una flecha de sentido de giro de modo que la flecha apunta contra el giro de la rueda al avanzar. ¿Incumple los requisitos?"
    answer: true
    explain: El sentido indicado en el neumático debe coincidir con el giro de la rueda en marcha hacia adelante.
    cites: ["rv:5.2.27"]

  - id: neumaticos-misma-medida-eje
    type: yesno
    prompt: "Cambias un neumático del eje delantero y no usas una rueda de emergencia o de repuesto. ¿Debe tener la misma medida que el neumático del otro lado de ese eje?"
    answer: true
    explain: Los neumáticos de un mismo eje deben tener la misma medida, salvo que sea una rueda de emergencia o de repuesto.
    cites: ["rv:5.2.27"]

  - id: neumaticos-presion-baja
    type: yesno
    prompt: El fabricante prescribe 2,3 bar para tu auto y tus neumáticos tienen 1,5 bar. ¿Cumple los requisitos?
    answer: false
    explain: La presión de los neumáticos debe ser la prescrita por el fabricante del vehículo.
    cites: ["rv:5.2.27"]

  - id: neumaticos-aviso
    type: yesno
    prompt: En un auto puesto en uso en 2019, el aviso de presión de neumáticos del tablero indica un defecto. ¿Cumple los requisitos?
    answer: false
    explain: Para autos puestos en uso después de 2017, el sistema de control de presión no debe indicar un defecto.
    cites: ["rv:5.2.27"]

  - id: neumaticos-prestar-auto
    type: mc
    prompt: Tu auto tiene un neumático con 1,2 mm de dibujo. Se lo prestas a un amigo y él conduce. ¿Quién infringe?
    options: ["Solo el amigo, que es quien lo conduce", "Solo tú, porque eres el dueño del auto", "Los dos: él por conducirlo y tú por dejarlo", "Nadie, el amigo no sabía del neumático"]
    answer: 2
    explain: Está prohibido conducir un vehículo que no cumple los requisitos y también está prohibido que el dueño o poseedor lo deje conducir.
    cites: ["rv:5.1.1", "rv:5.2.27"]

  - id: neumaticos-examen-control
    type: multi
    prompt: En la revisión previa del examen práctico, ¿qué compruebas en los neumáticos, fuera del auto?
    options: [La profundidad del dibujo y la presión, Que el tapón de la válvula esté puesto, Que no tengan daños, De qué material de caucho están hechos]
    answer: [0, 1, 2]
    explain: El CBR lista profundidad y presión, tapón de la válvula, ausencia de daños y marca de verano o invierno. La composición del neumático no se pregunta ni se comprueba.
    cites: ["cbr-rijprocedure:3.7"]
