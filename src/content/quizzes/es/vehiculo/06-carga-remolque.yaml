questions:
  - id: carga-remolque-asegurada
    type: mc
    prompt: Llevas cajas pesadas en el maletero abierto de una furgoneta pequeña y solo vas a recorrer 10 km por una carretera tranquila. ¿Hasta qué punto debe estar asegurada la carga?
    options: ["Basta con que aguante si conduzco despacio y en línea recta", "Debe aguantar una frenada fuerte o un golpe de volante", "Solo hace falta si el trayecto es largo o voy por autopista", "Solo hace falta si llueve o hay viento fuerte"]
    answer: 1
    explain: "La carga debe soportar frenadas fuertes, maniobras bruscas y mal pavimento sin caerse. La distancia corta o la carretera tranquila no cambian eso: la frenada de emergencia puede llegar en cualquier trayecto."
    cites: ["rv:5.18.6/1"]

  - id: carga-remolque-suelta
    type: mc
    prompt: Llevas arena suelta en un remolque abierto y el viento puede levantarla. ¿Qué debes hacer?
    options: ["Taparla bien, porque puede volarse y molestar", "Atarla con cuerdas como si fueran cajas o bultos", "Ir más rápido para que el viento no la levante", "Nada, porque la arena pesa demasiado para volar"]
    answer: 0
    explain: La carga suelta que no se puede fijar debe taparse bien si puede caerse o volar y causar peligro o molestia. Atarla no funciona con arena suelta.
    cites: ["rv:5.18.6/2"]

  - id: carga-remolque-escalera-1-5
    type: yesno
    prompt: Llevas una escalera atada en el techo que sobresale 1,5 m por detrás de tu auto. Pones una barra de protección firme (stootbalk). ¿Está permitido?
    answer: false
    explain: La carga no puede sobresalir más de 1,00 m por detrás del vehículo. La stootbalk solo protege a quien viene detrás cuando la carga sobresale; no amplía el límite.
    cites: ["rv:5.18.12/1"]

  - id: carga-remolque-stootbalk
    type: mc
    prompt: Con tu auto puesto en uso en 2020 llevas un tubo que sobresale 0,80 m por detrás, y su parte de abajo está a 0,70 m del suelo. ¿Qué más hace falta?
    options: ["Nada más, porque sobresale menos de 1,00 m por detrás", "Una barra firme a no más de 0,60 m del final del tubo", "Una bandera roja bien visible atada en el extremo del tubo", "Una luz de freno adicional colocada en el extremo del tubo"]
    answer: 1
    explain: Si la parte de abajo de la carga que sobresale está a más de 0,55 m del suelo, hace falta una stootbalk firme a no más de 0,60 m del final. Estar dentro de 1,00 m no basta.
    cites: ["rv:5.18.12/1"]

  - id: carga-remolque-luces
    type: mc
    prompt: Llevas bicicletas en un portabultos trasero que tapa las luces traseras del auto. ¿Qué es lo correcto?
    options: ["Ir despacio con las luces de emergencia puestas durante el trayecto", "El portabultos debe llevar sus propias luces e intermitentes", "Poner cinta reflectante en las bicicletas y en el portabultos", "Nada especial, si es de día y el portabultos se ve bien"]
    answer: 1
    explain: Si el portabultos o la carga tapan luces, el portabultos debe llevar sus propias luces traseras, de freno, reflectores e intermitentes. Ir despacio, cinta o el día no sustituyen a las luces.
    cites: ["rv:5.18.12/1", "rv:5.18.7/1"]

  - id: carga-remolque-tablas-lados
    type: yesno
    prompt: Llevas tablas largas dentro del auto con la ventanilla bajada, y sobresalen 0,30 m por el lado derecho y nada por el izquierdo. ¿Está permitido?
    answer: false
    explain: La carga de un auto no puede sobresalir más de 0,20 m por cada lado. Que por el otro lado no sobresalga nada no compensa.
    cites: ["rv:5.18.14"]

  - id: carga-remolque-altura-baca
    type: yesno
    prompt: Con la baca cargada, tu auto mide 4,3 m desde el suelo hasta lo más alto de la carga. ¿Puedes circular así?
    answer: false
    explain: El auto con carga no puede pasar de 4,00 m de altura. La altura se mide incluida la carga.
    cites: ["rv:5.18.15"]

  - id: carga-remolque-bicis-90kg
    type: yesno
    prompt: Llevas dos bicicletas eléctricas de 45 kg cada una en un portabicicletas sobre la barra de remolque, y la barra no indica ningún máximo. ¿Está permitido?
    answer: false
    explain: Si la barra no da datos, la carga vertical no puede pasar de 75 kg. Las dos bicicletas suman 90 kg.
    cites: ["rv:5.18.7/1"]

  - id: carga-remolque-matricula-tapada
    type: mc
    prompt: Tu portabicicletas tapa la matrícula del auto. ¿Qué debe llevar el portabicicletas?
    options: ["Nada, la carga es temporal", Una matrícula con el número de tu auto, Una nota con el número en la ventana trasera, Un reflector ámbar]
    answer: 1
    explain: Si el portabultos tapa la matrícula, debe llevar una matrícula con el número del auto (y su luz, si el auto la necesita). Una nota o un reflector no sustituyen a la matrícula.
    cites: ["rv:5.18.7/1"]

  - id: carga-remolque-techo-limite
    type: mc
    prompt: La baca de tu auto aguanta 100 kg, pero el fabricante del auto fija una carga máxima de 75 kg en el techo. ¿Cuánto puedes llevar?
    options: ["Hasta 75 kg, el máximo que fija el fabricante de tu auto", "Hasta 100 kg, lo que aguanta la baca", "Hasta 175 kg, sumando el límite del auto y el de la baca", "Cualquier peso mientras la carga esté bien atada"]
    answer: 0
    explain: No puedes pasar la carga máxima del techo que fija el fabricante del auto. Que la baca aguante más no cambia ese límite.
    cites: ["rv:5.18.7/2"]

  - id: carga-remolque-holgura
    type: yesno
    prompt: El enganche de tu remolque tiene 5 mm de holgura total entre el auto y el remolque, pero está bien asegurado. ¿Está en regla?
    answer: false
    explain: La holgura total en la unión entre el vehículo que arrastra y el arrastrado no puede pasar de 3 mm, aunque el enganche esté asegurado.
    cites: ["rv:5.18.54"]

  - id: carga-remolque-sin-datos-900
    type: yesno
    prompt: Quieres arrastrar un remolque de 900 kg con un auto de 1.400 kg de masa vacía. El acople no indica ningún dato. ¿Está permitido?
    answer: false
    explain: Si el acople no da datos, el remolque no puede pasar de 750 kg y tampoco de la masa vacía del auto. 900 kg supera los 750 kg, aunque el auto sea más pesado.
    cites: ["rv:5.18.18/1"]

  - id: carga-remolque-conjunto-19
    type: yesno
    prompt: Tu auto mide 4,8 m y quieres enganchar un remolque largo de 13,5 m. ¿Puede circular el conjunto así?
    answer: false
    explain: Las dos longitudes suman más de 18,3 m y el conjunto de auto y remolque no puede medir más de 18,00 m.
    cites: ["rv:5.18.11/7"]

  - id: carga-remolque-intermitente-lateral
    type: yesno
    prompt: Vas a enganchar un remolque a un auto que tiene intermitentes delanteros y traseros, pero ninguno en los costados. ¿Cumple el auto con remolque?
    answer: false
    explain: Un auto que arrastra un remolque debe tener un intermitente lateral en cada costado. Los intermitentes delanteros y traseros no sustituyen a los laterales.
    cites: ["rv:5.18.37"]
