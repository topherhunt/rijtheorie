questions:
  - id: visibilidad-espejos-parabrisas-luz
    type: yesno
    prompt: Pones una lámina oscura en el parabrisas y en las ventanillas delanteras de tu auto, y ahora dejan pasar solo el 50% de la luz. ¿Cumple?
    answer: false
    explain: El parabrisas y las ventanillas delanteras deben dejar pasar al menos el 55% de la luz. Con 50% no cumple.
    cites: ["rv:5.2.42"]

  - id: visibilidad-espejos-espejos
    type: multi
    prompt: ¿Qué espejos debe tener un auto puesto en uso en 2022?
    options: [Espejo exterior izquierdo, Espejo exterior derecho, Espejo interior, Un espejo en el techo]
    answer: [0, 1, 2]
    explain: Un auto puesto en uso después de enero de 2010 necesita espejo exterior izquierdo, derecho e interior.
    cites: ["rv:5.2.45"]

  - id: visibilidad-espejos-camara-averiada
    type: yesno
    prompt: Un auto de 2022 lleva un sistema de cámara y monitor en lugar del espejo exterior derecho, pero la pantalla no funciona. ¿Cumple con la obligación del espejo?
    answer: false
    explain: Un sistema cámara-monitor puede sustituir al espejo, pero tiene que funcionar bien y estar bien fijado. Una pantalla que no funciona no da la vista que exige la ley.
    cites: ["rv:5.2.45", "rv:5.18.4"]

  - id: visibilidad-espejos-objetos
    type: yesno
    prompt: ¿Puedes tener objetos que bloqueen la vista en el parabrisas si no los usas?
    answer: false
    explain: No puede haber objetos innecesarios que bloqueen la vista.
    cites: ["rv:5.2.42"]

  - id: visibilidad-espejos-sin-lavaparabrisas
    type: yesno
    prompt: En tu auto de 2015 el limpiaparabrisas funciona bien, pero el lavaparabrisas ya no echa líquido. ¿Cumple?
    answer: false
    explain: El auto debe tener limpiaparabrisas y también un lavaparabrisas que funcionen. Que uno funcione no compensa el otro.
    cites: ["rv:5.2.43"]

  - id: visibilidad-espejos-claxon-melodia
    type: yesno
    prompt: Cambias el claxon de tu auto por uno que toca una melodía. ¿Está permitido?
    answer: false
    explain: El auto debe tener un claxon de tono fijo y no puede llevar otros avisadores sonoros fuera de los permitidos por la ley.
    cites: ["rv:5.2.71"]

  - id: visibilidad-espejos-velocimetro-noche
    type: yesno
    prompt: El velocímetro de tu auto funciona de día, pero de noche no se ilumina y no puedes leerlo. ¿Cumple?
    answer: false
    explain: El velocímetro debe funcionar y ser legible para el conductor también de noche.
    cites: ["rv:5.2.15"]

  - id: visibilidad-espejos-ajuste-exterior
    type: mc
    prompt: Ajustas el espejo exterior izquierdo antes de salir. ¿Cómo debe quedar?
    options: [Sin ver nada de tu propio auto para ver más carretera, Viendo todavía justo el costado izquierdo del auto y la mayor parte posible de la carretera al lado y detrás, Apuntando sobre todo al cielo, Viendo solo el costado de tu auto]
    answer: 1
    explain: En el espejo exterior debe verse justo el costado del auto y el mayor trozo posible de carretera al lado y detrás, con el horizonte a una cuarta parte desde arriba. Ver más cielo o solo tu auto te quita la vista de lo que viene.
    cites: ["cbr-rijprocedure:1"]

  - id: visibilidad-espejos-hombro-demasiado
    type: yesno
    prompt: Antes de cambiar de carril, giras la cabeza hacia atrás y miras por encima del hombro durante varios segundos para estar seguro. ¿Es lo que se espera?
    answer: false
    explain: Mirar por encima del hombro es solo para comprobar el dode hoek. Si lo alargas o lo conviertes en mirar hacia atrás, puedes desviar el auto sin querer y no ves lo que pasa delante.
    cites: ["cbr-rijprocedure:3.5"]

  - id: visibilidad-espejos-estorbo
    type: yesno
    prompt: Llevas una maleta que te toca el brazo y te estorba al girar el volante. ¿Está permitido?
    answer: false
    explain: El conductor no puede ser estorbado por pasajeros, carga u otra cosa.
    cites: ["rv:5.18.3/1"]

  - id: visibilidad-espejos-interior
    type: yesno
    prompt: ¿Es siempre obligatorio el espejo interior, incluso si da vista nula hacia atrás?
    answer: false
    explain: No hace falta si no da vista hacia atrás.
    cites: ["rv:5.2.45"]
