questions:
  - id: asientos-cinturones-medidas-todos
    type: yesno
    prompt: Un auto puesto en uso en 2015 tiene cinturón solo en los asientos delanteros. ¿Cumple?
    answer: false
    explain: Para autos puestos en uso después del 30 de septiembre de 2000, todos los asientos deben tener cinturón.
    cites: ["rv:5.2.47"]

  - id: asientos-cinturones-medidas-airbag
    type: yesno
    prompt: En tu auto de 2021 el aviso de defecto del airbag está encendido, aunque el auto arranca y frena con normalidad. ¿Cumple los requisitos?
    answer: false
    explain: Los avisos del airbag y del pretensor no deben indicar un defecto en autos posteriores a 2017.
    cites: ["rv:5.2.47"]

  - id: asientos-cinturones-medidas-lado
    type: yesno
    prompt: Te ofrecen un auto particular puesto en uso en 2020 con un banco en la parte trasera orientado de lado, para dos pasajeros. ¿Puede el auto tener esos asientos?
    answer: false
    explain: Los autos puestos en uso después de 2014 no pueden tenerlos.
    cites: ["rv:5.2.46"]

  - id: asientos-cinturones-medidas-barra
    type: yesno
    prompt: Vas a enganchar un remolque y ves una grieta fina en la barra de remolque, pero solo es un trayecto corto. ¿Cumple?
    answer: false
    explain: La barra debe estar firmemente fijada y sin grietas.
    cites: ["rv:5.2.66"]

  - id: asientos-cinturones-medidas-pasajeros-cinturones
    type: yesno
    prompt: Los asientos traseros de tu auto tienen tres cinturones. Quieres llevar cuatro pasajeros atrás, apretados. ¿Está permitido?
    answer: false
    explain: Cuando los asientos de pasajeros tienen cinturón, no puedes llevar en ellos más pasajeros que cinturones.
    cites: ["rvv:59"]

  - id: asientos-cinturones-medidas-dimensiones-cual
    type: mc
    prompt: Alquilas un auto muy grande para una boda y comparas las fichas de cuatro modelos. ¿Cuál cumple las dimensiones máximas de un auto?
    options: ["11,5 m, 2,50 m y 3,90 m", "12,5 m, 2,50 m y 3,90 m", "11,5 m, 2,60 m y 3,90 m", "11,5 m, 2,50 m y 4,20 m"]
    answer: 0
    explain: Un auto puede medir como máximo 12,00 m de largo, 2,55 m de ancho y 4,00 m de alto. Las otras tres pasan en una medida (largo, ancho o alto), y basta una para no cumplir.
    cites: ["rv:5.2.6"]

  - id: asientos-cinturones-medidas-conjunto-ancho
    type: yesno
    prompt: Tu auto mide 1,85 m de ancho. Llevas unas tablas en el techo que sobresalen 0,20 m por cada lado. ¿Está permitido?
    answer: true
    explain: La carga de un auto puede sobresalir hasta 0,20 m por cada lado, y el ancho total (2,25 m) está lejos del máximo de 2,55 m.
    cites: ["rv:5.18.14", "rv:5.2.6"]

  - id: asientos-cinturones-medidas-masa-superada
    type: yesno
    prompt: Cargas el auto con cuatro personas y mucho equipaje, y la masa total supera la máxima que figura en la kentekencard. ¿Puedes circular así?
    answer: false
    explain: La masa total y la suma de las cargas por eje no pueden superar los máximos que figuran en el registro, la kentekencard o el kentekenbewijs.
    cites: ["rv:5.2.7"]

  - id: asientos-cinturones-medidas-escape-agujero
    type: yesno
    prompt: El escape de tu auto tiene un agujero por el que salen gases, pero el ruido está dentro del límite. ¿Cumple?
    answer: false
    explain: El escape debe ser hermético a los gases en toda su longitud (salvo los agujeros de drenaje). Cumplir con el ruido no compensa una fuga.
    cites: ["rv:5.2.11"]

  - id: asientos-cinturones-medidas-conducir-defecto
    type: yesno
    prompt: En tu auto de 2015 el cierre del cinturón de uno de los asientos traseros no engancha. Hoy solo llevas gente delante. ¿Puedes conducir ese auto?
    answer: false
    explain: Está prohibido conducir un vehículo que no cumple los requisitos, y un cinturón con el cierre defectuoso no los cumple. Que hoy no lo uses no cambia que el auto no cumple.
    cites: ["rv:5.1.1", "rv:5.2.47"]

  - id: asientos-cinturones-medidas-placa
    type: yesno
    prompt: Montas en la parte trasera de tu auto un portabicicletas que tapa la placa. Las luces y los intermitentes sí se ven. ¿Cumple?
    answer: false
    explain: El kenteken debe ser legible y las placas no pueden estar tapadas. Que se vean las luces no compensa que la placa quede oculta.
    cites: ["rv:5.2.1"]
