questions:
  - id: frenos-fugas
    type: yesno
    prompt: El sistema de frenos pierde líquido. ¿Cumple los requisitos?
    answer: false
    explain: Las piezas del freno no pueden tener fugas, estar dañadas ni tener corrosión grave.
    cites: ["rv:5.2.31"]

  - id: frenos-servofreno
    type: yesno
    prompt: ¿Debe funcionar el servofreno?
    answer: true
    explain: El requisito exige que el servofreno (brake booster) funcione.
    cites: ["rv:5.2.31"]

  - id: frenos-parkeerrem
    type: number
    prompt: ¿Sobre cuántas ruedas, como mínimo, debe actuar el freno de estacionamiento?
    answer: 2
    unit: ruedas
    explain: El freno de estacionamiento debe actuar sobre al menos dos ruedas.
    cites: ["rv:5.2.39"]

  - id: frenos-atras
    type: yesno
    prompt: ¿Debe el freno de estacionamiento funcionar también en sentido hacia atrás?
    answer: true
    explain: Debe funcionar también hacia atrás.
    cites: ["rv:5.2.39"]

  - id: frenos-abs-aviso
    type: yesno
    prompt: En un auto de 2020 se enciende el aviso de defecto del ABS. ¿Cumple?
    answer: false
    explain: Para autos puestos en uso después de 2017 el aviso del ABS no debe indicar un defecto.
    cites: ["rv:5.2.31"]

  - id: frenos-remolque
    type: mc
    prompt: Cuando frenas con el pedal, ¿qué deben hacer los frenos de un remolque que los tiene?
    options: [Nada, Entrar en acción al accionar el freno de servicio del auto, Solo actuar con el freno de mano, Solo actuar a más de 50 km/h]
    answer: 1
    explain: Los frenos del remolque deben actuar al accionar el freno de servicio del auto.
    cites: ["rv:5.18.34/1"]

  - id: frenos-losbreek
    type: mc
    prompt: ¿Cuándo debe actuar el freno de seguridad (losbreekreminrichting) del remolque?
    options: [Siempre que frenas, Solo después de que se suelta el acople del remolque, Al arrancar, Al estacionar]
    answer: 1
    explain: Solo debe actuar tras el desprendimiento del acople.
    cites: ["rv:5.18.34/2"]

  - id: frenos-sin-frenos
    type: yesno
    prompt: Un remolque de 600 kg de masa total detrás de un auto de 1.400 kg en orden de marcha. ¿Puede no tener frenos?
    answer: true
    explain: Un remolque de hasta 750 kg sin frenos es posible si su masa total no pasa de la mitad de la masa en orden de marcha del auto (700 kg aquí).
    cites: ["rv:5.18.33"]

  - id: frenos-sin-frenos-no
    type: yesno
    prompt: Un remolque de 750 kg de masa total detrás de un auto de 1.200 kg en orden de marcha. ¿Puede no tener frenos?
    answer: false
    explain: La mitad del auto es 600 kg; el remolque de 750 kg la supera, así que necesita frenos.
    cites: ["rv:5.18.33"]
