questions:
  - id: bus-tram-tranvia-izquierda
    type: mc
    prompt: Un tranvía viene por tu izquierda en un cruce sin señales. ¿Quién pasa primero?
    diagram:
      arms: { n: {}, e: {}, s: {}, w: { tram: true } }
      vehicles:
        - { label: A, kind: car, from: s, to: straight, you: true }
        - { label: B, kind: tram, from: w, to: straight }
      alt: Cruce sin señales. Tú (A) vienes del sur y sigues recto. Un tranvía (B) viene del oeste por su vía en el centro de la calzada, por tu izquierda, y sigue recto.
    options: [Tú (auto), Tranvía B]
    answer: 1
    explain: Los conductores deben dar prioridad a los tranvías, aunque vengan por la izquierda.
    cites: ["rvv:15.2.b"]

  - id: bus-tram-tranvia-frente
    type: mc
    prompt: Giras a la izquierda y un tranvía viene de frente. ¿Quién pasa primero?
    diagram:
      arms: { n: { tram: true }, e: {}, s: {}, w: {} }
      vehicles:
        - { label: A, kind: car, from: s, to: left, you: true }
        - { label: B, kind: tram, from: n, to: straight }
      alt: Cruce. Tú (A) vienes del sur y giras a la izquierda. Un tranvía (B) viene de frente, del norte, y sigue recto.
    options: [Tú (auto), Tranvía B]
    answer: 1
    explain: Dejas pasar al tráfico de frente al girar (art. 18) y además debes dar prioridad al tranvía (art. 15).
    cites: ["rvv:18.1", "rvv:15.2.b"]

  - id: bus-tram-tranvia-gira
    type: mc
    prompt: Sigues recto y un tranvía que viene de frente gira a la izquierda cruzando tu carril. ¿Quién pasa primero?
    diagram:
      arms: { n: { tram: true }, e: {}, s: {}, w: {} }
      vehicles:
        - { label: A, kind: car, from: s, to: straight, you: true }
        - { label: B, kind: tram, from: n, to: left }
      alt: Cruce. Tú (A) vienes del sur y sigues recto. Un tranvía (B) viene de frente, del norte, y gira a la izquierda cruzando tu carril.
    options: [Tú (auto), Tranvía B]
    answer: 1
    explain: Al tranvía no se le aplican las reglas de giro del art. 18 (art. 18.3), así que no tiene que dejarte pasar. Y tú sigues debiéndole prioridad por el art. 15.2.b. Pensar que "el que gira cede" también vale para el tranvía es el error.
    cites: ["rvv:18.3", "rvv:15.2.b"]

  - id: bus-tram-adelantar-derecha
    type: mc
    prompt: Vas detrás de un tranvía lento y a su derecha hay espacio libre. ¿Puedes adelantarlo por ese lado?
    options:
      - Sí, el tranvía se puede adelantar por la derecha
      - No, todo adelantamiento se hace por la izquierda
    answer: 0
    explain: La regla general es adelantar por la izquierda (art. 11.1), pero el art. 11.5 permite adelantar tranvías por la derecha. Aplicar la regla general al tranvía te haría rechazar un adelantamiento permitido.
    cites: ["rvv:11.5", "rvv:11.1"]

  - id: bus-tram-pasajeros
    type: mc
    prompt: Quieres pasar un autobús detenido por el lado donde suben y bajan pasajeros. ¿Qué debes hacer?
    options:
      - Pasar solo si les dejo la oportunidad de subir y bajar
      - Pasar despacio sin parar, porque ellos deben esperar
      - Pasar si no veo pasajeros subiendo o bajando en ese momento
    answer: 0
    explain: El art. 52 obliga a dar a los pasajeros la oportunidad de subir y bajar. No basta pasar despacio ni fijarse solo en quien ya está bajando, porque no tienes que quitarles esa oportunidad.
    cites: ["rvv:52"]

  - id: bus-tram-pasajeros-aparecen
    type: mc
    prompt: Pasas por el lado de las puertas de un autobús detenido en una parada. ¿Qué haces además de dejar subir y bajar a los pasajeros?
    options:
      - "Voy listo para frenar: pueden salir pasajeros por delante o detrás"
      - Acelero para pasar antes de que el autobús arranque y cierre el paso
      - Miro solo hacia las puertas, porque ahí es por donde salen los pasajeros
    answer: 0
    explain: El CBR pide atención a los pasajeros que aparecen por delante o por detrás del autobús, no solo junto a las puertas.
    cites: ["cbr-rijprocedure:3.6"]

  - id: bus-tram-salir-parada-situacion
    type: mc
    prompt: En zona urbana, un autobús parado en una parada pone el intermitente para volver a la calzada. Tú vienes por detrás por el mismo carril. ¿Qué haces?
    options:
      - Reduzco para darle la oportunidad de salir
      - Paso antes de que salga, porque circulo por la calzada y él no
      - Toco la bocina para que espere
    answer: 0
    explain: Dentro de la zona urbana el art. 56.1 te obliga a dar al autobús que avisa la oportunidad de salir de la parada. Que tú circules por la calzada no te da prioridad frente a él.
    cites: ["rvv:56.1"]
