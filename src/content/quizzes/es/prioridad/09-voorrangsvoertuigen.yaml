questions:
  - id: voorrangsvoertuigen-quien
    type: multi
    prompt: ¿Cuáles de estos servicios llevan luz azul y bocina de dos tonos según el art. 29?
    options:
      - Policía
      - Bomberos
      - Servicios de atención médica urgente
      - Autobuses de línea
    answer: [0, 1, 2]
    explain: El art. 29 nombra a la policía, los bomberos, los servicios de atención médica urgente y otros servicios de ayuda designados. Un autobús de línea no está entre ellos, aunque vaya con prisa.
    cites: ["rvv:29"]

  - id: voorrangsvoertuigen-sin-cruce
    type: mc
    prompt: Circulas por una calle recta, sin cruces, y una ambulancia con luz azul y sirena se acerca por detrás. ¿Se aplica el deber de dejarla pasar?
    options:
      - Sí, en cualquier punto de la vía, no solo en los cruces
      - No, el art. 50 solo regula quién pasa primero en un cruce
    answer: 0
    explain: El art. 50 dice que los usuarios de la vía deben dejar pasar a un vehículo prioritario, sin limitarlo a los cruces. Pensar que solo vale en cruces es confundirlo con las reglas de prioridad.
    cites: ["rvv:50"]

  - id: voorrangsvoertuigen-ambulancia-izquierda
    type: mc
    prompt: Una ambulancia con luz azul y sirena viene por tu izquierda. ¿Quién pasa primero?
    diagram:
      arms: { n: {}, e: {}, s: {}, w: {} }
      vehicles:
        - { label: A, kind: car, from: s, to: straight, you: true }
        - { label: B, kind: ambulance, from: w, to: straight, siren: true }
      alt: Cruce sin señales. Tú (A) vienes del sur y sigues recto. Una ambulancia (B) con luz azul y sirena viene del oeste, por tu izquierda, y sigue recto.
    options: [Tú (A), La ambulancia B]
    answer: 1
    explain: Debes dejar pasar a un vehículo prioritario aunque no venga por tu derecha.
    cites: ["rvv:50"]

  - id: voorrangsvoertuigen-policia-frente
    type: mc
    prompt: Giras a la izquierda y un auto de policía con luz azul y sirena viene de frente. ¿Quién pasa primero?
    diagram:
      arms: { n: {}, e: {}, s: {}, w: {} }
      vehicles:
        - { label: A, kind: car, from: s, to: left, you: true }
        - { label: B, kind: police, from: n, to: straight, siren: true }
      alt: Cruce sin señales. Tú (A) vienes del sur y giras a la izquierda. Un auto de policía (B) con luz azul y sirena viene de frente, del norte, y sigue recto.
    options: [Tú (A), El auto de policía B]
    answer: 1
    explain: Dejas pasar tanto por el art. 18 (giras a la izquierda) como por el art. 50 (vehículo prioritario).
    cites: ["rvv:50", "rvv:18.1"]

  - id: voorrangsvoertuigen-prioridad-tuya
    type: yesno
    prompt: Estás en una vía con prioridad y se acerca una ambulancia con sirena desde una vía lateral. ¿Debes dejarla pasar?
    answer: true
    explain: El art. 50 no depende de quién tenga la prioridad en el cruce.
    cites: ["rvv:50"]

  - id: voorrangsvoertuigen-ciclista
    type: mc
    prompt: Vas en bicicleta por la calzada y una ambulancia con luz azul y sirena viene por detrás. ¿Quién debe dejarla pasar?
    options:
      - Tú también, igual que los conductores de coche
      - Solo los coches, porque los ciclistas no conducen un motorvehículo
    answer: 0
    explain: El art. 50 habla de weggebruikers, todos los usuarios de la vía. Ciclistas y peatones también deben dejar pasar, no solo quienes conducen autos.
    cites: ["rvv:50"]

  - id: voorrangsvoertuigen-semaforo-rojo
    type: mc
    prompt: Estás parado ante un semáforo en rojo. Una ambulancia con luz azul y sirena se acerca por detrás y el cruce está libre. ¿Qué haces?
    options:
      - Me quedo parado ante el rojo y le dejo paso solo si puedo hacerlo de forma legal y segura
      - Cruzo el semáforo en rojo con cuidado para abrirle camino
      - Avanzo hasta el centro del cruce para dejar libre el carril de la ambulancia
      - Doy marcha atrás hasta dejarle espacio suficiente para pasar
    answer: 0
    explain: El art. 50 te obliga a dejarla pasar, pero no describe cómo hacerlo; el art. 91 da libertad al conductor de la ambulancia, no a ti. El semáforo en rojo sigue significando stop para ti (art. 68.1), así que cruzar o avanzar en rojo no es la respuesta por defecto.
    cites: ["rvv:50", "rvv:91", "rvv:68.1"]

  - id: voorrangsvoertuigen-verde
    type: mc
    prompt: Tienes el semáforo en verde y ves venir por el cruce una ambulancia con luz azul y sirena que no se detiene en su rojo. ¿Qué haces?
    options:
      - Le dejo pasar, porque a un vehículo prioritario se le deja pasar aunque yo tenga verde
      - Sigo, porque el verde me da paso y es ella quien debe parar
      - Acelero para cruzar antes de que llegue
    answer: 0
    explain: El art. 50 te obliga a dejar pasar a un vehículo prioritario, y el art. 91 permite a su conductor desviarse de las reglas en la medida en que su tarea lo exija. Tu verde no cambia esa obligación.
    cites: ["rvv:50", "rvv:91"]
