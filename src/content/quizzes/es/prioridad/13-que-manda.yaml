questions:
  - id: que-manda-b1-derecha
    type: mc
    prompt: Circulas por una vía con B1 (voorrangsweg) y llegas a un cruce sin semáforo. Un coche entra desde la vía lateral que queda a tu derecha. ¿Quién pasa primero?
    options:
      - Tú, porque la señal de prioridad manda sobre la regla de la derecha
      - El otro coche, porque viene por tu derecha
    answer: 0
    explain: Las señales van por encima de las reglas de tráfico cuando son incompatibles (art. 63). La regla de la derecha es solo la regla general; con B1 en tu vía, ya no se aplica.
    cites: ["rvv:63", "rvv:15.1"]

  - id: que-manda-semaforo-b6
    type: mc
    prompt: Tienes B6 en tu entrada, pero el semáforo del cruce está en verde para ti. ¿Qué rige tu paso?
    options:
      - El semáforo, que va por encima de la señal B6
      - La señal B6, porque obliga a ceder aunque tengas verde
      - La regla de la derecha, porque las otras dos se contradicen
    answer: 0
    explain: Los semáforos van por encima de las señales que regulan la prioridad (art. 64). Elegir B6 o la regla de la derecha ignora el orden de importancia.
    cites: ["rvv:64"]

  - id: que-manda-b1-semaforo-rojo
    type: mc
    prompt: Estás en una vía con B1 y el semáforo está en rojo para ti. El cruce está vacío. ¿Qué haces?
    options:
      - Paro, porque el semáforo va por encima de la señal de prioridad
      - Paso, porque tengo prioridad (B1) y el cruce está libre
      - Paso despacio, porque B1 me da preferencia
    answer: 0
    explain: El semáforo va por encima de la señal de prioridad (art. 64). Que el cruce esté libre no cambia la obligación de parar ante el rojo.
    cites: ["rvv:64", "rvv:68.1"]

  - id: que-manda-agente
    type: mc
    prompt: El semáforo está en rojo y un agente de policía te hace señas para que pases. ¿Qué haces?
    options: [Seguir la indicación del agente, Esperar el verde, Esperar a que pase otro auto, Tocar la bocina]
    answer: 0
    explain: Las indicaciones de los agentes van por encima de las señales y las reglas, y debes seguirlas. Esperar el verde sería seguir el semáforo, que está por debajo.
    cites: ["rvv:84", "rvv:82.1"]

  - id: que-manda-quien
    type: multi
    prompt: ¿De quién debes seguir todas las indicaciones con voz o gestos?
    options:
      - Agentes autorizados reconocibles
      - Marechaussee
      - Verkeersregelaars autorizados reconocibles
      - Un guardia escolar (verkeersbrigadier), para cualquier orden de tráfico
    answer: [0, 1, 2]
    explain: El art. 82.1 nombra a esos tres grupos. El verkeersbrigadier solo puede darte la orden de parar (art. 82.3), no cualquier indicación.
    cites: ["rvv:82.1", "rvv:82.3"]

  - id: que-manda-brigadier-parar
    type: mc
    prompt: El semáforo está en verde para ti, pero un guardia escolar (verkeersbrigadier) te indica que pares para que crucen niños. ¿Qué haces?
    options:
      - Paro, porque debo seguir su orden de parar
      - Sigo, porque el semáforo está en verde para mí
      - Sigo, porque un guardia escolar no es un agente de policía
    answer: 0
    explain: Los conductores deben seguir la orden de parar de los verkeersbrigadiers autorizados (art. 82.3), y las indicaciones van por encima de los semáforos.
    cites: ["rvv:82.3", "rvv:84"]

  - id: que-manda-stop-rws
    type: yesno
    prompt: Circulas por una carretera y delante de ti un vehículo de un inspector de carreteras de Rijkswaterstaat muestra un cartel luminoso con la palabra "STOP" en rojo. ¿Debes parar?
    answer: true
    explain: El art. 83 obliga a parar ante un cartel luminoso "stop" o "stop politie" de un vehículo de la policía o de inspectores de Rijkswaterstaat, no solo de la policía.
    cites: ["rvv:83"]

  - id: que-manda-gebod
    type: yesno
    sign: C1
    prompt: Quieres atajar por una calle desierta que empieza con esta señal. No hay nadie y ningún vecino se molestaría. ¿Puedes entrar con tu coche?
    answer: false
    explain: Debes obedecer las señales que contienen una orden o una prohibición (art. 62), aunque nadie se vea afectado.
    cites: ["rvv:62"]

  - id: que-manda-stopstreep
    type: mc
    prompt: Estás obligado a parar ante un semáforo en rojo y hay una línea de detención para ti. ¿Dónde te detienes?
    options:
      - Antes de la línea
      - Con las ruedas delanteras justo sobre la línea
      - Un poco pasada la línea, para ver mejor el cruce
    answer: 0
    explain: Debes parar antes de la stopstreep que es para ti (art. 79). Detenerte sobre ella o pasada no cumple la obligación.
    cites: ["rvv:79"]

  - id: que-manda-orden-ambulancia
    type: order
    prompt: ¿En qué orden pasan? La ambulancia lleva luz azul y sirena.
    diagram:
      arms: { n: {}, e: {}, s: {}, w: {} }
      vehicles:
        - { label: A, kind: car, from: s, to: straight, you: true }
        - { label: B, kind: bike, from: e, to: straight }
        - { label: C, kind: ambulance, from: w, to: straight, siren: true }
      alt: Cruce sin señales. Tú (A) vienes del sur y sigues recto. Un ciclista (B) viene del este, por tu derecha, y sigue recto. Una ambulancia (C) con luz azul y sirena viene del oeste y sigue recto.
    answer: [C, B, A]
    explain: La ambulancia pasa primero porque todos deben dejarla pasar. Después B, que viene por tu derecha, y al final tú.
    cites: ["rvv:50", "rvv:15.1"]

  - id: que-manda-orden-b1
    type: order
    prompt: ¿En qué orden pasan? Estás en una vía con prioridad (B1) y C viene de una vía lateral con B6.
    diagram:
      arms: { n: { sign: B1 }, e: { sign: B6, shark: true }, s: { sign: B1 }, w: {} }
      vehicles:
        - { label: A, kind: car, from: s, to: straight, you: true }
        - { label: B, kind: car, from: n, to: left }
        - { label: C, kind: car, from: e, to: straight }
      alt: Cruce en una vía con prioridad B1 que va de norte a sur. Tú (A) vienes del sur y sigues recto. B viene del norte y gira a la izquierda. C viene de una vía lateral del este con B6 y dientes de tiburón, y sigue recto.
    answer: [A, B, C]
    explain: A sigue recto por la vía con prioridad y pasa primero. B gira a la izquierda y deja pasar a A (art. 18), pero tiene prioridad sobre C. C viene de la vía lateral con B6 y cede el paso a los dos.
    cites: ["rvv:bijlage1.B1", "rvv:bijlage1.B6", "rvv:18.1"]
