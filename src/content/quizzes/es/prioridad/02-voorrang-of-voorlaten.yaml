questions:
  - id: voorrang-of-voorlaten-bici-bestuurder
    type: yesno
    prompt: Un ciclista que viene por tu derecha en un cruce sin señales es un "bestuurder" y tiene prioridad sobre ti.
    answer: true
    explain: Los ciclistas son conductores para la ley, así que la regla de la derecha les da prioridad igual que a un auto.
    cites: ["rvv:1", "rvv:15.1"]

  - id: voorrang-of-voorlaten-peaton-garaje
    type: yesno
    prompt: Sales de un garaje (uitrit) y viene un peatón por la acera. ¿Debes dejarlo pasar?
    answer: true
    explain: "Salir de una uitrit es una maniobra especial: dejas pasar a todo el tráfico, peatones incluidos (art. 54). El CBR lo subraya expresamente."
    cites: ["rvv:54", "cbr-rijprocedure:3.6"]

  - id: voorrang-of-voorlaten-peaton-recto
    type: mc
    prompt: Vas recto en un cruce normal, sin paso de cebra. Un peatón quiere cruzar tu calle. ¿Qué dice el CBR?
    options:
      - Por ley no hay voorrang para el peatón en el cruce, pero debes tener muy en cuenta su interés
      - El peatón siempre tiene prioridad absoluta
      - Puedes ignorarlo porque no es conductor
      - Debes tocar la bocina para que espere
    answer: 0
    explain: El CBR indica que en los cruces los peatones no tienen voorrang por ley, pero hay que considerar su interés y su seguridad.
    cites: ["cbr-rijprocedure:3.3"]

  - id: voorrang-of-voorlaten-detenerse
    type: yesno
    prompt: Ceder el paso (voorrang verlenen) siempre significa detenerse por completo.
    answer: false
    explain: Puedes ceder el paso reduciendo la velocidad si el otro no tiene que frenar ni esquivarte. Entre las señales de prioridad, solo B7 (Stop) obliga siempre a parar.
    cites: ["rvv:1", "rvv:bijlage1.B7"]

  - id: voorrang-of-voorlaten-ambulancia
    type: yesno
    prompt: Una ambulancia con luces azules y sirena se acerca. ¿Todos los usuarios de la vía deben dejarla pasar?
    answer: true
    explain: El art. 50 obliga a todos los usuarios a dejar pasar a los vehículos prioritarios.
    cites: ["rvv:50", "rvv:29"]

  - id: voorrang-of-voorlaten-uitrit-izquierda
    type: mc
    prompt: Sales de una uitrit (salida de un garaje) a la calle. Por tu derecha no viene nadie, pero por tu izquierda se acerca una bicicleta y por la acera pasa un peatón. ¿A quién dejas pasar?
    options:
      - "A todos: a la bicicleta y al peatón"
      - Solo a quien viene por tu derecha, o sea a nadie
      - Solo a la bicicleta, porque el peatón no es conductor
      - A nadie, porque estás saliendo de una propiedad privada y ellos van por la vía
    answer: 0
    explain: Salir de una uitrit es una maniobra especial (art. 54) y dejas pasar a todo el tráfico, también al que viene por la izquierda y a los peatones. La regla de la derecha no se aplica aquí. El CBR dice que no importa desde dónde ni qué tipo de usuario se acerque.
    cites: ["rvv:54", "cbr-rijprocedure:3.6"]

  - id: voorrang-of-voorlaten-que-regla
    type: mc
    prompt: Estás estacionado junto al borde de la calzada y vas a arrancar. A tu derecha se acerca un auto y de frente se acerca otro. ¿Qué regla se aplica?
    options:
      - Dejas pasar a todo el tráfico, incluido el que viene de frente (art. 54)
      - "Regla de la derecha: solo cedes al que viene por tu derecha"
      - Pasa primero el que llegue antes al punto de cruce
      - Dejas pasar solo al que viene de frente
    answer: 0
    explain: "Arrancar desde un estacionamiento es una maniobra especial: es voor laten gaan, no voorrang verlenen, y el círculo incluye a todos, también a los de frente."
    cites: ["rvv:54", "rvv:15.1", "cbr-rijprocedure:3.1"]

  - id: voorrang-of-voorlaten-ciclista-peaton
    type: mc
    prompt: Vas recto por un cruce sin señales ni paso de cebra. Un ciclista llega por tu derecha por la calle que cruzas y un peatón se dispone a cruzar tu calle. ¿A quién debes dar voorrang según la regla de la derecha?
    options:
      - Al ciclista; al peatón la regla no le da voorrang, pero debes tener en cuenta su interés
      - A los dos, porque ambos vienen por tu derecha
      - Solo al peatón, porque es el más vulnerable
      - A ninguno, porque van por la calle que cruzas
    answer: 0
    explain: El art. 15.1 da voorrang a los bestuurders que vienen de la derecha, y el ciclista lo es; el peatón no (art. 1). El CBR añade que en los cruces debes tener muy en cuenta el interés de los peatones.
    cites: ["rvv:1", "rvv:15.1", "cbr-rijprocedure:3.3"]
