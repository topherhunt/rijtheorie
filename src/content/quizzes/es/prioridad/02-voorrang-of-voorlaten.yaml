questions:
  - id: voorrang-of-voorlaten-def
    type: mc
    prompt: Según la ley, ¿qué significa "voorrang verlenen"?
    options:
      - Permitir a los conductores implicados que continúen su camino sin estorbo
      - Detenerse siempre por completo
      - Tocar la bocina para avisar al otro
      - Pasar solo si el otro no te ve
    answer: 0
    explain: La ley define voorrang verlenen como permitir a los conductores implicados continuar su camino sin estorbo. No siempre implica detenerse del todo.
    cites: ["rvv:1"]

  - id: voorrang-of-voorlaten-bestuurder
    type: yesno
    prompt: Para la ley, un peatón cuenta como "bestuurder" (conductor).
    answer: false
    explain: Bestuurders son todos los usuarios de la vía excepto los peatones. Por eso la regla de la derecha (art. 15) no se aplica hacia peatones.
    cites: ["rvv:1", "rvv:15.1"]

  - id: voorrang-of-voorlaten-bici-bestuurder
    type: yesno
    prompt: Un ciclista que viene por tu derecha en un cruce sin señales es un "bestuurder" y tiene prioridad sobre ti.
    answer: true
    explain: Los ciclistas son conductores para la ley, así que la regla de la derecha les da prioridad igual que a un auto.
    cites: ["rvv:1", "rvv:15.1"]

  - id: voorrang-of-voorlaten-casos
    type: multi
    prompt: ¿En cuáles de estas situaciones la ley usa la expresión "voor laten gaan" (dejar pasar)?
    options:
      - Al girar, hacia el tráfico de frente y el que va a tu lado
      - En un paso de cebra, hacia los peatones
      - Ante un vehículo prioritario con luces y sirena
      - Al arrancar desde el borde de la calzada (maniobra especial)
      - Solo en cruces sin señales
    answer: [0, 1, 2, 3]
    explain: Los artículos 18, 49, 50 y 54 usan voor laten gaan. La regla de la derecha de un cruce sin señales (art. 15) usa voorrang verlenen.
    cites: ["rvv:18.1", "rvv:49.2", "rvv:50", "rvv:54"]

  - id: voorrang-of-voorlaten-peaton-garaje
    type: yesno
    prompt: Sales de un garaje (uitrit) y viene un peatón por la acera. ¿Debes dejarlo pasar?
    answer: true
    explain: "Salir de una uitrit es una maniobra especial: dejas pasar a todo el tráfico, peatones incluidos (art. 54). El CBR lo subraya expresamente."
    cites: ["rvv:54", "cbr-rijprocedure:3.6"]

  - id: voorrang-of-voorlaten-peaton-recto
    type: mc
    prompt: Vas recto en un cruce normal, sin paso de cebra. Un peatón quiere cruzar tu calle. ¿Qué dice el CBR?
    options:
      - Por ley no hay voorrang para el peatón en el cruce, pero debes tener muy en cuenta su interés
      - El peatón siempre tiene prioridad absoluta
      - Puedes ignorarlo porque no es conductor
      - Debes tocar la bocina para que espere
    answer: 0
    explain: El CBR indica que en los cruces los peatones no tienen voorrang por ley, pero hay que considerar su interés y su seguridad.
    cites: ["cbr-rijprocedure:3.3"]

  - id: voorrang-of-voorlaten-detenerse
    type: yesno
    prompt: Ceder el paso (voorrang verlenen) siempre significa detenerse por completo.
    answer: false
    explain: Puedes ceder el paso reduciendo la velocidad si el otro no tiene que frenar ni esquivarte. Entre las señales de prioridad, solo B7 (Stop) obliga siempre a parar.
    cites: ["rvv:1", "rvv:bijlage1.B7"]

  - id: voorrang-of-voorlaten-acercarse
    type: mc
    prompt: Según el CBR, ¿cómo debes acercarte a un cruce donde debes ceder el paso?
    options:
      - De manera que quien tiene prioridad confíe en que le cederás el paso
      - Acelerando para pasar antes que el otro
      - Sin mirar si ves que el otro frena
      - Siempre en primera marcha
    answer: 0
    explain: El CBR pide una aproximación que muestre claramente que vas a ceder, y detenerte (si hace falta) de modo que el otro siga sin estorbo.
    cites: ["cbr-rijprocedure:3.3"]

  - id: voorrang-of-voorlaten-ambulancia
    type: yesno
    prompt: Una ambulancia con luces azules y sirena se acerca. ¿Todos los usuarios de la vía deben dejarla pasar?
    answer: true
    explain: El art. 50 obliga a todos los usuarios a dejar pasar a los vehículos prioritarios.
    cites: ["rvv:50", "rvv:29"]

  - id: voorrang-of-voorlaten-maniobra
    type: multi
    prompt: ¿Cuáles de estas son maniobras especiales en las que debes dejar pasar al resto del tráfico?
    options:
      - Arrancar desde el borde de la calzada
      - Dar marcha atrás
      - Salir de una uitrit hacia la calle
      - Dar la vuelta (keren)
      - Seguir recto por una vía con prioridad
    answer: [0, 1, 2, 3]
    explain: El art. 54 cubre wegrijden, achteruitrijden, uit een uitrit de weg oprijden, keren y cambiar de carril, entre otros. Seguir recto por una vía con prioridad no es maniobra especial.
    cites: ["rvv:54"]
