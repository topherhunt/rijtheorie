questions:
  - id: colonne-no-cortar
    type: yesno
    prompt: Una columna militar pasa por el cruce. Tú tienes prioridad. ¿Puedes cortarla?
    answer: false
    explain: Los usuarios de la vía no pueden cortar una columna militar ni un cortejo fúnebre de motorvehículos.
    cites: ["rvv:16"]

  - id: colonne-stoet
    type: yesno
    prompt: La prohibición de cortar también vale para un cortejo fúnebre de motorvehículos.
    answer: true
    explain: El art. 16 nombra a las militaire colonnes y a las uitvaartstoeten de motorvehículos.
    cites: ["rvv:16"]

  - id: colonne-def-colonne
    type: mc
    prompt: ¿Qué es una militaire colonne según la ley?
    options:
      - Varios vehículos motorizados militares, uno tras otro, bajo un solo comandante y con distintivos oficiales
      - Cualquier grupo de tres vehículos
      - Un solo camión militar
      - Un grupo de ciclistas militares
    answer: 0
    explain: Es una fila de vehículos motorizados bajo un solo comandante y con los distintivos oficiales.
    cites: ["rvv:1"]

  - id: colonne-def-stoet
    type: mc
    prompt: ¿Cuáles son las características de una uitvaartstoet de motorvehículos?
    options:
      - Motorvehículos que acompañan a un difunto o sus cenizas y llevan distintivos oficiales
      - Cualquier grupo de autos con luces encendidas
      - Cualquier vehículo con flores
      - Un solo coche fúnebre
    answer: 0
    explain: Según el art. 1, son motorvehículos que acompañan a un difunto o sus cenizas y llevan los distintivos del art. 30c.
    cites: ["rvv:1", "rvv:30c"]

  - id: colonne-excepciones
    type: multi
    prompt: ¿Qué excepciones tienen los motorvehículos que van dentro de una columna militar?
    options:
      - No tienen que dejar pasar a peatones en un paso de peatones
      - No tienen que dejar salir a un autobús de la parada
      - Pueden cortar cualquier cruce sin mirar
      - Pueden saltarse todas las señales
    answer: [0, 1]
    explain: Las excepciones nombradas son los arts. 49.3 y 56.2, no hay una exención general.
    cites: ["rvv:49.3", "rvv:56.2"]

  - id: colonne-semaforo
    type: yesno
    prompt: Un motorvehículo de una columna militar que empezó a pasar el semáforo en verde puede seguir aunque cambie la luz.
    answer: true
    explain: El art. 68.4 lo permite para columnas militares.
    cites: ["rvv:68.4"]

  - id: colonne-semaforo-fuera
    type: yesno
    prompt: Tú no formas parte de la columna, pero el semáforo se pone amarillo mientras ellos pasan. ¿Tienes la misma exención?
    answer: false
    explain: La excepción es solo para los vehículos de la columna militar.
    cites: ["rvv:68.4"]

  - id: colonne-peaton
    type: yesno
    prompt: Un motorvehículo de un cortejo fúnebre no está obligado a dejar pasar a un peatón en un paso de peatones.
    answer: true
    explain: El art. 49.3 los exceptúa.
    cites: ["rvv:49.3"]
