questions:
  - id: bijzondere-manoeuvres-lista-situaciones
    type: multi
    prompt: ¿En cuáles de estas situaciones debes dejar pasar a todo el tráfico por hacer una maniobra especial?
    options:
      - Sales de la entrada de un garaje (uitrit) a la calle
      - Pasas del carril de incorporación a la calzada principal
      - Sigues recto por una vía con prioridad
      - Arrancas cuando el semáforo se pone verde, tras esperar en la cola
    answer: [0, 1]
    explain: El art. 54 cita uit een uitrit de weg oprijden y van de invoegstrook de doorgaande rijbaan oprijden. Seguir recto no es una maniobra especial, y según el CBR arrancar tras una parada en el tráfico tampoco lo es.
    cites: ["rvv:54", "cbr-rijprocedure:3.1"]

  - id: bijzondere-manoeuvres-arrancar-mirar
    type: mc
    prompt: Vas a arrancar desde el borde derecho de la calzada, donde estás estacionado. ¿Qué miras antes de salir, según el CBR?
    options:
      - Retrovisor interior, adelante, exterior y hombro izquierdos
      - Adelante y retrovisor interior, porque lo que te alcanza viene de atrás
      - Retrovisor interior, adelante, exterior derecho y hombro derecho
    answer: 0
    explain: Al arrancar desde el lado derecho entras en el carril por tu izquierda, así que el tráfico que te alcanza viene por ese lado. El CBR indica esa secuencia, y además debes dejar pasar a todo el tráfico, también al de frente.
    cites: ["cbr-rijprocedure:3.1", "rvv:54"]

  - id: bijzondere-manoeuvres-semaforo-arrancar
    type: yesno
    prompt: Estabas detenido ante un semáforo en rojo y arrancas cuando se pone verde. ¿Es una maniobra especial en la que debes dejar pasar a todo el tráfico?
    answer: false
    explain: Según el CBR, arrancar tras una parada en el tráfico no se considera maniobra especial (aunque debes seguir molestando lo menos posible). Arrancar desde un estacionamiento o el borde sí lo es.
    cites: ["cbr-rijprocedure:3.1"]

  - id: bijzondere-manoeuvres-senal
    type: mc
    prompt: Quieres arrancar desde el borde de la calzada con tu auto. ¿Qué debes hacer antes?
    options: [Avisar con el intermitente, Tocar la bocina, Encender las emergencias, "Nada, si no viene nadie"]
    answer: 0
    explain: Los conductores de motorvehículos deben avisar con el intermitente al arrancar.
    cites: ["rvv:55"]

  - id: bijzondere-manoeuvres-uitrit-izquierda
    type: mc
    prompt: Sales de una uitrit (salida de un garaje) a la calle. Por tu derecha no viene nadie, pero por tu izquierda se acerca una bicicleta y por la acera pasa un peatón. ¿A quién dejas pasar?
    options:
      - "A todos: a la bicicleta y al peatón, vengan de donde vengan"
      - Solo a quien viene por tu derecha, o sea a nadie
      - Solo a la bicicleta, porque el peatón no es conductor
      - A nadie, porque sales de una propiedad privada y ellos van por la vía
    answer: 0
    explain: Salir de una uitrit es una maniobra especial (art. 54) y dejas pasar a todo el tráfico, también al que viene por la izquierda y a los peatones. La regla de la derecha no se aplica aquí. El CBR dice que no importa desde dónde ni qué tipo de usuario se acerque.
    cites: ["rvv:54", "cbr-rijprocedure:3.6"]

  - id: bijzondere-manoeuvres-uitrit-encuentro
    type: mc
    prompt: Un auto sale de una uitrit y otro entra a ella al mismo tiempo. Según la ley y la preferencia del CBR, ¿qué se espera?
    options:
      - Ambos ceden por ley; el CBR prefiere al que sale
      - Solo el que sale cede, porque el que entra va por la vía
      - Solo el que entra debe ceder, porque el que sale ya está en marcha
    answer: 0
    explain: Ambos hacen una maniobra especial, así que por ley ambos deben dejar pasar. Que se deje pasar al que sale es una preferencia del CBR, no una regla de la ley.
    cites: ["rvv:54", "cbr-rijprocedure:3.6"]

  - id: bijzondere-manoeuvres-inrit-situacion
    type: mc
    prompt: Vas a entrar con tu auto a una inrit y para llegar a ella cruzas un carril bici. Un ciclista se acerca por ese carril. ¿Qué haces?
    options:
      - Lo dejas pasar y entras cuando ya haya pasado
      - Entras, porque tú ya estás en la calzada
      - Entras si le haces señales con el intermitente
      - Entras si el ciclista viene por tu derecha
    answer: 0
    explain: "Entrar a una inrit es una maniobra especial (art. 54): dejas pasar al resto del tráfico, venga de donde venga. El CBR pide comprobar antes el carril bici y la acera."
    cites: ["rvv:54", "cbr-rijprocedure:3.6"]

  - id: bijzondere-manoeuvres-parada-uitrit
    type: yesno
    prompt: Paras delante de la salida de un garaje solo el tiempo de que baje un pasajero, y arrancas enseguida. ¿Infringes la prohibición de estacionar frente a una uitrit?
    answer: false
    explain: Estacionar (parkeren) excluye la parada necesaria para que suban o bajen pasajeros de inmediato (art. 1), así que esa parada no cae en el art. 24.1.b. Si te quedaras esperando, sí sería estacionar.
    cites: ["rvv:24.1", "rvv:1"]

  - id: bijzondere-manoeuvres-marcha-atras-situacion
    type: mc
    prompt: Das marcha atrás para salir de un estacionamiento. Un ciclista pasa por detrás de tu auto. ¿Quién pasa primero?
    options: [El ciclista que cruza por detrás, "Tú, porque ya empezaste la maniobra", Quien venga por la derecha, Quien llegue primero al punto de cruce]
    answer: 0
    explain: "Dar marcha atrás es una maniobra especial (art. 54): dejas pasar al resto del tráfico, sea de la categoría que sea. Haber empezado antes no te da prioridad."
    cites: ["rvv:54", "cbr-rijprocedure:3.7"]

  - id: bijzondere-manoeuvres-keren-quien
    type: mc
    prompt: Das la vuelta (keren) en una calle de doble sentido. Un auto se acerca por detrás y un ciclista viene de frente por el otro carril. ¿A quién dejas pasar?
    options: ["A los dos, al auto y al ciclista", Solo al auto que viene por detrás, Solo al ciclista que viene de frente, Solo a quien viene por tu derecha]
    answer: 0
    explain: "Keren es una maniobra especial: dejas pasar al resto del tráfico, venga de donde venga y sea de la categoría que sea."
    cites: ["rvv:54"]

  - id: bijzondere-manoeuvres-cambio-carril-situacion
    type: mc
    prompt: Circulas por una vía con dos carriles en tu sentido y quieres pasar al carril izquierdo. Ya pusiste el intermitente. Un auto viene por ese carril desde atrás, más rápido que tú. ¿Quién pasa primero?
    options: [El auto que viene por detrás, "Tú, porque ya señalizaste", El que esté más a la derecha, Quien llegue primero al punto de cruce]
    answer: 0
    explain: Cambiar de carril es una maniobra especial (art. 54) y dejas pasar al resto del tráfico. Señalizar (art. 55) es obligatorio pero no te da prioridad.
    cites: ["rvv:54", "rvv:55"]
