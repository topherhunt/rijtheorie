questions:
  - id: zebrapad-peaton-espera
    type: yesno
    prompt: Un peatón espera en el borde de un paso de peatones, claramente a punto de cruzar. ¿Debes dejarlo pasar?
    sign: L2
    diagram:
      arms: { n: {}, e: {}, s: { sign: L2 }, w: {} }
      vehicles:
        - { label: P, kind: pedestrian, from: s, pos: 0 }
        - { label: A, kind: car, from: s, to: straight, pos: 1, you: true }
      alt: Cruce. Un peatón (P) está en el paso de peatones de la entrada sur, a punto de cruzar. Tú (A) vienes del sur, detrás del peatón, y sigues recto.
    answer: true
    explain: Debes dejar pasar a los peatones que cruzan o que están evidentemente a punto de cruzar un paso de peatones.
    cites: ["rvv:49.2", "cbr-rijprocedure:3.6"]

  - id: zebrapad-ciego
    type: mc
    prompt: Ves a una persona con bastón blanco con anillos rojos cruzando. ¿Qué debes hacer?
    options: [Dejarla pasar hasta que cruce por completo, Pasar antes de que llegue a tu carril, Esperar solo si hay paso de peatones en ese punto]
    answer: 0
    explain: Los ciegos con bastón blanco con anillos rojos y las personas que se mueven con dificultad siempre deben ser dejadas pasar.
    cites: ["rvv:49.1"]

  - id: zebrapad-semaforo-cuando
    type: mc
    prompt: Llegas a un paso de peatones con semáforo para peatones. ¿Cuándo rige tu obligación de dejar pasar del art. 49.2?
    options:
      - Cuando los peatones no tienen rojo ni amarillo intermitente
      - Solo cuando el paso no tiene ningún semáforo para peatones
      - Siempre que haya algún peatón en la acera, sea cual sea la luz
    answer: 0
    explain: El art. 49.4 dice que el deber del 49.2 no rige si los peatones tienen luz roja o amarilla intermitente. Con luz verde para ellos sí rige, aunque haya semáforo. Y un peatón en la acera que no cruza ni va a cruzar no activa la obligación.
    cites: ["rvv:49.2", "rvv:49.4"]

  - id: zebrapad-amarillo
    type: mc
    prompt: Te acercas a un paso con la luz amarilla intermitente para los peatones, y un peatón ya está cruzando. ¿Qué haces?
    options:
      - Dejo que termine de cruzar aunque la ley ya no me obligue a eso
      - Acelero, porque con amarillo intermitente el peatón debe dejarme pasar
      - Paso sin cambiar nada, porque el art. 49.2 ya no se aplica
    answer: 0
    explain: Con amarillo intermitente el art. 49.4 quita el deber del 49.2 y es el peatón quien debe dejar pasar al tráfico (art. 74.2). Aun así, el CBR pide tener en cuenta a los peatones que cruzan, así que no aceleras contra uno que ya está en el paso.
    cites: ["rvv:49.4", "rvv:74.2", "cbr-rijprocedure:2"]

  - id: zebrapad-quienes
    type: multi
    prompt: Te acercas a un paso de peatones. ¿A cuáles de estas personas debes dejar pasar?
    options:
      - Un peatón parado en el borde, a punto de cruzar
      - Una persona ciega con bastón blanco con anillos rojos que cruza 30 m antes del paso
      - El conductor de un vehículo para personas con discapacidad que cruza por el paso
      - Un peatón que ya cruzó y camina por la acera
    answer: [0, 1, 2]
    explain: El art. 49.2 cubre a peatones y conductores de gehandicaptenvoertuigen que cruzan o están a punto de cruzar el paso. El art. 49.1 obliga con ciegos y personas que se mueven con dificultad en cualquier lugar. Quien ya cruzó y camina por la acera ya no cruza ni va a cruzar.
    cites: ["rvv:49.1", "rvv:49.2"]

  - id: zebrapad-adelantar-detenido
    type: mc
    prompt: Un auto va despacio delante de ti justo antes de un paso de peatones y el carril contrario está libre. ¿Puedes adelantarlo?
    options:
      - "No: está prohibido adelantar justo antes del paso de peatones"
      - Sí, si no viene nadie de frente y adelantas con rapidez y cuidado
      - Sí, pero solo si no hay ningún peatón esperando en el borde
    answer: 0
    explain: El art. 12 prohíbe adelantar vlak voor o sobre un paso de peatones, haya o no tráfico de frente. Quien adelanta no ve a un peatón que el vehículo adelantado tapa.
    cites: ["rvv:12"]

  - id: zebrapad-vehiculo-detenido
    type: mc
    prompt: Hay un auto detenido delante del paso de peatones por otro motivo. ¿Qué dice el CBR?
    options: [Pasar con muchísimo cuidado, Adelantarlo si está libre, Seguir sin cambiar nada]
    answer: 0
    explain: El auto detenido puede tapar a un peatón que cruza, así que pasa con gran cuidado.
    cites: ["cbr-rijprocedure:3.6"]

  - id: zebrapad-estacionar-tres-metros
    type: yesno
    prompt: Buscas dónde dejar el auto y ves un hueco libre a 3 metros de un paso de peatones, en tu lado de la calle. ¿Puedes dejar tu auto detenido ahí?
    answer: false
    explain: No puedes dejar tu vehículo parado sobre el paso de peatones ni a menos de cinco metros de él.
    cites: ["rvv:23.1"]

  - id: zebrapad-girar-derecha
    type: mc
    prompt: Giras a la derecha hacia una calle lateral. Justo al entrar hay un paso de peatones y un peatón empieza a cruzar. ¿Quién pasa primero?
    options: [El peatón que ya empieza a cruzar, "Tú, porque estabas en la vía principal", Quien llegó primero al cruce]
    answer: 0
    explain: La obligación del art. 49.2 vale para cualquier conductor que se encuentre con peatones que cruzan o están a punto de cruzar por un paso de peatones, también si acabas de girar.
    cites: ["rvv:49.2"]

  - id: zebrapad-ciego-sin-paso
    type: yesno
    prompt: En una calle sin paso de peatones, una persona ciega con bastón blanco con anillos rojos empieza a cruzar delante de ti. ¿Debes dejarla pasar?
    answer: true
    explain: El art. 49.1 obliga a dejar pasar a los ciegos con bastón blanco con anillos rojos y a quienes se mueven con dificultad, sin limitarlo al paso de peatones.
    cites: ["rvv:49.1"]
