questions:
  - id: afslaan-preseleccionar-derecha
    type: mc
    prompt: Vas a girar a la derecha en una calle ancha. ¿Cómo te colocas con tiempo?
    options:
      - Lo más a la derecha posible de tu carril
      - En el centro de la vía, para una curva más amplia
      - Junto al eje, para ver mejor el cruce
    answer: 0
    explain: El art. 17.1 permite colocarte lo más a la derecha posible para girar a la derecha, y el CBR lo pide cuando no hacerlo entorpece el tráfico o es inseguro. Quedarte en el centro hace esperar a los de detrás.
    cites: ["rvv:17.1", "cbr-rijprocedure:3.3"]

  - id: afslaan-preseleccionar-izquierda
    type: mc
    prompt: Vas a girar a la izquierda en una vía de doble sentido y tendrás que esperar a los de frente. ¿Cómo te colocas con tiempo?
    options:
      - Junto al eje, sin invadir el carril de frente
      - Lo más a la derecha posible, sin estorbar
      - Sobre el carril contrario, para ver mejor
    answer: 0
    explain: El art. 17.1 permite colocarte junto al eje para girar a la izquierda. El CBR explica que así el tráfico de detrás no te adelanta por la izquierda y puede pasar por la derecha.
    cites: ["rvv:17.1", "cbr-rijprocedure:3.3"]

  - id: afslaan-senal-posicion
    type: yesno
    prompt: Te colocas junto al eje para girar a la izquierda. Como ya se ve que vas a girar, no pones el intermitente. ¿Es correcto?
    answer: false
    explain: El art. 17.2 obliga a dar la señal con el intermitente o con el brazo antes de girar. Tu posición en la vía no la sustituye.
    cites: ["rvv:17.2"]

  - id: afslaan-senal-cuando
    type: mc
    prompt: Vas a girar. ¿Cuándo das el intermitente, según el CBR?
    options:
      - Con tiempo, después de mirar, y lo apago al terminar el giro
      - Justo al mover el volante, para no confundir a nadie
      - Solo si veo otros vehículos o ciclistas que puedan verlo
    answer: 0
    explain: El CBR pide señalizar con tiempo y tras mirar, para que los demás puedan adaptarse. El art. 17.2 obliga a señalizar en cualquier caso, haya o no tráfico a la vista.
    cites: ["cbr-rijprocedure:3.3", "rvv:17.2"]

  - id: afslaan-izquierda-frente
    type: mc
    prompt: Giras a la izquierda. B viene de frente y sigue recto. ¿Quién pasa primero?
    diagram:
      arms: { n: {}, e: {}, s: {}, w: {} }
      vehicles:
        - { label: A, kind: car, from: s, to: left, you: true }
        - { label: B, kind: car, from: n, to: straight }
      alt: Cruce sin señales. Tú (A) vienes del sur y giras a la izquierda hacia el oeste. B viene del norte, de frente, y sigue recto.
    options: [Tú (A), Auto B]
    answer: 1
    explain: Quien gira debe dejar pasar al tráfico que viene de frente por la misma vía.
    cites: ["rvv:18.1"]

  - id: afslaan-b1-izquierda
    type: mc
    prompt: Estás en una vía con prioridad (B1) y giras a la izquierda. B viene de frente y sigue recto. ¿Quién pasa primero?
    sign: B1
    diagram:
      arms: { n: { sign: B1 }, e: {}, s: { sign: B1 }, w: {} }
      vehicles:
        - { label: A, kind: car, from: s, to: left, you: true }
        - { label: B, kind: car, from: n, to: straight }
      alt: Cruce en una vía con prioridad B1. Tú (A) vienes del sur y giras a la izquierda. B viene del norte, de frente, y sigue recto.
    options: [Tú (A), Auto B]
    answer: 1
    explain: La prioridad de la vía no te libera del deber de quien gira. Dejas pasar al tráfico de frente.
    cites: ["rvv:18.1"]

  - id: afslaan-izq-der
    type: mc
    prompt: Tú giras a la izquierda y B, que viene de frente, gira a su derecha en el mismo cruce. ¿Quién pasa primero?
    diagram:
      arms: { n: {}, e: {}, s: {}, w: {} }
      vehicles:
        - { label: A, kind: car, from: s, to: left, you: true }
        - { label: B, kind: car, from: n, to: right }
      alt: Cruce sin señales. Tú (A) vienes del sur y giras a la izquierda. B viene del norte, de frente, y gira a su derecha, hacia el oeste.
    options: [Tú (A), Auto B]
    answer: 1
    explain: El que gira a la izquierda deja pasar al que gira a la derecha en el mismo cruce.
    cites: ["rvv:18.2"]

  - id: afslaan-quien-dejas
    type: multi
    prompt: Vas a girar en un cruce. ¿A quién debes dejar pasar por el hecho de girar?
    options:
      - Al tráfico que viene de frente por la misma vía
      - Al tráfico que va a tu lado en la misma vía
      - Al tráfico que va pegado detrás de ti en la misma vía
      - Al tráfico de la vía que entras, que viene de frente por ella
    answer: [0, 1, 2]
    explain: El art. 18.1 cita al tráfico de frente y al que va al lado o muy cerca detrás de ti, en la misma vía.
    cites: ["rvv:18.1"]

  - id: afslaan-orden
    type: order
    prompt: ¿En qué orden pasan? No hay señales.
    diagram:
      arms: { n: {}, e: {}, s: {}, w: {} }
      vehicles:
        - { label: A, kind: car, from: s, to: left, you: true }
        - { label: B, kind: car, from: n, to: straight }
        - { label: C, kind: car, from: e, to: straight }
      alt: Cruce sin señales. Tú (A) vienes del sur y giras a la izquierda. B viene del norte y sigue recto. C viene del este y sigue recto.
    answer: [B, C, A]
    explain: "B no tiene a nadie por su derecha y pasa primero. C tiene a B a su derecha, así que pasa después. A tiene a C a su derecha y además gira a la izquierda: va último."
    cites: ["rvv:15.1", "rvv:18.1"]

  - id: afslaan-ruedas
    type: mc
    prompt: Esperas en el cruce, sin bloquearlo, para girar a la izquierda mientras pasan los de frente. ¿Cómo recomienda el CBR tener las ruedas delanteras?
    options: ["Rectas, sin girar el volante", Giradas a la izquierda, Giradas a la derecha, Da igual cómo estén]
    answer: 0
    explain: El CBR pide mantener las ruedas delanteras en lo posible rectas mientras esperas para girar.
    cites: ["cbr-rijprocedure:3.3"]

  - id: afslaan-der-izq
    type: mc
    prompt: Giras a la derecha. B, que viene de frente, gira a la izquierda en el mismo cruce. No hay señales. ¿Quién pasa primero?
    diagram:
      arms: { n: {}, e: {}, s: {}, w: {} }
      vehicles:
        - { label: A, kind: car, from: s, to: right, you: true }
        - { label: B, kind: car, from: n, to: left }
      alt: Cruce sin señales. Tú (A) vienes del sur y giras a la derecha, hacia el este. B viene del norte, de frente, y gira a su izquierda, también hacia el este.
    options: [Tú (A), Auto B]
    answer: 0
    explain: Quien gira a la izquierda deja pasar al que viene de frente y gira a la derecha (art. 18.2). Aquí el que gira a la izquierda es B, así que cede B y pasas tú.
    cites: ["rvv:18.2"]

  - id: afslaan-hombro
    type: mc
    prompt: Vas a girar a la derecha y miras por encima del hombro derecho. ¿Qué compruebas con esa mirada?
    options:
      - El tráfico que va a tu lado derecho, junto a tu vehículo
      - El tráfico de frente por la vía a la que entras
      - Si el auto de detrás mantiene la distancia
    answer: 0
    explain: Mirar por encima del hombro permite ver el tráfico que va junto a tu vehículo. No debe convertirse en mirar hacia atrás durante mucho tiempo, porque entonces no ves lo que pasa delante.
    cites: ["cbr-rijprocedure:3.3"]
