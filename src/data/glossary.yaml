# Glossary: id -> { nl, es, def?, cbr?, untranslated? }
# cbr: true = on the CBR exam plan's word list (examenplan ch. 4). untranslated: true = CBR never translates it (ch. 6).
# ids are lowercase Dutch slugs; lessons use <T id="..."/>.

# --- Vía y usuarios ---
weg: { nl: weg, es: vía / carretera }
rijbaan: { nl: rijbaan, es: calzada, def: "La parte de la vía destinada a vehículos (no incluye carril bici separado, acera ni arcén)." }
rijstrook: { nl: rijstrook, es: carril, def: "Franja de la calzada, normalmente marcada con líneas, para una fila de vehículos." }
doorgaande-rijbaan: { nl: doorgaande rijbaan, es: calzada principal / de paso, cbr: true }
linker-rijstrook: { nl: linker rijstrook, es: carril izquierdo, cbr: true }
fietspad: { nl: fietspad, es: carril bici (separado), def: "Camino para bicicletas separado de la calzada, señalizado con G11, G12a o G13." }
fietsstrook: { nl: fietsstrook, es: carril bici pintado en la calzada, def: "Carril para bicicletas marcado en la calzada con línea continua o discontinua y símbolos de bicicleta.", cbr: true }
suggestiestrook: { nl: suggestiestrook, es: franja ciclista sugerida, def: "Franja de color (a menudo roja) al borde de la calzada que parece un carril bici pero NO lo es legalmente. Puedes circular y detenerte sobre ella.", cbr: true }
trottoir: { nl: trottoir, es: acera, cbr: true }
voetpad: { nl: voetpad, es: senda peatonal }
berm: { nl: berm, es: arcén de tierra / cuneta, def: "Franja sin pavimentar al lado de la vía.", cbr: true }
vluchtstrook: { nl: vluchtstrook, es: arcén de emergencia, def: "Franja a la derecha en la autosnelweg/autoweg, solo para emergencias.", cbr: true }
spitsstrook: { nl: spitsstrook, es: carril de hora punta, def: "Carril extra (a menudo el arcén) que se abre solo cuando lo indican las señales sobre la vía.", cbr: true }
invoegstrook: { nl: invoegstrook, es: carril de aceleración / incorporación, cbr: true }
uitvoegstrook: { nl: uitvoegstrook, es: carril de desaceleración / salida, cbr: true }
uitrijstrook: { nl: uitrijstrook, es: carril de salida (para salir de una vía), cbr: true }
voorsorteerstrook: { nl: voorsorteerstrook, es: carril de preselección, def: "Carril marcado con flechas antes de un cruce; debes seguir la dirección de la flecha.", cbr: true }
busstrook: { nl: busstrook, es: carril bus, cbr: true }
rijbaanscheiding: { nl: (verhoogde) rijbaanscheiding, es: separación (elevada) entre calzadas, def: "Mediana o isleta que separa calzadas.", cbr: true }
bebouwde-kom: { nl: bebouwde kom, es: zona urbana (poblado), def: "El área entre las señales H1 y H2 (el letrero con el nombre del lugar). La velocidad base es 50 km/h.", cbr: true }
autosnelweg: { nl: autosnelweg, es: autopista, def: "Vía señalizada con G1. Solo para vehículos de motor que puedan y deban ir a más de 60 km/h. Máximo legal 130 km/h, pero las señales a menudo indican menos (ver capítulo 3).", cbr: true }
autoweg: { nl: autoweg, es: "autoweg (vía para automóviles)", def: "Vía señalizada con G3. Máximo 100 km/h; solo para vehículos que puedan y deban ir a más de 50 km/h. El CBR no traduce esta palabra.", cbr: true, untranslated: true }
erf: { nl: erf, es: "erf (zona residencial)", def: "Zona señalizada con G5 donde peatones y niños pueden usar toda la vía. Máximo 15 km/h (velocidad al paso). El CBR no traduce esta palabra.", cbr: true, untranslated: true }
eenrichtingsweg: { nl: eenrichtingsweg, es: calle de sentido único, cbr: true }
doodlopende-weg: { nl: doodlopende weg, es: calle sin salida, cbr: true }
kruispunt: { nl: kruispunt, es: cruce / intersección }
splitsing: { nl: splitsing, es: bifurcación (cruce en T o Y), cbr: true }
rotonde: { nl: rotonde, es: rotonda }
turborotonde: { nl: turborotonde, es: turborrotonda, def: "Rotonda con carriles separados por bordillos: eliges el carril ANTES de entrar y no puedes cambiar dentro.", cbr: true }
uitrit: { nl: uitrit, es: salida de un terreno / garaje, def: "Salida de un garaje, parking, gasolinera o camino privado hacia la vía. Quien sale de una uitrit cede el paso a todos.", cbr: true }
inrit: { nl: inrit, es: entrada a un terreno / garaje }
overweg: { nl: overweg, es: paso a nivel (cruce con tren), cbr: true }
overwegbomen: { nl: overwegbomen, es: barreras del paso a nivel, cbr: true }
slagbomen: { nl: slagbomen, es: barreras, cbr: true }
tramkruising: { nl: tramkruising, es: cruce con tranvía, cbr: true }
voetgangersoversteekplaats: { nl: voetgangersoversteekplaats, es: paso de peatones (paso de cebra), def: "En el habla diaria: zebrapad.", cbr: true }
zebrapad: { nl: zebrapad, es: paso de cebra }
viaduct: { nl: viaduct, es: viaducto / paso elevado, cbr: true }
vluchthaven: { nl: vluchthaven, es: refugio de emergencia, def: "Ensanche junto a la vía (p. ej. en autopistas sin arcén o túneles) para detenerse en caso de avería.", cbr: true }
uitwijkplaats: { nl: uitwijkplaats, es: apartadero, def: "Ensanche en una vía estrecha para dejar pasar al tráfico que viene de frente.", cbr: true }
veerpont: { nl: veerpont, es: transbordador (ferry), cbr: true }
rijbaanversmalling: { nl: rijbaanversmalling, es: estrechamiento de calzada, cbr: true }
wegversmalling: { nl: wegversmalling, es: estrechamiento de la vía, cbr: true }
verkeersdrempel: { nl: verkeersdrempel, es: badén / lomo de burro (reductor de velocidad), cbr: true }
afritnummer: { nl: afritnummer, es: número de salida, cbr: true }
routenummer: { nl: routenummer, es: número de ruta, cbr: true }
hectometerbordje: { nl: hectometerbordje, es: poste/placa hectométrica, def: "Placa pequeña cada 100 m en autopistas; indica tu posición exacta (útil al llamar por una avería o accidente).", cbr: true }
wegwerkzaamheden: { nl: wegwerkzaamheden, es: obras en la vía, cbr: true }
omleidingsroute: { nl: omleidingsroute, es: ruta de desvío, cbr: true }
wegomleiding: { nl: wegomleiding, es: desvío, cbr: true }
uitwijkroute: { nl: uitwijkroute, es: ruta alternativa, cbr: true }
parkeergelegenheid: { nl: parkeergelegenheid, es: lugar de estacionamiento, cbr: true }
taxistandplaats: { nl: taxistandplaats, es: parada de taxis, cbr: true }
zone: { nl: zone, es: zona, def: "Una señal con la palabra ZONE vale para toda el área hasta la señal de fin de zona.", cbr: true }
wegligging: { nl: wegligging, es: trazado de la vía, cbr: true }
spoorvorming: { nl: spoorvorming, es: roderas (surcos en el asfalto), def: "Surcos formados por el paso de vehículos pesados; se acumula agua en ellos (riesgo de aquaplaning).", cbr: true }
losliggende-stenen: { nl: losliggende stenen, es: gravilla suelta, cbr: true }

