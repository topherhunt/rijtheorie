lijnbus: { nl: lijnbus, es: autobús de línea }
tram: { nl: tram, es: tranvía }
motorfiets: { nl: motorfiets, es: motocicleta, cbr: true }
motorrijder: { nl: motorrijder, es: motociclista, cbr: true }
