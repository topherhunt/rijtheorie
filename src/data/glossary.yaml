# --- Prioridad y maniobras ---
voorrang: { nl: voorrang, es: prioridad (derecho de paso), def: "Tener voorrang = el otro debe dejarte pasar. Dar voorrang (voorrang verlenen) = dejar pasar al otro." }
voorrang-verlenen: { nl: voorrang verlenen, es: ceder el paso }
voor-laten-gaan: { nl: voor laten gaan, es: dejar pasar (sin que sea cuestión de prioridad), def: "Se usa en situaciones que no son 'voorrang' en sentido estricto, p. ej. al girar o en una maniobra especial: debes dejar pasar a otros." }
voorrangsweg: { nl: voorrangsweg, es: vía con prioridad, def: "Vía señalizada con B1; en todos los cruces tienes prioridad hasta la señal B2." }
voorrangskruispunt: { nl: voorrangskruispunt, es: cruce con prioridad señalizada, cbr: true }
gelijkwaardig-kruispunt: { nl: gelijkwaardig kruispunt, es: cruce sin prioridad señalizada, def: "Cruce donde ninguna vía tiene prioridad por señales: vale la regla de la derecha." }
haaientanden: { nl: haaientanden, es: "dientes de tiburón (marca de ceda el paso)", def: "Triángulos blancos pintados en la calzada con la punta hacia ti: debes ceder el paso." }
bijzondere-manoeuvre: { nl: bijzondere manoeuvre, es: maniobra especial, def: "Arrancar desde el borde, salir de una uitrit, dar marcha atrás, girar en U, etc. Quien la hace debe dejar pasar a todos los demás." }
inhalen: { nl: inhalen, es: adelantar }
invoegen: { nl: invoegen, es: incorporarse (a una vía rápida) }
uitvoegen: { nl: uitvoegen, es: salir (de una vía rápida) }
ritsen: { nl: ritsen, es: incorporarse en cremallera, def: "Cuando un carril termina, los vehículos se alternan uno a uno al final del carril." }
voorsorteren: { nl: voorsorteren, es: preseleccionar carril }
achteruitrijden: { nl: achteruitrijden, es: dar marcha atrás, cbr: true }
keren: { nl: keren, es: dar la vuelta (cambio de sentido) }
afslaan: { nl: afslaan, es: girar (a la izquierda o derecha) }
rijrichting: { nl: rijrichting, es: sentido de circulación, cbr: true }
stilstaan: { nl: stilstaan, es: detenerse (parar brevemente), def: "Detenerse para subir/bajar personas o cargar/descargar mercancías de inmediato. Más corto que parkeren." }
