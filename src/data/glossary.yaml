parkeerschijf: { nl: parkeerschijf(-zone), es: disco de estacionamiento (zona azul), cbr: true }
vergunninghouders: { nl: vergunninghouders, es: titulares de permiso, cbr: true }
doorstroming: { nl: doorstroming, es: fluidez del tráfico, cbr: true }
