# Glossary: id -> { nl, es, def?, cbr?, untranslated? }
# cite: required when def states a legal rule (checked by npm run audit).
# cbr: true = on the CBR exam plan's word list (examenplan ch. 4). untranslated: true = CBR never translates it (ch. 6).
# ids are lowercase Dutch slugs; lessons use <T id="..."/>.

# --- Vía y usuarios ---
weg: { nl: weg, es: vía / carretera, def: "Para la Wegenverkeerswet: todas las vías o caminos abiertos al tráfico público, con sus puentes y alcantarillas, y los caminos y bermen que pertenecen a ellas.", cite: "wvw:1.1.b" }
verplicht-fietspad: { nl: verplicht fietspad, es: carril bici obligatorio (G11), def: "Fietspad señalizado con G11. Los ciclistas lo deben usar.", cite: "rvv:bijlage1.G11, rvv:5.1" }
onverplicht-fietspad: { nl: onverplicht fietspad, es: carril bici opcional (G13), def: "Fietspad señalizado con G13. Los ciclistas pueden usarlo, pero no están obligados.", cite: "rvv:bijlage1.G13, rvv:5.3" }
fiets-bromfietspad: { nl: fiets/bromfietspad, es: carril para bicicletas y ciclomotores (G12a), def: "Camino señalizado con G12a, para bicicletas y bromfietsen.", cite: "rvv:bijlage1.G12a, rvv:6.1" }
ruiterpad: { nl: ruiterpad, es: camino para jinetes, def: "Camino señalizado con G9, para jinetes.", cite: "rvv:bijlage1.G9, rvv:8.1" }
parkeerhaven: { nl: parkeerhaven / parkeerstrook, es: bahía o franja de estacionamiento, def: "Pavimento junto a la calzada destinado a vehículos detenidos o estacionados.", cite: "rvv:1" }
busbaan: { nl: busbaan, es: vía exclusiva de bus, def: "Calzada en la que está escrita la palabra BUS o LIJNBUS.", cite: "rvv:1" }
puntstuk: { nl: puntstuk, es: zona triangular pintada en una bifurcación, def: "Superficie con varios ángulos pintada en la calzada en bifurcaciones o uniones de vías, carriles o calzadas.", cite: "rvv:1" }
dag: { nl: dag, es: día (legal), def: "La ley llama día al periodo entre la salida y la puesta del sol.", cite: "rvv:1" }
nacht: { nl: nacht, es: noche (legal), def: "La ley llama noche al periodo entre la puesta y la salida del sol.", cite: "rvv:1" }
wagen: { nl: wagen, es: carro (de tracción animal o manual) }
fiets-met-trapondersteuning: { nl: fiets met trapondersteuning, es: bicicleta eléctrica (e-bike), def: "Bicicleta con motor eléctrico auxiliar cuya ayuda se corta al llegar a 25 km/h, o antes si dejas de pedalear. La Wegenverkeerswet no la cuenta como motorrijtuig.", cite: "wvw:1.1, wvw:1.1.c" }
kwetsbare-weggebruikers: { nl: kwetsbare weggebruikers, es: usuarios vulnerables, def: "Usuarios no motorizados como ciclistas y peatones, y quienes usan vehículos motorizados de dos o tres ruedas.", cite: "wvw:1.1" }
verkeersbrigadier: { nl: verkeersbrigadier, es: brigadier de tráfico (p. ej. guardia escolar) }
cbr: { nl: CBR, es: CBR (el organismo que toma el examen teórico) }
stopteken: { nl: stopteken, es: señal de alto (de un agente o de la policía) }
verharde-weg: { nl: verharde weg, es: vía pavimentada, def: "Con asfalto, adoquines o losas." }
onverharde-weg: { nl: onverharde weg, es: camino sin pavimentar, def: "De tierra, arena o grava. Quien viene de él cede el paso a quien va por una vía pavimentada.", cite: "rvv:15.2.a" }
rijbaan: { nl: rijbaan, es: calzada, def: "Cada parte de la vía destinada a vehículos en marcha, sin contar los fietspaden y fiets/bromfietspaden.", cite: "rvv:1" }
rijstrook: { nl: rijstrook, es: carril, def: "Franja de la calzada marcada con líneas continuas o discontinuas, lo bastante ancha para vehículos de motor de más de dos ruedas.", cite: "rvv:1" }
doorgaande-rijbaan: { nl: doorgaande rijbaan, es: calzada principal / de paso, cbr: true }
linker-rijstrook: { nl: linker rijstrook, es: carril izquierdo, cbr: true }
fietspad: { nl: fietspad, es: carril bici (separado), def: "Camino para bicicletas aparte de la calzada. Las señales son G11 (verplicht), G12a (fiets/bromfietspad) y G13 (onverplicht).", cite: "rvv:1, rvv:bijlage1.G11, rvv:bijlage1.G12a, rvv:bijlage1.G13" }
fietsstrook: { nl: fietsstrook, es: carril bici pintado en la calzada, def: "Parte de la calzada marcada con líneas continuas o discontinuas y con dibujos de bicicleta.", cbr: true, cite: "rvv:1" }
suggestiestrook: { nl: suggestiestrook, es: franja ciclista sugerida, def: "Franja de color (a menudo roja) pintada al borde de la calzada para sugerir dónde ir a los ciclistas, sin dibujos de bicicleta. La palabra no aparece en el RVV; sin esos dibujos no cumple la definición de fietsstrook.", cbr: true, cite: "rvv:1" }
trottoir: { nl: trottoir, es: acera, cbr: true }
voetpad: { nl: voetpad, es: senda peatonal, def: "Camino para peatones, señalizado con la señal G7.", cite: "rvv:bijlage1.G7" }
berm: { nl: berm, es: "franja lateral de tierra o hierba", def: "Franja lateral que forma parte de la vía, junto a la calzada.", cbr: true, cite: "wvw:1.1.b" }
vluchtstrook: { nl: vluchtstrook, es: arcén de emergencia, def: "Franja a la derecha en la autosnelweg o autoweg, separada por una línea continua, solo para emergencias, salvo cuando se abre como spitsstrook (señal C23-01).", cbr: true, cite: "rvv:1" }
spitsstrook: { nl: spitsstrook, es: carril de hora punta, def: "Carril extra (a menudo el arcén) que se abre solo cuando lo indican las señales sobre la vía.", cbr: true }
invoegstrook: { nl: invoegstrook, es: carril de aceleración / incorporación, cbr: true }
uitvoegstrook: { nl: uitvoegstrook, es: carril de desaceleración / salida, cbr: true }
uitrijstrook: { nl: uitrijstrook, es: carril de salida (para salir de una vía), cbr: true }
voorsorteerstrook: { nl: voorsorteerstrook, es: carril de preselección, def: "Carril marcado con flechas antes de un cruce; debes seguir la dirección de la flecha.", cbr: true, cite: "rvv:78.1" }
busstrook: { nl: busstrook, es: carril bus, cbr: true }
rijbaanscheiding: { nl: (verhoogde) rijbaanscheiding, es: separación (elevada) entre calzadas, def: "Mediana o isleta que separa calzadas.", cbr: true }
bebouwde-kom: { nl: bebouwde kom, es: zona urbana (poblado), def: "Zona que empieza en la señal H1 (bebouwde kom) y termina en la H2 (einde bebouwde kom). Sus límites los fija el concejo municipal.", cbr: true, cite: "rvv:bijlage1.H1, rvv:bijlage1.H2, wvw:20a.1" }
autosnelweg: { nl: autosnelweg, es: autopista, def: "Vía señalizada con G1. Solo para vehículos de motor que pueden y tienen permitido ir a 60 km/h o más. Máximo general fuera de zona urbana 130 km/h, pero las señales a menudo indican menos (ver el capítulo de velocidad).", cbr: true, cite: "rvv:42.1, rvv:21" }
autoweg: { nl: autoweg, es: "autoweg (vía para automóviles)", def: "Vía señalizada con G3. Máximo general fuera de zona urbana 100 km/h, salvo otra señal; solo para vehículos de motor que pueden y tienen permitido ir a 50 km/h o más. El CBR no traduce esta palabra.", cbr: true, untranslated: true, cite: "rvv:42.2, rvv:21" }
erf: { nl: erf, es: "erf (zona residencial)", def: "Zona señalizada con G5 donde los peatones pueden usar la vía en todo su ancho. Máximo 15 km/h. El CBR no traduce esta palabra.", cbr: true, untranslated: true, cite: "rvv:44, rvv:45" }
eenrichtingsweg: { nl: eenrichtingsweg, es: calle de sentido único, cbr: true }
doodlopende-weg: { nl: doodlopende weg, es: calle sin salida, cbr: true }
kruispunt: { nl: kruispunt, es: cruce / intersección }
splitsing: { nl: splitsing, es: bifurcación (cruce en T o Y), cbr: true }
rotonde: { nl: rotonde, es: rotonda, def: "Nudo de vías con tráfico que circula en movimiento giratorio, señalizado con D1. Una plaza sin D1 no es una rotonda para la ley.", cite: "rvv:bijlage1.D1, cbr-rijprocedure:3.6" }
turborotonde: { nl: turborotonde, es: turborrotonda, def: "Rotonda de varios carriles en la que eliges el carril según tu destino ANTES de entrar; dentro no puedes cambiar de carril.", cbr: true, cite: "vvn-turborotonde" }
uitrit: { nl: uitrit, es: salida de un terreno / garaje, def: "Salida de un garaje, parking, gasolinera o camino privado hacia la vía. Quien sale de una uitrit cede el paso a todos.", cbr: true }
inrit: { nl: inrit, es: entrada a un terreno / garaje }
overweg: { nl: overweg, es: paso a nivel (cruce con tren), cbr: true }
overwegbomen: { nl: overwegbomen, es: barreras del paso a nivel, cbr: true }
slagbomen: { nl: slagbomen, es: barreras, cbr: true }
tramkruising: { nl: tramkruising, es: cruce con tranvía, cbr: true }
voetgangersoversteekplaats: { nl: voetgangersoversteekplaats, es: paso de peatones (paso de cebra), def: "En el habla diaria: zebrapad.", cbr: true }
zebrapad: { nl: zebrapad, es: paso de cebra }
viaduct: { nl: viaduct, es: viaducto / paso elevado, cbr: true }
vluchthaven: { nl: vluchthaven, es: refugio de emergencia, def: "Ensanche junto a la calzada de una autosnelweg o autoweg, separado por una línea continua, para detenerse en una emergencia. El RVV lo define junto con la vluchtstrook.", cbr: true, cite: "rvv:1" }
uitwijkplaats: { nl: uitwijkplaats, es: apartadero, def: "Ensanche en una vía estrecha para dejar pasar al tráfico que viene de frente.", cbr: true }
veerpont: { nl: veerpont, es: transbordador (ferry), cbr: true }
rijbaanversmalling: { nl: rijbaanversmalling, es: estrechamiento de calzada, cbr: true }
wegversmalling: { nl: wegversmalling, es: estrechamiento de la vía, cbr: true }
verkeersdrempel: { nl: verkeersdrempel, es: badén / lomo de burro (reductor de velocidad), cbr: true }
afritnummer: { nl: afritnummer, es: número de salida, cbr: true }
routenummer: { nl: routenummer, es: número de ruta, cbr: true }
hectometerbordje: { nl: hectometerbordje, es: poste/placa hectométrica, def: "Placa pequeña en el borde de la autopista; con su número, el de la carretera y el lado puedes dar tu posición exacta al llamar por una avería.", cbr: true, cite: "rws-pech" }
wegwerkzaamheden: { nl: wegwerkzaamheden, es: obras en la vía, cbr: true }
omleidingsroute: { nl: omleidingsroute, es: ruta de desvío, cbr: true }
wegomleiding: { nl: wegomleiding, es: desvío, cbr: true }
uitwijkroute: { nl: uitwijkroute, es: ruta alternativa, cbr: true }
parkeergelegenheid: { nl: parkeergelegenheid, es: lugar de estacionamiento, cbr: true }
taxistandplaats: { nl: taxistandplaats, es: parada de taxis, cbr: true }
zone: { nl: zone, es: zona, def: "Una señal con la palabra ZONE vale para toda el área indicada, o hasta la señal de fin de zona.", cbr: true, cite: "rvv:66" }
wegligging: { nl: wegligging, es: estabilidad del auto en la vía, cbr: true }
spoorvorming: { nl: spoorvorming, es: roderas (surcos en el asfalto), def: "Surcos formados por el paso de vehículos pesados; se acumula agua en ellos (riesgo de aquaplaning).", cbr: true }
losliggende-stenen: { nl: losliggende stenen, es: gravilla suelta, cbr: true }

# --- Usuarios y vehículos ---
weggebruiker: { nl: weggebruiker, es: usuario de la vía, cbr: true }
medeweggebruiker: { nl: medeweggebruiker(s), es: otros usuarios de la vía, cbr: true }
bestuurder: { nl: bestuurder, es: conductor/a, def: "Para la ley, todos los usuarios de la vía excepto los peatones: ciclistas, motociclistas, conductores de auto, jinetes, etc.", cite: "rvv:1" }
beginnend-bestuurder: { nl: beginnend bestuurder, es: conductor/a novel, def: "Conductor/a con permiso desde hace poco (5 años desde el primer permiso emitido a los 18 años o más; 7 años desde el primer permiso AM o T emitido antes de los 18; 5 años desde el permiso B si se obtuvo antes de los 18). Tiene un límite de alcohol más bajo: más de 88 microgramos por litro de aliento.", cite: "wvw:8.3", cbr: true }
voetganger: { nl: voetganger, es: peatón }
fietser: { nl: fietser, es: ciclista }
ruiter: { nl: ruiter, es: jinete, cbr: true }
skeelers: { nl: skeelers, es: patines en línea, cbr: true }
voertuig: { nl: voertuig, es: vehículo }
motorvoertuig: { nl: motorvoertuig, es: vehículo de motor, def: "Vehículo propulsado por motor, excepto bromfietsen, bicicletas con asistencia al pedaleo, gehandicaptenvoertuigen y los que van sobre rieles.", cite: "rvv:1", cbr: true }
motorrijtuig: { nl: motorrijtuig, es: vehículo de motor (en la ley de seguros y matrícula), cbr: true }
personenauto: { nl: personenauto, es: turismo / auto, cbr: true }
bedrijfsauto: { nl: bedrijfsauto, es: furgoneta / vehículo comercial ligero }
vrachtauto: { nl: vrachtauto, es: camión }
bestelauto: { nl: bestelauto, es: furgoneta de reparto, def: "Vehículo de motor para transportar mercancías, con masa máxima autorizada de hasta 3500 kg.", cite: "rvv:1" }
autobus: { nl: autobus, es: autobús }
touringcar: { nl: touringcar, es: autobús de turismo, cbr: true }
lijnbus: { nl: lijnbus, es: autobús de línea }
tram: { nl: tram, es: tranvía }
motorfiets: { nl: motorfiets, es: motocicleta, cbr: true }
motorrijder: { nl: motorrijder, es: motociclista, cbr: true }
bromfiets: { nl: bromfiets, es: ciclomotor (hasta 45 km/h), def: "Vehículo de motor de dos, tres o cuatro ruedas con velocidad máxima de construcción de 45 km/h y motor pequeño (cada categoría tiene límites de cilindrada o potencia). También cuenta como bromfiets el vehículo que figura así en el permiso de circulación.", cite: "wvw:1.1.e" }
snorfiets: { nl: snorfiets, es: "snorfiets (ciclomotor lento)", def: "Bromfiets construida para una velocidad máxima de 25 km/h, que no es una speed pedelec. El CBR no traduce esta palabra.", cbr: true, untranslated: true, cite: "rvv:1" }
speed-pedelec: { nl: speed pedelec, es: "speed pedelec (bici eléctrica rápida)", def: "Bromfiets eléctrica con asistencia al pedaleo cuya fuerza de impulso continúa cuando pasas de 25 km/h. El CBR no traduce esta palabra.", cbr: true, untranslated: true, cite: "rvv:1" }
brommobiel: { nl: brommobiel, es: "brommobiel (microcoche)", def: "Bromfiets de más de dos ruedas con carrocería. El CBR no traduce esta palabra.", cbr: true, untranslated: true, cite: "rvv:1" }
gehandicaptenvoertuig: { nl: gehandicaptenvoertuig, es: vehículo para personas con discapacidad, def: "Vehículo para transportar a una persona con discapacidad, de ancho máximo 1,10 m, sin motor o con motor de máximo 45 km/h, y que no es una bromfiets.", cbr: true, cite: "rvv:1" }
landbouwvoertuig: { nl: landbouwvoertuig, es: vehículo agrícola, cbr: true }
veegwagen: { nl: veegwagen, es: barredora, cbr: true }
voorrangsvoertuig: { nl: voorrangsvoertuig, es: vehículo prioritario, def: "Ambulancia, policía o bomberos con luz azul (giratoria, de destellos o intermitente) y sirena de dos tonos encendidas. Debes dejarles pasar siempre.", cbr: true, cite: "rvv:50" }
politieauto: { nl: politieauto, es: auto de policía, cbr: true }
militaire-colonne: { nl: militaire colonne, es: columna militar, def: "Varios vehículos motorizados militares (o de la organización de lucha contra desastres) que van uno tras otro bajo un solo comandante y llevan los distintivos oficiales. No la debes cortar.", cbr: true, cite: "rvv:1, rvv:16" }
uitvaartstoet: { nl: uitvaartstoet, es: cortejo fúnebre, def: "Fila de vehículos motorizados que acompañan a un difunto o las cenizas de un difunto y llevan los distintivos oficiales. No lo debes cortar.", cbr: true, cite: "rvv:1, rvv:16, rvv:30c" }
verkeersregelaar: { nl: verkeersregelaar, es: controlador/a de tráfico, def: "Persona autorizada y reconocible como tal que da indicaciones de tráfico. Sus indicaciones se deben seguir.", cbr: true, cite: "rvv:82.1" }
carpooler: { nl: carpooler, es: persona que comparte auto, cbr: true }
passagier: { nl: passagier, es: pasajero/a, cbr: true }
tegenpartij: { nl: tegenpartij, es: la otra parte (en un accidente), cbr: true }
slachtoffer: { nl: slachtoffer, es: víctima, cbr: true }
tegenligger: { nl: tegenligger, es: vehículo que viene de frente }

# --- Prioridad y maniobras ---
voorrang: { nl: voorrang, es: prioridad (derecho de paso), def: "Tener voorrang = el otro debe dejarte pasar. Dar voorrang (voorrang verlenen) = dejar pasar al otro." }
voorrang-verlenen: { nl: voorrang verlenen, es: ceder el paso }
voor-laten-gaan: { nl: voor laten gaan, es: dejar pasar, def: "Expresión de la ley para girar (art. 18), maniobras especiales (art. 54), pasos de cebra (art. 49) y vehículos prioritarios (art. 50): debes dejar pasar a otros usuarios; al salir de un garaje o entrar en él, también a los peatones.", cite: "rvv:18.1, rvv:54, rvv:49.2, rvv:50" }
voorrangsweg: { nl: voorrangsweg, es: vía con prioridad, def: "Vía señalizada con B1; en todos los cruces tienes prioridad hasta la señal B2.", cite: "rvv:bijlage1.B1, rvv:bijlage1.B2" }
voorrangskruispunt: { nl: voorrangskruispunt, es: cruce con prioridad señalizada, cbr: true }
gelijkwaardig-kruispunt: { nl: gelijkwaardig kruispunt, es: cruce sin prioridad señalizada, def: "Cruce donde ninguna vía tiene prioridad por señales: vale la regla de la derecha." }
haaientanden: { nl: haaientanden, es: "dientes de tiburón (marca de ceda el paso)", def: "Triángulos blancos pintados en tu carril antes de un cruce: debes ceder el paso a los conductores de la vía que cruzas.", cite: "rvv:80, rvv:1" }
bijzondere-manoeuvre: { nl: bijzondere manoeuvre, es: maniobra especial, def: "Arrancar desde el borde, salir de una uitrit, dar marcha atrás, girar en U, etc. Quien la hace debe dejar pasar a todos los demás." }
inhalen: { nl: inhalen, es: adelantar }
invoegen: { nl: invoegen, es: incorporarse (a una vía rápida) }
uitvoegen: { nl: uitvoegen, es: salir (de una vía rápida) }
ritsen: { nl: ritsen, es: incorporarse en cremallera, def: "En un estrechamiento de la calzada, dejar espacio a los conductores que adelantan para que entren delante de ti.", cite: "cbr-rijprocedure:2" }
voorsorteren: { nl: voorsorteren, es: preseleccionar carril, def: "Antes de girar, colocarte a tiempo lo más a la derecha (giro a la derecha) o lo más cerca del eje / lo más a la izquierda (giro a la izquierda).", cite: "rvv:17.1" }
rechts-houden: { nl: rechts houden, es: circular por la derecha, def: "Los conductores deben circular lo más a la derecha posible.", cite: "rvv:3.1" }
rijstrook-wisselen: { nl: van rijstrook wisselen, es: cambiar de carril, def: "Es una maniobra especial: debes dejar pasar al resto del tráfico.", cite: "rvv:54" }
zijdelingse-verplaatsing: { nl: zijdelingse verplaatsing, es: desplazamiento lateral, def: "Cualquier movimiento hacia un lado dentro de la calzada, como esquivar o volver al sitio tras adelantar." }
voorbijgaan: { nl: voorbijgaan, es: pasar junto a un obstáculo, def: "Pasar junto a algo que no participa en el tráfico (auto estacionado, contenedor). No es 'inhalen', que es adelantar a otro usuario." }
tegemoetkomen: { nl: tegemoetkomen, es: cruzarse con el tráfico que viene de frente }
ingehaald-worden: { nl: ingehaald worden, es: ser adelantado }
weefvak: { nl: weefvak, es: tramo de entrecruzamiento, def: "Tramo donde se cruzan los que entran y los que salen de la calzada principal, por ejemplo en un carril combinado de incorporación y salida. El CBR usa la palabra también para un punto donde la calzada se divide con una línea de bloques y carriles con señales de dirección encima." }
hulppost: { nl: hulppost(kast), es: puesto de emergencia del túnel, def: "Armario en la pared del túnel con un teléfono de emergencia para llamar al wegverkeersleider y un extintor.", cite: "rws-tunnel" }
wegverkeersleider: { nl: wegverkeersleider, es: operador de tráfico, def: "Persona que vigila el túnel desde la central de tráfico, atiende las llamadas desde el hulppost y da instrucciones.", cite: "rws-tunnel" }
fileverkeer: { nl: fileverkeer, es: tráfico en atasco (fila), cite: "rvv:13" }
inhaalverbod: { nl: inhaalverbod, es: prohibición de adelantar, def: "La señal F1 prohíbe a los vehículos de motor adelantarse entre sí.", cite: "rvv:bijlage1.F1" }
portierbreedte: { nl: portierbreedte, es: ancho de una puerta (de auto), def: "Distancia lateral mínima recomendada al pasar junto a autos estacionados." }
wegas: { nl: wegas, es: eje de la calzada }
richting-aangeven: { nl: richting aangeven, es: indicar la dirección (poner el intermitente), def: "Dar la señal con el intermitente antes de una maniobra lateral importante.", cite: "rvv:55" }
over-de-schouder-kijken: { nl: over de schouder kijken, es: mirar por encima del hombro (ángulo muerto) }
rijstrooklichten: { nl: rijstrooklichten, es: señales luminosas sobre el carril, def: "Flecha verde o velocidad máxima: el carril se puede usar. Cruz roja: no se puede usar.", cite: "rvv:73" }
achteruitrijden: { nl: achteruitrijden, es: dar marcha atrás, cbr: true }
keren: { nl: keren, es: dar la vuelta (cambio de sentido) }
