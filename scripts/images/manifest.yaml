# AI scene images, generated by scripts/images/generate.ts into public/img/<id>.webp.
# status: planned -> generated (file exists, not yet looked at) -> approved (reviewed by eye) | rejected (reason in `review`).
# Only approved images may be used in lessons. Scenes must work without signs, markings or text: the model invents wrong ones.
style: Photorealistic photo in the Netherlands, natural light, eye-level unless stated. Absolutely no text, letters, numbers, traffic signs, road markings or readable license plates anywhere in the image.
images:
  luces-niebla-faros:
    lesson: luces/02-niebla-y-estacionado
    prompt: A small hatchback car driving on a flat Dutch country road in thick fog, low-beam headlights on, seen from behind at a distance with one bright red rear fog light glowing, faint taillights of another car far ahead.
    alt: Auto con luces encendidas avanzando en la niebla
    status: generated
  luces-averia-triangulo:
    lesson: luces/04-averia-emergencia
    prompt: A broken-down car stopped at the right edge of a quiet rural road, hazard lights flashing orange, a red reflective warning triangle standing on the road about 30 metres behind the car.
    alt: Auto averiado con luces de emergencia y triángulo colocado detrás
    status: planned
  conductor-dode-hoek-camion:
    lesson: conductor/05-usuarios-vulnerables
    prompt: Seen from directly above, a large truck waiting at a city junction about to turn right, a cyclist on a bicycle right next to the front right corner of the truck cab, close beside it.
    alt: Ciclista en el ángulo muerto de un camión
    status: planned
  conductor-asiento-infantil:
    lesson: conductor/04-cinturon-ninos
    prompt: Interior of a car, view from the open rear door, a young child sitting in a forward-facing child car seat on the rear bench with the harness buckled.
    alt: Niño en asiento infantil en el asiento trasero
    status: planned
  leyes-documentos-control:
    lesson: leyes/03-documentos-control
    prompt: A Dutch police officer in a dark blue uniform with a yellow reflective vest standing next to the open driver window of a car at the roadside, the driver handing over a plain card.
    alt: Un agente de policía junto a la ventanilla de un auto recibe documentos del conductor.
    status: planned
  vehiculo-banden-profiel:
    lesson: vehiculo/01-neumaticos
    prompt: Close-up of a hand pushing a simple metal tread depth gauge into the grooves of a worn car tyre on a car, the tread visibly shallow.
    alt: Medidor de profundidad en la banda de rodadura de un neumático gastado.
    status: planned
  vehiculo-lading-fietsdrager:
    lesson: vehiculo/06-carga-remolque
    prompt: Rear view of a station wagon car with a bicycle carrier mounted on the tow bar, two bicycles on it, the carrier has its own rear lights and a blank yellow plate holder with no characters.
    alt: Auto con un portabicicletas en el enganche con su propia placa.
    status: planned
  vehiculo-aanhangwagen:
    lesson: vehiculo/06-carga-remolque
    prompt: A car towing a small open single-axle trailer loaded with garden waste, driving along a quiet road between fields, seen from the side.
    alt: Auto remolcando un remolque ligero.
    status: planned
  especiales-invoegstrook:
    lesson: especiales/02-invoegen
    prompt: Aerial view from a drone of a car on a motorway on-ramp acceleration lane, speeding up alongside fast-moving cars on the main carriageway, choosing a gap to merge into.
    alt: Un auto en un carril de aceleración se incorpora a una autopista con tráfico rápido.
    status: planned
  especiales-tunnel:
    lesson: especiales/05-tunel
    prompt: Interior of a long two-lane road tunnel with light traffic, a lit emergency alcove with a fire extinguisher recessed in the tunnel wall on the right.
    alt: Interior de un túnel de carretera con un nicho de emergencia iluminado en la pared.
    status: planned
  especiales-overweg:
    lesson: especiales/07-overweg
    prompt: A rural Dutch railway level crossing with red and white striped barriers lowered across the road, red lights on, a yellow and blue passenger train approaching on the tracks, a car waiting before the barrier.
    alt: Un paso a nivel con las barreras bajadas y un tren que se acerca.
    status: planned
  especiales-erf:
    lesson: especiales/08-erf-halte-brug
    prompt: A narrow Dutch residential street paved with red clay bricks with no curbs and no separate sidewalk, children playing with a ball on the street, a car driving slowly at walking pace, planters and parked bicycles.
    alt: Una calle residencial con niños jugando y un auto que avanza al paso.
    status: planned
  via-tipos-ciclomotores:
    lesson: via/05-tipos-de-vehiculos
    prompt: Five vehicles parked side by side on a plain grey background, studio photo, left to right - an ordinary bicycle, an electric bicycle with a battery on the frame, a small step-through scooter, a fast electric bicycle with a sturdier frame, a tiny two-seat microcar.
    alt: Cinco vehículos, de la bicicleta a la brommobiel, uno al lado del otro.
    status: planned
