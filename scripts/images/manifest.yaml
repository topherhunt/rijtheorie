# AI scene images. scripts/images/generate.ts writes candidates for `planned` entries to scripts/images/candidates/ (gitignored); each is reviewed at full size and the chosen one is copied to public/img/<id>.webp.
# status: planned -> approved (in public/img, reviewed) | dropped (reason in `review`). Only approved images may be used in lessons.
# Review checklist: physically possible, equipment used the way it really is, objects whole and unmerged, positions/distances match what the lesson teaches, no readable text or invented signs.
style: Photorealistic photo in the Netherlands, natural light, eye-level unless stated. Absolutely no text, letters, numbers, traffic signs, road markings or readable license plates anywhere in the image.
images:
  luces-niebla-faros:
    lesson: luces/02-niebla-y-estacionado
    prompt: A small hatchback car driving on a flat Dutch country road in thick fog, low-beam headlights on, seen from behind at a distance with one bright red rear fog light glowing, faint taillights of another car far ahead.
    alt: Auto con luces encendidas avanzando en la niebla
    status: approved
  luces-averia-triangulo:
    lesson: luces/04-averia-emergencia
    prompt: High drone view from the side of a long straight empty rural road. On the right, a broken-down car stands half on the grass verge with orange hazard lights on. Far behind the car, separated by about seven car lengths of empty asphalt, a small red reflective warning triangle stands on the road. The large empty gap between the triangle and the car is the main subject.
    alt: Auto averiado con luces de emergencia y, muy por detrás, el triángulo de advertencia
    status: approved
  conductor-dode-hoek-camion:
    lesson: conductor/05-usuarios-vulnerables
    prompt: High aerial view from above and behind of a large articulated lorry with a long trailer stopped at a city junction, about to turn right. A cyclist waits on a separate bicycle path directly beside the right side of the lorry cab, level with the cab door and very close to it, where the driver cannot see.
    alt: Ciclista en el ángulo muerto de un camión
    status: approved
  conductor-asiento-infantil:
    lesson: conductor/04-cinturon-ninos
    prompt: Interior of a car, view from the open rear door, a young child sitting in a forward-facing child car seat on the rear bench with the harness buckled.
    alt: Niño en asiento infantil en el asiento trasero
    status: approved
  leyes-documentos-control:
    lesson: leyes/03-documentos-control
    prompt: A Dutch police officer in a dark blue uniform with a yellow reflective vest standing next to the open driver window of a car at the roadside, the driver handing over a plain card.
    alt: Un agente de policía junto a la ventanilla de un auto recibe documentos del conductor.
    status: approved
  vehiculo-banden-profiel:
    lesson: vehiculo/01-neumaticos
    prompt: Close-up of a hand pushing a simple metal tread depth gauge into the grooves of a car tyre on a car.
    alt: Medidor de profundidad colocado en una ranura del dibujo de un neumático.
    status: approved
  vehiculo-lading-fietsdrager:
    lesson: vehiculo/06-carga-remolque
    prompt: Rear view of a parked station wagon car with a platform bicycle carrier mounted on the tow bar, carrying one single upright city bicycle clamped by its frame. The carrier has its own rear light unit with a blank yellow plate holder with no characters.
    alt: Auto con un portabicicletas en el enganche que lleva sus propias luces.
    status: approved
  vehiculo-aanhangwagen:
    lesson: vehiculo/06-carga-remolque
    prompt: Side view of a car driving along a quiet road between fields, towing a small open single-axle box trailer loaded with garden waste. The trailer has no jockey wheel and no support leg at all; its V-shaped drawbar ends in a coupling head that sits on the car's tow ball, and only the trailer's own two wheels touch the road. A thin electrical cable runs from the drawbar to the car.
    alt: Auto remolcando un remolque ligero.
    status: approved
  especiales-invoegstrook:
    lesson: especiales/02-invoegen
    prompt: High drone photo looking forward along a two-lane motorway. On the right, a long acceleration lane runs directly alongside the right-hand motorway lane. One single red car drives on the acceleration lane with its right side to the grass. In the right-hand motorway lane right next to the red car there is a long empty gap of open asphalt; one car is far ahead of the gap and one car is far behind it. No other road or ramp in view.
    alt: Un auto en el carril de aceleración junto a un hueco en el carril derecho de la autopista.
    status: dropped
    review: "7 attempts never drew the block marking that separates a Dutch acceleration lane; a solid line made it read as driving on the hard shoulder. Needs an SVG diagram instead"
  especiales-tunnel:
    lesson: especiales/05-tunel
    prompt: Interior of a long two-lane road tunnel with light traffic, a lit emergency alcove with a fire extinguisher recessed in the tunnel wall on the right.
    alt: Interior de un túnel de carretera con un nicho de emergencia iluminado en la pared.
    status: approved
  especiales-overweg:
    lesson: especiales/07-overweg
    prompt: Seen from just behind a stopped car on a two-way rural road, the car waits in its own right-hand lane in front of a Dutch automatic railway level crossing. A single red and white half barrier on a post at the right roadside is lowered across the car's lane only; next to it a post carries two round red warning lights, both lit. A yellow and blue passenger train passes across the crossing from left to right beyond the barrier.
    alt: Un paso a nivel con la media barrera bajada, luces rojas encendidas y un tren que pasa.
    status: approved
  especiales-erf:
    lesson: especiales/08-erf-halte-brug
    prompt: A narrow Dutch residential street paved with red clay bricks with no curbs and no separate sidewalk, children playing with a ball on the street, a car driving slowly at walking pace, planters and parked bicycles.
    alt: Una calle residencial con niños jugando y un auto que avanza al paso.
    status: approved
  via-tipos-ciclomotores:
    lesson: via/05-tipos-de-vehiculos
    prompt: Five vehicles side by side, studio photo - bicycle, e-bike, scooter, speed pedelec, microcar.
    alt: Cinco vehículos, de la bicicleta a la brommobiel, uno al lado del otro.
    status: dropped
    review: "a speed pedelec is told apart by its plate, which the no-text rule forbids; the image would teach nothing"
