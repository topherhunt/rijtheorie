name: CI

# Deployment is done by Cloudflare Workers Builds (wrangler.jsonc); this only runs the quality gates.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run audit -- --strict
      - run: npm test
      - run: npm run build
